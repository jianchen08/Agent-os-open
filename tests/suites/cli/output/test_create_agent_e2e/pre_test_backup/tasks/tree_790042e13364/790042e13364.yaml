description: '创建一个名为 e2e_time_agent 的时间助手 Agent，用于回答用户关于时间的问题。


  ## Agent 配置要求

  - **agent_id**: e2e_time_agent

  - **agent_name**: 时间助手 (E2E Time Agent)

  - **agent_description**: 专门负责回答用户关于时间的问题，包括但不限于：当前时间查询、日期计算、时区转换、时间差计算等。

  - **隔离级别**: container

  - **配置文件保存路径**: config/agents/executor/test/

  - **配置文件格式**: YAML


  ## Agent 职责

  1. 回答用户询问的当前时间/日期

  2. 提供日期/时间计算服务（加/减天数、计算日期间隔等）

  3. 支持时区转换（各时区与本地时间的换算）

  4. 其他与时间相关的简单问答


  ## 约束

  - 使用温柔亲切的语气与用户交流

  - 回答尽量简洁明了

  - 如果时间计算涉及复杂逻辑，需展示计算过程'
