<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Resume HTML 测试</title>
<style>
  body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
  .pass { color: #4caf50; font-weight: bold; }
  .fail { color: #f44336; font-weight: bold; }
  .test-item { margin: 4px 0; padding: 4px 8px; border-left: 3px solid #444; }
  .test-item.passed { border-left-color: #4caf50; }
  .test-item.failed { border-left-color: #f44336; }
  h1 { color: #a8c0e8; }
  h2 { color: #7a9cc6; margin-top: 20px; }
  #summary { margin-top: 20px; padding: 16px; background: #16213e; border-radius: 8px; }
  #result-json { display: none; }
</style>
</head>
<body>
<h1>📄 Resume.html 测试报告</h1>
<div id="results"></div>
<div id="summary"></div>
<pre id="result-json"></pre>

<script>
/**
 * Resume HTML 测试套件
 * 使用 JavaScript 在浏览器中解析 resume.html，验证各项功能指标。
 * 所有测试结果以 JSON 格式输出，供自动化评估系统读取。
 */

(async function runAllTests() {
  const results = [];
  let passed = 0;
  let failed = 0;

  // 加载 resume.html 内容
  let htmlContent = '';
  let parser = null;
  let doc = null;

  try {
    const resp = await fetch('../resume.html');
    htmlContent = await resp.text();
    parser = new DOMParser();
    doc = parser.parseFromString(htmlContent, 'text/html');
  } catch (e) {
    // 如果 fetch 失败（如 file:// 协议），尝试用 XMLHttpRequest
    try {
      htmlContent = await new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', '../resume.html', true);
        xhr.onload = () => resolve(xhr.responseText);
        xhr.onerror = reject;
        xhr.send();
      });
      parser = new DOMParser();
      doc = parser.parseFromString(htmlContent, 'text/html');
    } catch (e2) {
      document.getElementById('results').innerHTML = '<div class="fail">无法加载 resume.html: ' + e2.message + '</div>';
      outputResult(false, 1);
      return;
    }
  }

  function assert(condition, testName, detail) {
    const item = { name: testName, passed: !!condition, detail: detail || '' };
    results.push(item);
    if (condition) passed++;
    else failed++;
    return condition;
  }

  // ============================================================
  // 测试1: HTML结构完整性
  // ============================================================
  (function testHTMLStructure() {
    // 1.1 DOCTYPE 存在
    assert(
      htmlContent.includes('<!DOCTYPE html>'),
      'HTML结构 - DOCTYPE声明存在',
      '文件以 <!DOCTYPE html> 开头'
    );

    // 1.2 html标签正确
    assert(
      doc.querySelector('html') !== null,
      'HTML结构 - html根标签存在',
      'DOM解析后存在html元素'
    );

    // 1.3 head和body存在
    assert(
      doc.querySelector('head') !== null && doc.querySelector('body') !== null,
      'HTML结构 - head和body标签存在',
      '文档包含完整的head和body'
    );

    // 1.4 charset正确
    const charsetMeta = doc.querySelector('meta[charset]');
    assert(
      charsetMeta !== null && charsetMeta.getAttribute('charset').toUpperCase() === 'UTF-8',
      'HTML结构 - charset为UTF-8',
      'meta charset="UTF-8" 存在'
    );

    // 1.5 lang属性
    const htmlEl = doc.querySelector('html');
    assert(
      htmlEl !== null && htmlEl.getAttribute('lang') === 'zh-CN',
      'HTML结构 - html lang="zh-CN"',
      '语言设置为中文'
    );

    // 1.6 title标签存在
    const titleEl = doc.querySelector('title');
    assert(
      titleEl !== null && titleEl.textContent.length > 0,
      'HTML结构 - title标签有内容',
      '标题: ' + (titleEl ? titleEl.textContent : 'N/A')
    );

    // 1.7 无明显语法错误（DOMParser不会产生parsererror）
    const parseError = doc.querySelector('parsererror');
    assert(
      !parseError,
      'HTML结构 - 无解析错误',
      parseError ? '存在解析错误' : 'DOM解析正常'
    );
  })();

  // ============================================================
  // 测试2: contenteditable属性
  // ============================================================
  (function testContentEditable() {
    const editables = doc.querySelectorAll('[contenteditable="true"]');
    assert(
      editables.length >= 10,
      'contenteditable - 至少10个可编辑区域 (实际: ' + editables.length + ')',
      '找到 ' + editables.length + ' 个 contenteditable="true" 元素'
    );

    // 验证关键文本区域可编辑
    const nameEl = doc.querySelector('.name[contenteditable="true"]');
    assert(
      nameEl !== null,
      'contenteditable - 姓名区域可编辑',
      nameEl ? '姓名: "' + nameEl.textContent + '"' : '未找到'
    );

    const titleEl = doc.querySelector('.title[contenteditable="true"]');
    assert(
      titleEl !== null,
      'contenteditable - 职位标题区域可编辑',
      titleEl ? '标题: "' + titleEl.textContent + '"' : '未找到'
    );

    // 联系方式区域
    const contactEditables = doc.querySelectorAll('.contact [contenteditable="true"]');
    assert(
      contactEditables.length >= 3,
      'contenteditable - 至少3个联系方式可编辑 (实际: ' + contactEditables.length + ')',
      '联系方式可编辑元素: ' + contactEditables.length
    );

    // 项目经历条目可编辑
    const entryEditables = doc.querySelectorAll('.entry [contenteditable="true"]');
    assert(
      entryEditables.length >= 5,
      'contenteditable - 至少5个项目经历元素可编辑 (实际: ' + entryEditables.length + ')',
      '项目条目可编辑元素: ' + entryEditables.length
    );

    // 自我评价可编辑
    const summaryEl = doc.querySelector('.summary-text[contenteditable="true"]');
    assert(
      summaryEl !== null,
      'contenteditable - 自我评价区域可编辑',
      summaryEl ? '内容长度: ' + summaryEl.textContent.length : '未找到'
    );
  })();

  // ============================================================
  // 测试3: 照片嵌入
  // ============================================================
  (function testPhotoEmbed() {
    const photo = doc.querySelector('img.photo');
    assert(
      photo !== null,
      '照片嵌入 - img.photo元素存在',
      photo ? '找到照片元素' : '未找到'
    );

    if (photo) {
      const src = photo.getAttribute('src') || '';
      assert(
        src.startsWith('data:image/'),
        '照片嵌入 - 使用base64 data URI',
        'src以 "data:image/" 开头, 长度: ' + src.length
      );

      assert(
        src.includes('base64,'),
        '照片嵌入 - 包含base64编码数据',
        '包含 "base64," 标记'
      );

      // 检查圆形裁剪样式 - 从原始HTML中检查CSS
      const styleContent = htmlContent.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
      const hasCircularStyle = styleContent && (
        styleContent[1].includes('border-radius: 50%') ||
        styleContent[1].includes('border-radius:50%')
      );
      assert(
        hasCircularStyle,
        '照片嵌入 - CSS圆形裁剪样式 (border-radius: 50%)',
        hasCircularStyle ? '.photo 样式包含 border-radius: 50%' : '未找到圆形裁剪样式'
      );

      // 检查object-fit: cover
      const hasObjectFit = styleContent && (
        styleContent[1].includes('object-fit: cover') ||
        styleContent[1].includes('object-fit:cover')
      );
      assert(
        hasObjectFit,
        '照片嵌入 - object-fit: cover 样式',
        hasObjectFit ? '照片使用 object-fit: cover' : '未找到 object-fit'
      );
    }
  })();

  // ============================================================
  // 测试4: PDF导出按钮
  // ============================================================
  (function testExportButton() {
    const btn = doc.querySelector('.btn-export');
    assert(
      btn !== null,
      'PDF导出 - 导出按钮存在 (.btn-export)',
      btn ? '按钮文本: "' + btn.textContent.trim() + '"' : '未找到'
    );

    // 检查onclick事件绑定
    if (btn) {
      const onclick = btn.getAttribute('onclick');
      assert(
        onclick !== null && onclick.includes('exportPDF'),
        'PDF导出 - 按钮绑定了 onclick="exportPDF()"',
        'onclick: ' + onclick
      );
    }

    // 检查toolbar存在
    const toolbar = doc.querySelector('.toolbar');
    assert(
      toolbar !== null,
      'PDF导出 - 工具栏存在 (.toolbar)',
      toolbar ? '工具栏包含编辑器标题和导出按钮' : '未找到'
    );
  })();

  // ============================================================
  // 测试5: 导出逻辑 (html2pdf.js + printing类)
  // ============================================================
  (function testExportLogic() {
    // 5.1 html2pdf.js CDN引入
    const scripts = doc.querySelectorAll('script[src]');
    let hasHtml2Pdf = false;
    let html2pdfSrc = '';
    scripts.forEach(s => {
      const src = s.getAttribute('src') || '';
      if (src.includes('html2pdf')) {
        hasHtml2Pdf = true;
        html2pdfSrc = src;
      }
    });
    assert(
      hasHtml2Pdf,
      '导出逻辑 - html2pdf.js CDN引入',
      'src: ' + html2pdfSrc
    );

    // 5.2 exportPDF函数存在
    const hasExportFunc = htmlContent.includes('function exportPDF') ||
                          htmlContent.includes('exportPDF');
    assert(
      hasExportFunc,
      '导出逻辑 - exportPDF函数已定义',
      hasExportFunc ? '在script标签中找到exportPDF函数' : '未找到'
    );

    // 5.3 导出时添加printing类
    const addsPrintingClass = htmlContent.includes("classList.add('printing')") ||
                              htmlContent.includes('classList.add("printing")');
    assert(
      addsPrintingClass,
      '导出逻辑 - 导出时添加 .printing 类',
      addsPrintingClass ? 'document.body.classList.add("printing") 存在' : '未找到'
    );

    // 5.4 导出后移除printing类
    const removesPrintingClass = htmlContent.includes("classList.remove('printing')") ||
                                  htmlContent.includes('classList.remove("printing")');
    assert(
      removesPrintingClass,
      '导出逻辑 - 导出完成后移除 .printing 类',
      removesPrintingClass ? 'document.body.classList.remove("printing") 存在' : '未找到'
    );

    // 5.5 printing类下toolbar隐藏
    const styleMatch = htmlContent.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
    const printingHidesToolbar = styleMatch && (
      styleMatch[1].includes('.printing .toolbar') &&
      (styleMatch[1].includes('display: none') || styleMatch[1].includes('display:none'))
    );
    assert(
      printingHidesToolbar,
      '导出逻辑 - .printing 类隐藏工具栏',
      printingHidesToolbar ? '.printing .toolbar { display: none } 存在' : '未找到'
    );

    // 5.6 printing类下隐藏contenteditable边框
    const printingHidesOutline = styleMatch && (
      styleMatch[1].includes('.printing [contenteditable') &&
      (styleMatch[1].includes('outline: none') || styleMatch[1].includes('outline:none'))
    );
    assert(
      printingHidesOutline,
      '导出逻辑 - .printing 类隐藏编辑边框',
      printingHidesOutline ? '.printing [contenteditable] { outline: none } 存在' : '未找到'
    );
  })();

  // ============================================================
  // 测试6: CSS样式验证
  // ============================================================
  (function testCSSStyles() {
    const styleMatch = htmlContent.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
    const css = styleMatch ? styleMatch[1] : '';

    // 6.1 深蓝/藏青主色调
    const hasDarkBlue = css.includes('#1a2a4a') || css.includes('#2c3e6b') ||
                         css.includes('#1a2a4a') || css.includes('rgb(26, 42, 74)');
    assert(
      hasDarkBlue,
      'CSS样式 - 深蓝/藏青主色调 (#1a2a4a 或类似)',
      hasDarkBlue ? '找到深蓝主色调色值' : '未找到'
    );

    // 6.2 A4尺寸
    const hasA4 = css.includes('210mm') || css.includes('A4');
    assert(
      hasA4,
      'CSS样式 - A4页面尺寸 (210mm)',
      hasA4 ? '找到A4尺寸相关CSS' : '未找到'
    );

    // 6.3 @page规则
    const hasPageRule = css.includes('@page');
    assert(
      hasPageRule,
      'CSS样式 - @page打印规则',
      hasPageRule ? '@page { size: A4 } 存在' : '未找到'
    );

    // 6.4 print-color-adjust
    const hasPrintColor = css.includes('print-color-adjust') || css.includes('-webkit-print-color-adjust');
    assert(
      hasPrintColor,
      'CSS样式 - 打印颜色保留 (print-color-adjust)',
      hasPrintColor ? '打印时保留背景色和颜色' : '未找到'
    );

    // 6.5 紧凑布局 - resume-page有合适的padding
    const hasCompactLayout = css.includes('padding:') && css.includes('297mm');
    assert(
      hasCompactLayout,
      'CSS样式 - 适合A4一页的紧凑布局',
      hasCompactLayout ? 'min-height: 297mm, 合理padding' : '未找到'
    );
  })();

  // ============================================================
  // 测试7: 简历内容完整性
  // ============================================================
  (function testResumeContent() {
    // 7.1 项目经历 section
    const projectSection = Array.from(doc.querySelectorAll('.section-title'))
      .find(el => el.textContent.includes('项目经历'));
    assert(
      !!projectSection,
      '内容完整性 - 项目经历 section 存在',
      projectSection ? '找到"项目经历"标题' : '未找到'
    );

    // 7.2 至少2个项目条目
    const projectEntries = doc.querySelectorAll('.entry');
    assert(
      projectEntries.length >= 2,
      '内容完整性 - 至少2个项目条目 (实际: ' + projectEntries.length + ')',
      '找到 ' + projectEntries.length + ' 个 .entry 元素'
    );

    // 7.3 工作经历 section
    const workSection = Array.from(doc.querySelectorAll('.section-title'))
      .find(el => el.textContent.includes('工作经历'));
    assert(
      !!workSection,
      '内容完整性 - 工作经历 section 存在',
      workSection ? '找到"工作经历"标题' : '未找到'
    );

    // 7.4 工作经历条目
    const workEntries = doc.querySelectorAll('.work-entry');
    assert(
      workEntries.length >= 1,
      '内容完整性 - 至少1条工作经历 (实际: ' + workEntries.length + ')',
      '找到 ' + workEntries.length + ' 个 .work-entry'
    );

    // 7.5 教育背景 section
    const eduSection = Array.from(doc.querySelectorAll('.section-title'))
      .find(el => el.textContent.includes('教育背景'));
    assert(
      !!eduSection,
      '内容完整性 - 教育背景 section 存在',
      eduSection ? '找到"教育背景"标题' : '未找到'
    );

    // 7.6 教育经历条目
    const eduRows = doc.querySelectorAll('.edu-row');
    assert(
      eduRows.length >= 1,
      '内容完整性 - 至少1条教育经历 (实际: ' + eduRows.length + ')',
      '找到 ' + eduRows.length + ' 个 .edu-row'
    );

    // 7.7 技能 section
    const skillSection = Array.from(doc.querySelectorAll('.section-title'))
      .find(el => el.textContent.includes('技能'));
    assert(
      !!skillSection,
      '内容完整性 - 技能 section 存在',
      skillSection ? '找到"技能"标题' : '未找到'
    );

    // 7.8 技能网格
    const skillsGrid = doc.querySelector('.skills-grid');
    assert(
      skillsGrid !== null,
      '内容完整性 - 技能网格存在 (.skills-grid)',
      skillsGrid ? '找到技能网格' : '未找到'
    );

    // 7.9 自我评价 section
    const summarySection = Array.from(doc.querySelectorAll('.section-title'))
      .find(el => el.textContent.includes('自我评价'));
    assert(
      !!summarySection,
      '内容完整性 - 自我评价 section 存在',
      summarySection ? '找到"自我评价"标题' : '未找到'
    );

    // 7.10 自我评价内容
    const summaryText = doc.querySelector('.summary-text');
    assert(
      summaryText !== null && summaryText.textContent.trim().length > 10,
      '内容完整性 - 自我评价有实质内容',
      '内容长度: ' + (summaryText ? summaryText.textContent.trim().length : 0)
    );

    // 7.11 联系信息完整
    const contactDiv = doc.querySelector('.contact');
    assert(
      contactDiv !== null && contactDiv.textContent.includes('@'),
      '内容完整性 - 联系信息包含邮箱',
      contactDiv ? '联系方式区域存在' : '未找到'
    );

    // 7.12 姓名存在
    const nameDiv = doc.querySelector('.name');
    assert(
      nameDiv !== null && nameDiv.textContent.trim().length > 0,
      '内容完整性 - 姓名已填写',
      '姓名: ' + (nameDiv ? nameDiv.textContent.trim() : 'N/A')
    );
  })();

  // ============================================================
  // 输出结果
  // ============================================================
  const resultsDiv = document.getElementById('results');
  let html = '<h2>测试详情</h2>';
  results.forEach((r, i) => {
    const cls = r.passed ? 'passed' : 'failed';
    const icon = r.passed ? '✅' : '❌';
    html += `<div class="test-item ${cls}">${icon} [${i+1}/${results.length}] ${r.name}${r.detail ? ' — ' + r.detail : ''}</div>`;
  });
  resultsDiv.innerHTML = html;

  const summaryDiv = document.getElementById('summary');
  const allPassed = failed === 0;
  summaryDiv.innerHTML = `
    <h2>测试总结</h2>
    <div>总计: <strong>${results.length}</strong> 项 | <span class="pass">通过: ${passed}</span> | <span class="fail">失败: ${failed}</span></div>
    <div>结果: <span class="${allPassed ? 'pass' : 'fail'}">${allPassed ? 'ALL PASSED ✅' : 'HAS FAILURES ❌'}</span></div>
  `;

  // 输出JSON格式结果（供自动化评估读取）
  const resultObj = {
    success: allPassed,
    data: {
      status: allPassed ? 'completed' : 'failed',
      exit_code: allPassed ? 0 : 1,
      total: results.length,
      passed: passed,
      failed: failed,
      tests: results
    }
  };

  document.getElementById('result-json').textContent = JSON.stringify(resultObj, null, 2);

  // 同时在控制台输出，便于自动化采集
  console.log('TEST_RESULT_JSON:' + JSON.stringify(resultObj));
})();
</script>
</body>
</html>
