# 本地构建配置
#
# 本机 Windows + rustc（1.85.0 / 1.92.0 stable）存在两类间歇性 ICE：
#   1. 增量编译缓存损坏 → STATUS_ACCESS_ACCESS_VIOLATION（serde_json/itoa/aho-corasick link 阶段）
#   2. 多线程编译竞态 → core_simd swizzle / proc_macro use-after-free（parking_lot_core/memchr build script）
# 解决：关闭增量编译 + 单线程编译。CI 环境不受影响（CI 默认无增量缓存且通常单核）。
[build]
incremental = false
jobs = 1

# mimalloc 活字节计量（MI_STAT）
#
# release 构建下 libmimalloc-sys 以 MI_DEBUG=0 编译 C 源，mimalloc 据此取
# MI_STAT=0：malloc_normal/huge 的 total/peak/current 在编译点被剔除，
# `allocator::snapshot_stats()` 的 in_use/requested/allocs 面读不出活集——
# 内存诊断只剩 committed/reserved 总量，无法回答"涨在谁身上"（2026-11-10
# 装机实证：committed 7 小时从 69MB 爬到 1006MB，RSS 仅 357MB，无活集可归因）。
#
# cc-rs 从环境取外部旗标：纯 C 编译读 CFLAGS，C++ 编译读 CXXFLAGS（MSVC
# 路径 mimalloc 以 C++ 编译，故两个都设；cl 接受 -D 形式）。关闭 = 删本节
# 后 `cargo clean -p libmimalloc-sys` 重编。代价：每次 malloc/free 多一次
# 计数（MI_STAT=1 只维护计量面，不含 MI_STAT=2 的分 bin 明细与峰值追踪）。
[env]
CFLAGS = { value = "-DMI_STAT=1", force = true }
CXXFLAGS = { value = "-DMI_STAT=1", force = true }

