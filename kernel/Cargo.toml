[workspace]
members = [
    "crates/core",
    "crates/config",
    "crates/plugin-loader",
    "crates/native-sdk",
    "crates/native-sdk-test-plugin",
    "crates/mcp",
    "crates/invoker",
    "crates/tenant",
    "crates/api",
    "crates/hooks",
    "crates/engine",
    "crates/session",
    "crates/integration-tests",
]
resolver = "2"

# libsqlite3-sys 的 sqlite3.c 在 MSVC -O2 下编译崩溃(cl.exe exit 0xc0000005)，
# 降优化级别到 1 规避（已知 MSVC + sqlite3 兼容性问题）。
[profile.release.package.libsqlite3-sys]
opt-level = 1

# ============================================================================
# dev / test profile：本地代码全量调试符号 + 第三方依赖精简
# 目标：自己写的代码能完整单步/看变量；第三方库只留 panic 行号栈，省磁盘。
#
# 两层调试符号：
#   - 顶层 debug = "full"      → workspace 内自己的 crate：行号+变量+类型，断点单步全可用
#   - package."*"               → 所有第三方依赖（tokio/serde/…）：仅 line-tables-only，
#                                 足以定位 panic 栈，但 .pdb/.rlib 体积大幅缩小（实测约 -60%~70%）
# split-debuginfo = "packed"   → Windows-MSVC 下把符号剥离到独立 .pdb，二进制本体不含重复符号
#
# 注：incremental=false / jobs=1 由 .cargo/config.toml 统一控制（本机规避编译器 ICE），此处不设。
# ============================================================================
[profile.dev]
debug = "full"
split-debuginfo = "packed"

[profile.dev.package."*"]
debug = "line-tables-only"

[profile.test]
debug = "full"
split-debuginfo = "packed"

[profile.test.package."*"]
debug = "line-tables-only"
[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 异步 trait
async-trait = "0.1"
# 错误处理
thiserror = "2"
# 日志
tracing = "0.1"
# ID 类型
uuid = { version = "1", features = ["v4", "serde"] }
# 时间
chrono = { version = "0.4", features = ["serde"] }
# OS 标准目录（%APPDATA% / ~/Library/Application Support / ~/.local/share）
dirs = "5"
# 内核 crate（workspace 内部引用）
agentos-core = { path = "crates/core" }
agentos-config = { path = "crates/config" }
agentos-plugin-loader = { path = "crates/plugin-loader" }
# 原生插件 SDK（cdylib 插件作者依赖，task_11 N3）
agentos-native-sdk = { path = "crates/native-sdk" }
agentos-mcp = { path = "crates/mcp" }
agentos-invoker = { path = "crates/invoker" }
agentos-engine = { path = "crates/engine" }
agentos-tenant = { path = "crates/tenant" }
agentos-api = { path = "crates/api" }
agentos-session = { path = "crates/session" }
agentos-hooks = { path = "crates/hooks" }
