[workspace]
members = [
    "crates/core",
    "crates/config",
    "crates/plugin-loader",
    "crates/mcp",
    "crates/invoker",
    "crates/tenant",
    "crates/api",
    "crates/hooks",
    "crates/engine",
    "crates/integration-tests",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 异步 trait
async-trait = "0.1"
# 错误处理
thiserror = "2"
# 日志
tracing = "0.1"
# ID 类型
uuid = { version = "1", features = ["v4", "serde"] }
# 时间
chrono = { version = "0.4", features = ["serde"] }
# 内核 crate（workspace 内部引用）
lingxi-core = { path = "crates/core" }
lingxi-config = { path = "crates/config" }
lingxi-plugin-loader = { path = "crates/plugin-loader" }
lingxi-mcp = { path = "crates/mcp" }
lingxi-invoker = { path = "crates/invoker" }
lingxi-engine = { path = "crates/engine" }
lingxi-tenant = { path = "crates/tenant" }
lingxi-api = { path = "crates/api" }
lingxi-hooks = { path = "crates/hooks" }
