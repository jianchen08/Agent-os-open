[workspace]
members = [
    "crates/core",
    "crates/config",
    "crates/plugin-loader",
    "crates/native-sdk",
    "crates/native-sdk-test-plugin",
    "crates/mcp",
    "crates/invoker",
    "crates/tenant",
    "crates/api",
    "crates/http",
    "crates/db-admin",
    "crates/user-admin",
    "crates/hooks",
    "crates/engine",
    "crates/session",
    "crates/integration-tests",
]
resolver = "2"

# libsqlite3-sys 的 sqlite3.c 在 MSVC -O2 下编译崩溃(cl.exe exit 0xc0000005)，
# 降优化级别到 1 规避（已知 MSVC + sqlite3 兼容性问题）。
[profile.release.package.libsqlite3-sys]
opt-level = 1

# ============================================================================
# dev / test（test 继承 dev）：全仓统一 line-tables-only。
# 只保留行号表——panic/backtrace 能定位到文件:行号，但不含变量/类型信息，
# .pdb/.rlib 体积比 full 小一个数量级（历史上 full 曾把 target/debug 撑到 46G）。
# 需要断点单步看变量时临时覆盖即可，不必改本文件：
#   CARGO_PROFILE_DEV_DEBUG=full cargo test ...
# 注：MSVC 下符号本就拆到独立 .pdb；MSVC 编译器 ICE 的规避配置 incremental=false
#     / jobs=1 曾由本机手建 kernel/.cargo/config.toml 承担——该文件不入仓，
#     工作区还原会抹掉（历史诱因：rustc 1.85/1.92 双版本共存，现单版本 1.85.0）。
#     若 ICE 复发，重建该文件写入：
#       [build]
#       incremental = false
#       jobs = 1
# 产物回收：python scripts/clean_rust_debug.py 全清；--older-than N 增量回收
#     （per-crate hash 簇判定：同 crate 最新副本永远保留，旧副本冷置满 N 天
#     回收，单副本 crate 不动），由 run_gates kernel-artifact-sweep 车道
#     在 kernel-test/kernel-coverage 后自动执行。
# ============================================================================
[profile.dev]
debug = "line-tables-only"

# release 剥离调试信息（保留符号表，panic 栈仍有函数名）；行号级定位交给 dev profile。
[profile.release]
strip = "debuginfo"
[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# 异步 trait
async-trait = "0.1"
# 错误处理
thiserror = "2"
# 日志
tracing = "0.1"
# ID 类型
uuid = { version = "1", features = ["v4", "serde"] }
# HTTP 客户端（MCP Streamable HTTP transport：external_mcp 插件连远程第三方 MCP server）
# rustls-tls 而非 native-tls——Windows 宿主免 OpenSSL 折腾，跨平台一致。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# URL 解析（agentos-mcp 的 SSRF 出网守卫；transport 本体已迁 rmcp，见
# ADR 2026-09-24-external-mcp-http-rmcp-migration）
url = "2"
# HTTP 语义类型（HeaderName/HeaderValue；rmcp transport config 的自定义头面）
http = "1"
# 时间
chrono = { version = "0.4", features = ["serde"] }
# OS 标准目录（%APPDATA% / ~/Library/Application Support / ~/.local/share）
dirs = "5"
# tool_core messages 序列化（对齐 Python get_format_manager 默认 YAML）。
serde_yaml = "0.9"
form_urlencoded = "1"
# 口令哈希（argon2id）+ token HMAC 签名（D1/D12：认证链加固）
argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
# 全局分配器（Windows 段堆并发高水位滞留修复，ADR 2026-08-31-mimalloc-global-allocator）
mimalloc = { version = "0.1.52", features = ["extended"] }
# mimalloc 选项控制（mi_option_set：purge_delay=0 空闲页立即归还 OS）
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
# 内核 crate（workspace 内部引用）
agentos-core = { path = "crates/core" }
agentos-config = { path = "crates/config" }
agentos-plugin-loader = { path = "crates/plugin-loader" }
# 原生插件 SDK（cdylib 插件作者依赖，task_11 N3）
agentos-native-sdk = { path = "crates/native-sdk" }
agentos-mcp = { path = "crates/mcp" }
agentos-invoker = { path = "crates/invoker" }
agentos-engine = { path = "crates/engine" }
agentos-tenant = { path = "crates/tenant" }
agentos-api = { path = "crates/api" }
agentos-http = { path = "crates/http" }
agentos-db-admin = { path = "crates/db-admin" }
agentos-user-admin = { path = "crates/user-admin" }
agentos-session = { path = "crates/session" }
agentos-hooks = { path = "crates/hooks" }
