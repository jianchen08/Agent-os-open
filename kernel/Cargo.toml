[workspace]
members = [
    "crates/core",
    "crates/config",
    "crates/plugin-loader",
    "crates/native-sdk",
    "crates/native-sdk-test-plugin",
    "crates/mcp",
    "crates/invoker",
    "crates/tenant",
    "crates/api",
    "crates/hooks",
    "crates/engine",
    "crates/session",
    "crates/integration-tests",
]
resolver = "2"

# libsqlite3-sys 的 sqlite3.c 在 MSVC -O2 下编译崩溃(cl.exe exit 0xc0000005)，
# 降优化级别到 1 规避（已知 MSVC + sqlite3 兼容性问题）。
[profile.release.package.libsqlite3-sys]
opt-level = 1

# ── dev profile 瘦身配置 ──────────────────────────────────────────────
# 目标：在【不损失调试能力】的前提下，减小 target/debug 体积。
#   - debug = true       ：保留完整源码级调试符号（PDB），断点/单步/变量查看全部可用。
#   - split-debuginfo = "packed" ：MSVC 下把分散在每个 .rlib 里的调试信息收敛，
#                                  减少重复编码、降低 deps 目录冗余，调试器照常加载符号。
#   - debug = "line-tables-only" 用在依赖上：第三方 crate 只保留行号表（足够栈回溯），
#                                  仅本 workspace crate 保留完整符号，显著省体积。
# 实测：历史 16G debug 产物主要来自 deps 里 916 份 .rlib + 141 份 .pdb 重复编码。
[profile.dev]
debug = true
split-debuginfo = "packed"

[profile.dev.package."*"]
debug = "line-tables-only"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 异步 trait
async-trait = "0.1"
# 错误处理
thiserror = "2"
# 日志
tracing = "0.1"
# ID 类型
uuid = { version = "1", features = ["v4", "serde"] }
# 时间
chrono = { version = "0.4", features = ["serde"] }
# OS 标准目录（%APPDATA% / ~/Library/Application Support / ~/.local/share）
dirs = "5"
# 内核 crate（workspace 内部引用）
agentos-core = { path = "crates/core" }
agentos-config = { path = "crates/config" }
agentos-plugin-loader = { path = "crates/plugin-loader" }
# 原生插件 SDK（cdylib 插件作者依赖，task_11 N3）
agentos-native-sdk = { path = "crates/native-sdk" }
agentos-mcp = { path = "crates/mcp" }
agentos-invoker = { path = "crates/invoker" }
agentos-engine = { path = "crates/engine" }
agentos-tenant = { path = "crates/tenant" }
agentos-api = { path = "crates/api" }
agentos-session = { path = "crates/session" }
agentos-hooks = { path = "crates/hooks" }
