[package]
name = "agentos-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lingxi AgentOS 0.2 kernel core traits and types"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
# 用户空间解析（user_space.rs）：OS 标准数据目录（%APPDATA% / XDG / Library）
dirs.workspace = true
arc-swap.workspace = true
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
# 模式种子版本对账（user_space.rs）：种子 version 按 semver 语义比较
semver = "1"

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"

# 设备档案内存探测（device_profile.rs）：GetPhysicallyInstalledSystemMemory。
# 仅 FFI 声明零运行时开销，且为本仓依赖图既有传递依赖（Cargo.lock 0.52.0）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
] }
