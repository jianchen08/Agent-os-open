[package]
name = "agentos-plugin-loader"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lingxi AgentOS 0.2 plugin loader — discovery, manifest validation, lifecycle"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
agentos-core.workspace = true
agentos-mcp.workspace = true
parking_lot = "0.12"
chrono.workspace = true
# 插件准入哈希校验（P2-2）
sha2 = "0.10"
# 原生插件 cdylib 动态加载（直接 dlopen 拿构造函数符号，还原 Box<dyn PipelinePlugin>）。
libloading = "0.8"
# 原生插件 interface crate（PipelinePlugin trait 契约）。
agentos-native-sdk.workspace = true
# WASM 插件运行时（task_11 N5-N10）。
# 锁定 wasmtime 25：更高版本（≥28）的若干传递依赖需 rustc>1.85；
# 25.0.3 在 rustc 1.85 可编译（配合下方 Cargo.lock 中对 windows-sys/memchr 等的精确降级）。
# 见计划文档 §八 #1/#3 与本 crate 顶部文档。
wasmtime = { version = "25", default-features = false, features = [
    "cranelift",
    "runtime",
    "cache",        # Module::serialize 预编译缓存（计划文档 §八 #5）
] }
# WAT 文本解析（load_bytes 支持 WAT，免去 wasm32 工具链依赖）。
# wasmtime 25 的 "wat" feature 即转发到此 crate；显式依赖避免版本漂移。
wat = "1"

[dev-dependencies]
tempfile = "3"
agentos-native-sdk.workspace = true
