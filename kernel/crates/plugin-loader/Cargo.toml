[package]
name = "agentos-plugin-loader"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lingxi AgentOS 0.2 plugin loader — discovery, manifest validation, lifecycle"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
agentos-core.workspace = true
agentos-mcp.workspace = true
parking_lot = "0.12"
chrono.workspace = true
# 插件准入哈希校验（P2-2）
sha2 = "0.10"
# 原生插件 cdylib 动态加载（直接 dlopen 拿构造函数符号，还原 Box<dyn PipelinePlugin>）。
libloading = "0.8"
# 原生插件 interface crate（PipelinePlugin trait 契约）。
agentos-native-sdk.workspace = true

[dev-dependencies]
mimalloc = { version = "0.1.52", features = ["extended"] }
tempfile = "3"
agentos-native-sdk.workspace = true
