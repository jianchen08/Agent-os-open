[package]
name = "agentos-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lingxi AgentOS 0.2 pipeline engine — minimal scheduler + SQLite state ledger"

[dependencies]
tokio.workspace = true
# 并行 for-each 的有界并发流（buffer_unordered）：借用友好的并发组合子——
# JoinSet 要求 'static（step/compiled 计划是借用），futures 的 stream 组合不受此限。
futures = "0.3"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
agentos-core.workspace = true
agentos-tenant.workspace = true
agentos-hooks.workspace = true
agentos-invoker = { path = "../invoker" }
parking_lot = "0.12"
chrono.workspace = true
uuid.workspace = true
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
