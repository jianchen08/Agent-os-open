[package]
name = "agentos-native-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lingxi AgentOS native plugin SDK — direct trait object contract (no abi_stable)"

[dependencies]
serde.workspace = true
serde_json.workspace = true

[lib]
# interface crate：被内核（host）和插件（implementation cdylib）共同依赖。
# 自身是 rlib，插件 crate 声明自己的 crate-type = ["cdylib"]。
crate-type = ["rlib"]
