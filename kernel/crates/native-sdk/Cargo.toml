[package]
name = "agentos-native-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lingxi AgentOS native (cdylib) plugin SDK — plugin_entry! macro + C-ABI contract"

[dependencies]
serde.workspace = true
serde_json.workspace = true

[lib]
# 该 crate 同时作为 rlib（供宏/类型引用）和 cdylib（自测产物）。
# 插件项目依赖本 crate 后，其自身 Cargo.toml 声明 crate-type = ["cdylib"]。
crate-type = ["rlib"]
