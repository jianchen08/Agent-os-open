[package]
name = "agentos-wasm-hello-plugin"
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
description = "WASM hello world 插件样例（task_11 N10）：验证 host↔guest JSON 经线性内存契约 + 体积实测"

# 独立 workspace（不并入 kernel workspace——它是 wasm32 目标，会干扰 host 构建）。
[workspace]

[lib]
crate-type = ["cdylib"]

# 无外部依赖——刻意保持最小体积，用于实测 wasm32-unknown-unknown 产物大小。
[dependencies]
