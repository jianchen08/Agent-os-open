version: "20260119_add_pass_threshold_to_evaluation_metrics"
name: "add_pass_threshold_to_evaluation_metrics"
description: "为 evaluation_metrics 表添加 default_pass_threshold 字段，用于存储默认通过阈值"

up: |
  -- 添加 default_pass_threshold 字段（SQLite 兼容）
  -- 首先检查列是否不存在
  SELECT 'ALTER TABLE evaluation_metrics ADD COLUMN default_pass_threshold FLOAT'
  WHERE NOT EXISTS (
    SELECT 1 FROM pragma_table_info('evaluation_metrics')
    WHERE name = 'default_pass_threshold'
  );

