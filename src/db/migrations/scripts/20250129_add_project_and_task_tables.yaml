# -*- coding: utf-8 -*-
# 数据库迁移：添加项目和任务表
#
# 创建 projects 表和更新 tasks 表，用于长期任务和子任务管理
# 双层指挥系统：L1 主 Agent 管理 Project，L2 Sub Agent 管理 Task

version: "20250129_add_project_and_task_tables"
name: "add_project_and_task_tables"
description: "创建 projects 表和更新 tasks 表，支持长期任务管理和双层指挥系统"

up: |
  -- 第一步：创建 projects 表（不引用 tasks）
  CREATE TABLE IF NOT EXISTS projects (
    id VARCHAR(36) PRIMARY KEY,
    user_id VARCHAR(36) NOT NULL REFERENCES users(id) ON DELETE CASCADE,
    session_id VARCHAR(36) REFERENCES sessions(id) ON DELETE SET NULL,
    goal TEXT NOT NULL,
    project_ac JSONB,
    status VARCHAR(50) DEFAULT 'planning',
    auto_execute BOOLEAN DEFAULT FALSE,
    current_task_index INTEGER DEFAULT 0,
    metadata JSONB,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP WITH TIME ZONE
  );

  -- 第二步：为现有的 tasks 表添加 project_id 字段（不带外键约束）
  ALTER TABLE tasks ADD COLUMN IF NOT EXISTS project_id VARCHAR(36);

  -- 第三步：更新数据，确保 project_id 指向有效的 projects.id
  -- UPDATE tasks SET project_id = NULL WHERE project_id IS NOT NULL AND NOT EXISTS (SELECT 1 FROM projects WHERE projects.id = tasks.project_id);

  -- 第四步：添加外键约束
  ALTER TABLE tasks ADD CONSTRAINT fk_tasks_project_id FOREIGN KEY (project_id) REFERENCES projects(id) ON DELETE CASCADE;

  -- 第五步：添加其他缺失字段
  ALTER TABLE tasks ADD COLUMN IF NOT EXISTS parent_task_id VARCHAR(36);
  ALTER TABLE tasks ADD COLUMN IF NOT EXISTS user_id VARCHAR(36);
  ALTER TABLE tasks ADD COLUMN IF NOT EXISTS priority INTEGER DEFAULT 5;
  ALTER TABLE tasks ADD COLUMN IF NOT EXISTS due_date TIMESTAMP WITH TIME ZONE;
  ALTER TABLE tasks ADD COLUMN IF NOT EXISTS tags JSONB;
  ALTER TABLE tasks ADD COLUMN IF NOT EXISTS goal JSONB;
  ALTER TABLE tasks ADD COLUMN IF NOT EXISTS acceptance_criteria JSONB;
  ALTER TABLE tasks ADD COLUMN IF NOT EXISTS target_type VARCHAR(50);
  ALTER TABLE tasks ADD COLUMN IF NOT EXISTS target_id VARCHAR(36);
  ALTER TABLE tasks ADD COLUMN IF NOT EXISTS target_name VARCHAR(255);
  ALTER TABLE tasks ADD COLUMN IF NOT EXISTS total_criteria INTEGER DEFAULT 0;
  ALTER TABLE tasks ADD COLUMN IF NOT EXISTS passed_criteria INTEGER DEFAULT 0;
  ALTER TABLE tasks ADD COLUMN IF NOT EXISTS failed_criteria INTEGER DEFAULT 0;
  ALTER TABLE tasks ADD COLUMN IF NOT EXISTS progress_percent FLOAT DEFAULT 0.0;
  ALTER TABLE tasks ADD COLUMN IF NOT EXISTS retry_count INTEGER DEFAULT 0;
  ALTER TABLE tasks ADD COLUMN IF NOT EXISTS max_retries INTEGER DEFAULT 3;
  ALTER TABLE tasks ADD COLUMN IF NOT EXISTS current_phase VARCHAR(50);
  ALTER TABLE tasks ADD COLUMN IF NOT EXISTS phase_status JSONB;
  ALTER TABLE tasks ADD COLUMN IF NOT EXISTS started_at TIMESTAMP WITH TIME ZONE;
  ALTER TABLE tasks ADD COLUMN IF NOT EXISTS completed_at TIMESTAMP WITH TIME ZONE;
  ALTER TABLE tasks ADD COLUMN IF NOT EXISTS error_message TEXT;
  ALTER TABLE tasks ADD COLUMN IF NOT EXISTS metadata JSONB;
  ALTER TABLE tasks ADD COLUMN IF NOT EXISTS updated_at TIMESTAMP WITH TIME ZONE;

  -- 第六步：创建 acceptance_criteria 表
  CREATE TABLE IF NOT EXISTS acceptance_criteria (
    id VARCHAR(36) PRIMARY KEY,
    task_id VARCHAR(36) NOT NULL,
    description TEXT NOT NULL,
    evaluator_type VARCHAR(50) NOT NULL,
    evaluator_id VARCHAR(255) NOT NULL,
    status VARCHAR(50) DEFAULT 'pending',
    result JSONB,
    evaluated_at TIMESTAMP WITH TIME ZONE,
    retry_count INTEGER DEFAULT 0,
    is_red_line BOOLEAN DEFAULT FALSE,
    weight FLOAT DEFAULT 1.0,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP WITH TIME ZONE
  );

  -- 第七步：添加外键约束到 acceptance_criteria
  ALTER TABLE acceptance_criteria ADD CONSTRAINT fk_acceptance_criteria_task_id FOREIGN KEY (task_id) REFERENCES tasks(id) ON DELETE CASCADE;

  -- 第八步：创建 task_phase_results 表
  CREATE TABLE IF NOT EXISTS task_phase_results (
    id VARCHAR(36) PRIMARY KEY,
    task_id VARCHAR(36) NOT NULL,
    phase VARCHAR(50) NOT NULL,
    status VARCHAR(50) DEFAULT 'pending',
    start_time TIMESTAMP WITH TIME ZONE,
    end_time TIMESTAMP WITH TIME ZONE,
    output JSONB,
    error TEXT,
    duration_ms INTEGER,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP WITH TIME ZONE
  );

  -- 第九步：添加外键约束到 task_phase_results
  ALTER TABLE task_phase_results ADD CONSTRAINT fk_task_phase_results_task_id FOREIGN KEY (task_id) REFERENCES tasks(id) ON DELETE CASCADE;

  -- 第十步：创建索引
  CREATE INDEX IF NOT EXISTS idx_projects_user_id ON projects(user_id);
  CREATE INDEX IF NOT EXISTS idx_projects_session_id ON projects(session_id);
  CREATE INDEX IF NOT EXISTS idx_projects_status ON projects(status);
  CREATE INDEX IF NOT EXISTS idx_tasks_project_id ON tasks(project_id);
  CREATE INDEX IF NOT EXISTS idx_tasks_user_id ON tasks(user_id);
  CREATE INDEX IF NOT EXISTS idx_acceptance_criteria_task_id ON acceptance_criteria(task_id);
  CREATE INDEX IF NOT EXISTS idx_acceptance_criteria_status ON acceptance_criteria(status);
  CREATE INDEX IF NOT EXISTS idx_task_phase_results_task_id ON task_phase_results(task_id);
  CREATE INDEX IF NOT EXISTS idx_task_phase_results_phase ON task_phase_results(phase);

down: |
