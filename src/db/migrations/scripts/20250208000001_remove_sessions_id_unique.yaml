version: "20250208000001"
name: remove_sessions_id_unique
description: 移除 sessions.id 的唯一约束，改为用户级别唯一
up: |
  -- SQLite 不支持直接移除约束，需要重建表
  -- 1. 创建新表（没有 unique 约束）
  CREATE TABLE sessions_new (
      user_id VARCHAR(36) NOT NULL,
      session_seq INTEGER NOT NULL,
      id VARCHAR(36) NOT NULL,
      agent_id VARCHAR(255),
      title VARCHAR(255),
      status VARCHAR(20),
      context_data JSON,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      updated_at TIMESTAMP,
      PRIMARY KEY (user_id, session_seq),
      FOREIGN KEY (user_id) REFERENCES users (id) ON DELETE CASCADE
  );
  
  -- 2. 复制数据
  INSERT INTO sessions_new
  SELECT user_id, session_seq, id, agent_id, title, status,
         context_data, created_at, updated_at
  FROM sessions;
  
  -- 3. 删除旧表
  DROP TABLE sessions;
  
  -- 4. 重命名新表
  ALTER TABLE sessions_new RENAME TO sessions;
  
  -- 5. 创建索引
  CREATE INDEX ix_sessions_id ON sessions (id);
  CREATE INDEX ix_sessions_agent_id ON sessions (agent_id);

down: |
  -- 回滚：重新添加 unique 约束（需要确保没有重复数据）
  -- 注意：如果已经有重复数据，回滚会失败
  CREATE TABLE sessions_new (
      user_id VARCHAR(36) NOT NULL,
      session_seq INTEGER NOT NULL,
      id VARCHAR(36) NOT NULL UNIQUE,
      agent_id VARCHAR(255),
      title VARCHAR(255),
      status VARCHAR(20),
      context_data JSON,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      updated_at TIMESTAMP,
      PRIMARY KEY (user_id, session_seq),
      FOREIGN KEY (user_id) REFERENCES users (id) ON DELETE CASCADE
  );
  
  INSERT INTO sessions_new
  SELECT user_id, session_seq, id, agent_id, title, status,
         context_data, created_at, updated_at
  FROM sessions;
  
  DROP TABLE sessions;
  ALTER TABLE sessions_new RENAME TO sessions;
  
  CREATE INDEX ix_sessions_id ON sessions (id);
  CREATE INDEX ix_sessions_agent_id ON sessions (agent_id);
