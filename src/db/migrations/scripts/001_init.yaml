# -*- coding: utf-8 -*-
version: "001"
name: "init"
description: "初始数据库结构"
up: |
  -- 创建用户表
  CREATE TABLE IF NOT EXISTS users (
    id VARCHAR(36) PRIMARY KEY,
    username VARCHAR(255) UNIQUE NOT NULL,
    email_encrypted BYTEA,
    password_hash TEXT NOT NULL,
    role VARCHAR(50) DEFAULT 'user',
    preferences JSONB,
    is_active BOOLEAN DEFAULT TRUE,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP WITH TIME ZONE
  );

  -- 创建会话表
  CREATE TABLE IF NOT EXISTS sessions (
    id VARCHAR(36) PRIMARY KEY,
    user_id VARCHAR(36) NOT NULL REFERENCES users(id),
    title VARCHAR(255),
    status VARCHAR(50) DEFAULT 'active',
    parent_session_id VARCHAR(36) REFERENCES sessions(id),
    branch_from_message_id VARCHAR(36),
    context_data JSONB,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP WITH TIME ZONE
  );

  -- 创建消息表
  CREATE TABLE IF NOT EXISTS messages (
    id VARCHAR(36) PRIMARY KEY,
    session_id VARCHAR(36) NOT NULL REFERENCES sessions(id),
    parent_id VARCHAR(36) REFERENCES messages(id),
    sequence INTEGER NOT NULL,
    role VARCHAR(100) NOT NULL,
    agent_id VARCHAR(36) REFERENCES agents(id),
    content TEXT,
    tool_calls JSONB,
    tool_call_id VARCHAR(255),
    extra_data JSONB,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
  );

  -- 创建 Agent 表
  CREATE TABLE IF NOT EXISTS agents (
    id VARCHAR(36) PRIMARY KEY,
    name VARCHAR(255) UNIQUE NOT NULL,
    description TEXT,
    description_vector JSONB,
    type VARCHAR(50) DEFAULT 'user_defined',
    source VARCHAR(50) DEFAULT 'database',
    config JSONB NOT NULL DEFAULT '{}',
    status VARCHAR(50) DEFAULT 'active',
    success_count INTEGER DEFAULT 0,
    avg_score FLOAT,
    last_used_at TIMESTAMP WITH TIME ZONE,
    created_by VARCHAR(36),
    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
  );

  -- 创建工作流表
  CREATE TABLE IF NOT EXISTS workflows (
    id VARCHAR(36) PRIMARY KEY,
    name VARCHAR(255) NOT NULL,
    description TEXT,
    description_vector JSONB,
    type VARCHAR(50) DEFAULT 'user_defined',
    source VARCHAR(50) DEFAULT 'native',
    source_id VARCHAR(255),
    definition JSONB NOT NULL,
    inputs_schema JSONB,
    outputs_schema JSONB,
    status VARCHAR(50) DEFAULT 'active',
    success_count INTEGER DEFAULT 0,
    avg_score FLOAT,
    last_used_at TIMESTAMP WITH TIME ZONE,
    created_by VARCHAR(36),
    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
  );

  -- 创建工具库表
  CREATE TABLE IF NOT EXISTS tool_library (
    id VARCHAR(36) PRIMARY KEY,
    name VARCHAR(255) UNIQUE NOT NULL,
    description TEXT,
    description_vector JSONB,
    args_schema JSONB,
    return_schema JSONB,
    source_type VARCHAR(50) DEFAULT 'code',
    source_code TEXT,
    config JSONB,
    requires_approval BOOLEAN DEFAULT FALSE,
    status VARCHAR(50) DEFAULT 'active',
    success_count INTEGER DEFAULT 0,
    last_used_at TIMESTAMP WITH TIME ZONE,
    created_by VARCHAR(36),
    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
  );

  -- 创建情景记忆表
  CREATE TABLE IF NOT EXISTS episodes_memory (
    id VARCHAR(36) PRIMARY KEY,
    user_id VARCHAR(36) NOT NULL REFERENCES users(id),
    session_id VARCHAR(36) REFERENCES sessions(id),
    intent_text TEXT NOT NULL,
    intent_vector JSONB,
    plan_dag JSONB,
    execution_summary TEXT,
    evaluation_report JSONB,
    final_score FLOAT,
    tags JSONB,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
  );

  -- 创建语义记忆表
  CREATE TABLE IF NOT EXISTS semantic_memory (
    id VARCHAR(36) PRIMARY KEY,
    user_id VARCHAR(36) NOT NULL REFERENCES users(id),
    source_type VARCHAR(50) NOT NULL,
    source_id VARCHAR(36),
    content TEXT NOT NULL,
    embedding JSONB,
    extra_data JSONB,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP WITH TIME ZONE
  );

  -- 创建知识库表
  CREATE TABLE IF NOT EXISTS knowledge_bases (
    id VARCHAR(36) PRIMARY KEY,
    user_id VARCHAR(36) NOT NULL REFERENCES users(id),
    name VARCHAR(255) NOT NULL,
    description TEXT,
    type VARCHAR(50) DEFAULT 'document',
    source_url TEXT,
    status VARCHAR(50) DEFAULT 'processing',
    doc_count INTEGER DEFAULT 0,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP WITH TIME ZONE
  );

  -- 创建检查点表
  CREATE TABLE IF NOT EXISTS checkpoints (
    thread_id VARCHAR(255) NOT NULL,
    thread_ts VARCHAR(255) NOT NULL,
    parent_ts VARCHAR(255),
    checkpoint BYTEA NOT NULL,
    checkpoint_metadata JSONB,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
    PRIMARY KEY (thread_id, thread_ts)
  );

  -- 创建检查点写入记录表
  CREATE TABLE IF NOT EXISTS checkpoint_writes (
    thread_id VARCHAR(255) NOT NULL,
    thread_ts VARCHAR(255) NOT NULL,
    task_id VARCHAR(255) NOT NULL,
    idx INTEGER NOT NULL,
    channel VARCHAR(255),
    type VARCHAR(255),
    value BYTEA,
    PRIMARY KEY (thread_id, thread_ts, task_id, idx)
  );

  -- 创建索引
  CREATE INDEX IF NOT EXISTS idx_sessions_user_id ON sessions(user_id);
  CREATE INDEX IF NOT EXISTS idx_sessions_status ON sessions(status);
  CREATE INDEX IF NOT EXISTS idx_messages_session_id ON messages(session_id);
  CREATE INDEX IF NOT EXISTS idx_messages_parent_id ON messages(parent_id);
  CREATE INDEX IF NOT EXISTS idx_messages_agent_id ON messages(agent_id);
  CREATE INDEX IF NOT EXISTS idx_agents_status ON agents(status);
  CREATE INDEX IF NOT EXISTS idx_workflows_status ON workflows(status);
  CREATE INDEX IF NOT EXISTS idx_tool_library_status ON tool_library(status);
  CREATE INDEX IF NOT EXISTS idx_episodes_memory_user_id ON episodes_memory(user_id);
  CREATE INDEX IF NOT EXISTS idx_episodes_memory_session_id ON episodes_memory(session_id);
  CREATE INDEX IF NOT EXISTS idx_semantic_memory_user_id ON semantic_memory(user_id);
  CREATE INDEX IF NOT EXISTS idx_knowledge_bases_user_id ON knowledge_bases(user_id);
down: |
  -- 删除表（按依赖关系逆序）
  DROP INDEX IF EXISTS idx_knowledge_bases_user_id;
  DROP INDEX IF EXISTS idx_semantic_memory_user_id;
  DROP INDEX IF EXISTS idx_episodes_memory_session_id;
  DROP INDEX IF EXISTS idx_episodes_memory_user_id;
  DROP INDEX IF EXISTS idx_tool_library_status;
  DROP INDEX IF EXISTS idx_workflows_status;
  DROP INDEX IF EXISTS idx_agents_status;
  DROP INDEX IF EXISTS idx_messages_agent_id;
  DROP INDEX IF EXISTS idx_messages_parent_id;
  DROP INDEX IF EXISTS idx_messages_session_id;
  DROP INDEX IF EXISTS idx_sessions_status;
  DROP INDEX IF EXISTS idx_sessions_user_id;

  DROP TABLE IF EXISTS checkpoint_writes;
  DROP TABLE IF EXISTS checkpoints;
  DROP TABLE IF EXISTS knowledge_bases;
  DROP TABLE IF EXISTS semantic_memory;
  DROP TABLE IF EXISTS episodes_memory;
  DROP TABLE IF EXISTS tool_library;
  DROP TABLE IF EXISTS workflows;
  DROP TABLE IF EXISTS agents;
  DROP TABLE IF EXISTS messages;
  DROP TABLE IF EXISTS sessions;
  DROP TABLE IF EXISTS users;
