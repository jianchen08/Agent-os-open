# task_manage 工具定义（OpenAI function calling 格式）
# 5 个操作：get / continue / stop / delete / change

name: task_manage
description: |
  任务管理工具：用于查询和控制任务的生命周期。

  ## 5 个操作
  - **get**：查询任务。不传 task_id → 返回列表简表；传 task_id → 返回单个任务详情
  - **continue**：继续执行（针对非容器任务）。可重试失败任务、恢复已停止任务、向运行中任务注入指令
  - **stop**：停止任务（针对非容器任务）。统一进入 stopped 状态（数据完好，可 continue 恢复）
  - **delete**：彻底删除任务
  - **change**：变更容器任务状态（仅L1，仅容器任务）。容器只是子任务的集合，无执行体，
    状态可自由变更。通过 status 参数指定目标状态；status=completed 时会清理子任务 worktree。

  ## continue 的四种行为
  - 运行中任务 + message：注入指令（不改变状态）
  - 失败/超时任务：重试（自动继承管道+空间）
  - 失败/超时任务 + message：重试 + 注入指令
  - 已停止任务：恢复执行

  ## change 说明
  - 仅限 L1 主 Agent，仅对容器任务（task_scope=container）生效
  - 容器状态可自由切换到任意目标状态（completed/failed/pending/running/stopped/timeout）
  - status=completed：清理子任务 worktree；其它状态：纯改状态字段

  ## 权限
  - L1：默认只显示自己提交的任务；传 show_all=true 可递归查看当前会话所有任务
  - L2：只能管理自己提交的子任务

  ## 失败处理策略（权威源，所有 Agent 失败时按此处理）

  核心原则：**优先抢救已有工作成果，禁止动辄重新提交丢弃成果。**

  子任务在 worktree 副本中完成的工作是真实产出。任务失败（尤其合并失败、评估失败）
  时，绝大多数情况是"工作做完了但没合并好"或"差一点没过门禁"，不是"全白做了"。
  重新提交任务会丢弃 worktree 中的成果从头来过，是最大浪费，必须避免。

  处理顺序（严格按优先级，上一级不可行才下一级）：

  1. **先查失败原因**：用 get 查看失败任务的详情和 recent_activities，搞清楚
     - 是合并失败（worktree 产出无法合并回主空间）？
     - 是评估未通过（产出存在但质量不达标）？
     - 是执行报错（产出不完整或错误）？
     不要连失败原因都不看就重新提交。

  2. **优先处理已有工作成果**（适用：合并失败、评估未通过但产出基本可用）：
     - 合并问题用 resource_merge 工具（action=merge）直接合并 worktree 变更到目标空间；
       有冲突先用 git_diff 查看冲突，用 git_merge_abort 中止错误合并，解决后重新 merge。
     - 评估未过/产出缺失用 host 模式（task_submit 设 isolation_level=host）直接在目标空间
       补全缺失部分、修复评估指出的问题。处理对象是"已有的产出文件"，不是"重新生成一遍"。
     - 典型场景：子任务代码已写好但 worktree 合并冲突 → resource_merge 解决冲突后合并；
       评估差几个测试没过 → host 模式补测试而非重写全部代码。

  3. **定向重试失败环节**（适用：产出部分错误，但可定位到具体环节）：
     - 用 continue 重试失败任务（自动继承管道+空间，保留已有成果），
       并通过 message 注入精确的修复指令（附失败证据，指向具体问题）。
     - 不是重新 task_submit 一个全新任务，而是在原任务上 continue。

  4. **重新提交整个任务**（最后手段，仅当：worktree 无有效产出、或产出完全错误）：
     - 只有当前三级都不可行（工作成果无法抢救）时，才重新 task_submit。
     - 重新提交必须继承原工作空间（inherit_workspace_from），尽量复用还能用的部分。

  5. **上报人类**：多次处理（同级手段最多 3 次）仍失败，通知人类，不要自行放弃。

  判定依据：失败后第一反应必须是"看失败原因 + 检查 worktree 有没有产出"，
  而不是"重新提交"。有产出就抢救（步骤2/3），无产出才重做（步骤4）。

  ## 合并失败专项处理

  合并失败（worktree 产出无法自动合并回主空间）是最常见的失败类型，专项处理：
  - 合并失败 ≠ 工作白做。worktree 里的代码/产出仍在，只是合并这一步卡住。
  - 处理方式：用 resource_merge 工具解决。先用 git_diff 查看冲突文件，判断保留哪边；
    解决冲突后用 merge 完成合并；合并方向错误可用 git_merge_abort 中止重来。
  - 禁止因为合并失败就重新提交任务重做（worktree 的成果会被新 worktree 覆盖）。
  - 多次合并仍冲突：检查冲突文件内容，人工判断保留哪边，上报人类决策。

parameters:
  type: object
  properties:
    action:
      type: string
      enum:
        - get
        - continue
        - stop
        - delete
        - change
      description: |
        操作类型：
        - get：查询任务。不传 task_id 返回列表简表，传 task_id 返回详情
        - continue：继续执行（重试/恢复/注入指令，针对非容器任务）
        - stop：停止任务（统一进入 stopped 状态，针对非容器任务）
        - delete：删除任务
        - change：变更容器任务状态（仅L1，仅容器任务），需配合 status 指定目标状态

    task_id:
      type: string
      description: |
        目标任务 ID。
        - get：不传返回列表，传入返回详情
        - continue/stop/delete：必填（与 task_ids 二选一）
        - change：必填

    task_ids:
      type: array
      items:
        type: string
      description: 批量任务 ID 列表（与 task_id 二选一）。适用于 continue/stop/delete 操作

    task_scope:
      type: string
      enum:
        - all
        - container
        - non_container
      description: 任务范围过滤（get 列表模式时生效）
      default: all

    status:
      type: string
      enum:
        - pending
        - running
        - stopped
        - completed
        - failed
        - timeout
      description: |
        双重用途：
        - get 列表模式：按状态筛选
        - change 操作：目标状态（必填），如 completed/failed/pending/running/stopped/timeout

    message:
      type: string
      description: |
        注入的指令内容（continue 操作时可选）。
        - 不传：纯重试/恢复，无额外指令
        - 传入：注入指令，子任务下一轮会看到此消息

    reason:
      type: string
      description: 操作原因说明（stop/delete 时推荐填写）

    container_reason:
      type: string
      description: 容器操作原因（change 操作时填写，记录到任务 metadata）

    include_details:
      type: boolean
      description: 是否包含详细信息（get 详情模式生效）。设为 true 时返回 recent_activities 和 elapsed_seconds
      default: false

    include_agent_calls:
      type: boolean
      description: 是否只返回工具调用类型的活动记录（get 详情模式生效，自动启用详细信息）
      default: false

    parent_task_id:
      type: string
      description: 父任务 ID（get 列表模式时传入可筛选该容器下的子任务）

    project_id:
      type: string
      description: 项目 ID，用于筛选特定项目的任务

    session_id:
      type: string
      description: 会话 ID，用于筛选特定会话的任务

    limit:
      type: integer
      description: 返回数量限制，默认 50，最大 100
      default: 50
      maximum: 100

    show_all:
      type: boolean
      description: 是否显示当前会话的所有任务（含子任务的子任务）。默认 false，L1 只显示自己提交的任务。仅 L1 生效。
      default: false

  required:
    - action
