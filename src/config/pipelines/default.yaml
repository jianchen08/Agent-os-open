# Default Pipeline Configuration
# 默认管道配置 — 与 load_pipeline_config() 扁平格式兼容

name: "lingxi_agent"

# 输入路由表：决定每轮迭代的执行路径
input_routes:
  - name: stop
    condition: "should_stop == True"
    target: end
    plugins: []
    priority: 1

  - name: default
    condition: "True"
    target: core
    plugins: [tool_schema]
    priority: 10

# 输出路由表：决定输出阶段的路由
# 优先级数值越小越先匹配
output_routes:
  # 1. 用户请求停止 → 立即结束
  - route_type: end
    condition: "should_stop == True"
    priority: 1

  # 2. 有待处理工具调用 → 进入工具执行
  - route_type: next_tool
    condition: "len(raw_tool_calls) > 0"
    priority: 6
    target_core: tool_execute

  # 3. 工具执行完毕，有格式化结果 → 回到 LLM 继续推理
  - route_type: next_llm
    condition: "core_type == 'tool_execute' and len(tool_results) > 0"
    priority: 7
    target_core: llm_call

  # 4. 兜底：LLM 正常回复且无工具调用 → 结束当前轮次
  - route_type: end
    condition: "True"
    priority: 99

# 核心插件注册
core_plugins:
  llm_call:
    class: plugins.core.llm_core.LLMCore
    config:
      provider: zhipu_coding
      model_name: glm-4.7
      api_base: https://open.bigmodel.cn/api/coding/paas/v4/
      api_key: 91357bf2d11743138a8f2670f411a2d1.OAoHqNzFvE0mBUr7
      default_params:
        temperature: 0.7
        max_tokens: 8192

  tool_execute:
    class: plugins.core.tool_core.ToolCore
    config: {}

# 普通插件注册（Input + Output 类型）
plugins:
  # 0. 注入参数启动校验（最早执行，只执行一次）
  - class: plugins.input.injected_param_validator.InjectedParamValidator
    config:
      enabled: true

  # 0.5 上下文窗口守卫（Input 类型 — 在 LLM 调用前检查上下文大小，超阈值触发压缩）
  - class: plugins.input.context_window_guard.ContextWindowGuardPlugin
    config:
      enabled: true
      trigger_ratio: 0.7

  # 1. 工具 Schema 注入（Input 类型 — 在 LLM 调用前注入 tool_schemas）
  - class: plugins.input.tool_schema.ToolSchemaPlugin
    config:
      enabled: true

  # 2. 工具 Schema 验证与自动修复（Input 类型 — 校验参数类型并自动修复）
  - class: plugins.input.tool_schema_validator.ToolSchemaValidator
    config:
      enabled: true
      strict: false

  # 3. 停止检查（系统级，最高优先级）
  - class: plugins.output.stop_check.StopCheckPlugin
    config:
      max_iterations: 20
      max_duration_seconds: 600

  # 4. 错误检查（系统级）
  - class: plugins.output.error_check.ErrorCheckPlugin
    config:
      max_retries: 3

  # 4.5 LLM 错误恢复（系统级，在 error_check 之后执行）
  - class: plugins.output.llm_error_recovery.LLMErrorRecoveryPlugin
    config:
      enabled: true

  # 5. 待处理工具检测
  - class: plugins.output.pending_tools.PendingToolsOutput
    config: {}

  # 6. 结果格式化
  - class: plugins.output.result_format.ResultFormatPlugin
    config: {}
