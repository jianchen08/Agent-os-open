# 功能验证评估指标
# 使用独立 LLM Agent 验证实现是否真正满足需求，发现测试遗漏
# 核心价值：解决"执行 Agent 自己写测试自己通过"的盲区问题

id: function_verify
name: 功能验证
description: 验证实现是否真正满足需求，分析测试覆盖度，发现功能遗漏和隐患

# ===== 评估器配置 =====
evaluator_id: evaluator_agent
evaluator_type: agent

default_config:
  check: function_verify

# ===== 预期输入定义 =====
expected_input:
  description: "验证实现是否满足需求"
  params:
    requirement:
      type: string
      description: "需求描述"
      required: true
      example: "实现用户登录功能，密码错误时返回 401"
    acceptance_criteria:
      type: array
      items:
        type: string
      description: "验收标准列表"
      required: false
      example:
        - "用户名和密码正确时返回 200 和 token"
        - "密码错误时返回 401"
        - "用户不存在时返回 404"
    implementation:
      type: string
      description: "实现代码或配置内容"
      required: true
    test_code:
      type: string
      description: "已有的测试代码"
      required: false
    test_result:
      type: string
      description: "测试执行结果（test_check 的输出）"
      required: false
    context:
      type: object
      description: "补充上下文"
      required: false
      properties:
        modified_files:
          type: array
          items:
            type: string
          description: "修改的文件列表"
        dependencies:
          type: array
          items:
            type: string
          description: "新增的依赖"
        environment:
          type: string
          description: "运行环境信息"

# ===== 预期输出定义 =====
# Agent 评估器统一返回结构（所有 Agent 评估器输出相同）
expected_output:
  description: "返回功能验证结果"
  params:
    passed:
      type: boolean
      description: "功能验证是否通过"
    score:
      type: number
      description: "综合评分（0-100）"
    feedback:
      type: string
      description: "验证结果总结"
    suggestions:
      type: array
      items:
        type: object
        properties:
          priority:
            type: string
            enum: ["high", "medium", "low"]
            description: "优先级"
          action:
            type: string
            description: "建议操作（补充测试/修改代码/需要人工确认）"
          description:
            type: string
            description: "具体说明"
    evaluation_details:
      type: object
      description: "详细验证结果"
      properties:
        requirement_analysis:
          type: array
          items:
            type: object
            properties:
              point:
                type: string
                description: "需求功能点"
              status:
                type: string
                enum: ["implemented", "partial", "missing"]
                description: "实现状态"
              evidence:
                type: string
                description: "证据说明"
              risks:
                type: array
                items:
                  type: string
                description: "风险点"
        test_coverage_analysis:
          type: object
          properties:
            covered_scenarios:
              type: array
              items:
                type: string
              description: "已覆盖的测试场景"
            uncovered_scenarios:
              type: array
              items:
                type: string
              description: "未覆盖的场景"
            coverage_score:
              type: number
              description: "测试覆盖度评分（0-100）"
        code_review_findings:
          type: array
          items:
            type: object
            properties:
              severity:
                type: string
                enum: ["critical", "major", "minor", "suggestion"]
                description: "严重程度"
              category:
                type: string
                description: "问题类别（逻辑错误/安全漏洞/边界情况/性能问题/设计问题）"
              description:
                type: string
                description: "问题描述"
              location:
                type: string
                description: "代码位置"
              suggestion:
                type: string
                description: "修复建议"

# ===== 语义评估（必须在功能验证通过后执行） =====
semantic_evaluation:
  required: true
  description: |
    功能验证必须有语义评估，语义评估是对验证过程本身的审查。
    评估者需要回答以下问题：
    1. 验证Agent做了什么：评估者必须清楚描述验证Agent实际执行了哪些操作、覆盖了哪些场景。
    2. 验证行为与用户真实使用是否一致：验证Agent的验证方式是否还原了用户真实的使用路径和操作方式，
       而不是仅从技术角度做单元测试式的验证。
    3. 是否使用了用户真实的使用场景去验证：验证场景是否来源于真实的用户使用场景，
       而非仅凭技术推测构造的测试用例。
  evaluation_points:
    - point: "验证Agent行为描述"
      description: "评估者必须明确说明验证Agent具体做了什么，包括执行了哪些操作、使用了什么工具、覆盖了哪些场景"
      required: true
    - point: "与用户真实使用的一致性"
      description: "评估者必须判断验证Agent的验证行为是否与用户真实使用时一致，是否模拟了用户的真实操作路径"
      required: true
    - point: "用户真实场景覆盖"
      description: "评估者必须确认验证是否使用了用户真实的使用场景，而非仅靠技术推测"
      required: true
  output_fields:
    evaluator_assessment:
      type: string
      description: "评估者对验证Agent行为的总结描述"
      required: true
    user_consistency_check:
      type: string
      description: "验证Agent的验证方式与用户真实使用方式的一致性判断"
      required: true
    real_scenario_verification:
      type: string
      description: "是否使用了用户真实场景验证的说明及证据"
      required: true

# ===== 评估判断标准 =====
expect:
  conditions:
    - field: "passed"
      operator: "is_true"
      logic: "and"
      pass_message: "功能验证通过"
      fail_message: "功能验证未通过"
    - field: "semantic_evaluation"
      operator: "is_present"
      logic: "and"
      pass_message: "语义评估已完成"
      fail_message: "缺少语义评估，功能验证必须包含语义评估"

# ===== 输入参数定义 =====
input_schema:
  type: object
  properties:
    requirement:
      type: string
      description: "需求描述"
    acceptance_criteria:
      type: array
      items:
        type: string
      description: "验收标准列表"
    implementation:
      type: string
      description: "实现代码或配置内容"
    test_code:
      type: string
      description: "已有的测试代码"
    test_result:
      type: string
      description: "测试执行结果"
    context:
      type: object
      description: "补充上下文"
      properties:
        modified_files:
          type: array
          items:
            type: string
          description: "修改的文件列表"
        dependencies:
          type: array
          items:
            type: string
          description: "新增的依赖"
        environment:
          type: string
          description: "运行环境信息"
  required: [requirement, implementation]

# ===== 使用边界 =====
when_to_use:
  - 验证代码实现是否满足需求
  - 验证方案/配置是否可行
  - 分析测试覆盖度，发现遗漏场景
  - 发现执行 Agent 未考虑的边界情况
  - 发现代码中的安全隐患和逻辑漏洞
when_not_use:
  - 只需要检查代码规范（使用 code_check）
  - 只需要检查测试是否通过（使用 test_check）
  - 只需要评估文本/文档质量（使用 semantic_check）
  - 不涉及代码实现的任务（如纯翻译、纯文档编写）
examples:
  - params:
      requirement: "实现用户注册，密码至少8位包含字母和数字"
      acceptance_criteria:
        - "密码少于8位时返回 400"
        - "密码不包含字母时返回 400"
        - "密码不包含数字时返回 400"
        - "注册成功时返回用户信息和 token"
      implementation: |
        def register(username, password):
            if len(password) < 8:
                return {"status": 400, "message": "密码太短"}
            ...
      test_code: |
        def test_password_short(): ...
        def test_register_success(): ...
      test_result: "2 passed"
    description: "验证用户注册功能是否满足需求"
caveats:
  - 无法真正运行代码，依赖 LLM 的推理能力
  - 应在 test_check 通过后执行，避免重复发现已知问题
  - 验证质量取决于需求描述的清晰度和完整性
  - 复杂系统可能需要结合人工审核
  - 功能验证必须包含语义评估，评估者必须回答：验证Agent做了什么、验证方式与用户真实使用是否一致、是否用了用户真实场景去验证

# ===== 依赖关系 =====
is_red_line: false
default_weight: 2.0
level: 3
includes:
  - file_check
  - test_check
requires: []

# ===== 元数据 =====
source: builtin
status: active
tags:
  - function
  - verify
  - requirement
  - coverage
  - review
