# API 响应检查评估指标
# 使用通用工具 fetch 检查 API 响应

id: api_check
name: API检查
description: 检查API接口响应状态

# ===== 评估器配置 =====
evaluator_id: fetch
evaluator_type: tool

default_config:
  action: get
  timeout: 30

# ===== 预期输入定义 =====
expected_input:
  description: "检查API接口是否正常响应"
  params:
    url:
      type: string
      description: "API URL"
      required: true
      example: "http://localhost:8000/health"
    headers:
      type: object
      description: "请求头"
      required: false

# ===== 预期输出定义 =====
expected_output:
  description: "返回API响应状态"
  params:
    success:
      type: boolean
      description: "工具调用是否成功"
    data:
      type: object
      description: "返回数据（成功时返回）"
      properties:
        url:
          type: string
          description: "请求的 URL"
        status:
          type: integer
          description: "HTTP 状态码"
        headers:
          type: object
          description: "响应头"
        data:
          type: object
          description: "响应数据"
    error:
      type: string
      description: "错误信息（失败时返回）"

# ===== 评估判断标准 =====
expect:
  conditions:
    - field: "success"
      operator: "is_true"
    - field: "status"
      operator: "in"
      value: [200, 201, 204]
  logic: "and"
  pass_message: "API响应正常"
  fail_message: "API响应异常"

# ===== 输入参数定义 =====
input_schema:
  type: object
  properties:
    action:
      type: string
      enum: ["get", "post", "fetch"]
      description: "操作类型：get(GET请求)、post(POST请求)、fetch(抓取网页)"
    url:
      type: string
      description: "目标 URL"
    headers:
      type: object
      description: "请求头"
    data:
      type: object
      description: "POST 请求体数据"
    params:
      type: object
      description: "URL 查询参数"
    timeout:
      type: integer
      description: "超时时间（秒）"
      default: 30
  required: ["action", "url"]

# ===== 使用边界 =====
when_to_use:
  - 需要验证API可访问性
  - 需要检查响应状态
when_not_use:
  - 需要完整的功能测试
  - 需要进行性能测试
examples:
  - params:
      url: http://localhost:8000/health
    description: "检查健康检查接口"
  - params:
      url: http://localhost:8000/api/users
    description: "检查用户接口"
caveats:
  - 确保服务已启动
  - 需要正确的网络访问权限
  - action/timeout 由 default_config 固定，Agent 无需关心

# ===== 依赖关系 =====
is_red_line: false
default_weight: 1.0
level: 2
includes: []
requires: []

# ===== 元数据 =====
source: builtin
status: active
tags:
  - api
  - http
  - response
