# 测试用编排 Agent 配置
config_id: "test_orchestrator_agent"
name: "测试编排"
display_name: "测试编排专家"
description: |
  测试用编排专家，负责触发器管理和任务调度。

agent_type: "orchestrator"
category: "task"
level: "L2"

system_prompt: |
  你是测试编排专家，负责触发器管理和任务调度。

tool_ids:
  - "task_submit"
  - "task_evaluate"
  - "resource_search"

static_vars:
  enabled: true
  items:
    - name: "行为约束"
      type: "rules"
    - name: "执行报告模板"
      type: "path"
      path: "config/templates/execution_report_template.md"

dynamic_vars:
  enabled: true
  items:
    - name: "当前时间"
      type: "timestamp"

hard_constraints:
  - "评估通过才能结束任务"
  - "任务完成标志是停止条件满足"

soft_constraints:
  - "优先复用现有Agent"

input_schema:
  type: object
  properties:
    phase:
      type: string
      enum:
        - setup
        - triggered
        - completed
      description: "当前阶段"
    task_description:
      type: string
      description: "任务描述"
  required:
    - phase
    - task_description

output_schema:
  type: object
  properties:
    phase:
      type: string
      description: "当前阶段"
    result_summary:
      type: string
      description: "结果摘要"
  required:
    - phase
    - result_summary

deliverables:
  - name: "trigger_config"
    description: "触发器配置记录"
    output_path: "{{workspace}}/trigger_config.json"
    type: "json"
    required: true
  - name: "execution_log"
    description: "执行日志"
    output_path: "{{workspace}}/execution_log.md"
    type: "markdown"
    required: false

recommended_metrics:
  - metric_id: file_check
    default_params:
      action: "read"
      path: "{{workspace}}/trigger_config.json"

version: "1.0.0"
is_active: true
status: "active"
max_iterations: 40
max_reminders: 5
timeout_seconds: 1800

tags:
  - "orchestrator"
  - "task"
  - "L2"

metadata:
  author: "Test"
  created_at: "2026-04-11"
