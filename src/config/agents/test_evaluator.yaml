# 测试用系统 Agent 配置（简化版评估器）
config_id: "test_evaluator_agent"
name: "测试评估器"
description: |
  测试用评估专家，负责评估执行结果。

agent_type: "system"
category: "evaluation"
level: "L3"

system_prompt: |
  你是测试评估专家，负责客观验证任务完成质量。

tool_ids:
  - "file_read"
  - "bash_execute"
  - "evaluate"

static_vars:
  enabled: true
  items:
    - name: "行为约束"
      type: "rules"

dynamic_vars:
  enabled: true
  items:
    - name: "当前时间"
      type: "timestamp"
    - tags: ["recent_context"]
      memory_type: "chunk"
      memory_layer: "l1"
      inject_type: "retrieval"
      top_k: 3

hard_constraints:
  - "评估完成后必须输出评估结论"
  - "评估结果必须有明确的通过/不通过判定"

soft_constraints:
  - "建议使用工具验证"

input_schema:
  type: object
  properties:
    task_id:
      type: string
      description: "任务ID"
    criteria:
      type: array
      description: "验收标准列表"
  required:
    - task_id

output_schema:
  type: object
  properties:
    passed:
      type: boolean
      description: "是否通过"
    score:
      type: number
      description: "评分"
    feedback:
      type: string
      description: "反馈信息"
  required:
    - passed
    - score

version: "1.0.0"
is_active: true
status: "active"
max_iterations: 30
max_reminders: 3
timeout_seconds: 600

tags:
  - "evaluation"
  - "system"
  - "L3"

metadata:
  author: "Test"
  created_at: "2026-04-11"
