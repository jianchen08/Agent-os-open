# =============================================================================
# Agent OS — Docker Compose（仅 Redis）
#
# 0.2 架构下内核（agentos-kernel :9100）与 Vite 前端（:6390）均运行在宿主机，
# 容器只按需承载 Redis：Linux/macOS 启动脚本 start_web_02.sh 检测到 Docker
# 时执行 `docker compose up -d redis`，并用 REDIS_HOST_PORT 环境变量覆盖端口。
# 注意：0.2 内核与插件当前没有 Redis 消费方（0.1 遗留），拉起与否不影响功能。
#
# 容器命名与端口说明：
#   不设 name/container_name，让 compose 用标准 {project}-{service} 命名。
#   project name 默认取自所在目录名，因此不同目录的实例天然隔离
#   （容器/网络/卷互不冲突）。
#
#   REDIS_HOST_PORT  默认 6480（start_web_02.sh 会覆盖为从 6690 起的可用端口）
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    # on-failure：崩溃不无限重启，避免反复触发 WSL2 容器停止路径的内核卡死。
    restart: on-failure
    ports:
      - "${REDIS_HOST_PORT:-6480}:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly no
      --save ""
    volumes:
      - redis-data:/data
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  redis-data:

networks:
  agent-net:
    driver: bridge
