# =============================================================================
# Agent OS — Docker Compose（Redis + Frontend）
# Agent 在宿主机运行：python -m channels.websocket.app_factory
#
# 构建上下文说明：
#   - frontend: context 为仓库根目录（.），以便 Dockerfile 读取 packages/ 离线包
#   - redis: 直接使用 Docker Hub 镜像；首次拉取由 start_web.bat 带镜像前缀回退
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 前端 (Python 静态文件服务器)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      # 上下文设为仓库根目录，以便 COPY 根目录下的 packages/ 离线包
      # Dockerfile 内的 COPY 路径已相应加上 frontend/ 前缀
      context: .
      dockerfile: frontend/Dockerfile
    image: agent-os-frontend:latest
    container_name: agent-os-frontend-22404
    # on-failure + 上层 deploy 限制：崩溃不再无限重启拉起，
    # 避免 SIGSEGV 崩溃循环把 daemon 的网络栈/事件流拖垮。
    restart: on-failure
    ports:
      - "5290:5188"
    environment:
      # Agent 跑在宿主机，前端通过 host.docker.internal 连接
      - BACKEND_URL=http://host.docker.internal:8989
      - BACKEND_WS_URL=ws://host.docker.internal:8989
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agent-net-22404
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 10s
        window: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5188/health').read(); print('ok')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: agent-os-redis-22404
    restart: unless-stopped
    ports:
      - "6480:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis-data-22404:/data
    networks:
      - agent-net-22404
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  redis-data-22404:

networks:
  agent-net-22404:
    driver: bridge
