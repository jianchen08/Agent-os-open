[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-os"
version = "0.1.0"
description = "Agent OS 插件化管道架构"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Lingxi AgentOS Contributors"}
]
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "aiohttp>=3.9",
    "watchdog>=3.0",
    # 下两条 next-major 上界（2026-09-11 第七波，最小刀只封高漂移风险项，
    # 不做全量封顶）：pydantic 1→2 为生态最著名破坏性迁移、3 在路上；
    # Pillow 历代大版本惯例移除弃用 API（如 10 删 Image.ANTIALIAS）。
    # 与 weekly pip-audit 互补：审计抓已知 CVE，上界抓大版本破坏性升级。
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0",
    "python-lsp-server>=1.14.0",
    "cryptography>=42.0",
    "psutil>=5.9",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.2.2",
    "Pillow>=10.0,<13",
    # cost_control/tokenizer.py 的真实依赖：litellm 退役（0b8e3f775）前靠其
    # 传递依赖存活，lock 重算后消失致测试收集 ModuleNotFoundError——显式声明。
    "tiktoken>=0.13",
    # ACP 客户端 SDK（acp_bridge 插件：外部编码 agent 派发统一走 ACP，
    # ADR 2026-10-15-acp-agent-connector-quota-pool）。minor 封顶：0.x 系列
    # 无稳定契约承诺，协议演进随 SDK 升级显式动锁。
    "agent-client-protocol>=0.12.1,<0.13",
    # Windows 无系统 IANA 时区库，zoneinfo（prompt_build 动态变量时间注入等）
    # 缺 tzdata 会静默回退 UTC；Linux 走系统库不受影响。
    "tzdata>=2024.1; sys_platform == 'win32'",
    # 流式退化循环检测引擎（plugins/shared/_llm_streaming.py：自研四信号
    # RepetitionGuard 退役换成熟件，ADR 2026-11-12-degen-detector-simurg-adoption）。
    # minor 封顶：检测行为经证据级 vetting 锚定 1.0.4（14 份真实留证零误杀 +
    # 事故夹具全拦），检测器面/fusion 行为大版本可能漂移，升级须重跑回归矩阵。
    "simurg>=1.0.4,<2",
    # stub 兼容 pin（仅本检查环境生效）：numpy 2.3+ 的 .pyi 使用 PEP 695 `type`
    # 语句，与本仓 mypy 检查目标 python_version=3.11 不兼容（stub 解析期 syntax
    # 错误，disable/skip/override 均不可抑制——实测 2026-11-12）；经 pytest
    # _pytest.python_api 链入 mypy 检查图。2.2.x stubs 无该语句。
    "numpy>=1.26,<2.3",
    # OAuth 协议引擎（oauth_broker CA-P0 协议机退役自研，2026-11-19）：PKCE/
    # 授权 URL/token 兑换/刷新唯一实现面。插件自身 pyproject 同步声明（sidecar
    # 运行面）；根声明服务 plugins-coverage 测试车道（根 uv 环境跑 pytest，
    # aiohttp 同款口径）。与插件侧同上界；requests = authlib requests_client
    # 集成的运行依赖（1.9 起无 [requests] extra，显式声明）。
    "authlib>=1.6,<2",
    "requests>=2.31",
]

# [project.scripts]
# 0.2 架构下 CLI 由插件提供（plugins/shared/channel_cli/），
# 不再在根包注册 entry point。如需 CLI，运行 channel_cli 插件或内核 dispatcher。

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-timeout>=2.0",
    "pytest-cov>=4.0",
    "mypy>=1.10",
    "ruff>=0.5",
    # yaml 类型桩：sdk-mypy（diagnostics_settings import yaml）严格模式
    # 必需——根 venv 供 CI python-lint 车道与本 uv run 同口径
    "types-PyYAML>=6.0",
    # psutil 类型桩：sdk-mypy（process_runtime.backends 懒加载 psutil）严格模式必需
    "types-psutil>=6.0",
    # fastapi：tests/test_new_project_e2e.py import（TestClient/声明式
    # schema），运行测试才需要
    "fastapi>=0.110",
    # websockets：tests/deploy 种子物化测试 import（2026-11-08 timing-gate
    # uv 环境收集错误清偿——ad-hoc 安装被 frozen 同步裁掉的根因收口）
    "websockets>=12.0",
    # zstandard：tests/eval_bench 单测 import（同上清偿）
    "zstandard>=0.22",
    # docker：isolation docker 系测试（test_isolation_docker_timeout 等）
    # import docker SDK——uv sync --extra dev 裁非锁包的循环清偿（2026-11-08）
    "docker>=7.0",
    # pypdf/python-docx：builtin_tools/doc_tools 插件测试 import（同上清偿）
    "pypdf>=5.0",
    "python-docx>=1.1",
    # agentos-plugin-sdk：plugins 测试 conftest 面 import（editable 源，
    # tool.uv.sources 钉位——uv sync 裁非锁包循环的最终收口）
    "agentos-plugin-sdk",
    # e2e（tests/e2e_02）：WS 流式链路测试需要
    "websockets>=13.0",
    # zstandard：tests/deploy/test_materialize_seed.py（种子包压缩校验）import；
    # 2026-11-02 干净检出 timing-gate 收集期 ModuleNotFoundError 实证漏声明
    "zstandard>=0.22",
    # file_read 文档→markdown 回退测试（builtin_tools tests 真实生成 docx/pdf；
    # 生产面依赖在 builtin_tools 插件 venv，此处仅为根 venv 测试车道同口径）
    "markdown-it-py>=3.0",
    "python-docx>=1.1",
    "pypdf>=4.0",
]
document = [
    "markitdown[docx,xlsx]>=0.1.0",
]
isolation = [
    "docker>=7.0",
]

[tool.pytest.ini_options]
# 合并自原 pytest.ini（已删除），pyproject.toml 为唯一 pytest 配置来源。
# CI 显式列出子目录跑纯单测；本地全量跑可用 `pytest tests/`。
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
log_cli = false
log_cli_level = "WARNING"
# --strict-markers：未在下方注册的 marker 直接报错，防止动态未登记的标记再出现。
# 不在此处设全局 -m 排除：各 CI job 已按需调度测试（e2e 由 e2e.yml 车道单独执行），
# 全局排除会改变现有语义。
addopts = ["--strict-markers"]
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
    "e2e: 端到端测试",
    "timing: 关键时序不变量（事件顺序/间隔/超时边界），独立 stage 阻塞门禁",
    # ── tests/suites/__init__.py 动态注册的标记（此处静态登记以配合 --strict-markers）──
    "core: 核心单元测试",
    "m6: M6插件测试",
    "stage: Stage闭环测试",
    "cli: CLI测试",
    "memory: 内存经验测试",
    "task: Task E2E测试",
    "agent: Agent测试",
    "llm: LLM相关测试",
    "real_api: 实机探针（需真实密钥+显式环境变量opt-in，缺任一即 skip，不对 CI/常规门禁生效）",
    "whitebox: 白盒测试（直探内部实现的补充测试面，code-debug/test-fixer 技能强制使用）",
]
filterwarnings = [
    "ignore::sqlalchemy.exc.SADeprecationWarning",
    "ignore::sqlalchemy.exc.SAWarning",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

[tool.setuptools]
# 0.2 架构：Python 包分别由 plugins/sdk（agentos-plugin-sdk）和各插件独立管理。
# 根 pyproject 仅保留依赖清单与工具配置，不再从 src/ 打包（src/ 已迁移到 plugins/）。
packages = []

# ============================================================
# 代码质量工具链配置（REQ-13）
# ============================================================

[tool.ruff]
# 行长度配置
line-length = 120
# 目标 Python 版本
target-version = "py311"
# 排除的目录（mcp-servers 曾随初始容器导入被排除、无事故依据——2026-09-24
# 执行方案 0-6 判定摘除，存量 34 处入 ruff-plugins 基线棘轮）
extend-exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
    "frontend",
    "electron",
    "node_modules",
]

[tool.ruff.lint]
# 默认规则集 + 项目常用规则
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort（导入排序）
    "B",    # flake8-bugbear（常见 bug）
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade（现代化语法）
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate（注释代码）
    "PL",   # pylint
]
# 忽略部分严格规则（避免一次性报大量错误）
# 重构类规则（PLR0911/0912/0915）标注为技术债，见 ROADMAP，后续单独治理
ignore = [
    "E501",   # 行长度检查整体关闭（注释修正：line-length 只是 E501 的阈值，
              # E501 被 ignore 后行长度不再检查；如需恢复按 line-length=120 执行）
    "B008",   # 函数调用作为默认参数（FastAPI Depends 等）
    "PLR0913", # 参数过多
    "PLR2004", # magic value
    "PLR0911", # return 语句过多（需拆函数，技术债）
    "PLR0912", # 分支过多（需拆函数，技术债）
    "PLR0915", # 语句过多（需拆函数，技术债）
    "PLC0415", # 函数内 import（项目用于延迟加载/避免循环依赖）
    "PLW0603", # global 语句（单例模式合理使用）
    "SIM102",  # 嵌套 if 合并（可读性争议，保留显式结构）
    "SIM103",  # 返回条件简化（可读性争议）
    "SIM105",  # try-except-pass→contextlib.suppress（语义等价，保留显式 try）
    "SIM108",  # if-else→三元（可读性争议，保留显式分支）
    "ARG001", # 未使用的方法参数（接口需要）
    "ARG002", # 同上
    "PTH100", # os.path→pathlib（项目大量使用 os.path 风格，整族统一）
    "PTH103", # 同上
    "PTH107", # 同上
    "PTH108", # 同上
    "PTH109", # 同上
    "PTH110", # 同上
    "PTH112", # 同上
    "PTH113", # 同上
    "PTH115", # 同上
    "PTH116", # 同上
    "PTH118", # 同上
    "PTH119", # 同上
    "PTH120", # 同上
    "PTH123", # 同上
    "PTH204", # 同上
    "ERA001", # 注释代码（可能是有意为之）
    "RET504", # 过多 return
    "N818",   # 异常类名不以 Error 结尾
]
# 允许自动修复
fixable = ["ALL"]
unfixable = ["F401"]  # 不自动删除未使用 import（可能是 re-export）

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # __init__.py 允许未使用 import
"tests/**" = ["B011", "PT009", "PT027"]  # 测试文件：允许 assert 调试残留与 unittest 风格断言
"plugins/shared/channel_cli/**" = ["T201"]  # CLI 允许 print
# isolation/manager.py 的函数内 docker 延迟导入（已标 noqa: PLC0415），
# 其 import 排序对延迟加载场景意义有限，避免与延迟加载意图冲突
"plugins/shared/isolation/manager.py" = ["I001"]

[tool.ruff.lint.isort]
# 0.2 架构：插件目录平铺，各插件内部以裸模块名 import（server.py 把自身目录加入 sys.path）。
# 声明这些为 first-party，避免 ruff 在 CI 环境下误判为 third-party → I001 误报。
known-first-party = [
    "agentos_plugin_sdk",
    "plugins",
]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ============================================================
# mypy 类型检查配置
# ============================================================

[tool.mypy]
python_version = "3.11"
# 宽松模式：项目大量依赖无类型注解的第三方库（docker 等），
# 关闭噪音类警告，只保留真正的类型错误检查。
# 类型注解完善是长期技术债，见 ROADMAP。
warn_return_any = false
warn_unused_configs = true
warn_redundant_casts = false
warn_unused_ignores = false
# 以下检查适度开启，不强制全量覆盖
disallow_untyped_defs = false
disallow_any_unimported = false
no_implicit_optional = true
check_untyped_defs = true
# 忽略缺失导入（第三方库未提供类型注解）
ignore_missing_imports = true
# 宽松模式：允许现有警告（不强制 0 错误）
ignore_errors = false
# 禁用噪音类规则（项目大量使用动态属性/Pydantic model/Mixin 模式，
# mypy 静态检测报大量 attr-defined 误报；import-untyped 是缺第三方 stubs 的环境问题）
disable_error_code = ["attr-defined", "import-untyped"]
# 显示错误上下文
show_error_codes = true
show_column_numbers = true
# 增量检查：从缓存开始
incremental = true
cache_dir = ".mypy_cache"
# mypy 2.1.0 起 sqlite 缓存默认开启；多进程并发跑 mypy（pre-commit 分片/
# 基线脚本）时并发建表写锁偶发 "database is locked"（被包装成 INTERNAL
# ERROR，CI 实证 2026-09-01）。退回文件缓存后端，无 sqlite 锁语义。
sqlite_cache = false
# 排除目录
exclude = [
    "frontend",
    "electron",
    "mcp-servers",
    "node_modules",
    "tests",
    "build",
    "dist",
    "docs",
]

[[tool.mypy.overrides]]
# 测试文件更宽松
module = "tests.*"
ignore_missing_imports = true
check_untyped_defs = false

[[tool.mypy.overrides]]
# 第三方库跳过
module = [
    "watchdog.*",
    "aiohttp.*",
]
ignore_missing_imports = true

# ============================================================
# 覆盖率配置（对照 testing_rules §3 / 表 D）
# ============================================================
# source 限定 plugins（0.2 架构的 Python 代码主体）；omit 排除测试自身与 SDK 桩。
# 分级目标见 docs/test_traceability.md 表 D（core/tools P1、其余 P2）。
# CI 门禁：python-coverage job 的整体覆盖率基线锁
#   （.github/python-coverage-baseline.txt，只升不降，取代旧 fail-under 静态地板）。
[tool.coverage.run]
source = ["plugins"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "plugins/sdk/*",          # SDK 独立成包，自有 python-test job
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# 排除不可避免未覆盖的样板/防御性分支
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

[tool.uv.sources]
agentos-plugin-sdk = { path = "plugins/sdk", editable = true }
