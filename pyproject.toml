[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-os"
version = "0.1.0"
description = "Agent OS 插件化管道架构"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Lingxi AgentOS Contributors"}
]
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "aiohttp>=3.9",
    "watchdog>=3.0",
    "litellm>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "jsonschema>=4.0",
    "simpleeval>=1.0.5",
    "python-lsp-server>=1.14.0",
    "fastapi>=0.110",
    "python-multipart>=0.0.31",
    "uvicorn>=0.27",
    "redis>=5.0",
    "PyJWT>=2.13.0",
    "bcrypt>=4.0",
    "cryptography>=42.0",
    "psutil>=5.9",
    "watchfiles>=0.21",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.2.2",
    "jinja2>=3.1",
    "Pillow>=10.0",
]

[project.scripts]
agent-os = "channels.cli.cli_main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
document = [
    "markitdown[docx,xlsx]>=0.1.0",
]
isolation = [
    "docker>=7.0",
]
triggers = [
    "apscheduler>=3.10",
]

[tool.pytest.ini_options]
# 合并自原 pytest.ini（已删除），pyproject.toml 为唯一 pytest 配置来源。
# CI 显式列出子目录跑纯单测；本地全量跑可用 `pytest tests/`。
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
log_cli = false
log_cli_level = "WARNING"
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
    "e2e: 端到端测试",
    "slow: 慢速测试",
    "requires_api: 需要真实 API 的测试",
    "requires_redis: 需要 Redis 的测试",
    "requires_db: 需要数据库的测试",
    "offline: 可离线运行的测试",
]
filterwarnings = [
    "ignore::sqlalchemy.exc.SADeprecationWarning",
    "ignore::sqlalchemy.exc.SAWarning",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

[tool.setuptools.packages.find]
where = ["src"]

# ============================================================
# 代码质量工具链配置（REQ-13）
# ============================================================

[tool.ruff]
# 行长度配置
line-length = 120
# 目标 Python 版本
target-version = "py310"
# 排除的目录
extend-exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
    "frontend",
    "electron",
    "mcp-servers",
    "node_modules",
]

[tool.ruff.lint]
# 默认规则集 + 项目常用规则
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort（导入排序）
    "B",    # flake8-bugbear（常见 bug）
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade（现代化语法）
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate（注释代码）
    "PL",   # pylint
]
# 忽略部分严格规则（避免一次性报大量错误）
ignore = [
    "E501",   # 行长度由 line-length 控制
    "B008",   # 函数调用作为默认参数（FastAPI Depends 等）
    "PLR0913", # 参数过多
    "PLR2004", # magic value
    "ARG001", # 未使用的方法参数（接口需要）
    "ARG002", # 同上
    "PTH118", # os.path 已被项目大量使用
    "PTH123", # 同上
    "ERA001", # 注释代码（可能是有意为之）
    "RET504", # 过多 return
    "N818",   # 异常类名不以 Error 结尾
]
# 允许自动修复
fixable = ["ALL"]
unfixable = ["F401"]  # 不自动删除未使用 import（可能是 re-export）

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # __init__.py 允许未使用 import
"tests/**" = ["B011", "PT009", "PT027"]  # 测试文件允许 assert
"src/channels/cli/**" = ["T201"]  # CLI 允许 print

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ============================================================
# mypy 类型检查配置
# ============================================================

[tool.mypy]
python_version = "3.10"
# 适度严格模式（不开启最严格的 disallow_untyped_defs）
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
# 以下检查适度开启，不强制全量覆盖
disallow_untyped_defs = false
disallow_any_unimported = false
no_implicit_optional = true
check_untyped_defs = true
# 忽略缺失导入（第三方库未提供类型注解）
ignore_missing_imports = true
# 宽松模式：允许现有警告（不强制 0 错误）
ignore_errors = false
# 显示错误上下文
show_error_codes = true
show_column_numbers = true
# 增量检查：从缓存开始
incremental = true
cache_dir = ".mypy_cache"
# 排除目录
exclude = [
    "frontend",
    "electron",
    "mcp-servers",
    "node_modules",
    "tests",
    "build",
    "dist",
    "docs",
]

[[tool.mypy.overrides]]
# 测试文件更宽松
module = "tests.*"
ignore_missing_imports = true
check_untyped_defs = false

[[tool.mypy.overrides]]
# 第三方库跳过
module = [
    "litellm.*",
    "watchdog.*",
    "aiohttp.*",
]
ignore_missing_imports = true
