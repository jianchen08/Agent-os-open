[pytest]
# Pytest 测试配置文件

# 测试发现
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试路径
testpaths = tests

# 最小 Python 版本
minversion = 7.0

# 命令行选项 - 已移除 addopts 以避免与命令行参数冲突
# addopts 配置已注释，使用命令行参数代替

# 标记定义
markers =
    # 单元测试
    unit: 单元测试
    # 集成测试
    integration: 集成测试
    # 端到端测试
    e2e: 端到端测试
    # 慢速测试
    slow: 慢速测试
    # 需要 API 的测试
    requires_api: 需要真实 API 的测试
    # 需要 Redis 的测试
    requires_redis: 需要 Redis 的测试
    # 需要数据库的测试
    requires_db: 需要数据库的测试
    # 离线测试
    offline: 可离线运行的测试

# 异步配置
asyncio_mode = auto

# 日志配置 - 禁用以避免 Python 3.14 兼容性问题
log_cli = false
log_cli_level = WARNING

# 覆盖率配置（如果使用 pytest-cov）
# addopts = --cov=src --cov-report=html --cov-report=term-missing

# 过滤警告
filterwarnings =
    # 忽略 SQLAlchemy 的警告
    ignore::sqlalchemy.exc.SADeprecationWarning
    ignore::sqlalchemy.exc.SAWarning
    # 忽略 Pydantic 的警告
    ignore::pydantic.warnings.PydanticDeprecatedSince20