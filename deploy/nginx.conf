    # 实际域名；③整段取消注释；④wss 无需额外配置——同源 https 页面发起的
    # WebSocket 即 wss://<同源>/ws，反代按上面 80 档的 Upgrade 头原样终结转发，
    # CSP connect-src 'self' 已覆盖。
    # 注意：location 内出现任意 add_header 时不再继承 server 级安全头，须在
