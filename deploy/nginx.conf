# =============================================================================
# AgentOS 生产反代参考配置（Linux 服务器部署）
#
# 以 frontend/nginx.conf 为底定稿：同一套 CSP/安全头与静态缓存语义，上游从
# 0.1 编排遗留改为 0.2 内核实际监听位。部署形态见 docs/guides/deployment.md
# 「前端连接两形态」；本文件承载生产形态 = 前端静态 dist 与内核 API 同源反代，
# 浏览器只见反代一个源，CORS/WS ticket 均免配置、前端产物零重打包。
#
# 两个部署参数（按实际环境调整）：
# 1. root —— 前端构建产物目录（构建步骤见 deployment.md 第二节第 2 步；
#    下例假定仓库落在 /opt/agentos，与 deploy/agentos-kernel.service 同一口径）。
# 2. 反代目标端口 —— 内核缺省 9100（AGENTOS_KERNEL_PORT，解析链见
#    kernel/crates/api/src/bin/agentos-kernel.rs；frontend/vite.config.ts 的
#    dev 代理缺省 target http://127.0.0.1:9100 同源佐证）。nginx 主配置不展开
#    环境变量：改了 AGENTOS_KERNEL_PORT 就同步替换下方 5 处 proxy_pass 端口
#    （或用官方镜像的 /etc/nginx/templates envsubst 机制生成）。
#
# CSP 语义与 dev 对齐说明：frontend/vite.config.ts 的 dev CSP 与本文件的
# 生产 CSP 同基线，connect-src 均为 'self' ws: wss:——同源反代模式下 API/WS
# 全部打向本源（'self' 天然满足），ws:/wss: 仅在非常规端口直连 WS 时才被
# 用到，两种形态下都无需改动。
# =============================================================================

server {
    listen 80;
    server_name _;

    # 前端静态产物（部署参数 1）
    root /opt/agentos/frontend/dist;
    index index.html;

    # 附件/文件上传经 /api 上行，nginx 默认 1m 会 413 截断，按需放宽（内核侧无上限）。
    client_max_body_size 200m;

    # 安全响应头（always：4xx/5xx 与静态/代理响应统一携带）。
    # CSP 资源形态核对结论（2026-09 实证，与 frontend/nginx.conf 同一套）：
    # - script-src 需 'self' + 'unsafe-inline' + blob: 三者并存：
    #   a) blob: —— skinRuntime 以 dynamic import(blob:) 装载皮肤 hooks.mjs
    #      （内容经同源 /ext 通道取回，非任意远程代码）；
    #   b) 'unsafe-inline' —— WebviewWidget/HtmlPreviewWidget 以 srcDoc 注入
    #      插件 HTML（内联 bootstrap JS + 插件内联脚本），srcDoc iframe 继承
    #      父文档 CSP，父级不放行内联则全部插件 webview 页面被拦截；
    #      该继承机制决定了无法只在 iframe 局部豁免（除非改造 widget 本体，
    #      升级路径：webview bootstrap 外置/加 nonce 后即可收回 'unsafe-inline'）；
    #   c) 'self' 仍在：任意外部源（CDN/注入远程脚本）依旧被拒。
    #   d) 'unsafe-eval' —— ajv8（@rjsf/validator-ajv8，RJSF 全家动态表单的校验
    #      引擎）运行时以 new Function 编译 schema 生成校验函数；缺失则所有
    #      RJSF 表单（插件配置/agent 编辑/webview 表单）提交被 CSP 拦死，
    #      报 "Evaluating a string as JavaScript violates ... script-src"
    #      （BUG-16 GUI 实证 2026-09-15）。
    #   应用壳自身保持无内联脚本（主题预置脚本已外置 /theme-init.js，
    #   有静态契约测试 cspSecurityHeaders.contract.test.ts 看守）。
    # - style-src 'unsafe-inline'：antd/@lobehub 与插件样式（pluginStyles 运行时
    #   注入 <style>）、组件 style 属性均依赖内联样式，收紧会全面破面。
    # - connect-src ws: wss: 兼容同源代理之外的非 443 WS 端口；img/frame 的
    #   blob:/data: 供附件预览（URL.createObjectURL）与 FilePreview 内嵌。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http: https: ws: wss:; font-src 'self' data:; frame-src 'self' blob: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # 静态资源长缓存（Vite 生成文件名含 hash）。
    # 注意：location 内出现任意 add_header 时不再继承 server 级安全头，须在此重复声明。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http: https: ws: wss:; font-src 'self' data:; frame-src 'self' blob: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # index.html 必须 no-cache：它引用的 JS 文件名带 hash（内容变即重建），
    # 浏览器缓存旧 index.html 会一直加载旧 hash 的 JS，前端重新发布后改动
    # 不生效（启发式缓存）。assets 里带 hash 的文件已按上面长缓存。
    # 同样受 add_header 不继承约束，安全头在此重复声明。
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http: https: ws: wss:; font-src 'self' data:; frame-src 'self' blob: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---- 以下全部反代到内核（部署参数 2：端口与 AGENTOS_KERNEL_PORT 对齐）----

    # 内核业务 API
    location /api/ {
        proxy_pass http://127.0.0.1:9100/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # 插件 http_endpoints 面（/ext/<插件 id>/...，如 /ext/agent_manager/agents）
    location /ext/ {
        proxy_pass http://127.0.0.1:9100/ext/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # WebSocket（会话/流式通道）：升级头 + 长读超时
    location /ws {
        proxy_pass http://127.0.0.1:9100/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 媒体文件（内核产物预览）
    location /media/ {
        proxy_pass http://127.0.0.1:9100/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 用户上传附件（图片/文件等多模态输入，前端按同源相对路径取用）
    location /uploads/ {
        proxy_pass http://127.0.0.1:9100/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # /health 探活回落（2026-10-22 设备页探活假阴根修）：无鉴权探针不反代内核
    # （安全清单对齐，版本面不暴露公网），回落 SPA HTML 恒 200——但渲染层跨源
    # 探活（app://bundle fetch）读不到无 ACAO 的响应即 net::FAILED，探活闸把
    # 活内核误判「不可达」。本块只补 CORS 读权 + 复制安全头（add_header 不继承
    # 既律），连接判定照 connectionProbe 契约走 2xx、版本如实降级 null。
    location = /health {
        add_header Access-Control-Allow-Origin "app://bundle" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http: https: ws: wss:; font-src 'self' data:; frame-src 'self' blob: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /index.html =404;
    }

    # SPA 路由：所有未匹配路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全清单对齐：/metrics（Prometheus）不设反代 location——只留在
    # 127.0.0.1:9100 内核本机面，不经本配置暴露公网（deployment.md 第八章）。
    # /health 为无鉴权存活探针，同理仅供本机冒烟（curl 127.0.0.1:9100/health）。

    # ---- TLS/wss 终结（F-min 批补全：完整 443 档，证书路径为占位）----
