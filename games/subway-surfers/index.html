<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#141a3c">
<title>地铁跑酷 · Metro Rush</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#141425;}
  canvas{display:block;touch-action:none;}
  #ui{position:fixed;inset:0;pointer-events:none;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;}
  .hud{position:absolute;top:14px;left:18px;text-shadow:0 2px 6px rgba(0,0,0,.55);transition:opacity .3s;}
  #score{font-size:36px;font-weight:800;letter-spacing:1px;line-height:1;}
  #best{font-size:14px;opacity:.85;margin-top:6px;}
  #coinbox{position:absolute;top:18px;right:66px;font-size:26px;font-weight:800;display:flex;align-items:center;gap:9px;text-shadow:0 2px 6px rgba(0,0,0,.55);transition:opacity .3s;}
  .coin-dot{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe98a,#f5b81e 60%,#c98a08);box-shadow:0 0 8px rgba(245,184,30,.8);}
  #mute{position:absolute;top:14px;right:14px;width:38px;height:38px;pointer-events:auto;background:rgba(255,255,255,.12);border:none;border-radius:10px;color:#fff;font-size:17px;cursor:pointer;}
  #mute:hover{background:rgba(255,255,255,.25);}
  body[data-state="menu"] .hud,body[data-state="menu"] #coinbox{opacity:0;}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(10,10,26,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);pointer-events:auto;text-align:center;padding:0 16px;}
  .overlay.hidden{display:none;}
  h1{font-size:clamp(42px,9vw,72px);margin:0;background:linear-gradient(180deg,#ffd75e,#ff8a3c);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .ttl{font-size:clamp(30px,6vw,46px);font-weight:800;color:#ffd75e;text-shadow:0 4px 18px rgba(255,138,60,.4);}
  .sub{font-size:16px;opacity:.92;line-height:1.9;}
  .keys{display:flex;gap:16px;font-size:14px;opacity:.85;flex-wrap:wrap;justify-content:center;}
  kbd{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-bottom-width:3px;border-radius:6px;padding:2px 8px;font-family:inherit;font-size:13px;}
  .btn{border:none;cursor:pointer;font-family:inherit;font-size:22px;font-weight:800;color:#332038;padding:14px 48px;border-radius:999px;background:linear-gradient(180deg,#ffd75e,#ff9d3c);box-shadow:0 6px 0 #b25f1e,0 10px 24px rgba(255,157,60,.4);margin-top:6px;}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b25f1e;}
  #finalScore{font-size:46px;font-weight:800;color:#ffd75e;line-height:1;}
  #finalBest{font-size:15px;opacity:.9;}
  .newbest{font-size:18px;font-weight:700;color:#7dffca;animation:pulse 1s infinite;}
  .newbest.hidden{display:none;}
  @keyframes pulse{50%{transform:scale(1.12);}}
</style>
</head>
<body data-state="menu">
<canvas id="game"></canvas>
<div id="ui">
  <div class="hud">
    <div id="score">0</div>
    <div id="best">最高分 0</div>
  </div>
  <div id="coinbox"><span class="coin-dot"></span><span id="coinN">0</span></div>
  <button id="mute" title="静音 (M)">🔊</button>

  <div class="overlay" id="menu">
    <h1>地铁跑酷</h1>
    <div class="sub">在轨道上狂奔，躲避列车与路障，收集金币！</div>
    <div class="keys">
      <span><kbd>←</kbd><kbd>→</kbd> 变道</span>
      <span><kbd>↑</kbd>/<kbd>空格</kbd> 跳跃</span>
      <span><kbd>↓</kbd> 滚铲</span>
      <span><kbd>P</kbd> 暂停</span>
      <span>手机支持滑动操作</span>
    </div>
    <div class="sub" id="menuBest"></div>
    <button class="btn">开始游戏</button>
  </div>

  <div class="overlay hidden" id="dead">
    <div class="ttl">游戏结束</div>
    <div class="newbest hidden" id="newBest">🎉 新纪录！</div>
    <div id="finalScore">0</div>
    <div id="finalBest">最高分 0</div>
    <button class="btn">再来一局</button>
  </div>

  <div class="overlay hidden" id="pause">
    <div class="ttl">已暂停</div>
    <div class="sub">按 <kbd>P</kbd> 或 <kbd>Esc</kbd> 继续，点击屏幕也可继续</div>
  </div>
</div>
<script>
'use strict';
/* ================= 基础 ================= */
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
let W=innerWidth,H=innerHeight;
function resize(){
  const d=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=W*d;cv.height=H*d;
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(d,0,0,d,0,0);
  buildScenery();
}
const LANES=[-2.3,0,2.3];
const CAM_H=3.4,CAM_BACK=4.2;
const horizonY=()=>H*0.34,focalLen=()=>H*0.62;
function proj(x,y,z){
  const d=Math.max(z,-CAM_BACK+0.12)+CAM_BACK,s=focalLen()/d;
  return{x:W/2+x*s,y:horizonY()+(CAM_H-y)*s,s};
}
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
function poly(a,b,c,d,fill){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.lineTo(d.x,d.y);ctx.closePath();if(fill)ctx.fillStyle=fill;ctx.fill();}
function rr(x,y,w,h,r,fill){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();ctx.fillStyle=fill;ctx.fill();}

/* ================= 状态 ================= */
let state='menu';   // menu | play | pause | dead
let dist=0,speed=13,nextZ=45,coinsGot=0,best=0,shake=0,flash=0,deathT=0,elapsed=0,deadShown=false;
try{best=+localStorage.getItem('metro-rush-best')||0;}catch(e){}
const obstacles=[],coinsArr=[],parts=[];
const player={lane:1,x:0,y:0,vy:0,ground:true,roll:0,phase:0,deadRot:0};
const score=()=>Math.floor(dist)+coinsGot*10;

/* ================= 音效（WebAudio 合成，无外部资源） ================= */
const sfx=(()=>{
  let ac=null,muted=false;
  function get(){
    if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
    if(ac&&ac.state==='suspended')ac.resume();
    return ac;
  }
  function tone(f0,f1,dur,type,vol){
    const a=get();if(!a||muted)return;
    const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.02);
  }
  return{
    coin:()=>tone(1250,1900,0.09,'square',0.06),
    jump:()=>tone(240,540,0.16,'sine',0.1),
    roll:()=>tone(200,90,0.14,'sine',0.09),
    woosh:()=>tone(500,900,0.07,'sine',0.05),
    crash:()=>{tone(180,40,0.5,'sawtooth',0.18);tone(90,30,0.6,'triangle',0.15);},
    toggleMute(){muted=!muted;return muted;}
  };
})();

/* ================= 场景静态元素 ================= */
let skyGrad=null,stars=[],skylineFar=[],skylineNear=[];
function genSkyline(maxH){const arr=[];let x=0;while(x<2600){const w=rnd(40,120),h=rnd(maxH*0.3,maxH);arr.push({x,w,h});x+=w+rnd(4,30);}return arr;}
function buildScenery(){
  skyGrad=ctx.createLinearGradient(0,0,0,H*0.4);
  skyGrad.addColorStop(0,'#141a3c');skyGrad.addColorStop(0.55,'#3a3166');
  skyGrad.addColorStop(0.85,'#7a4660');skyGrad.addColorStop(1,'#c97a4e');
  stars=[];for(let i=0;i<70;i++)stars.push({x:Math.random(),y:Math.random()*0.75,r:rnd(0.5,1.6),tw:rnd(0,7)});
  skylineFar=genSkyline(90);skylineNear=genSkyline(150);
}
function drawSkyline(arr,col,off){
  const loop=2600;off=((off%loop)+loop)%loop;
  ctx.fillStyle=col;
  for(let base=-1;base<=Math.ceil(W/loop);base++){
    for(const b of arr){
      const x=base*loop+b.x-off;
      if(x>W||x+b.w<0)continue;
      const h=b.h*(H/900);
      ctx.fillRect(x,horizonY()-h,b.w,h+4);
    }
  }
}
function drawSky(){
  ctx.fillStyle=skyGrad;ctx.fillRect(0,0,W,horizonY()+2);
  ctx.fillStyle='#fff';
  for(const st of stars){
    ctx.globalAlpha=0.25+0.5*Math.abs(Math.sin(elapsed*0.7+st.tw));
    ctx.fillRect(st.x*W,st.y*horizonY(),st.r,st.r);
  }
  ctx.globalAlpha=1;
  const sx=W*0.72,sy=horizonY()*0.9;
  const g=ctx.createRadialGradient(sx,sy,0,sx,sy,H*0.25);
  g.addColorStop(0,'rgba(255,170,90,0.5)');g.addColorStop(1,'rgba(255,170,90,0)');
  ctx.fillStyle=g;ctx.fillRect(sx-H*0.25,sy-H*0.25,H*0.5,H*0.5);
  ctx.fillStyle='#ffce8a';ctx.beginPath();ctx.arc(sx,sy,H*0.032,0,7);ctx.fill();
  drawSkyline(skylineFar,'#2a2447',dist*0.5);
  drawSkyline(skylineNear,'#221d3a',dist*1.4);
}
function drawGround(){
  const g=ctx.createLinearGradient(0,horizonY(),0,H);
  g.addColorStop(0,'#3a3644');g.addColorStop(1,'#575061');
  ctx.fillStyle=g;ctx.fillRect(0,horizonY(),W,H-horizonY());
  // 隧道侧墙
  for(const sx of[-4.6,4.6]){
    poly(proj(sx,2.8,92),proj(sx,2.8,-2),proj(sx,0,-2),proj(sx,0,92),'#2c2740');
  }
  // 立柱与灯
  const step=9;let k=Math.floor((dist-2)/step);
  for(;;k++){
    const z=k*step-dist;if(z>92)break;if(z<-2)continue;
    for(const sx of[-4.25,4.25]){
      poly(proj(sx-0.25,2.8,z),proj(sx+0.25,2.8,z),proj(sx+0.25,0,z),proj(sx-0.25,0,z),'#231e33');
      if(((k%3)+3)%3===0){
        const lp=proj(sx-Math.sign(sx)*0.6,2.9,z);
        const gg=ctx.createRadialGradient(lp.x,lp.y,0,lp.x,lp.y,1.6*lp.s);
        gg.addColorStop(0,'rgba(255,205,130,0.5)');gg.addColorStop(1,'rgba(255,205,130,0)');
        ctx.fillStyle=gg;ctx.beginPath();ctx.arc(lp.x,lp.y,1.6*lp.s,0,7);ctx.fill();
        ctx.fillStyle='#ffd9a0';ctx.fillRect(lp.x-0.15*lp.s,lp.y-0.1*lp.s,0.3*lp.s,0.15*lp.s);
      }
    }
  }
  // 三条轨道：枕木 + 钢轨
  for(const lx of LANES){
    const st2=1.35;let kk=Math.floor((dist-2)/st2);
    for(;;kk++){
      const z=kk*st2-dist;if(z>92)break;if(z<-2)continue;
      const ze=Math.min(z+0.5,92);
      poly(proj(lx-1.05,0.02,z),proj(lx+1.05,0.02,z),proj(lx+1.05,0.02,ze),proj(lx-1.05,0.02,ze),((kk%2)+2)%2?'#463d52':'#4d4459');
    }
    for(const off of[-0.72,0.72]){
      const x=lx+off;
      poly(proj(x-0.06,0.14,92),proj(x+0.06,0.14,92),proj(x+0.06,0.14,-2),proj(x-0.06,0.14,-2),'#8e93ad');
      poly(proj(x-0.022,0.16,92),proj(x+0.022,0.16,92),proj(x+0.022,0.16,-2),proj(x-0.022,0.16,-2),'#c9cede');
    }
  }
}

/* ================= 关卡生成（模板保证至少一条通路） ================= */
function ob(lane,type,Z,len){obstacles.push({lane,type,Z,len,halfW:type==='train'?0.95:0.85,ci:ri(0,3)});}
function addCoin(lane,y,Z){coinsArr.push({lane,y,Z,taken:false});}
function coinLine(lane,Z,n,step=1.6,y=0.55){for(let i=0;i<n;i++)addCoin(lane,y,Z+i*step);}
function coinArc(lane,Z){const hs=[0.7,1.45,1.75,1.45,0.7];for(let i=0;i<5;i++)addCoin(lane,hs[i],Z+(i-2)*1.5);}
const TRAIN_COLORS=[['#e8514b','#a83a38'],['#3f7ad6','#2b57a3'],['#f0b13a','#bd8a1e'],['#37ad68','#26854e']];
const patterns=[
  {w:3,f:z=>{const l=ri(0,2);ob(l,'hurdle',z,0.5);coinArc(l,z);return 8;}},
  {w:3,f:z=>{const l=ri(0,2);ob(l,'overhead',z,0.5);coinLine(l,z+2.5,4);return 8;}},
  {w:4,f:z=>{const l=ri(0,2);ob(l,'train',z,ri(12,18));coinLine((l+ri(1,2))%3,z+2,6);return 18;}},
  {w:2,f:z=>{ob(ri(0,2),'train',z,26);return 30;}},
  {w:3,f:z=>{const free=ri(0,2);for(let l=0;l<3;l++)if(l!==free)ob(l,'train',z+rnd(0,5),ri(13,20));coinLine(free,z+2,7);return 26;}},
  {w:2,f:z=>{const free=ri(0,2);for(let l=0;l<3;l++)if(l!==free)ob(l,'hurdle',z,0.5);coinArc(free,z);return 10;}},
  {w:2,f:z=>{coinLine(ri(0,2),z,7);return 14;}},
  {w:3,f:z=>{const a=ri(0,2),b=(a+ri(1,2))%3;ob(a,'overhead',z,0.5);ob(b,'hurdle',z+9,0.5);coinLine(b,z+10.5,4);return 20;}},
];
function spawnChunk(){
  let tot=0;for(const p of patterns)tot+=p.w;
  let r=Math.random()*tot,p=patterns[0];
  for(const q of patterns){r-=q.w;if(r<=0){p=q;break;}}
  const len=p.f(nextZ);
  nextZ+=len+rnd(12,18)+speed*0.35;
}

/* ================= 玩家动作 ================= */
function doLeft(){if(state!=='play')return;if(player.lane>0){player.lane--;sfx.woosh();}}
function doRight(){if(state!=='play')return;if(player.lane<2){player.lane++;sfx.woosh();}}
function doJump(){if(state!=='play')return;if(player.ground){player.vy=7.6;player.ground=false;player.roll=0;sfx.jump();}}
function doRoll(){if(state!=='play')return;if(!player.ground)player.vy=Math.min(player.vy,-14);player.roll=0.75;sfx.roll();}

/* ================= 流程 ================= */
const $=id=>document.getElementById(id);
function setState(s){state=s;document.body.dataset.state=s;setOverlay();}
function setOverlay(){
  $('menu').classList.toggle('hidden',state!=='menu');
  $('dead').classList.toggle('hidden',!(state==='dead'&&deadShown));
  $('pause').classList.toggle('hidden',state!=='pause');
}
function reset(){
  obstacles.length=0;coinsArr.length=0;parts.length=0;
  dist=0;speed=13;nextZ=45;coinsGot=0;deathT=0;shake=0;flash=0;
  player.lane=1;player.x=0;player.y=0;player.vy=0;player.ground=true;player.roll=0;player.phase=0;player.deadRot=0;
}
function start(){reset();setState('play');sfx.woosh();}
function togglePause(){
  if(state==='play')setState('pause');
  else if(state==='pause')setState('play');
}
function die(){
  setState('dead');deadShown=false;deathT=0;shake=1;flash=0.7;
  player.vy=5.5;player.ground=false;
  sfx.crash();
  const p=proj(player.x,player.y+1,0.35);
  burst(p.x,p.y,'#ff6b4a',26);
}
function showGameOver(){
  const sc=score(),nb=sc>best;
  if(nb){best=sc;try{localStorage.setItem('metro-rush-best',best);}catch(e){}}
  $('finalScore').textContent=sc;
  $('finalBest').textContent='最高分 '+best;
  $('newBest').classList.toggle('hidden',!nb);
  setOverlay();
}

/* ================= 输入 ================= */
addEventListener('keydown',e=>{
  if(e.repeat)return;
  const k=e.key;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k))e.preventDefault();
  if(state==='menu'&&(k===' '||k==='Enter')){start();return;}
  if(state==='dead'&&deadShown&&(k===' '||k==='Enter'||k==='r'||k==='R')){start();return;}
  if(k==='p'||k==='P'||k==='Escape'){if(state==='play'||state==='pause')togglePause();return;}
  if(k==='m'||k==='M'){toggleMute();return;}
  if(k==='ArrowLeft'||k==='a'||k==='A')doLeft();
  else if(k==='ArrowRight'||k==='d'||k==='D')doRight();
  else if(k==='ArrowUp'||k==='w'||k==='W'||k===' ')doJump();
  else if(k==='ArrowDown'||k==='s'||k==='S')doRoll();
});
let tx=0,ty=0;
cv.addEventListener('touchstart',e=>{const t=e.changedTouches[0];tx=t.clientX;ty=t.clientY;e.preventDefault();},{passive:false});
cv.addEventListener('touchend',e=>{
  const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.hypot(dx,dy)<24)return;
  if(Math.abs(dx)>Math.abs(dy)){dx>0?doRight():doLeft();}else{dy<0?doJump():doRoll();}
  e.preventDefault();
},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
$('menu').addEventListener('click',()=>start());
$('dead').addEventListener('click',()=>{if(deadShown)start();});
$('pause').addEventListener('click',()=>togglePause());
function toggleMute(){$('mute').textContent=sfx.toggleMute()?'🔇':'🔊';}
$('mute').addEventListener('click',e=>{e.stopPropagation();toggleMute();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')setState('pause');});

/* ================= 粒子 ================= */
function burst(x,y,col,n){
  for(let i=0;i<n;i++){
    const a=rnd(0,7),v=rnd(60,260);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,life:1,col});
  }
}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.life-=dt*1.8;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;
    if(p.life<=0)parts.splice(i,1);
  }
}
function drawParts(){
  for(const p of parts){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.col;ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;
}

/* ================= 更新 ================= */
function update(dt){
  elapsed+=dt;
  shake=Math.max(0,shake-dt*2.5);flash=Math.max(0,flash-dt*2);
  if(state==='menu'){dist+=6*dt;player.phase+=6*dt*1.7;return;}
  if(state==='pause')return;
  if(state==='dead'){
    deathT+=dt;
    player.vy-=20*dt;player.y=Math.max(0,player.y+player.vy*dt);
    player.deadRot=-Math.min(1.5,deathT*4);
    updateParts(dt);
    if(deathT>0.9&&!deadShown){deadShown=true;showGameOver();}
    return;
  }
  // play
  speed=Math.min(34,13+dist*0.011);
  dist+=speed*dt;
  player.phase+=speed*dt*1.7;
  while(nextZ<dist+130)spawnChunk();
  const tgx=LANES[player.lane];
  player.x+=(tgx-player.x)*Math.min(1,dt*11);
  if(!player.ground){
    player.vy-=20*dt;player.y+=player.vy*dt;
    if(player.y<=0){player.y=0;player.vy=0;player.ground=true;}
  }
  player.roll=Math.max(0,player.roll-dt);
  // 碰撞（玩家 AABB：x±0.3，z -0.45..0.55）
  const ph=player.roll>0?0.85:1.75;
  for(const o of obstacles){
    const zN=o.Z-dist,zF=zN+o.len;
    if(zF<-0.45||zN>0.55)continue;
    if(Math.abs(LANES[o.lane]-player.x)>o.halfW+0.3)continue;
    let hit=false;
    if(o.type==='train')hit=true;
    else if(o.type==='hurdle')hit=player.y<0.95;
    else hit=player.y+ph>1.15;
    if(hit){die();break;}
  }
  // 金币
  for(const c of coinsArr){
    if(c.taken)continue;
    const z=c.Z-dist;
    if(Math.abs(z)<0.8&&Math.abs(LANES[c.lane]-player.x)<0.75&&Math.abs(c.y-(player.y+0.9))<1.05){
      c.taken=true;coinsGot++;sfx.coin();
      const p=proj(LANES[c.lane],c.y,z);
      burst(p.x,p.y,'#ffd75e',10);
    }
  }
  // 清理身后
  for(let i=obstacles.length-1;i>=0;i--)if(obstacles[i].Z+obstacles[i].len-dist<-6)obstacles.splice(i,1);
  for(let i=coinsArr.length-1;i>=0;i--){const c=coinsArr[i];if(c.taken||c.Z-dist<-6)coinsArr.splice(i,1);}
  updateParts(dt);
}

/* ================= 绘制：障碍物 ================= */
function drawTrain(o,zN,zF){
  const col=TRAIN_COLORS[o.ci];
  const x0=LANES[o.lane]-1.02,x1=LANES[o.lane]+1.02,hh=3.0;
  const zNc=Math.max(zN,-CAM_BACK+0.3);
  const frontVis=zN>-CAM_BACK+0.35;
  const A=proj(x0,0,zNc),B=proj(x1,0,zNc);
  // 地影
  poly(proj(x0-0.15,0.01,zNc),proj(x1+0.15,0.01,zNc),proj(x1+0.15,0.01,zF),proj(x0-0.15,0.01,zF),'rgba(0,0,0,0.3)');
  // 侧面（车在画面右半 → 看左面）
  if(zF-zNc>0.2){
    const left=(A.x+B.x)/2>W/2,sx=left?x0:x1;
    poly(proj(sx,0,zNc),proj(sx,hh,zNc),proj(sx,hh,zF),proj(sx,0,zF),col[1]);
    poly(proj(sx,0,zNc),proj(sx,0.5,zNc),proj(sx,0.5,zF),proj(sx,0,zF),'#1c1926');
    poly(proj(sx,1.5,zNc),proj(sx,1.75,zNc),proj(sx,1.75,zF),proj(sx,1.5,zF),'rgba(255,255,255,0.18)');
    for(let wz=zNc+1.1;wz<zF-1.2;wz+=2.4){
      if(wz<0.4)continue;
      const we=Math.min(wz+1.4,zF-0.6);
      poly(proj(sx,1.85,wz),proj(sx,2.55,wz),proj(sx,2.55,we),proj(sx,1.85,we),'#31406b');
    }
    for(let wz=zNc+1;wz<zF-0.8;wz+=3){
      if(wz<0.2)continue;
      const wp=proj(sx,0.22,wz);
      ctx.fillStyle='#12101a';ctx.beginPath();ctx.arc(wp.x,wp.y,0.22*wp.s,0,7);ctx.fill();
    }
  }
  // 顶面 + 设备箱
  poly(proj(x0,hh,zNc),proj(x1,hh,zNc),proj(x1,hh,zF),proj(x0,hh,zF),col[1]);
  const m=LANES[o.lane];
  for(let vz=zNc+2;vz<zF-1.5;vz+=5.5){
    if(vz<0.3)continue;
    poly(proj(m-0.55,hh,vz),proj(m+0.55,hh,vz),proj(m+0.55,hh+0.28,vz+1.6),proj(m-0.55,hh+0.28,vz+1.6),'#20263c');
  }
  // 正面
  if(frontVis){
    poly(proj(x0,0,zNc),proj(x1,0,zNc),proj(x1,hh,zNc),proj(x0,hh,zNc),col[0]);
    poly(proj(x0+0.25,2.0,zNc),proj(x1-0.25,2.0,zNc),proj(x1-0.25,2.72,zNc),proj(x0+0.25,2.72,zNc),'#131a2e');
    poly(proj(x0,1.2,zNc),proj(x1,1.2,zNc),proj(x1,1.5,zNc),proj(x0,1.5,zNc),'rgba(0,0,0,0.25)');
    poly(proj(x0,0,zNc),proj(x1,0,zNc),proj(x1,0.35,zNc),proj(x0,0.35,zNc),'#1c1926');
    for(const lx of[x0+0.35,x1-0.35]){
      const lp=proj(lx,0.72,zNc);
      const g=ctx.createRadialGradient(lp.x,lp.y,0,lp.x,lp.y,0.5*lp.s);
      g.addColorStop(0,'rgba(255,236,170,0.9)');g.addColorStop(1,'rgba(255,236,170,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(lp.x,lp.y,0.5*lp.s,0,7);ctx.fill();
      ctx.fillStyle='#fff3c4';ctx.beginPath();ctx.arc(lp.x,lp.y,0.11*lp.s,0,7);ctx.fill();
    }
  }
}
function drawHurdle(o,zN){
  const cx=LANES[o.lane],z=zN+0.25;
  const sp=proj(cx,0.02,z);
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.beginPath();ctx.ellipse(sp.x,sp.y,1.05*sp.s,0.18*sp.s,0,0,7);ctx.fill();
  for(const off of[-0.86,0.86]){
    poly(proj(cx+off-0.05,0,z),proj(cx+off+0.05,0,z),proj(cx+off+0.05,0.98,z),proj(cx+off-0.05,0.98,z),'#6a7188');
  }
  const P1=proj(cx-0.92,0.42,z),P2=proj(cx+0.92,0.42,z),P3=proj(cx+0.92,0.95,z),P4=proj(cx-0.92,0.95,z);
  poly(P1,P2,P3,P4,'#ff8c1a');
  ctx.save();
  ctx.beginPath();ctx.moveTo(P1.x,P1.y);ctx.lineTo(P2.x,P2.y);ctx.lineTo(P3.x,P3.y);ctx.lineTo(P4.x,P4.y);ctx.closePath();ctx.clip();
  ctx.fillStyle='rgba(255,255,255,0.85)';
  const wq=P2.x-P1.x,hgt=P3.y-P2.y;
  for(let i=-1;i<4;i++){
    const xx=P1.x+i*wq/3;
    ctx.beginPath();ctx.moveTo(xx,P2.y);ctx.lineTo(xx+wq/7,P2.y);ctx.lineTo(xx+wq/7-hgt*0.6,P3.y);ctx.lineTo(xx-hgt*0.6,P3.y);ctx.closePath();ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=Math.max(1,0.03*P1.s);
  ctx.beginPath();ctx.moveTo(P4.x,P4.y);ctx.lineTo(P3.x,P3.y);ctx.stroke();
}
function drawOverhead(o,zN){
  const cx=LANES[o.lane],z=zN+0.25;
  const sp=proj(cx,0.02,z);
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(sp.x,sp.y,1.1*sp.s,0.16*sp.s,0,0,7);ctx.fill();
  for(const off of[-0.92,0.92]){
    poly(proj(cx+off-0.05,0,z),proj(cx+off+0.05,0,z),proj(cx+off+0.05,2.6,z),proj(cx+off-0.05,2.6,z),'#7d8598');
  }
  const P1=proj(cx-1.0,1.15,z),P2=proj(cx+1.0,1.15,z),P3=proj(cx+1.0,2.35,z),P4=proj(cx-1.0,2.35,z);
  poly(P1,P2,P3,P4,'#26325e');
  ctx.strokeStyle='#e8ecff';ctx.lineWidth=Math.max(1,0.04*P1.s);
  ctx.beginPath();ctx.moveTo(P1.x,P1.y);ctx.lineTo(P2.x,P2.y);ctx.lineTo(P3.x,P3.y);ctx.lineTo(P4.x,P4.y);ctx.closePath();ctx.stroke();
  ctx.strokeStyle='#ffd23c';ctx.lineWidth=Math.max(1,0.09*P1.s);ctx.lineJoin='round';ctx.lineCap='round';
  for(const off of[-0.45,0,0.45]){
    const a=proj(cx+off-0.18,1.95,z),b=proj(cx+off,1.55,z),c=proj(cx+off+0.18,1.95,z);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.stroke();
  }
}
function drawObstacle(o){
  const zN=o.Z-dist,zF=zN+o.len;
  if(o.type==='train')drawTrain(o,zN,zF);
  else if(o.type==='hurdle')drawHurdle(o,zN);
  else drawOverhead(o,zN);
}
function drawCoin(c){
  const z=c.Z-dist;
  const p=proj(LANES[c.lane],c.y+Math.sin(elapsed*3+c.Z)*0.05,z);
  const r=0.34*p.s,sq=Math.abs(Math.cos(elapsed*5+c.Z*0.7))*0.75+0.25;
  ctx.save();ctx.translate(p.x,p.y);
  const g=ctx.createRadialGradient(-r*0.3,-r*0.3,r*0.1,0,0,r);
  g.addColorStop(0,'#fff3b8');g.addColorStop(0.6,'#ffd75e');g.addColorStop(1,'#d99a12');
  ctx.shadowColor='rgba(255,215,94,0.9)';ctx.shadowBlur=r*0.9;
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,r*sq,r,0,0,7);ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(120,70,0,0.5)';ctx.lineWidth=Math.max(1,r*0.12);
  ctx.beginPath();ctx.ellipse(0,0,r*sq*0.62,r*0.62,0,0,7);ctx.stroke();
  ctx.restore();
}

/* ================= 绘制：玩家 ================= */
function drawPlayer(){
  const p=proj(player.x,0,0.35),u=p.s,px=p.x,py=p.y;
  const shH=Math.max(0.15,1-player.y*0.35);
  ctx.fillStyle=`rgba(0,0,0,${0.35*shH})`;
  ctx.beginPath();ctx.ellipse(px,py,0.55*u*shH+0.15*u,0.16*u*shH+0.05*u,0,0,7);ctx.fill();
  ctx.save();
  ctx.translate(px,py);
  ctx.rotate((LANES[player.lane]-player.x)*0.28+player.deadRot);
  if(player.roll>0){
    const r=0.42*u;
    ctx.fillStyle='#21b6a8';ctx.beginPath();ctx.arc(0,-r,r,0,7);ctx.fill();
    ctx.fillStyle='#ff8a3c';ctx.beginPath();ctx.arc(0.08*u,-r-0.05*u,0.2*u,0,7);ctx.fill();
    ctx.fillStyle='#ffd23c';ctx.beginPath();ctx.arc(-0.1*u,-r-0.12*u,0.14*u,0,7);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=0.05*u;
    const a0=elapsed*20;
    ctx.beginPath();ctx.arc(0,-r,r*0.75,a0,a0+1.8);ctx.stroke();
  }else{
    const y0=-player.y*u;
    const airborne=!player.ground;
    const phz=player.phase;
    const legA=airborne?0.5:Math.sin(phz)*0.55;
    const legB=airborne?-0.3:Math.sin(phz+Math.PI)*0.55;
    const bob=airborne?0:Math.abs(Math.cos(phz))*0.05*u;
    ctx.lineCap='round';
    // 腿 + 鞋
    ctx.strokeStyle='#2b3350';ctx.lineWidth=0.16*u;
    const foot=(hx,swing)=>{
      const lift=airborne?0.3:Math.max(0,swing)*0.3;
      const fx=hx+swing*0.18*u,fy=y0-lift*u;
      ctx.beginPath();ctx.moveTo(hx,y0-0.72*u+bob);ctx.lineTo(fx,fy);ctx.stroke();
      ctx.fillStyle='#f4f6ff';ctx.beginPath();ctx.arc(fx,fy-0.02*u,0.09*u,0,7);ctx.fill();
    };
    foot(-0.12*u,legA);foot(0.12*u,legB);
    // 身体 + 背包
    const bodyTop=y0-1.42*u+bob;
    rr(-0.26*u,bodyTop,0.52*u,0.75*u,0.12*u,'#21b6a8');
    rr(-0.17*u,bodyTop+0.08*u,0.34*u,0.5*u,0.08*u,'#ff8a3c');
    ctx.strokeStyle='#d96f2a';ctx.lineWidth=0.045*u;
    ctx.beginPath();ctx.moveTo(-0.13*u,bodyTop+0.08*u);ctx.lineTo(-0.13*u,bodyTop+0.55*u);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0.13*u,bodyTop+0.08*u);ctx.lineTo(0.13*u,bodyTop+0.55*u);ctx.stroke();
    // 手臂
    ctx.strokeStyle='#1a9a8e';ctx.lineWidth=0.13*u;
    const armA=airborne?-0.5:Math.sin(phz+Math.PI)*0.2;
    const armB=airborne?-0.5:Math.sin(phz)*0.2;
    const arm=(hx,sw)=>{
      ctx.beginPath();ctx.moveTo(hx,y0-1.3*u+bob);
      ctx.lineTo(hx+sw*0.25*u,y0-0.85*u+bob);ctx.stroke();
    };
    arm(-0.3*u,armA);arm(0.3*u,armB);
    // 头 + 帽
    const hy=y0-1.62*u+bob;
    ctx.fillStyle='#ffd9b0';ctx.beginPath();ctx.arc(0,hy,0.19*u,0,7);ctx.fill();
    ctx.fillStyle='#ffd23c';
    ctx.beginPath();ctx.arc(0,hy-0.02*u,0.2*u,Math.PI,0);ctx.fill();
    ctx.fillRect(-0.2*u,hy-0.05*u,0.4*u,0.06*u);
  }
  ctx.restore();
}

/* ================= 绘制：主流程 ================= */
function drawSpeedLines(a){
  ctx.save();
  ctx.strokeStyle=`rgba(255,255,255,${0.28*a})`;ctx.lineWidth=2;
  const cx=W/2,cy=H*0.45,R=Math.max(W,H);
  for(let i=0;i<14;i++){
    const ang=(i/14)*Math.PI*2+elapsed*0.5;
    const r1=R*(0.55+((i*37)%23)/60),r2=r1+40+((i*53)%40);
    ctx.beginPath();ctx.moveTo(cx+Math.cos(ang)*r1,cy+Math.sin(ang)*r1);ctx.lineTo(cx+Math.cos(ang)*r2,cy+Math.sin(ang)*r2);ctx.stroke();
  }
  ctx.restore();
}
function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake*18,(Math.random()-0.5)*shake*14);
  drawSky();drawGround();
  const list=[];
  for(const o of obstacles){
    const zN=o.Z-dist;
    if(zN+o.len<-CAM_BACK+0.3||zN>95)continue;
    list.push({z:Math.max(zN,-CAM_BACK),kind:'o',o});
  }
  for(const c of coinsArr){
    if(c.taken)continue;
    const z=c.Z-dist;
    if(z<-CAM_BACK+0.3||z>95)continue;
    list.push({z,kind:'c',c});
  }
  list.push({z:0,kind:'p'});
  list.sort((a,b)=>b.z-a.z);
  for(const it of list){
    if(it.kind==='o')drawObstacle(it.o);
    else if(it.kind==='c')drawCoin(it.c);
    else drawPlayer();
  }
  drawParts();
  ctx.restore();
  if(state==='play'&&speed>20)drawSpeedLines((speed-20)/14);
  if(flash>0){ctx.fillStyle=`rgba(255,60,40,${flash*0.45})`;ctx.fillRect(0,0,W,H);}
  $('score').textContent=score();
  $('coinN').textContent=coinsGot;
  $('best').textContent='最高分 '+best;
  $('menuBest').textContent='最高分 '+best;
}

/* ================= 主循环 ================= */
addEventListener('resize',resize);
resize();
$('menuBest').textContent='最高分 '+best;
let last=performance.now();
function frame(now){
  const dt=Math.min(0.033,(now-last)/1000);
  last=now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
