# ============================================================
# pre-commit 配置（REQ-13）
# 集成 ruff（lint+format）+ mypy（类型检查）+ 基础文件检查
# ============================================================
#
# 使用方式：
#   1. 安装 pre-commit: pip install pre-commit
#   2. 安装 git hooks: pre-commit install
#   3. 手动运行: pre-commit run --all-files
#
# 说明：
#   - 本配置文件是项目代码质量门禁的入口
#   - 现有警告会被允许通过（按任务要求"工具本身不报错"）
#   - 新代码应逐步满足所有规则

# 最小 pre-commit 版本
minimum_pre_commit_version: "3.5.0"

# 默认所有文件都跑所有 hook
default_install_hook_types: [pre-commit, commit-msg]

# 失败时回滚到 clean 状态
fail_fast: false

# 跳过自动生成的/不需要检查的目录
exclude: |
  (?x)^(
      .*\.min\.(js|css)|
      .*\.bak|
      frontend/.*|
      electron/.*|
      mcp-servers/.*|
      node_modules/.*|
      .*\.egg-info/.*|
      docs/.*\.md
  )$

repos:
  # ============================================================
  # 1. 基础文件检查（pre-commit-hooks 内置）
  # ============================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: 去除行尾空白
        args: [--markdown-linebreak-ext=md]

      - id: end-of-file-fixer
        name: 确保文件以换行符结尾

      - id: check-yaml
        name: 验证 YAML 语法
        args: [--allow-multiple-documents]
        # 排除第三方 YAML
        exclude: ^(\.gitlab-ci\.yml|docker/.*|node_modules/.*|docs/working/private/.*)

      - id: check-toml
        name: 验证 TOML 语法

      - id: check-json
        name: 验证 JSON 语法
        # config/media_workflows/ 是 {{占位符}} 模板文件,非合法 JSON(设计如此)
        exclude: ^(\.vscode/.*|node_modules/.*|package-lock\.json|config/media_workflows/.*)

      - id: check-merge-conflict
        name: 检测未解决的合并冲突标记

      - id: check-added-large-files
        name: 防止提交大文件
        args: [--maxkb=1024]

      - id: check-case-conflict
        name: 检测文件名大小写冲突

      - id: mixed-line-ending
        name: 强制 LF 换行符
        # *.bat/*.ps1 由 .gitattributes 强制 CRLF(Windows 运行时约定),与
        # 本 hook 的 LF 归一天然冲突——排除,行尾治理交给 gitattributes。
        exclude: \.(bat|ps1|cmd)$
        args: [--fix=lf]

      - id: detect-private-key
        name: 防止意外提交私钥

  # ============================================================
  # 2. Ruff（lint + format）+ 3. mypy —— repo: local + language: system
  # 工具取 PATH 上的 ruff/mypy（本机全局 ruff 0.15.20 与项目 uv 工具链
  # 同版；mypy 本机/CI 均 2.1.0，插件域 2.2.0 由 plugins-mypy-baseline
  # 门禁单独治理，此差一档为既定现状）。不依赖 github.com 拉取 hook
  # 仓库——本机 git https 到 github 不通是既有环境约束；CI job 已补
  # pip install 同版本。升级项目 ruff 时须同步 CI 安装版本与本机全局。
  # ============================================================
  - repo: local
    hooks:
      # Lint 检查（先于 format）
      - id: ruff
        name: Ruff Lint
        entry: ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        # 排除不需要 lint 的目录;tests/skills/agent-research 等老域是 0.1 遗留
        # (1273 个 N802/PLC2401/E402 风格项,治理归 plugins 域门禁与 baseline,
        # pre-commit 只管已治理域:plugins/sdk、scripts、src)
        exclude: |
          (?x)^(
              frontend/.*|
              electron/.*|
              mcp-servers/.*|
              node_modules/.*|
              tests/.*|
              skills/.*|
              agent-research/.*|
              plugins/shared/.*|
              plugins/test_.*|
              hosts/.*|
              config/templates/.*|
              scripts/agent_prompt_viewer\.py|
              docs/.*|
          )$

      # Format 格式化（在 lint 之后）
      - id: ruff-format
        name: Ruff Format
        entry: ruff format
        language: system
        types_or: [python, pyi]
        # 范围对齐 Ruff Lint(老域排除,见上)
        exclude: |
          (?x)^(
              frontend/.*|
              electron/.*|
              mcp-servers/.*|
              node_modules/.*|
              tests/.*|
              skills/.*|
              agent-research/.*|
              plugins/shared/.*|
              plugins/test_.*|
              hosts/.*|
              config/templates/.*|
              scripts/agent_prompt_viewer\.py|
              docs/.*|
          )$

      - id: mypy
        name: mypy 类型检查
        # 允许现有警告（不强制 0 错误），工具本身正常运行即可
        # --show-traceback + --cache-dir=NONE：2026-09-01 CI Linux mypy 2.1.0
        # 间歇性 INTERNAL ERROR，traceback 定根因 = --no-incremental 仍写 sqlite
        # 缓存库，多 worker 并发写偶发 "database is locked"（ OperationalError 被
        # 包装成 INTERNAL ERROR）。--no-incremental 本就不读缓存，配
        # --cache-dir=NONE 禁写根治；--show-traceback 保留供将来取证。
        entry: mypy --config-file=pyproject.toml --no-incremental --cache-dir=NONE --show-traceback
        language: system
        files: \.py$
        # 实际检查范围：根目录 .py 脚本 + scripts/（src/ 已迁移至 plugins/）。
        # plugins/ 排除——插件 server.py 同名模块冲突(mypy duplicate module)，
        # 且插件域已由 plugins-mypy-baseline 门禁(run_gates)单独治理,pre-commit 不重复管辖
        exclude: |
          (?x)^(
              tests/.*|
              frontend/.*|
              electron/.*|
              mcp-servers/.*|
              plugins/.*|
              skills/.*|
              agent-research/.*|
              hosts/.*|
              docs/.*|
              config/templates/.*|
              scripts/agent_prompt_viewer\.py|
              .*tests/.*|
              .*test_.*\.py$
          )$
        # 单个文件失败不影响其他
        require_serial: false
