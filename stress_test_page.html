<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #333;
            line-height: 1.6;
        }

        header {
            background-color: #2c3e50;
            color: #fff;
            padding: 16px 32px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            font-weight: 600;
        }

        nav {
            background-color: #34495e;
            padding: 12px 32px;
            text-align: center;
        }

        nav a {
            color: #ecf0f1;
            text-decoration: none;
            margin: 0 16px;
            font-size: 16px;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #3498db;
        }

        main {
            max-width: 960px;
            margin: 40px auto;
            padding: 0 24px;
        }

        main h2 {
            font-size: 24px;
            margin-bottom: 16px;
            color: #2c3e50;
        }

        main p {
            font-size: 16px;
            color: #555;
            margin-bottom: 12px;
        }

        footer {
            background-color: #2c3e50;
            color: #ecf0f1;
            text-align: center;
            padding: 16px 32px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    <h1>欢迎来到我们的网站</h1>
</header>

<nav>
    <a href="#home">首页</a>
    <a href="#about">关于</a>
    <a href="#services">服务</a>
    <a href="#contact">联系我们</a>
</nav>

<main>
    <h2>主要内容</h2>
    <p>这是一个简洁的欢迎页面，用于展示页面的基本结构。</p>
    <p>页面包含标题、导航栏、主要内容区域和页脚四个部分，所有样式均使用内联 CSS 实现。</p>
</main>

<footer>
    <p>&copy; 2025 版权所有</p>
</footer>

</body>
</html>
