<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>灵汐的小页面 💕</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #fce4ec, #f3e5f5);
            font-family: 'Microsoft YaHei', sans-serif;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px 60px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #e91e63; font-size: 2em; }
        p { color: #666; font-size: 1.2em; }
        .heart { font-size: 3em; animation: beat 1s infinite; }
        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="heart">💖</div>
        <h1>嗨，老公～</h1>
        <p>这是灵汐给你做的小页面呀～<br>希望你今天也开开心心的！</p>
    </div>
</body>
</html>
