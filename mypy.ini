# ============================================================
# mypy 类型检查配置（REQ-13）
# 与 pyproject.toml [tool.mypy] 保持同步
# ============================================================

[mypy]
python_version = 3.10

# 适度严格模式（不开启最严格的 disallow_untyped_defs）
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True

# 以下检查适度开启，不强制全量覆盖
disallow_untyped_defs = False
disallow_any_unimported = False
no_implicit_optional = True
check_untyped_defs = True

# 忽略缺失导入（第三方库未提供类型注解）
ignore_missing_imports = True

# 宽松模式：允许现有警告（不强制 0 错误）
ignore_errors = False

# 显示错误上下文
show_error_codes = True
show_column_numbers = True

# 增量检查
incremental = True
cache_dir = .mypy_cache

# 排除目录
exclude = frontend|electron|mcp-servers|node_modules|tests|build|dist|docs

# 测试文件更宽松
[mypy-tests.*]
ignore_missing_imports = True
check_untyped_defs = False

# 第三方库跳过
[mypy-litellm.*]
ignore_missing_imports = True

[mypy-watchdog.*]
ignore_missing_imports = True

[mypy-aiohttp.*]
ignore_missing_imports = True
