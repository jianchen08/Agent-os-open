<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <title>AgentOS</title>
    <!-- 字体已全部本地化（public/fonts/ + src/styles/fonts.css 的 @font-face），
         不再依赖 Google Fonts CDN：内网/离线环境下像素/圆体主题字体同样生效。
         基础 UI 字体栈回退系统字体（Segoe UI / 微软雅黑 /苹方等）。 -->
    <!-- 主题预置脚本外置为同源静态文件（head 内无 defer/async，仍同步先于渲染执行）：
         生产 CSP（nginx.conf）script-src 不放行内联脚本，页面不得残留内联 <script>。 -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
