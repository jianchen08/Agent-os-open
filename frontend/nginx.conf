# 部署形态说明（S16 勘误）：本文件服务「独立 nginx 容器/主机反代」部署形态，
# 上游 = 宿主侧 8000 端口的内核（agentos-api）。历史上游名 `agent:8000` 在
# 仓内部署编排（docker-compose.yml 仅 redis）中无对应服务，独立 nginx 下
# `agent` 主机名不可解析（/api /ws /media 全 502）——已改为 127.0.0.1 直指
# 内核。前端镜像本体（frontend/Dockerfile）走 uvicorn 静态方案，不消费本文件。
server {
    listen 5188;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头（always：4xx/5xx 与静态/代理响应统一携带）。
    # CSP 资源形态核对结论（2026-09 实证）：
    # - script-src 需 'self' + 'unsafe-inline' + blob: 三者并存：
    #   a) blob: —— skinRuntime 以 dynamic import(blob:) 装载皮肤 hooks.mjs
    #      （内容经同源 /ext 通道取回，非任意远程代码）；
    #   b) 'unsafe-inline' —— WebviewWidget/HtmlPreviewWidget 以 srcDoc 注入
    #      插件 HTML（内联 bootstrap JS + 插件内联脚本），srcDoc iframe 继承
    #      父文档 CSP，父级不放行内联则全部插件 webview 页面被拦截；
    #      该继承机制决定了无法只在 iframe 局部豁免（除非改造 widget 本体，
    #      升级路径：webview bootstrap 外置/加 nonce 后即可收回 'unsafe-inline'）；
    #   c) 'self' 仍在：任意外部源（CDN/注入远程脚本）依旧被拒。
    #   应用壳自身保持无内联脚本（主题预置脚本已外置 /theme-init.js，
    #   有静态契约测试 cspSecurityHeaders.contract.test.ts 看守）。
    # - style-src 'unsafe-inline'：antd/@lobehub 与插件样式（pluginStyles 运行时
    #   注入 <style>）、组件 style 属性均依赖内联样式，收紧会全面破面。
    # - connect-src ws: wss: 兼容同源代理之外的非 443 WS 端口；img/frame 的
    #   blob:/data: 供附件预览（URL.createObjectURL）与 FilePreview 内嵌。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self' data:; frame-src 'self' blob: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # 静态资源长缓存（Vite 生成文件名含 hash）。
    # 注意：location 内出现任意 add_header 时不再继承 server 级安全头，须在此重复声明。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self' data:; frame-src 'self' blob: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # API 反向代理到后端容器
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # WebSocket 反向代理到后端容器
    location /ws {
        proxy_pass http://127.0.0.1:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 媒体文件反向代理
    location /media/ {
        proxy_pass http://127.0.0.1:8000/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA 路由：所有未匹配路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
