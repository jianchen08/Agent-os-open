packages:
  - frontend

# pnpm 11 构建脚本放行名单（单一真值源）。证据（CI run 32333595329）：
# root package.json 的 pnpm.onlyBuiltDependencies 含 esbuild 仍被拒
# （ERR_PNPM_IGNORED_BUILDS: esbuild@0.28.2）——pnpm 11 只认本文件的
# allowBuilds，package.json 旧机制已删（防双源漂移）。
# esbuild：frontend 构建链依赖（vite），workspace 纳入 frontend 后需要。
allowBuilds:
  electron: true
  electron-winstaller: true
  unrs-resolver: true
  esbuild: true

# 依赖边修复（2026-08-20）：react-syntax-highlighter@16 的 async 语言表引用
# highlight.js/lib/languages/sql_more，该文件只在 10.7.x 存在（10.4.1 没有）；
# a4574ab5 lock 全量重生成时此边被锚回 10.4.1 → vite build 必挂（CI run
# 32333595329 后本地复现）。override 强制 ^10.4.1 range 解析到 10.7.3。
overrides:
  highlight.js@^10.4.1: 10.7.3
