name: Debug shards v2 full failures
on:
  push:
    branches: [debug/**]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shards-v2
  cancel-in-progress: true
jobs:
  shard-a:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with: { enable-cache: true, cache-dependency-glob: "uv.lock" }
      - run: |
          uv sync --frozen --extra dev --extra isolation
          uv pip install -e ./plugins/sdk
      - name: Run gate
        run: |
          T=$(mktemp)
          ( uv run --frozen python -m pytest -q plugins/test_system_plugins.py plugins/shared/system/llm/ plugins/shared/system/tasks/ plugins/shared/modes/ plugins/shared/pipeline/input/agent_config_load/ plugins/shared/pipeline/core/tool_core/ plugins/shared/pipeline/output/result_format/ plugins/shared/pipeline/input/mode_material_inject/ plugins/shared/pipeline/input/environment_lifecycle/ plugins/shared/pipeline/input/level_guard/ plugins/shared/pipeline/input/multimodal_preprocessor/ plugins/shared/pipeline/input/tool_schema/ plugins/shared/pipeline/output/duplicate_check/ plugins/shared/tools/task/ plugins/shared/tools/human/ plugins/shared/tools/lsp/ plugins/shared/tools/task_evaluate/ plugins/shared/tools/web_ext/ plugins/shared/tools/builtin_tools/tests/ plugins/shared/system/dsh_adapter/tests/ tests/plugins/ tests/suites/plugins/ tests/channels/ tests/gates/ tests/test_security_check_allow_priority.py tests/test_security_check_isolation.py tests/test_track_stats_contract.py tests/test_process_watchdog_integration.py tests/test_isolation_docker_timeout.py tests/test_isolation_container_self_heal.py tests/test_isolation_checkpoint_security.py tests/test_isolation_concurrent_create.py tests/test_isolation_docker_provider_injection.py tests/test_isolation_io_error_self_heal.py tests/test_isolation_prune_throttle.py tests/test_isolation_sandbox.py tests/test_isolation_skills_copy.py --cov=plugins 2>&1 || true ) | tee "$T" | tee /tmp/gate.log > /dev/null
          cp /tmp/gate.log "$GITHUB_WORKSPACE/gate.log" 2>/dev/null || true
      - name: Post failures
        if: always()
        run: |
          cp /tmp/gate.log /tmp/gate.log 2>/dev/null || true
          python3 - <<'PYEOF'
          import os, json, urllib.request, pathlib, re
          out = []
          p = pathlib.Path('/tmp/gate.log')
          if p.exists():
              logt = p.read_text(errors='replace')
              fails = [l for l in logt.splitlines() if l.startswith('FAILED') or l.startswith('ERROR')]
              out.append(str(len(fails)) + ' failed/ERROR lines:')
              out.extend(fails)
              m = re.findall(r'=+ .*(?:passed|failed|error).* =+', logt)
              out.append('summary: ' + (m[-1] if m else 'none'))
          sha = os.environ["GITHUB_SHA"]; token = os.environ["GITHUB_TOKEN"]
          data = json.dumps({"body": "shard-a " + chr(10) + "```" + chr(10) + chr(10).join(out)[:55000] + chr(10) + "```"}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/jianchen08/Agent-os-open/commits/{sha}/comments",
              data=data, headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}, method="POST")
          with urllib.request.urlopen(req) as r:
              print("status", r.status)
          PYEOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
