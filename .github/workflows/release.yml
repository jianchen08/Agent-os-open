# ============================================================
# 发布链 — 灵汐 AgentOS 0.2（tag 触发，GitHub Release 归档产物）
# ============================================================
#
# 定位：Phase 3（2026-08-23）。从 ci.yml 独立出的发布车道——
#   ci.yml 只读、不持任何写权限；本 workflow 持有 contents: write。
#
# 触发：
#   - push tag v*（如 v0.2.0）
#   - workflow_dispatch（手动指定 tag，先手工验证再依赖 tag 触发）
#
# 产物：
#   - Python sdist + wheel（python -m build 产出，dist/）
#   - kernel 二进制（release 构建，Linux x86_64 tar.gz + Windows x86_64 zip）
#   - Linux 产物入 Release 前先冒烟（临时库启动内核，curl /health 断言 200）
#   - 全部归档到 GitHub Release（softprops/action-gh-release）
#
# 权限：contents: write（创建 Release）；id-token 预留 pypi Trusted
#   Publishing（TODO(0.2.0+)：确认 agent-os 包名可用性后启用）。
#
# 注意：CI 不构建 Electron 安装包（体积大、需矩阵），发布物先聚焦
#   wheel + kernel 二进制；Electron 打包留 0.3.0 跨平台打包分发。
# ============================================================

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true

permissions:
  contents: write
  # id-token: write   # 预留：pypi Trusted Publishing 时启用

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Windows 产物（编译通过 + 产物存在即可；无 smoke）─────────────────
  # build（Linux）needs 本 job：Windows zip 经 artifact 汇入同一个 Release。
  build-windows:
    name: Build Windows kernel binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build kernel binary (release)
        working-directory: kernel
        run: |
          rustup show
          cargo +stable build --release --bin agentos-kernel

      - name: Package kernel binary (zip)
        run: |
          mkdir release-assets
          cp kernel/target/release/agentos-kernel.exe release-assets/
          Compress-Archive -Path release-assets/agentos-kernel.exe `
            -DestinationPath release-assets/agentos-kernel-windows-x86_64.zip
          ls release-assets/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kernel-windows
          path: release-assets/agentos-kernel-windows-x86_64.zip
          if-no-files-found: error

  # ── 构建发布产物 ──────────────────────────────────────────
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    needs: build-windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Python 包：sdist + wheel（--frozen 锁定 uv.lock，可复现）
      - name: Build Python sdist + wheel
        run: |
          uv sync --frozen --extra dev
          uv pip install build
          uv run python -m build --outdir dist
          ls -la dist/

      # Rust 内核：release 二进制（sccache 兜底，编译失败即红）
      - name: Build kernel binary (release)
        working-directory: kernel
        run: |
          rustup show
          cargo install sccache --locked || true
          cargo +stable build --release --bin agentos-kernel

      # 打包内核二进制为 tar.gz 资产
      - name: Package kernel binary
        run: |
          mkdir -p release-assets
          cp kernel/target/release/agentos-kernel release-assets/
          tar -czf release-assets/agentos-kernel-linux-x86_64.tar.gz \
            -C release-assets agentos-kernel
          ls -la release-assets/

      # 冒烟验证：发布二进制必须能真实启动并服务 /health（200）。
      # AGENTOS_DB_PATH 指向临时目录（不动仓库数据）；默认绑定 127.0.0.1；
      # 插件 sidecar 缺 venv 只会 G2 观测降级（非致命），不阻塞 /health。
      - name: Smoke test kernel binary (/health -> 200)
        run: |
          SMOKE_DIR=$(mktemp -d)
          AGENTOS_DB_PATH="$SMOKE_DIR/smoke.db" AGENTOS_KERNEL_PORT=9117 \
            ./kernel/target/release/agentos-kernel > /tmp/kernel-smoke.log 2>&1 &
          KERNEL_PID=$!
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9117/health || true)
            [ "$code" = "200" ] && break
            # 进程已退出还等就是白等：立即失败并带日志
            if ! kill -0 "$KERNEL_PID" 2>/dev/null; then break; fi
            sleep 2
          done
          kill "$KERNEL_PID" 2>/dev/null || true
          wait "$KERNEL_PID" 2>/dev/null || true
          if [ "$code" != "200" ]; then
            echo "===== kernel-smoke.log tail ====="
            tail -60 /tmp/kernel-smoke.log
            echo "::error::kernel smoke failed: /health 未在超时内返回 200（最后一次 HTTP $code）"
            exit 1
          fi
          echo "[smoke] /health -> 200 OK"

      # Windows 产物（zip）经 artifact 汇入同一 release-assets 目录
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kernel-windows
          path: release-assets

      # TODO(0.2.0+)：pypi 发布（需确认 agent-os 包名可用性 + 配置
      # pypa/gh-action-pypi-publish Trusted Publishing）：
      #   - uses: pypa/gh-action-pypi-publish@release/v1
      #     with:
      #       packages-dir: dist

      # 归档 GitHub Release：tag 触发用 github.ref_name，
      # 手动触发用输入 tag（含 v 前缀校验）
      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2（旧 pin a9292714 上游不可达被 GC，2026-09-02 公开仓 CI 首跑抓出）
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            release-assets/*.tar.gz
            release-assets/*.zip
