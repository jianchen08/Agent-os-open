# ============================================================
# CI/CD 流水线 — 灵汐 AgentOS 0.2（Rust + Python 混合）
# ============================================================
#
# 流程：代码提交 → Rust Lint → Rust Build → Rust Test → Python Lint → Python Test
#
# 触发条件：
#   - push 到 main / develop 分支
#   - Pull Request 到 main / develop 分支
#
# 缓存策略：
#   - Swatinem/rust-cache 跨 job 共享（shared-key: agentos-0.2）
#   - sccache 加速 Rust 编译（RUSTC_WRAPPER）
#
# 产出物：
#   - Rust 编译产物（debug + release）
#   - Rust 测试报告
#   - Python lint 报告
#   - Python 测试报告
# ============================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: /home/runner/.cache/sccache

jobs:
  # ── Rust Lint ──────────────────────────────────────────────
  rust-lint:
    name: Rust Lint (fmt + clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kernel
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup component add rustfmt clippy

      - name: Install sccache
        run: cargo install sccache || true

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernel
          shared-key: agentos-0.2

  # ── Rust Build ─────────────────────────────────────────────
  rust-build:
    name: Rust Build
    runs-on: ubuntu-latest
    needs: rust-lint
    defaults:
      run:
        working-directory: kernel
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Install sccache
        run: cargo install sccache || true

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernel
          shared-key: agentos-0.2

      - name: Build (debug)
        run: cargo build --verbose

      - name: Build (release)
        run: cargo build --release --verbose

  # ── Rust Test ──────────────────────────────────────────────
  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    needs: rust-build
    defaults:
      run:
        working-directory: kernel
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Install sccache
        run: cargo install sccache || true

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernel
          shared-key: agentos-0.2

      - name: Run tests (with baseline lock)
        # 覆盖全插件热加载单测（invoker 的指纹/TTL/force_unload 单测在 agentos-invoker crate 内）：
        #   test_compute_plugin_fingerprint_stable_for_unchanged_dir
        #   test_compute_plugin_fingerprint_changes_on_file_edit
        #   test_is_plugin_stale_ttl_short_circuits
        #   test_force_unload_via_trait_method
        # 这些单测零外部依赖（不启 kernel/LLM），适合 CI。
        # 失败数走基线锁（.github/rust-test-baseline.txt，只许减不许增），
        # 与 Python test-batch-baseline 同构。
        run: |
          cargo test --all 2>&1 | tee /tmp/rust_test_output.txt
          python ../scripts/check_rust_test_baseline.py

  # ── E2E Manual (热加载/用户旅程实测, 需 kernel+LLM, 手动触发) ─────────────
  # 这些测试需要启动 0.2 kernel + 0.1 服务 + 真实 LLM key，不适合每次 PR 跑。
  # 用 workflow_dispatch 手动触发，或本地直接运行：
  #   python tests/manual/test_0_2_hot_reload.py            # 0.2 热加载
  #   python tests/manual/test_0_1_hot_reload.py            # 0.1 热加载
  #   python tests/manual/test_user_journey_compare.py      # 0.1 vs 0.2 对照
  e2e-manual:
    name: E2E Manual (热加载/用户旅程, 手动触发)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Document
        run: |
          echo "本 job 仅在手动触发时运行（需 kernel + LLM 环境）。"
          echo "本地运行方式见 tests/manual/ 下三个脚本的文档头。"
          echo "核心热加载逻辑已由 rust-test job 的单测覆盖（零 LLM 依赖）。"

  # ── Python Lint ────────────────────────────────────────────
  python-lint:
    name: Python Lint (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.5" "mypy>=1.10"

      - name: Ruff check
        run: ruff check .

      - name: Mypy check
        run: mypy plugins/sdk/src/agentos_plugin_sdk

  # ── Python Test ────────────────────────────────────────────
  python-test:
    name: Python Test (pytest)
    runs-on: ubuntu-latest
    needs: python-lint
    defaults:
      run:
        working-directory: plugins/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

  # ── Python Plugins Test（插件体系 + 全插件 E2E 冒烟矩阵）────────────────
  # 覆盖：
  #   1. 全部插件测试（system/tools/pipeline 目录下的 test_*.py）
  #   2. tests/plugins/ 冒烟矩阵：94 个插件（85 sidecar + 8 external_mcp + 1 native）
  #      逐个以子进程 sidecar 方式加载、注册校验、生命周期触发、精选工具真实执行
  #      （见 tests/plugins/plugin_probe.py）
  #   3. MCP 服务（bing-search/demo-tools/llm-sidecar）与 skills 清单校验
  #   4. tests/suites/ 插件单元测试矩阵（plugins + m6_plugins：路径修复 + 接口同步）
  # PYTHONPATH 与本地开发一致：plugins（插件）+ sdk（SDK 源码）
  python-plugins-test:
    name: Python Plugins Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "./plugins/sdk"

      - name: Run plugin tests + E2E smoke matrix + suite tests
        env:
          # 0.2 架构：插件运行时依赖 plugins（平铺模块）+ SDK 源码，不再需要 src/
          PYTHONPATH: ${{ github.workspace }}/plugins:${{ github.workspace }}/plugins/sdk/src
        run: |
          python -m pytest -v \
            plugins/test_system_plugins.py \
            plugins/shared/system/llm/ \
            plugins/shared/system/tasks/ \
            plugins/shared/system/test_migration_batch3.py \
            plugins/shared/tools/task/ \
            plugins/shared/tools/tests/ \
            plugins/shared/tools/builtin_tools/tests/ \
            tests/plugins/ \
            tests/suites/plugins/ \
            tests/suites/m6_plugins/

  # ── TDD Gate（变更必有测试）─────────────────────────────────
  # PR 中有源码变更时，必须有对应的测试变更（先红后绿）。
  # 纯配置/文档/前端变更豁免；纯重构可在 commit message 加 [skip-tdd] 跳过。
  # 详见 scripts/check_tdd_compliance.py
  tdd-gate:
    name: TDD Gate (变更必有测试)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史做 diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check TDD compliance
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python scripts/check_tdd_compliance.py
