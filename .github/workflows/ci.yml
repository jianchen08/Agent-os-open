# ============================================================
# CI/CD 流水线 — 灵汐 AgentOS 0.2（Rust + Python 混合）
# ============================================================
#
# 流程：代码提交 → Rust Lint → Rust Build → Rust Test → Python Lint → Python Test
#
# 触发条件：
#   - push 到 main / develop 分支
#   - Pull Request 到 main / develop 分支
#
# 缓存策略：
#   - Swatinem/rust-cache 跨 job 共享（shared-key: agentos-0.2）
#   - sccache 加速 Rust 编译（RUSTC_WRAPPER）
#
# 产出物：
#   - Rust 编译产物（debug + release）
#   - Rust 测试报告
#   - Python lint 报告
#   - Python 测试报告
# ============================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: /home/runner/.cache/sccache

jobs:
  # ── Rust Lint ──────────────────────────────────────────────
  rust-lint:
    name: Rust Lint (fmt + clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kernel
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup component add rustfmt clippy

      - name: Install sccache
        run: cargo install sccache || true

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernel
          shared-key: agentos-0.2

  # ── Rust Build ─────────────────────────────────────────────
  rust-build:
    name: Rust Build
    runs-on: ubuntu-latest
    needs: rust-lint
    defaults:
      run:
        working-directory: kernel
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Install sccache
        run: cargo install sccache || true

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernel
          shared-key: agentos-0.2

      - name: Build (debug)
        run: cargo build --verbose

      - name: Build (release)
        run: cargo build --release --verbose

  # ── Rust Test ──────────────────────────────────────────────
  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    needs: rust-build
    defaults:
      run:
        working-directory: kernel
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Install sccache
        run: cargo install sccache || true

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernel
          shared-key: agentos-0.2

      - name: Run tests
        run: cargo test --verbose --all

  # ── Python Lint ────────────────────────────────────────────
  python-lint:
    name: Python Lint (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.5" "mypy>=1.10"

      - name: Ruff check
        run: ruff check .

      - name: Mypy check
        run: mypy src/lingxi_plugin_sdk

  # ── Python Test ────────────────────────────────────────────
  python-test:
    name: Python Test (pytest)
    runs-on: ubuntu-latest
    needs: python-lint
    defaults:
      run:
        working-directory: plugins/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v
