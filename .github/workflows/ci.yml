# ============================================================
# CI/CD 流水线 — 灵汐 AgentOS 0.2（Rust + Python + 前端 + Electron）
# ============================================================
#
# 机械门禁原则（DSH quality-gates 适配，见 docs/working/机械门禁统一入口与覆盖率豁免.md）：
#   - 每个可机械检查的承诺都有非零退出命令；命令统一在
#     scripts/run_gates.py 定义一次，CI job 与本地调用同一入口（--filter），
#     不存在第二套口径。
#   - 覆盖率豁免重型套件：插件测试拆两个并行 job——python-coverage（插桩，
#     覆盖率基线锁自动守护豁免名单）+ python-heavy-suites（免插桩跑
#     94 插件子进程冒烟矩阵，正确性信号不缩水）。名单单点：
#     scripts/coverage_exempt.py。
#
# 流程：push/PR → Rust Lint → Rust Build → Rust Test / Rust Coverage
#        → SDK Lint → SDK Test → Python Coverage（插桩）/ Python Heavy（免插桩）
#        → Timing → Frontend Test/E2E → Electron Compile
#        → Pre-commit / TDD / Traceability → Python E2E（内核+LLM）
#
# 触发条件：
#   - push 到 main / dev/* 分支（实际开发分支是 dev/0.2）
#   - Pull Request 到 main / dev/* 分支
#
# 缓存策略：
#   - Swatinem/rust-cache 跨 job 共享（shared-key: agentos-0.2）
#   - sccache 加速 Rust 编译（RUSTC_WRAPPER）
# ============================================================

name: CI

on:
  push:
    branches: [main, "dev/*"]
  pull_request:
    branches: [main, "dev/*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: /home/runner/.cache/sccache
  # 门禁输出全量打印（基线锁计数等便于排查）
  AGENTOS_GATE_VERBOSE: "1"

jobs:
  # ── Rust Lint ──────────────────────────────────────────────
  rust-lint:
    name: Rust Lint (fmt + clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kernel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup component add rustfmt clippy

      - name: Install sccache (best-effort)
        run: |
          if cargo install sccache --locked 2>/dev/null && command -v sccache >/dev/null; then
            echo "sccache ready"
          else
            echo "sccache unavailable, disable RUSTC_WRAPPER"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - name: Set up Python (gate runner)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run gates (kernel-fmt, kernel-clippy)
        working-directory: ${{ github.workspace }}
        run: python scripts/run_gates.py --filter kernel-fmt,kernel-clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: kernel
          shared-key: agentos-0.2

  # ── Rust Build ─────────────────────────────────────────────
  rust-build:
    name: Rust Build
    runs-on: ubuntu-latest
    needs: rust-lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        run: rustup show
        working-directory: kernel

      - name: Install sccache (best-effort)
        run: |
          if cargo install sccache --locked 2>/dev/null && command -v sccache >/dev/null; then
            echo "sccache ready"
          else
            echo "sccache unavailable, disable RUSTC_WRAPPER"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi
        working-directory: kernel

      - name: Set up Python (gate runner)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run gates (kernel-build, kernel-build-release)
        run: python scripts/run_gates.py --filter kernel-build,kernel-build-release

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: kernel
          shared-key: agentos-0.2

  # ── Rust Test ─────────────────────────────────────────────
  # 覆盖全插件热加载单测（invoker 的指纹/TTL/force_unload 单测在 agentos-invoker crate 内）：
  #   test_compute_plugin_fingerprint_stable_for_unchanged_dir
  #   test_compute_plugin_fingerprint_changes_on_file_edit
  #   test_is_plugin_stale_ttl_short_circuits
  #   test_force_unload_via_trait_method
  # 这些单测零外部依赖（不启 kernel/LLM），适合 CI。
  # 失败数走基线锁（.github/rust-test-baseline.txt，只许减不许增）。
  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    needs: rust-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        run: rustup show
        working-directory: kernel

      - name: Install sccache (best-effort)
        run: |
          if cargo install sccache --locked 2>/dev/null && command -v sccache >/dev/null; then
            echo "sccache ready"
          else
            echo "sccache unavailable, disable RUSTC_WRAPPER"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi
        working-directory: kernel

      - name: Set up Python (gate runner + sidecar 依赖)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install SDK (config_injection 等测试 spawn 真 python sidecar)
        run: pip install -e ./plugins/sdk

      - name: Run gates (kernel-test + 失败数基线锁)
        run: python scripts/run_gates.py --filter kernel-test

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: kernel
          shared-key: agentos-0.2

  # ── Rust Coverage（line% 基线锁，只升不降）──────────────────────────────
  # cargo-llvm-cov 产出 lcov，check_rust_coverage_baseline.py 解析 line% 对照
  # .github/rust-coverage-baseline.txt。与 kernel-test 分离 = 天然双 gate 形态
  # （测试免插桩快跑 / 覆盖率插桩单独量）。invoker 的 native cdylib 插桩
  # STATUS_ACCESS_VIOLATION 用 --ignore-run-fail 容错；integration-tests 的
  # /tmp mock + 跨平台噪音用 --exclude 排除。
  rust-coverage:
    name: Rust Coverage (llvm-cov line% 基线锁 + 改动行 100%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # kernel-diff-coverage 需要完整历史做 merge-base diff
          fetch-depth: 0

      - name: Install Rust toolchain
        run: rustup show
        working-directory: kernel

      - name: sccache best-effort (装不上则禁用 wrapper)
        run: |
          if command -v sccache >/dev/null 2>&1 && sccache --version >/dev/null 2>&1; then
            echo "sccache ready"
          else
            echo "sccache unavailable, disable RUSTC_WRAPPER"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2
        with:
          tool: cargo-llvm-cov

      - name: Set up Python (gate runner)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run gates (kernel-coverage + 改动行 100%)
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python scripts/run_gates.py --filter kernel-coverage,kernel-diff-coverage

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: kernel
          shared-key: agentos-0.2

  # ── E2E Manual（手动触发占位，不跑测试）─────────────────────────────────
  # 注意：本 job 是 workflow_dispatch 占位——**不执行任何测试**，仅打印手动/本地
  # 运行说明。真正的热加载/用户旅程脚本需 0.2 kernel + 0.1 服务 + 真实 LLM key，
  # 不适合在 CI 自动跑。请用以下方式执行：
  #   - 本地：python tests/manual/test_0_2_hot_reload.py        # 0.2 热加载
  #           python tests/manual/test_0_1_hot_reload.py        # 0.1 热加载
  #           python tests/manual/test_user_journey_compare.py  # 0.1 vs 0.2 对照
  #   - 核心热加载逻辑（零 LLM 依赖）由 rust-test job 的单测覆盖。
  # 若要让本 job 真正联网跑 manual 脚本，需把下方 echo 换成实际执行命令并配置
  # kernel/LLM 环境与凭据；在此之前切勿将其列为合并必需门禁（否则等于假门禁）。
  e2e-manual:
    name: E2E Manual (占位/不跑测试, 手动触发)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Print manual run instructions (此 job 不执行测试)
        run: |
          echo "本 job 是手动触发占位，不执行任何测试（已如实标注，非合并门禁）。"
          echo "PR 级 e2e 门禁已由 frontend-e2e job 提供（零后端依赖冒烟子集 ci-smoke.spec.ts）。"
          echo "热加载/用户旅程全流程需 kernel + LLM 环境，请本地运行："
          echo "  - tests/manual/ 下脚本（0.2/0.1 热加载、用户旅程对照，见其文档头）"
          echo "  - frontend/e2e/specs/journey_*.spec.ts（需启动 kernel + 前端）"
          echo "核心热加载逻辑已由 rust-test job 的单测覆盖（零 LLM 依赖）。"


  # ── Python Lint（插件 SDK）─────────────────────────────────
  # 注：sdk-mypy 的路径参数由 run_gates.py 统一持有（cwd=plugins/sdk 下
  # mypy src/agentos_plugin_sdk）；此前 ci.yml 在 plugins/sdk 目录下误写
  # 相对路径 plugins/sdk/src/...（解析到不存在的嵌套路径），本次重构修正。
  python-lint:
    name: Python Lint (SDK ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        # 锁定安装（安全审查 2026-08-19：原浮动 pip 在线解析绕开 uv.lock，
        # 改与其它 Python job 同口径——uv sync --frozen + SDK editable）
        run: |
          uv sync --frozen --extra dev
          uv pip install -e ./plugins/sdk

      - name: Run gates (sdk-lint, sdk-mypy)
        run: python scripts/run_gates.py --filter sdk-lint,sdk-mypy

  # ── Python Test（插件 SDK）─────────────────────────────────
  python-test:
    name: Python Test (SDK pytest)
    runs-on: ubuntu-latest
    needs: python-lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: plugins/sdk
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run gates (sdk-test)
        run: python scripts/run_gates.py --filter sdk-test

  # ── Python Coverage（插桩 gate：插件测试 + 覆盖率阈值 + mypy 基线锁）──
  # 覆盖（豁免名单之外的全部）：
  #   1. 全部插件测试（system/tools/pipeline 目录下的 test_*.py）
  #   2. tests/suites/ 插件单元测试矩阵（plugins + m6_plugins：路径修复 + 接口同步）
  #   3. MCP 服务与 skills 清单校验、tests/channels/、tests/ 顶层回归/安全/时序外的
  #      有价值测试（P0 回归、isolation、security_check、track 契约、process_watchdog）
  # 豁免（scripts/coverage_exempt.py 单一名单点）：
  #   tests/plugins/test_plugin_smoke_matrix.py——94 插件子进程冒烟矩阵，
  #   子进程加载的插件代码父进程 coverage 测不到，插桩纯缴税；
  #   由 python-heavy-suites job 免插桩并排执行，正确性信号不缩水。
  # 阈值守护：fail-under=50 会自动验证豁免名单正确性——若豁免套件实际
  # 独家贡献了覆盖率，本 job 当场红（misconfiguration fails loud）。
  python-coverage:
    name: Python Coverage (插桩 + 覆盖率基线锁 + mypy 基线 + 改动行 100%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 改动行覆盖率门禁（plugins-diff-coverage）需要完整历史做 merge-base diff
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies from uv.lock (frozen, reproducible)
        # 从 uv.lock 安装根项目依赖（全量锁定、可复现构建），不再 pip 在线解析。
        # 注：plugins/sdk 是独立包（自身无锁文件、其依赖 mcp 未纳入根 uv.lock），
        # 故单独 editable 安装以补齐 SDK 源码与其依赖；根依赖均由锁文件锁定。
        run: |
          uv sync --frozen --extra dev
          uv pip install -e ./plugins/sdk

      # 门禁：plugins-coverage-pairing（名单配对校验，瞬时）
      #     + channel-copy-guard（渠道共享拷贝守卫，瞬时——channel_common 模块名
      #       黑名单不得重回 channel_* 目录，C1 合流防复发）
      #     + plugins-coverage（插桩：pytest || true 经 tee 捕获 → 失败数基线锁
      #       .github/pytest-failure-baseline.txt 只减不增 → 整体覆盖率基线锁
      #       .github/python-coverage-baseline.txt 只升不降（取代旧 fail-under=44
      #       静态地板；coverage.xml 供 diff 门禁与矩阵回填消费））
      #     + plugins-diff-coverage（改动行覆盖率 100%：PR 事件按 merge-base，
      #       push 事件查最后一个提交；[skip-diff-cov] 逃生口，ADR 2026-08-20）
      #     + plugins-mypy-baseline（plugins/shared mypy 只减不增，
      #       基线 .github/mypy-baseline.txt；uv run 保证与本地计数口径一致）
      - name: Run gates (pairing + copy-guard + coverage + diff-coverage + mypy baseline)
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python scripts/run_gates.py --filter plugins-coverage-pairing,channel-copy-guard,plugins-coverage,plugins-diff-coverage,plugins-mypy-baseline

  # ── Python Heavy Suites（免插桩 gate：重型套件并排执行）────────────────
  # 与 python-coverage 并行（无 needs 依赖）：94 插件（85 sidecar + 8
  # external_mcp + 1 native）逐个以子进程 sidecar 方式加载、注册校验、
  # 生命周期触发、精选工具真实执行（tests/plugins/plugin_probe.py）。
  # 不加 --cov：子进程执行的插件代码父进程 coverage 本就测不到，
  # 免插桩后整条车道收敛于本 job 与插桩 job 的较慢者，而非两者串行之和。
  python-heavy-suites:
    name: Python Heavy (免插桩冒烟矩阵)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies from uv.lock (frozen, reproducible)
        run: |
          uv sync --frozen --extra dev
          uv pip install -e ./plugins/sdk

      # 批 D 单轨（2026-08-19）：冒烟矩阵探针以插件 .venv 解释器 spawn（生产
      # invoker fail-closed 等价），CI 需先按各插件 uv.lock 建 venv。
      # 96+ 个 lock 全量 uv sync；缓存键含全部插件锁（setup-uv enable-cache）。
      - name: Build plugin venvs (uv sync per locked plugin)
        run: |
          uv python install 3.12
          failed=0
          for lock in $(git ls-files 'plugins/**/uv.lock' | sort -u); do
            d=$(dirname "$lock")
            echo "::group::uv sync $d"
            if ! uv sync --project "$d"; then
              echo "::error::uv sync failed: $d"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      # rust native 插件产物不入库（.gitignore *.dll/*.so），CI 冒烟矩阵的
      # test_native_plugin_json_valid 按生产同规则解析 native.artifact——
      # Linux 产物为 lib{name}.so，需先构建并落位到插件目录（本地 Windows
      # 同理由开发者 cargo build 后自持）。RUSTC_WRAPPER 置空：本 job 未装
      # sccache，全局 env 的 RUSTC_WRAPPER 指向不存在二进制会直接失败。
      - name: Build native plugin artifacts (cdylib)
        run: |
          for crate in \
            plugins/shared/pipeline/core/tool_core \
            plugins/shared/pipeline/output/sensitive_checker \
            plugins/shared/pipeline/output/spill_guard; do
            echo "::group::cargo build $crate"
            RUSTC_WRAPPER= cargo build --release --manifest-path "$crate/Cargo.toml"
            name=$(python -c "import json;print(json.load(open('$crate/plugin.json'))['native']['artifact'])")
            if [ -f "$crate/target/release/$name.dll" ]; then
              cp "$crate/target/release/$name.dll" "$crate/"
            else
              cp "$crate/target/release/lib$name.so" "$crate/"
            fi
            echo "::endgroup::"
          done

      - name: Run gates (plugins-heavy)
        run: python scripts/run_gates.py --filter plugins-heavy

  # ── 前端端点供给一致性（生成物漂移闸 + /ext/ 手写棘轮闸）──────────────
  # 插件端点 URL 唯一真值源 = 各插件 plugin.json 的 http_endpoints 声明
  # （ADR 2026-08-21 channel_api 退役：前端端点供给模型改生成式）。
  # 两条检查（scripts/check_frontend_endpoints_sync.py）：
  #   1. 漂移闸：重新生成 endpoints.generated.ts 与仓库内文件 diff 非空即红；
  #   2. 手写棘轮闸：frontend/src 的 /ext/ 字面量（排除生成物与测试断言）
  #      计数只减不增（baseline 内嵌脚本，随 channel_api 批次逐域下调）。
  # 纯 Python 检查（重新生成 + 计数），不依赖 Node/内核，独立轻量 job，
  # 与 run_gates.py 无耦合（本闸承诺由本 job 持有）。
  frontend-endpoints-sync:
    name: Frontend Endpoints Sync (生成物漂移闸 + /ext/ 手写棘轮闸)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run endpoints sync checks (drift + handwritten ratchet)
        run: python scripts/check_frontend_endpoints_sync.py

  # ── Timing Gate（关键时序不变量，独立阻塞，§9.4/§6.4）──────────────
  # 专门运行标记了 @pytest.mark.timing 的用例（事件顺序 / 间隔 / 超时边界）。
  # 与单元测试 stage 隔离运行（避免真实延迟影响主套件稳定性）；
  # 失败**直接拦截合并**，与单测同级，禁止降级为 warning 或 `|| true`。
  # 当前覆盖：isolation docker 超时边界（3）+ rate_limiter 窗口过期边界（2）。
  timing:
    name: Timing Gate (时序不变量, 独立阻塞)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies from uv.lock (frozen)
        # 需要 --extra isolation：isolation 超时测试 patch docker.from_env，
        # 需 docker 包（已在 uv.lock 内锁定）。
        run: |
          uv sync --frozen --extra dev --extra isolation
          uv pip install -e ./plugins/sdk

      - name: Run gates (timing-gate)
        run: python scripts/run_gates.py --filter timing-gate

  # ── Frontend Test（vitest 单测 + typecheck + lint）─────────────────────
  # typecheck(tsc) + lint(eslint 基线锁) + vitest 覆盖率(基线锁)。
  # vitest/eslint 存量失败走"只减不增"基线锁（.github/frontend-baseline.txt）：
  # 失败/error 数增长 → CI 红；减少或持平 → 放行。
  frontend-test:
    name: Frontend Test (tsc + lint + vitest + 改动行 100%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # frontend-diff-coverage 需要完整历史做 merge-base diff
          fetch-depth: 0

      - name: Set up Python (gate runner + 基线锁脚本)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Enable pnpm (setup-node 的 cache= pnpm 需先有 pnpm)
        run: corepack enable && pnpm --version

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (pnpm workspace,根 lock；不同步直接红——安全审查：禁 fallback 绕过锁定)
        run: pnpm install --frozen-lockfile

      - name: Run gates (typecheck + lint 基线 + coverage 基线 + 改动行 100%)
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python scripts/run_gates.py --filter frontend-typecheck,frontend-lint,frontend-coverage,frontend-diff-coverage

  # ── Frontend E2E 冒烟（零后端依赖）──────────────────────────────────────
  # PR 级 e2e 门禁：构建前端 → vite preview 服务于 5188 → 跑零外部依赖冒烟子集
  # (e2e/specs/ci-smoke.spec.ts，不依赖 kernel/LLM)。journey_* 全流程需后端，
  # 仍归本地/手动（见 e2e-manual）。
  frontend-e2e:
    name: Frontend E2E (冒烟子集, 零后端依赖)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python (gate runner)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Enable pnpm (setup-node 的 cache= pnpm 需先有 pnpm)
        run: corepack enable && pnpm --version

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (pnpm workspace,根 lock；不同步直接红——安全审查：禁 fallback 绕过锁定)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run gates (frontend-e2e-smoke)
        run: python scripts/run_gates.py --filter frontend-e2e-smoke

  # ── Electron 主进程编译门禁 ─────────────────────────────────────────────
  # electron/ 桌面壳（main/preload/tray/window-info）此前无任何 CI 覆盖。
  # tsc 编译门禁（electron:compile，与 electron:build 共用同一命令）；
  # ELECTRON_SKIP_BINARY_DOWNLOAD=1 跳过 100MB+ 二进制下载，类型检查无需它。
  electron-compile:
    name: Electron Compile (主进程 tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python (gate runner)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (跳过 Electron 二进制下载)
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci

      - name: Run gates (electron-compile)
        run: python scripts/run_gates.py --filter electron-compile

  # ── Pre-commit（项目代码质量门禁入口）────────────────────────────────
  # .pre-commit-config.yaml 自述为"项目代码质量门禁的入口"。
  # 归属说明：pre-commit 的承诺由本 job（pre-commit/action，非零退出）持有，
  # 不进 run_gates.py（避免同一承诺两个所有者）。
  pre-commit:
    name: Pre-commit (ruff + mypy + 基础检查)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  # ── TDD Gate（变更必有测试）─────────────────────────────────
  # PR 中有源码变更时，必须有对应的测试变更（先红后绿）。
  # 纯配置/文档/前端变更豁免；纯重构可在 commit message 加 [skip-tdd] 跳过。
  # 详见 scripts/check_tdd_compliance.py
  tdd-gate:
    name: TDD Gate (变更必有测试)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # 需要完整历史做 diff

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run gates (tdd-gate)
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python scripts/run_gates.py --filter tdd-gate

  # ── Traceability Gate（测试追溯标记闭环）────────────────────────────────
  # 强制每个测试文件带合法 @feature（引用闭环到 docs/test_traceability.md）。
  # 非法标记（引用不存在的功能点/愿景/审查号）→ 硬失败；
  # 未标记文件数走"只减不增"基线锁（.github/traceability-baseline.txt）。
  traceability-gate:
    name: Traceability Gate (@feature 追溯闭环)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run gates (traceability-gate)
        run: python scripts/run_gates.py --filter traceability-gate

  # ── Python 0.2 端到端（内核二进制 + 内存库 + 功能点 e2e）───────────────
  # 覆盖 tests/e2e_02 的功能点级 e2e：审批闭环、管道 chat、WS 流式全链路。
  # 依赖真实 LLM 的用例带 skipif 守卫：无 secrets.ZHIPU_API_KEY 时自动跳过。
  # 归属说明：需内核二进制 + 进程管理 + LLM key，保持 CI 专用 job 车道，
  # 不进 run_gates.py（与 pre-commit 同理，承诺由本 job 持有）。
  python-e2e:
    name: Python E2E (kernel + e2e_02)
    runs-on: ubuntu-latest
    needs: rust-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: sccache best-effort (workflow 级 RUSTC_WRAPPER 兜底)
        run: |
          if ! command -v sccache >/dev/null 2>&1; then
            echo "sccache unavailable, disable RUSTC_WRAPPER"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies + SDK
        run: |
          uv sync --frozen --extra dev
          uv pip install -e ./plugins/sdk

      # 批 D 单轨（2026-08-19）：invoker 已删 plain PATH python 回退（fail-closed），
      # 内核 boot/任务链 spawn sidecar 依赖各插件 .venv——先按 uv.lock 批量建。
      - name: Build plugin venvs (uv sync per locked plugin)
        run: |
          uv python install 3.12
          failed=0
          for lock in $(git ls-files 'plugins/**/uv.lock' | sort -u); do
            d=$(dirname "$lock")
            echo "::group::uv sync $d"
            if ! uv sync --project "$d"; then
              echo "::error::uv sync failed: $d"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      - name: Build native plugin artifacts (cdylib, Linux .so)
        run: |
          for mf in $(git ls-files 'plugins/**/plugin.json' | sort -u); do
            d=$(dirname "$mf")
            if grep -q '"native"' "$mf" && [ -f "$d/Cargo.toml" ]; then
              echo "::group::native build $d"
              (cd "$d" && cargo build --release)
              art=$(python3 -c "import json;print(json.load(open('plugin.json'))['native']['artifact'])" 2>/dev/null)
              stem="${art%.*}"
              if [ -n "$stem" ]; then
                for cand in "lib${stem}.so" "${stem}.so" "${stem}.dll"; do
                  [ -f "target/release/$cand" ] && cp "target/release/$cand" . && break
                done
              fi
              echo "::endgroup::"
            fi
          done
          ls plugins/shared/pipeline/output/spill_guard/ || true

      - name: Build kernel (release, sccache cached)
        working-directory: kernel
        run: |
          cargo install sccache --locked || true
          cargo +stable build --release --bin agentos-kernel

      - name: Start kernel (in-memory DB, :9100)
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          AGENTOS_DB_PATH=":memory:" AGENTOS_KERNEL_PORT=9100 \
            ./kernel/target/release/agentos-kernel > /tmp/kernel.log 2>&1 &
          for i in $(seq 1 150); do
            curl -sf http://localhost:9100/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -sf http://localhost:9100/health && echo " [kernel ready]" ||             { echo "===== kernel.log tail ====="; tail -60 /tmp/kernel.log; exit 1; }

      - name: Run e2e_02 (功能点 e2e；LLM 用例无 key 自动 skip)
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          # github.workspace 经 env 注入而非内插 run（安全审查：表达式内插 shell 的规范写法）
          PYTHONPATH: ${{ github.workspace }}/plugins:${{ github.workspace }}/plugins/sdk/src
        run: |
          uv run --frozen python -m pytest -q \
            tests/e2e_02/test_04_approval_flow.py \
            tests/e2e_02/test_05_pipeline_chat.py \
            tests/e2e_02/test_06_ws_stream.py

      - name: Show kernel log on failure
        if: failure()
        run: tail -60 /tmp/kernel.log
