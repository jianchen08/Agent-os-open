name: Debug shard failures
on:
  push:
    branches: [debug/**]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shard-a:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with: { enable-cache: true, cache-dependency-glob: "uv.lock" }
      - run: |
          uv sync --frozen --extra dev --extra isolation
          uv pip install -e ./plugins/sdk
      - name: Run shard a
        run: |
          T=$(mktemp)
          ( uv run --frozen python -m pytest -q plugins/test_system_plugins.py --co -q > /dev/null 2>&1 || true )
          ( uv run --frozen python -m pytest -q plugins/shared/system/llm/ plugins/shared/system/tasks/ plugins/shared/modes/ plugins/shared/pipeline/input/agent_config_load/ plugins/shared/pipeline/core/tool_core/ plugins/shared/pipeline/output/result_format/ plugins/shared/pipeline/input/mode_material_inject/ plugins/shared/pipeline/input/environment_lifecycle/ plugins/shared/pipeline/input/level_guard/ plugins/shared/pipeline/input/multimodal_preprocessor/ plugins/shared/pipeline/input/tool_schema/ plugins/shared/pipeline/output/duplicate_check/ plugins/shared/tools/task/ plugins/shared/tools/human/ plugins/shared/tools/lsp/ plugins/shared/tools/task_evaluate/ plugins/shared/tools/web_ext/ plugins/shared/tools/builtin_tools/tests/ plugins/shared/system/dsh_adapter/tests/ tests/plugins/ tests/suites/plugins/ tests/channels/ tests/gates/ --cov=plugins 2>&1 || true ) | tee "$T"
          grep -E "^(FAILED|ERROR)" "$T" | head -40 > /tmp/fails.txt || true
          grep -E "=+ .*(passed|failed|error)" "$T" | tail -2 >> /tmp/fails.txt || true
      - name: Post failures
        if: always()
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, pathlib
          body = pathlib.Path('/tmp/fails.txt').read_text(errors='replace')
          sha = os.environ["GITHUB_SHA"]; token = os.environ["GITHUB_TOKEN"]
          data = json.dumps({"body": "shard-a failures:\n```\n" + body[:50000] + "\n```"}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/jianchen08/Agent-os-open/commits/{sha}/comments",
              data=data, headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}, method="POST")
          with urllib.request.urlopen(req) as r:
              print("status", r.status)
          PYEOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
