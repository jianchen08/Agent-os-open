# -*- coding: utf-8 -*-
# VS Code 编程场景配置

scene_id: "vscode"
display_name: "编程助手"
description: "VS Code 编程场景，提供代码相关的快捷操作"
icon: "code"

quick_actions:
  - id: "explain_code"
    label: "解释代码"
    icon: "lightbulb"
    action_type: "agent"
    action_target: "code_explain"
    context_type: "selection"
    shortcut: "Ctrl+Shift+E"

  - id: "fix_bug"
    label: "修复 Bug"
    icon: "bug"
    action_type: "agent"
    action_target: "bug_fix"
    context_type: "selection"
    shortcut: "Ctrl+Shift+F"

  - id: "generate_test"
    label: "生成测试"
    icon: "test-tube"
    action_type: "workflow"
    action_target: "test_gen_flow"
    context_type: "file"

  - id: "search_code"
    label: "搜索代码"
    icon: "search"
    action_type: "tool"
    action_target: "search"
    context_type: "selection"

integrations:
  lsp:
    enabled: true
    languages: ["python", "typescript", "javascript", "go"]
    features: ["diagnostics", "completion", "hover"]

ui_config:
  position: "right"
  theme: "auto"
  compact_mode: false
