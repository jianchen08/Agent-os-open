# DSH 插件适配器配置：DSH 插件装载管理
#
# 适配器自动装载 dsh_plugins/ 下含 package.json 的 DSH 插件包目录。
# 此文件用于逐包启用/禁用（"配置 DSH 插件"）：
#   - 列出且 enabled: false 的包：跳过装载（不翻译、不出现在 dsh_list_plugins）
#   - 未列出的包：默认启用
#
# 当前装载（显式列出以便设置中心可见可操作）：
plugins:
  dsh-tool-calculator:
    enabled: true
  dsh-tool-csv:
    enabled: true
  dsh-tool-diff:
    enabled: true
  dsh-tool-json:
    enabled: true
  dsh-tool-time:
    enabled: true
  modlens:
    enabled: true
  skin-center:
    enabled: true
  ui-brand-official:
    enabled: true
  ui-theme:
    enabled: true

# ── 皮肤 CSS 补充层（主题主体走 contributes.themes 主题管线） ──────────
# 皮肤选择 = 前端主题列表选 dsh-skin-* 主题卡（原生渲染配色/背景图/基准）；
# 本字段仅控制 CSS 补充注入（皮肤 :root 装饰令牌 + 字体）。
# 可选值 = dsh_plugins/skin-center/skins/ 下的皮肤 id：
#   matrix miku mint xp minecraft harbor trading whale-song whale-mom
#   blue-fantasy dragon-heir maid-atelier(非商业许可) cyber-night furina
#   summer-liquid-glass
# 换肤 = 改此字段 → reenable dsh_adapter（或重启内核）→ 刷新前端页面。
# none / 删除字段 = 关闭注入（返回空 CSS）。
skin: dragon-heir
