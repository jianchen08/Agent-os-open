# -*- coding: utf-8 -*-
# 代码审查Agent

config_id: code_reviewer_test
name: 代码审查专家
display_name: 代码审查专家
description: |
  负责代码审查，发现潜在问题，提供改进建议。
  核心能力：代码质量评估、bug发现、规范检查。

agent_type: specialized
category: code
level: L3

system_prompt: |
  # 你是代码审查专家

  ## 核心职责
  1. 理解代码审查目标
  2. 制定审查计划
  3. 执行代码审查
  4. 输出审查报告
  5. 自评估质量（task_evaluate）

  ## 执行流程
  1. 使用 创建审查计划
  2. 使用 file_read 读取代码文件
  3. 使用 enhanced_search 搜索相关代码
  4. 分析并记录问题
  5. 使用 task_evaluate 评估审查质量

  ## 审查维度
  - 代码可读性
  - 性能考虑
  - 安全漏洞
  - 边界条件
  - 规范遵循

# 静态变量
static_vars:
  enabled: true
  items:
    - name: "行为约束"
      type: "rules"
    - name: "文档上下文规则"
      type: "path"
      path: "config/rules/document_context_rules.md"

# 动态变量
dynamic_vars:
  enabled: true
  items:
    - name: "当前时间"
      type: "timestamp"

# 工具配置
tool_ids:
- file_read
- file_write
- enhanced_search
- task_evaluate
- resource_search

# 硬约束
hard_constraints:
- 必须指出所有潜在问题
- 必须提供具体改进建议
- 审查要客观公正
- 任务执行完成后必须调用 task_evaluate 工具进行评估
- 必须输出规定的产出物
- 评估通过才能结束任务

# 软约束
soft_constraints:
- 尽量使用建设性语言
- 优先关注关键问题
- 建议添加测试用例

# 产出物
deliverables:
  - name: "review_report"
    description: "代码审查报告"
    output_path: "{{workspace}}/review_report.md"
    type: "markdown"
    required: true

# 推荐指标
recommended_metrics:
  - metric_id: file_check
    default_params:
      action: "read"
      path: "{{workspace}}/review_report.md"
  - metric_id: semantic_check
    default_params:
      criteria:
        required_sections:
          - "概述"
          - "发现的问题"
          - "改进建议"
          - "总结"

# 运行配置
version: "1.0.0"
is_active: true
status: "active"
max_iterations: 30
max_reminders: 3
timeout_seconds: 600

# 插件配置
plugins:
  disabled: []
  enabled:
    task_reminder:
      max_reminders: 3

# 标签
tags:
- code_review
- quality
- L3
- specialized

# 元数据
metadata:
  author: auto_generated
  created_at: '2026-04-14'
  capabilities:
    - code_review
    - bug_detection
    - quality_assessment
