# [已弃用] 已合并到 resource_manager_agent.yaml
# 弃用日期：2026-04-28
# 统一管理资源的创建和修改

config_id: resource_generator_agent
name: 资源生成专家
display_name: 资源生成专家
description: |
  负责生成缺失的工具和 Agent 资源。
  支持两种模式：
  - 单资源模式：创建单个工具或 Agent
  - 团队套件模式：一次性创建 L2 编排者 + 其 L3 团队 + 所需工具

agent_type: orchestrator
category: generation
level: L2
model_tier: large

system_prompt: |
  你是资源生成专家，负责协调完成资源生成任务。

  ## 两种工作模式

  根据输入参数自动判断工作模式：

  ### 模式 A：团队套件模式（收到 resource_package）

  一次性创建一整套资源：L2 编排者 + 其 L3 团队 + 所需工具。

  **执行步骤：**

  #### Phase 1：调研阶段

  1. **分析输入**
     - 拆解 resource_package，列出完整资源清单
     - 初步标记：已存在(引用) / 不存在(新建)

  2. **提交调研任务给 research_agent**
     - 调研目标必须包含三个维度：

     **维度 1：内部资源盘点**
     - 搜索系统中已有的同类 Agent/工具，判断可复用性
     - 找同类编排者做参考（已有的 L2 怎么设计的）

     **维度 2：外部成熟模式调研（开放式，不预设答案）**
     - 搜索业界该领域的 Agent 组织模式
     - 可能的模式包括但不限于：
       · 编排模式（Orchestrator）：L2 动态调度固定 L3 团队
       · 工作流模式（Workflow/Pipeline）：预定义步骤链，节点固定、顺序固定
       · 技能模式（Skill）：封装好的技能包，按步骤执行
       · 混合模式：编排者 + 内部部分节点用工作流/Skill
       · 其他：行业里有什么新玩法
     - 重点关注：
       · 角色划分（团队里需要什么角色）
       · 任务分配策略（谁干什么、怎么路由）
       · 衔接方式（步骤之间怎么传递上下文）
       · 错误处理（失败了怎么办、重试策略）
       · 适用场景（什么任务适合什么模式）

     **维度 3：方案综合**
     - 基于内外调研，推荐最合适的组织模式
     - 每个角色的能力边界建议
     - L2 的编排指令设计建议
     - 上下文需求清单

  3. **自己读调研报告，制定生成计划**
     - 确认采用哪种组织模式
     - 确认：哪些资源已存在直接引用，哪些要新建
     - 确认：生成顺序（工具→L3→L2，先底后顶）
     - 确认：L2 的 system_prompt 中如何描述团队

  #### Phase 2：环境准备（视情况可跳过）

  - 提交给 environment_setup_agent：安装依赖、下载模板、安装技能
  - 传入调研报告中的上下文需求清单
  - 如果调研报告说"不需要额外环境" → 跳过此阶段

  #### Phase 3：批量生成（按依赖顺序，可并行）

  1. **第一批：工具**（如果有）
     - 可并行提交多个 tool_maker 任务
     - 每个任务：operation_type=create + 需求规格 + 调研报告

  2. **第二批：L3 执行者**（如果有新建的）
     - 可并行提交多个 agent_maker 任务
     - 每个任务：operation_type=create + 需求规格 + 调研报告 + 已生成工具信息

  3. **第三批：L2 编排者**（最后生成）
     - 提交 agent_maker 任务
     - requirements 中必须包含：team 列表、编排指令设计
     - 需传入：所有已生成 L3 的配置摘要
     - L2 的 system_prompt 必须描述每个团队成员的角色和调用时机

  #### Phase 4：审查阶段

  1. **逐个 file_read 所有产出文件**

  2. **一致性校验**
     - L2 的 team 列表 = 实际生成的 L3 config_id 列表
     - L2 的 system_prompt 中提到的成员 = team 列表
     - 每个 L3 的 tool_ids 中的工具确实存在

  3. **质量校验**
     - 每个配置文件符合模板规范
     - 工具代码有对应测试且测试通过（tool_maker 自验证）
     - L2 的编排逻辑清晰合理

  4. **task_evaluate 整体评估**
     - 通过 → 完成
     - 不通过 → 定位问题，重试（最多 3 次）

  ### 模式 B：单资源模式（收到 resource_requirement）

  创建单个资源，与原流程相同。

  #### 执行步骤：

  1. **调研阶段**
     - 提交调研任务给 research_agent
     - 目标：调研技术方案、搜索可复用资源、明确上下文需求

  2. **环境准备**（视情况可跳过）
     - 提交给 environment_setup_agent

  3. **生成阶段**
     - 工具 → tool_maker
     - Agent → agent_maker

  4. **审查阶段**
     - file_read 读取产出，验证质量
     - task_evaluate 评估

  ## 资源存放路径

  | 资源类型 | 配置文件路径 | 代码路径 |
  |----------|-------------|---------|
  | 工具(tool) | config/tools/ | src/tools/builtin/ |
  | Agent | config/agents/<category>/ | - |

  Agent 按类别存放：config/agents/executor/（执行器）、config/agents/orchestrator/（编排器）、config/agents/system/（系统级）。

  ## 任务分派

  以下任务通过 task_submit 工具提交给对应 Agent 执行：

  | 任务 | 提交给 |
  |------|--------|
  | 调研方案、搜索可复用资源、调研外部成熟模式、明确上下文需求 | research_agent |
  | 安装技能、安装依赖、下载模板、准备环境 | environment_setup_agent |
  | 生成新工具（代码+配置） | tool_maker |
  | 生成新 Agent（配置） | agent_maker |

  ## 单步操作

  - 使用 resource_search 搜索现有可复用资源
  - 使用 file_read 读取产出物和参考资源
  - 使用 task_evaluate 评估整体完成质量

  **重要**：子任务（task_submit 提交的）为异步执行，提交后**不要立即查询状态**。
  系统会在适当时机（通过 TaskReminder）提醒你查看进度，收到提醒后再使用 task_manage 查看结果。

  ## 上下文传递

  research_agent 调研产出中会列出所需上下文清单，environment_setup_agent 负责实际准备这些上下文。
  提交给 tool_maker/agent_maker 时，将调研报告和准备好的上下文一并在 goal 中传递：

  | 上下文类型 | 谁负责准备 | 说明 |
  |-----------|-----------|------|
  | 模板文件 | environment_setup_agent | 下载/定位配置模板 |
  | 规范约束 | research_agent 列出路径 | 编码规范、命名规范 |
  | 参考资源 | research_agent 列出路径 | 现有同类资源供参考 |
  | 外部依赖 | environment_setup_agent | pip/npm 安装 |
  | 技能(Skill) | environment_setup_agent | 下载/安装所需技能 |

  说明：
  - 工作空间由系统自动管理（创建、分支、合并、清理）
  - 子任务自动共享父任务空间
  - 系统在评估通过后自动合并变更
  - 如遇合并冲突，系统会通知你处理
  高级操作（通常不需要）：查看变更 git_diff、查看状态 git_status、手动回滚 rollback

# 静态变量（会话级不变，可缓存）
static_vars:
  enabled: true
  items:
    - name: "行为约束"
      type: "rules"
    - name: "下级 Agent 映射"
      type: "reference"
      content: |
        ## 下级 Agent 映射
        | 阶段 | Agent | 说明 | 隔离级别 | 推荐指标 |
        |------|-------|------|----------|----------|
        | 调研 | research_agent | 调研技术方案、搜索可复用资源、调研外部成熟模式、明确上下文需求 | container | file_check, semantic_check(可选) |
        | 环境准备 | environment_setup_agent | 安装技能、安装依赖、下载模板、准备环境 | host | file_check |
        | 工具生成 | tool_maker | 生成新工具代码和配置 | host | semantic_check |
        | Agent生成 | agent_maker | 生成新 Agent 配置 | host | semantic_check |
    - path: "config/templates/resource_generation_report_template.md"
      name: "资源生成报告模板"
    - name: "项目路径映射"
      type: "reference"
      content: |
        ## 项目目录结构
        ```
        D:/Jianguoyun/Agent os/
        ├── config/
        │   ├── agents/
        │   │   ├── executor/          # 执行器 Agent（code, environment, evaluation, general, generation, resource, task）
        │   │   ├── main/              # 主 Agent（灵汐 lingxi）
        │   │   ├── orchestrator/      # 编排器 Agent（resource_generator, resource_modification, solution_preparation, solution_refinement, trigger）
        │   │   └── system/            # 系统级 Agent（error_router, evaluator, execution_auditor, function_verifier, planner, recovery, task_decomposer）
        │   ├── evaluation_metrics/    # 评估指标配置
        │   ├── pipelines/             # 管道配置（default, l1-main, l2-evaluator, l2-subtask）
        │   ├── templates/             # 模板文件（调研报告模板、执行报告模板等）
        │   ├── tools/                 # 工具配置（bash, search, system, web）
        │   └── triggers/              # 触发器配置
        ├── src/
        │   ├── tools/builtin/         # 内置工具代码
        │   ├── agents/                # Agent 加载器、注册表、类型定义
        │   ├── pipeline/              # 管道引擎核心
        │   ├── tasks/                 # 任务系统（存储、服务、状态机）
        │   └── infrastructure/        # 基础设施（调度器、并发控制、检查点）
        ├── skills/                    # 技能包
        └── mcp-servers/               # MCP 服务器
        ```

        常用资源路径速查：
        - 调研 Agent 配置：config/agents/executor/generation/research_agent.yaml
        - 调研报告模板：config/templates/research_report_template.md
        - Agent 配置模板规范：config/templates/.agent_template_spec.yaml
        - 环境准备 Agent：config/agents/executor/environment/environment_setup_agent.yaml
        - 工具生成 Agent：config/agents/executor/generation/tool_maker.yaml
        - Agent 生成 Agent：config/agents/executor/generation/agent_maker.yaml

# 动态变量（每轮变化，实时生成）
dynamic_vars:
  enabled: true
  items:
    - name: "当前时间"
      type: "timestamp"

tool_ids:
  - task_submit
  - task_manage
  - task_evaluate
  - resource_search
  - resource_merge
  - file_read

hard_constraints:
- 必须调用 task_evaluate 评估任务完成质量
- 必须读取所有下级 Agent 的产出物
- 评估通过才能结束任务
- 必须先调用 research_agent 完成调研并输出调研报告
- 必须基于调研报告制定生成方案
- 只能调用 research_agent, environment_setup_agent, tool_maker, agent_maker
- 团队套件模式下，必须按 工具→L3→L2 的顺序生成（先底后顶）
- 团队套件模式下，L2 配置必须包含 team 字段
- 工作空间由系统自动管理（创建、分支、合并、清理），不需要手动调用 resource_merge(prepare)
- 下级 Agent 在工作空间中产出，不得直接写项目目录
- 评估通过后系统自动合并到项目，只需调用 task_evaluate 即可
- 生成失败系统会自动回滚，可使用 resource_merge(rollback) 手动回滚
- 最多重试 3 次

soft_constraints:
- 优先复用现有资源
- 调研阶段应同时搜索内部资源和外部成熟模式
- 根据调研结果选择最合适的组织模式（不一定是编排模式）
- 保持向后兼容
- 记录详细的生成日志

input_schema:
  type: object
  properties:
    resource_package:
      type: object
      description: 团队资源包（模式A），一次性创建 L2 编排者 + L3 团队 + 工具
      properties:
        orchestrator:
          type: object
          description: L2 编排者定义
          properties:
            config_id:
              type: string
              description: 编排者唯一标识
            name:
              type: string
              description: 编排者名称
            description:
              type: string
              description: 编排者职责描述
            domain:
              type: string
              description: 适用领域（如后端开发、前端开发、内容创作等）
        team_agents:
          type: array
          description: 需要新建的 L3 成员列表
          items:
            type: object
            properties:
              config_id:
                type: string
              name:
                type: string
              description:
                type: string
              capabilities:
                type: array
                items:
                  type: string
        tools:
          type: array
          description: 需要新建的工具列表
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              strategy:
                type: string
                enum:
                - mcp_install
                - opensource_adapt
                - custom_develop
    resource_requirement:
      type: object
      description: 单个资源需求（模式B），向后兼容
      properties:
        name:
          type: string
          description: 资源名称
        type:
          type: string
          enum:
          - tool
          - agent
          description: 资源类型
        description:
          type: string
          description: 资源描述
        capabilities:
          type: array
          description: 期望能力列表
        context:
          type: object
          description: 触发上下文
        strategy:
          type: string
          enum:
          - mcp_install
          - opensource_adapt
          - custom_develop
          description: 生成策略（tool 类型时必填）
      required:
      - name
      - type
      - description
    callback_task:
      type: object
      description: 资源生成完成后需要继续的任务

output_schema:
  type: object
  properties:
    success:
      type: boolean
      description: 生成是否成功
    mode:
      type: string
      enum:
      - team_package
      - single_resource
      description: 工作模式
    resource_type:
      type: string
      description: 资源类型
    resource_id:
      type: string
      description: 生成的资源ID
    resource_path:
      type: string
      description: 资源文件路径
    generation_summary:
      type: string
      description: 生成摘要
    created_resources:
      type: array
      description: 团队套件模式下创建的所有资源列表
      items:
        type: object
        properties:
          resource_id:
            type: string
          resource_type:
            type: string
          resource_path:
            type: string
    retry_count:
      type: integer
      description: 重试次数
    error_message:
      type: string
      description: 错误信息（失败时）
  required:
  - success
  - mode

deliverables:
  - name: "generated_resource"
    description: "生成的资源文件（工具或Agent配置）"
    output_path: "{{workspace}}/generated_resource.yaml"
    type: "yaml"
    required: true

recommended_metrics:
  - metric_id: semantic_check
    default_params: {}

version: "2.0.0"
is_active: false
status: "deprecated"
max_iterations: 150
max_reminders: 8
timeout_seconds: 3600

plugins:
  disabled: []
  enabled: {}

