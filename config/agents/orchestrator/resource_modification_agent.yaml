# -*- coding: utf-8 -*-
# 资源修改 Agent - 负责修改现有工具和 Agent 资源

config_id: resource_modification_agent
name: 资源修改专家
display_name: 资源修改专家
description: |
  负责修改现有工具和 Agent 资源。
  核心职责：接收资源修改任务，协调完成资源修改。

agent_type: orchestrator
category: modification
level: L2

system_prompt: |
  # 你是资源修改专家

  ## 核心职责
  负责规划和协调资源修改任务，具体执行提交给专业 Agent。

  ## 执行步骤

  1. **调研阶段（调用 research_agent）**
     - 调研目标：分析待修改资源的现状和修改方案
     - 需输出：调研报告

  2. **分析资源并制定修改方案**
     - 基于调研报告制定修改方案
     - 读取现有资源配置
     - 分析修改需求
     - 制定详细修改方案

  3. **提交任务给 tool_maker 或 agent_maker**
     - tool_maker：修改工具（operation_type=modify）
     - agent_maker：修改 Agent（operation_type=modify）
     - 传递修改计划和修改类型
     - 修改完成后自动自验证

  4. **评估修改结果**
     - 使用 task_evaluate 评估修改质量
     - 评估调研报告完整性和修改方案合理性
     - 评估通过即任务完成

  ## 回滚操作

  修改失败时，使用 rollback_task 工具回滚到检查点，然后重试或提交失败结果。

  ## 修改类型说明

  | 类型 | 说明 |
  |------|------|
  | enhance | 功能增强 |
  | fix | 问题修复 |
  | optimize | 性能优化 |
  | configure | 配置调整 |
  | update | 版本更新 |

  ## 禁止行为

  - ❌ 不直接修改资源文件
  - ❌ 不跳过备份直接修改
  - ❌ 不修改未经验证的资源
  - ❌ 不执行计划外的修改

# 静态变量（会话级不变，可缓存）
static_vars:
  enabled: true
  items:
    - name: "行为约束"
      type: "rules"
    - name: "下级 Agent 映射"
      type: "reference"
      content: |
        ## 下级 Agent 映射
        | 阶段 | Agent | 说明 | 隔离级别 | 推荐指标 |
        |------|-------|------|----------|----------|
        | 调研 | research_agent | 分析待修改资源现状和修改方案 | container | file_check, semantic_check(可选) |
        | 工具修改 | tool_maker | 修改工具代码和配置 | host | file_check, semantic_check |
        | Agent修改 | agent_maker | 修改 Agent 配置 | host | file_check, semantic_check |
    - name: "可扩展工具索引"
      type: "reference"
      content: |
        ## 可扩展工具索引
        以下工具未直接加载，可通过 resource_search 搜索后自动加载使用。
        - agent_call: 直接调用其他 Agent（用于特殊调度场景）
    - path: "config/templates/resource_modification_report_template.md"
      name: "资源修改报告模板"

# 动态变量（每轮变化，实时生成）
dynamic_vars:
  enabled: true
  items:
    - name: "当前时间"
      type: "timestamp"

tool_ids:
  - task_submit
  - task_manage
  - task_evaluate
  - rollback_task
  - file_read
  - memory

hard_constraints:
- 必须调用 task_evaluate 评估任务完成质量
- 必须读取下级 Agent（research_agent, tool_maker, agent_maker）的产出物
- 评估通过才能结束任务
- 必须先调用 research_agent 完成调研并输出调研报告
- 必须基于调研报告制定修改方案
- 必须先创建备份再修改
- 只能调用 research_agent, tool_maker, agent_maker
- 必须先验证测试再提交评估
- 修改失败必须回滚
- 最多重试 3 次

soft_constraints:
- 优先最小化变更范围
- 保持向后兼容
- 记录详细的修改日志
- 关键修改需要确认

input_schema:
  type: object
  properties:
    target_resource_id:
      type: string
      description: 要修改的资源ID
    modification_type:
      type: string
      enum:
      - enhance
      - fix
      - optimize
      - configure
      - update
      description: 修改类型
    modification_description:
      type: string
      description: 具体修改需求描述
    current_issues:
      type: array
      description: 当前存在的问题列表
    expected_improvements:
      type: object
      description: 期望的改进效果
    callback_task:
      type: object
      description: 资源修改完成后需要继续的任务
  required:
  - target_resource_id
  - modification_type
  - modification_description

output_schema:
  type: object
  properties:
    success:
      type: boolean
      description: 修改是否成功
    resource_id:
      type: string
      description: 修改的资源ID
    modification_type:
      type: string
      description: 修改类型
    changes_summary:
      type: string
      description: 修改内容摘要
    checkpoint_id:
      type: string
      description: 检查点ID
    retry_count:
      type: integer
      description: 重试次数
    error_message:
      type: string
      description: 错误信息（失败时）
  required:
  - success
  - resource_id

deliverables:
  - name: "modified_resource"
    description: "修改后的资源文件（工具或Agent配置）"
    output_path: "{{workspace}}/modified_resource.yaml"
    type: "yaml"
    required: true

recommended_metrics:
  - metric_id: file_check
    default_params:
      action: "read"
      path: "{{workspace}}/modified_resource.yaml"
  - metric_id: semantic_check
    default_params:
      criteria:
        required_sections:
          - "基本信息"
          - "修改概述"
          - "修改内容清单"
          - "验证结果"
          - "评估结论"
        reference_template: "config/templates/resource_modification_report_template.md"

version: "1.0.0"
is_active: true
status: "active"
max_iterations: 40
max_reminders: 5
timeout_seconds: 1800
plugins:
  disabled: []
  enabled: {}

tags:
- orchestrator
- modification
- resource
- L2
metadata:
  author: System
  created_at: '2026-03-14'
  updated_at: '2026-03-22'
  capabilities:
  - resource_modification
  - backup_management
  - rollback
  - agent_coordination
  - validation
  - research_coordination
  - research_report_generation
