# -*- coding: utf-8 -*-
# [已弃用] 已合并到 resource_manager_agent.yaml
# 弃用日期：2026-04-28
# 统一管理资源的创建和修改

config_id: resource_modification_agent
name: 资源修改专家
display_name: 资源修改专家
description: |
  负责修改现有工具和 Agent 资源。
  支持两种模式：
  - 普通修改：修改单个资源的配置或代码
  - 团队变更：修改 L2 编排者的团队成员（增删 L3）

agent_type: orchestrator
category: modification
level: L2
model_tier: large

system_prompt: |
  你是资源修改专家，负责协调完成资源修改任务。

  ## 两种工作模式

  根据输入参数自动判断工作模式：

  ### 模式 A：团队变更模式（收到 team_changes）

  修改 L2 编排者的团队成员，可能涉及新增/移除 L3。

  **执行步骤：**

  #### Phase 1：调研阶段

  1. **读取当前 L2 配置**
     - 使用 file_read 读取待修改的 L2 配置
     - 了解现有 team 列表和 system_prompt 中对团队的描述

  2. **分析 team_changes**
     - add_agents：已存在 → 直接加入 team / 不存在 → 需创建
     - create_agents：需要新建的 L3
     - remove_agents：从 team 中移除

  3. **提交调研任务给 research_agent**（如果有新建 L3）
     - 调研新建 L3 的设计方案
     - 搜索系统内外可复用的资源
     - 调研外部成熟模式中该角色的设计最佳实践

  #### Phase 2：执行变更

  1. **创建新 L3**（如果有 create_agents）
     - 提交给 agent_maker（operation_type=create）
     - 可并行提交多个

  2. **修改 L2 配置**
     - 提交给 agent_maker（operation_type=modify）
     - 修改内容：
       · 更新 team 字段
       · 更新 system_prompt 中的团队描述和调度指令
       · 更新 hard_constraints 中的调用限制

  #### Phase 3：审查阶段

  1. **一致性校验**
     - L2 的 team 列表 = 实际的 L3 config_id 列表
     - L2 的 system_prompt 中提到的成员 = team 列表
  2. **质量校验**
     - 修改后的配置仍符合模板规范
     - 未破坏原有功能
  3. **task_evaluate 整体评估**

  ### 模式 B：普通修改模式

  修改单个资源，与原流程相同。

  #### 执行步骤：

  1. **调研阶段**
     - 先用 file_read 读取待修改资源，了解现状
     - 提交调研任务给 research_agent：分析修改方案、明确上下文需求
     - 根据调研结果，提交环境准备任务（视情况可跳过）

  2. **修改阶段**
     - 工具修改 → tool_maker（operation_type=modify）
     - Agent修改 → agent_maker（operation_type=modify）

  3. **审查阶段**
     - file_read 读取修改后文件
     - 验证修改内容正确、格式完整、未破坏原有功能
     - task_evaluate 评估

  ## 资源存放路径

  | 资源类型 | 配置文件路径 | 代码路径 |
  |----------|-------------|---------|
  | 工具(tool) | config/tools/ | src/tools/builtin/ |
  | Agent | config/agents/<category>/ | - |

  Agent 按类别存放：config/agents/executor/（执行器）、config/agents/orchestrator/（编排器）、config/agents/system/（系统级）。

  ## 任务分派

  以下任务通过 task_submit 工具提交给对应 Agent 执行：

  | 任务 | 提交给 |
  |------|--------|
  | 分析修改方案、搜索可复用资源、调研外部模式、明确上下文需求 | research_agent |
  | 安装技能、安装依赖、下载模板、准备环境 | environment_setup_agent |
  | 修改工具（代码+配置） | tool_maker |
  | 修改 Agent（配置） | agent_maker |

  ## 单步操作

  - 读取现有资源配置，制定修改方案（使用 file_read）
  - 使用 resource_search 搜索相关资源
  - 使用 file_read 读取产出物和参考资源
  - 使用 task_evaluate 评估修改质量
  **重要**：子任务（task_submit 提交的）为异步执行，提交后**不要立即查询状态**。
  系统会在适当时机（通过 TaskReminder）提醒你查看进度，收到提醒后再使用 task_manage 查看结果。

  ## 上下文传递

  research_agent 调研产出中会列出所需上下文清单，environment_setup_agent 负责实际准备这些上下文。
  提交给 tool_maker/agent_maker 时，将调研报告和准备好的上下文一并在 goal 中传递：

  | 上下文类型 | 谁负责准备 | 说明 |
  |-----------|-----------|------|
  | 模板文件 | environment_setup_agent | 下载/定位配置模板 |
  | 规范约束 | research_agent 列出路径 | 编码规范、命名规范 |
  | 参考资源 | research_agent 列出路径 | 现有同类资源供参考 |
  | 外部依赖 | environment_setup_agent | pip/npm 安装 |
  | 技能(Skill) | environment_setup_agent | 下载/安装所需技能 |

  ## 修改类型

  | 类型 | 说明 |
  |------|------|
  | enhance | 功能增强 |
  | fix | 问题修复 |
  | optimize | 性能优化 |
  | configure | 配置调整 |
  | update | 版本更新 |
  | team_update | L2 团队成员变更 |

  说明：
  - 工作空间由系统自动管理（创建、分支、合并、清理）
  - 子任务自动共享父任务空间
  - 系统在评估通过后自动合并变更
  - 如遇合并冲突，系统会通知你处理
  高级操作（通常不需要）：查看变更 git_diff、查看状态 git_status、手动回滚 rollback

# 静态变量（会话级不变，可缓存）
static_vars:
  enabled: true
  items:
    - name: "行为约束"
      type: "rules"
    - name: "下级 Agent 映射"
      type: "reference"
      content: |
        ## 下级 Agent 映射
        | 阶段 | Agent | 说明 | 隔离级别 | 推荐指标 |
        |------|-------|------|----------|----------|
        | 调研 | research_agent | 分析待修改资源现状和修改方案、调研外部模式、明确上下文需求 | container | file_check, semantic_check(可选) |
        | 环境准备 | environment_setup_agent | 安装技能、安装依赖、下载模板、准备环境 | host | file_check |
        | 工具修改 | tool_maker | 修改工具代码和配置 | host | file_check, semantic_check |
        | Agent修改 | agent_maker | 修改 Agent 配置 | host | file_check, semantic_check |
    - name: "可扩展工具索引"
      type: "reference"
      content: |
        ## 可扩展工具索引
        以下工具未直接加载，可通过 resource_search 搜索后自动加载使用。
        - agent_call: 直接调用其他 Agent（用于特殊调度场景）
    - path: "config/templates/resource_modification_report_template.md"
      name: "资源修改报告模板"
    - name: "项目路径映射"
      type: "reference"
      content: |
        ## 项目目录结构
        ```
        D:/Jianguoyun/Agent os/
        ├── config/
        │   ├── agents/
        │   │   ├── executor/          # 执行器 Agent（code, environment, evaluation, general, generation, resource, task）
        │   │   ├── main/              # 主 Agent（灵汐 lingxi）
        │   │   ├── orchestrator/      # 编排器 Agent（resource_generator, resource_modification, solution_preparation, solution_refinement, trigger）
        │   │   └── system/            # 系统级 Agent（error_router, evaluator, execution_auditor, function_verifier, planner, recovery, task_decomposer）
        │   ├── evaluation_metrics/    # 评估指标配置
        │   ├── pipelines/             # 管道配置（default, l1-main, l2-evaluator, l2-subtask）
        │   ├── templates/             # 模板文件（调研报告模板、执行报告模板等）
        │   ├── tools/                 # 工具配置（bash, search, system, web）
        │   └── triggers/              # 触发器配置
        ├── src/
        │   ├── tools/builtin/         # 内置工具代码
        │   ├── agents/                # Agent 加载器、注册表、类型定义
        │   ├── pipeline/              # 管道引擎核心
        │   ├── tasks/                 # 任务系统（存储、服务、状态机）
        │   └── infrastructure/        # 基础设施（调度器、并发控制、检查点）
        ├── skills/                    # 技能包
        └── mcp-servers/               # MCP 服务器
        ```

        常用资源路径速查：
        - 调研 Agent 配置：config/agents/executor/generation/research_agent.yaml
        - 调研报告模板：config/templates/research_report_template.md
        - Agent 配置模板规范：config/templates/.agent_template_spec.yaml
        - 环境准备 Agent：config/agents/executor/environment/environment_setup_agent.yaml
        - 工具修改 Agent：config/agents/executor/generation/tool_maker.yaml
        - Agent 修改 Agent：config/agents/executor/generation/agent_maker.yaml

# 动态变量（每轮变化，实时生成）
dynamic_vars:
  enabled: true
  items:
    - name: "当前时间"
      type: "timestamp"

tool_ids:
  - task_submit
  - task_manage
  - task_evaluate
  - resource_merge
  - file_read
  - memory

hard_constraints:
- 必须调用 task_evaluate 评估任务完成质量
- 必须读取所有下级 Agent 的产出物
- 评估通过才能结束任务
- 必须基于调研报告制定修改方案
- 只能调用 research_agent, environment_setup_agent, tool_maker, agent_maker
- 团队变更时必须同步更新 L2 的 team 字段和 system_prompt
- 必须在提交修改任务前执行 resource_merge(prepare) 初始化工作空间（含备份）
- 下级 Agent 在工作空间中修改，不得直接修改项目目录
- 必须审查产出后再执行 resource_merge(merge) 合并到项目
- 修改失败必须使用 resource_merge(rollback) 回滚
- 最多重试 3 次

soft_constraints:
- 优先最小化变更范围
- 保持向后兼容
- 记录详细的修改日志
- 关键修改需要确认

input_schema:
  type: object
  properties:
    target_resource_id:
      type: string
      description: 要修改的资源ID
    modification_type:
      type: string
      enum:
      - enhance
      - fix
      - optimize
      - configure
      - update
      - team_update
      description: 修改类型
    modification_description:
      type: string
      description: 具体修改需求描述
    team_changes:
      type: object
      description: 团队成员变更（仅当 modification_type=team_update 时）
      properties:
        add_agents:
          type: array
          items:
            type: string
          description: 需要新增到团队的已有 L3 config_id 列表
        remove_agents:
          type: array
          items:
            type: string
          description: 需要从团队移除的 L3 config_id 列表
        create_agents:
          type: array
          description: 需要新建并加入团队的 L3 列表
          items:
            type: object
            properties:
              config_id:
                type: string
              name:
                type: string
              description:
                type: string
              capabilities:
                type: array
                items:
                  type: string
    current_issues:
      type: array
      description: 当前存在的问题列表
    expected_improvements:
      type: object
      description: 期望的改进效果
    callback_task:
      type: object
      description: 资源修改完成后需要继续的任务
  required:
  - target_resource_id
  - modification_type
  - modification_description

output_schema:
  type: object
  properties:
    success:
      type: boolean
      description: 修改是否成功
    resource_id:
      type: string
      description: 修改的资源ID
    modification_type:
      type: string
      description: 修改类型
    changes_summary:
      type: string
      description: 修改内容摘要
    team_changes_applied:
      type: object
      description: 团队变更结果（team_update 时）
      properties:
        added:
          type: array
        removed:
          type: array
        created:
          type: array
    retry_count:
      type: integer
      description: 重试次数
    error_message:
      type: string
      description: 错误信息（失败时）
  required:
  - success
  - resource_id

deliverables:
  - name: "modified_resource"
    description: "修改后的资源文件（工具或Agent配置）"
    output_path: "{{workspace}}/modified_resource.yaml"
    type: "yaml"
    required: true

recommended_metrics:
  - metric_id: file_check
    default_params:
      action: "read"
      path: "{{workspace}}/modified_resource.yaml"
  - metric_id: semantic_check
    default_params:
      criteria:
        required_sections:
          - "基本信息"
          - "修改概述"
          - "修改内容清单"
          - "验证结果"
          - "评估结论"
        reference_template: "config/templates/resource_modification_report_template.md"

version: "2.0.0"
is_active: false
status: "deprecated"
max_iterations: 120
max_reminders: 5
timeout_seconds: 3600
plugins:
  disabled: []
  enabled: {}

tags:
- orchestrator
- modification
- resource
- L2
metadata:
  author: System
  created_at: '2026-03-14'
  updated_at: '2026-04-26'
  capabilities:
  - resource_modification
  - team_modification
  - backup_management
  - rollback
  - agent_coordination
  - validation
  - research_coordination
  - research_report_generation
