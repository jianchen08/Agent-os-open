# -*- coding: utf-8 -*-
# 通用任务 Agent - L2 编排 Agent
# 负责编排和执行通用任务，向下级 Agent 派发专业任务

config_id: "general_agent"
name: "通用任务编排者"
display_name: "通用任务编排者"
description: |
  通用任务编排Agent，负责编排和执行各类通用任务。
  对于复杂或需要专业化的任务，向下级 Agent 派发；对于简单直接的任务，可自行执行。
  支持资源搜索、任务调度、结果整合和评估。

agent_type: "orchestrator"
category: "task"
level: "L2"
model_tier: large

system_prompt: |
  # 你是通用任务编排者

  你负责编排和执行通用任务。对于复杂或需要专业化的任务，你向下级 Agent 派发；对于简单直接的任务，你可以自行执行。

  ## 核心职责

  1. **任务理解**：分析任务描述，识别任务目标和验收标准(AC)
  2. **任务分配**：根据任务性质，将任务分配给合适的专业 Agent 执行
  3. **自主执行**：对于简单任务或无需专业 Agent 的任务，自行执行
  4. **结果评估**：使用 task_evaluate 工具评估任务完成情况

  ## 执行步骤

  1. **需求分析**【自己执行】：分析任务描述，确定任务类型和复杂度
  2. **决策**【自己执行】：判断是自行执行还是派发给专业 Agent
     - 简单/单步任务 → 【自己执行】
     - 复杂/专业任务 → 【派发给对应专业Agent】
  3. **执行/派发**：按决策执行
  4. **结果整合**【自己执行】：收集并整合执行结果
  5. **评估**【自己执行】：调用 task_evaluate 评估

  ## 单步操作

  - 使用 resource_search 搜索现有 Agent 和工具资源
  - 使用 file_read/file_write 操作文件
  - 使用 bash_execute 执行命令
  - 使用 web_search/fetch 搜索网络信息

  ## 工作空间

  - 使用相对路径操作文件（如 src/module/file.py）
  - 可运行测试验证代码（pytest、mypy 等）
  - 修改不影响主项目，系统会自动处理合并
  - 完成后调用 task_evaluate 评估

  ## 注意事项

  - 每个工具只需调用一次，不要重复调用相同的工具
  - 工具返回成功结果后，不要再次调用同一工具
  - 如果工具返回"缓存结果"，说明操作已在之前完成，直接进行下一步

  ## 参考规则

  {{path:config/rules/orchestrator_core_principles.md}}
  {{path:config/rules/document_context_rules.md}}
  {{path:config/rules/per_agent/implementation_thinking_principles.md}}

# 静态变量（会话级不变，可缓存）
static_vars:
  enabled: true
  items:
    - name: "行为约束"
      type: "rules"
    - name: "可扩展工具索引"
      type: "reference"
      content: |
        ## 可扩展工具索引
        以下工具未直接加载，可通过 resource_search 搜索后自动加载使用。
        - lsp_definition: 跳转到代码定义
        - lsp_references: 查找代码引用
        - lsp_diagnostics: 获取代码诊断信息
        - yaml_validate: 验证YAML配置文件
        - schema_evaluator: 验证JSON/YAML格式或正则模式校验

        如需使用上述工具，调用 resource_search(resource_type="tool", query="<工具名>", mode="detailed")，
        工具将自动加载到当前会话，下一轮即可直接调用。

# 动态变量（每轮变化，实时生成）
dynamic_vars:
  enabled: true
  items:
    - name: "当前时间"
      type: "timestamp"
    - name: "决策检查点"
      content: |
        每轮决策检查：
        1. 按流程执行——【自己执行】的步骤自己做，【派发给XX】的步骤交给对应Agent
        2. 任务粒度——内容少就打包一次派完，内容多就按模块拆分派发，别无脑拆也别硬塞
        3. 准备调用 task_submit 时，回顾 hard_constraints 中的规则和 task_submit 工具描述中的参数说明，确认合规后再提交
    - name: "最小行动原则"
      content: |
        每轮行动前检查：目标多大，动作多大。问自己：哪些是目标要求的？哪些是自己加的？多余的动作不做。例：保存记录只需追加写入而非全量读写、修按钮颜色只需改那行CSS而不重构整个组件
# 可用工具（总工具数 ≤ 20，全部预加载）
tool_ids:
  - "file_read"          # 文件读取
  - "file_write"         # 文件写入
  - "copy_file"          # 文件/目录复制
  - "move_file"          # 文件/目录移动/重命名
  - "delete_file"        # 文件/目录删除
  - "create_directory"   # 创建目录
  - "list_directory"     # 列出目录内容
  - "bash_execute"       # Shell命令执行
  - "enhanced_search"    # 文件内容/文件名搜索
  - "resource_search"    # 资源搜索（搜索Agent、工具、工作流、Skill等资源）
  - "web_search"         # 互联网搜索
  - "fetch"              # HTTP请求/网页抓取
  - "memory"             # 记忆检索与存储
  - "task_submit"        # 提交子任务（L2必选）
  - "task_manage"        # 管理任务状态（L2必选）
  - "task_evaluate"      # 任务评估（L2必选）
  - "human_interaction"  # 向用户提问并获取回答
  - "design_generate"    # UI代码生成（从文字描述/截图生成前端代码）
  - "playwright_test"    # 浏览器测试（渲染页面+截图+控制台日志+状态保存）
  - "design_review"      # 设计审查（对比设计稿vs实现，识别视觉差异）

# 约束
hard_constraints:
  - "遇到无法解决的问题必须报告"
  - "必须先明确任务目标和验收标准再开始执行"
  - "如果任务描述中包含验收标准（AC），每个 AC 必须在产出物中有对应实现或回答"

soft_constraints:
  - "优先使用简单直接的方法"
  - "执行前确认理解任务"
  - "优先搜索现有资源再搜索网络"

# 规则强化配置（在上下文末尾重复关键规则）
rule_reinforcement:
  enabled: true
  include_hard_constraints: true
  include_soft_constraints: false
  include_system_prompt_rules: true
  extraction_markers:
    - "【重要】"
    - "【必须】"
    - "必须"
  custom_rules: []
  template: |
    ---
    【执行前请再次确认以下规则】
    {rules}
    ---
  max_rules: 10

# 产出物定义
deliverables:
  - name: "execution_report"
    description: "执行报告，包含任务概述、执行记录、产出物索引、修改记录、已知问题与建议"
    output_path: "{{workspace}}/reports/{{task_id}}_report.md"
    type: "markdown"
    template_source: "knowledge"
    template_name: "config/templates/execution_report_template.md"
    required: true

# 推荐评估指标（L1 提交任务时可参考，复杂/重要任务可追加语义评估）
recommended_metrics:
  - metric_id: "file_check"
    default_params:
      action: "read"
      path: "{{workspace}}/reports/{{task_id}}_report.md"
  - metric_id: "format_valid"
    default_params:
      path: "{{workspace}}/reports/{{task_id}}_report.md"
      type: "markdown"

# 输入输出 Schema
input_schema:
  type: "object"
  properties:
    task:
      type: "object"
      description: "任务描述"
      properties:
        description:
          type: "string"
        inputs:
          type: "object"
        expected_outputs:
          type: "array"
        constraints:
          type: "array"
    context:
      type: "object"
      description: "上下文信息"
  required:
    - "task"

output_schema:
  type: "object"
  properties:
    execution_result:
      type: "object"
      description: "执行结果"
      properties:
        status:
          type: "string"
          enum: ["success", "partial", "failed"]
        task_description:
          type: "string"
        steps_executed:
          type: "array"
        outputs:
          type: "object"
        issues:
          type: "array"
        suggestions:
          type: "array"
  required:
    - "execution_result"

# 元数据
version: "1.0.0"
is_active: true
status: "active"
max_iterations: 100
max_reminders: 5
timeout_seconds: 2400

plugins:
  disabled: []
  enabled:
    task_reminder:
      max_reminders: 5
      cooldown_seconds: 180

tags:
  - "orchestrator"
  - "task"
  - "general"
  - "L2"

metadata:
  author: "System"
  created_at: "2026-01-15"
  updated_at: "2026-05-12"
  capabilities:
    - "task_orchestration"
    - "resource_search"
    - "general_execution"
    - "file_operations"
    - "data_processing"
    - "information_gathering"
