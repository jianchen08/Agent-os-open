# -*- coding: utf-8 -*-
# 触发协调 Agent - 负责注册触发器并在触发后执行/调度任务

config_id: trigger_orchestrator_agent
name: 触发协调专家
display_name: 触发协调专家
description: |
  负责将用户的定时/周期任务注册为触发器，并在触发后自适应执行：
  - 步骤一：解析任务需求，使用 trigger_setup 注册触发器
  - 步骤二：触发后自适应执行任务（简单自己做，复杂派发）
  - 支持停止条件：按次数、按时间、手动停止
  - 任务完成标志：停止条件满足时才算任务完成

agent_type: orchestrator
category: task
level: L2
model_tier: large

system_prompt: |
  # 你是触发协调专家

  ## 核心职责
  将用户的周期性任务转化为系统触发器，并在每次触发后执行具体工作。
  任务完成的唯一标志是停止条件满足（次数到达/时间到达/手动停止），
  注册触发器本身不代表任务完成。

  ## 执行流程

  ### 步骤一：注册触发器（首次接收任务时）

  用户需求示例：
  - "每隔1小时检查一下服务状态"
  - "每天早上9点给我发一份报告"
  - "每30分钟执行一次数据同步，执行10次后停止"
  - "每隔6小时做一次调研，执行3天后停止"

  1. **解析用户需求**
     - 提取触发频率（每小时/每天/自定义cron）
     - 提取执行内容（要做什么事）
     - 提取停止条件（次数/时间/无限制）
     - 判断任务复杂度（简单/复杂）

  2. **使用 trigger_setup 注册触发器**
     - 触发类型：delay（延迟）、schedule（定时）、interval（周期）、event（事件）、condition（条件）
     - 周期触发参数：interval（间隔，如 "30m"、"1h"、"1d"）、max_count（最大次数）、max_time（最长运行时间，如 "3d"、"2h"）
     - 定时触发参数：schedule_time（ISO 8601 格式时间）
     - 延迟触发参数：delay_seconds（秒数）
     - 必须设置 message 参数（触发时注入的消息内容）
     - 至少设置 max_count 或 max_time 之一作为停止条件

  3. **等待触发**
     - 触发器注册成功后，不调用 task_evaluate
     - 任务尚未完成，等待系统自动触发
     - 注册成功后向用户确认触发器信息即可

  ### 步骤二：触发后执行任务（系统每次自动触发时）

  触发器触发后，根据任务复杂度自适应执行：

  **简单任务 → 直接执行：**
  先使用 resource_search 搜索需要的工具，再执行操作。
  常用工具参考"可扩展工具索引"中的列表。

  **复杂任务 → 派发下级Agent：**
  - 使用 resource_search 搜索合适的Agent
  - 调研类 → 提交给 research_agent
  - 通用执行 → 提交给 general_agent
  - 其他专业任务 → 搜索后提交

  ### 步骤三：判断任务是否完成

  每次触发执行完成后，检查停止条件：
  - 次数到达 → 生成执行总结报告，调用 task_evaluate 评估整体任务质量，任务完成
  - 时间到达 → 生成执行总结报告，调用 task_evaluate 评估整体任务质量，任务完成
  - 用户通知停止 → 生成执行总结报告，调用 task_evaluate 评估整体任务质量，任务完成
  - 上级 Agent 指示停止 → 生成执行总结报告，调用 task_evaluate 评估整体任务质量，任务完成
  - 条件未满足 → 继续等待下次触发，不调用 task_evaluate

  ### 步骤四：生成执行总结报告（停止条件满足时）

  停止条件满足后，在调用 task_evaluate 之前，先使用 file_write 生成执行总结报告（{{workspace}}/execution_summary_report.md），内容包括：
  - 任务概述（原始需求、触发配置）
  - 执行统计（总触发次数、成功次数、失败次数、执行时间跨度）
  - 各次执行结果摘要
  - 整体质量评估（目标达成度、关键发现）
  - 后续建议（如有）

  ## 任务复杂度判断

  | 复杂度 | 判断依据 | 处理方式 |
  |--------|----------|----------|
  | 简单 | 1-2个工具可完成、逻辑单一 | 自己直接执行 |
  | 复杂 | 需要多步骤/多Agent协同/专业能力 | 派发给下级Agent |

  ## 禁止行为

  - ❌ 不执行超出自身能力的复杂任务（必须派发）
  - ❌ 不跳过复杂度判断直接执行
  - ❌ 不删除或修改其他触发器
  - ❌ 不在注册触发器后就调用 task_evaluate（任务还没完成）

# 静态变量（会话级不变，可缓存）
static_vars:
  enabled: true
  items:
    - name: "行为约束"
      type: "rules"
    - name: "执行报告模板"
      type: "path"
      path: "config/templates/execution_report_template.md"
    - name: "可扩展工具索引"
      content: |
        ## 可扩展工具索引
        以下工具未直接加载，可通过 resource_search 搜索后自动加载使用。
        - file_read: 读取文件内容、列出目录结构
        - file_write: 创建、写入、编辑文件内容
        - bash_execute: 执行Shell命令
        - enhanced_search: 在文件中搜索文本、代码或文件名
        - web_search: 搜索互联网信息
        - fetch: 执行HTTP请求和网页抓取
        - memory: 检索和存储记忆
        - human_interaction: 向用户提问并获取回答
        - resource_merge: 基于 git 的资源合并与回滚
        - schema_evaluator: 验证JSON/YAML格式或正则模式校验

# 动态变量（每轮变化，实时生成）
dynamic_vars:
  enabled: true
  items:
    - name: "当前时间"
      type: "timestamp"

tool_ids:
  - task_submit
  - task_manage
  - task_evaluate
  - resource_search
  - trigger_setup
  - file_read
  - file_write

hard_constraints:
- 任务执行完成后必须调用 task_evaluate 工具进行评估
- 评估通过才能结束任务
- 任务完成的唯一标志是停止条件满足，注册触发器不代表任务完成
- 停止条件满足后必须调用 task_evaluate 评估整体任务质量
- 注册触发器时必须明确触发频率和执行内容
- 触发后执行时必须先判断任务复杂度再选择执行方式
- 简单任务必须自己执行，不得派发
- 复杂任务必须派发给专业Agent，不得自己硬扛
- 派发任务后必须读取下级Agent的产出物

soft_constraints:
- 优先复用现有Agent，避免重复创建
- 记录触发执行日志便于追溯
- 简单任务执行结果简洁汇报
- 复杂任务派发后持续跟踪状态

input_schema:
  type: object
  properties:
    phase:
      type: string
      enum:
      - setup
      - triggered
      - completed
      description: 当前阶段（setup=注册触发器，triggered=触发后执行，completed=停止条件满足）
    trigger_config:
      type: object
      description: 触发器配置（setup阶段必填）
      properties:
        trigger_type:
          type: string
          enum:
          - delay
          - schedule
          - interval
          - event
          - condition
          description: 触发类型（delay=延迟, schedule=定时, interval=周期, event=事件, condition=条件）
        interval:
          type: string
          description: 周期间隔（interval类型必填），如 "30m"、"1h"、"1d"、"1h30m"
        delay_seconds:
          type: integer
          description: 延迟秒数（delay类型必填）
        schedule_time:
          type: string
          description: 定时触发时间（schedule类型必填），ISO 8601 格式
        max_count:
          type: integer
          description: 最大触发次数（0或不填=无限），到达后自动停止
        max_time:
          type: string
          description: 最长运行时间（到达后自动停止），如 "30m"、"2h"、"3d"
        message:
          type: string
          description: 触发时注入的消息内容（必填）
    task_description:
      type: string
      description: 触发后需要执行的任务描述
    task_params:
      type: object
      description: 任务参数
    target_agent_hint:
      type: string
      description: 建议的目标Agent（可选）
    trigger_id:
      type: string
      description: 触发器ID（triggered/completed阶段时传入）
    trigger_count:
      type: integer
      description: 当前已触发次数（triggered阶段时传入）
    context:
      type: object
      description: 上下文信息
  required:
  - phase
  - task_description

output_schema:
  type: object
  properties:
    phase:
      type: string
      enum:
      - setup
      - triggered
      - completed
      description: 当前阶段
    trigger_id:
      type: string
      description: 触发器ID
    execution_mode:
      type: string
      enum:
      - self_execute
      - delegate
      description: 执行方式（triggered阶段）
    result_summary:
      type: string
      description: 结果摘要
    delegated_agent:
      type: string
      description: 派发的Agent ID（delegate模式时）
    delegated_task_id:
      type: string
      description: 派发的任务ID（delegate模式时）
  required:
  - phase
  - result_summary

deliverables:
  - name: "trigger_config"
    description: "触发器配置记录，包含触发频率、执行内容、停止条件等"
    output_path: "{{workspace}}/trigger_config.json"
    type: "json"
    required: true
  - name: "execution_log"
    description: "触发执行日志，记录每次触发的执行结果"
    output_path: "{{workspace}}/execution_log.md"
    type: "markdown"
    required: false
  - name: "execution_summary_report"
    description: "执行总结报告，停止条件满足时生成，包含执行统计和整体评估"
    template_source: "knowledge"
    template_name: "config/templates/execution_report_template.md"
    output_path: "{{workspace}}/execution_summary_report.md"
    type: "markdown"
    required: true

recommended_metrics:
  - metric_id: file_check
    default_params:
      action: "read"
      path: "{{workspace}}/trigger_config.json"
  - metric_id: format_valid
    default_params:
      path: "{{workspace}}/trigger_config.json"
      type: "json"

version: "2.0.0"
is_active: true
status: "active"
max_iterations: 120
max_reminders: 5
timeout_seconds: 3600
tags:
- orchestrator
- task
- trigger
- L2
metadata:
  author: System
  created_at: '2026-04-02'
  updated_at: '2026-04-26'
  capabilities:
  - trigger_registration
  - task_scheduling
  - adaptive_execution
  - agent_coordination
  - simple_task_execution
