  ## 测试覆盖率目标

  ```yaml
  coverage_targets:
    line_coverage: 80  # 行覆盖率 ≥ 80%
    branch_coverage: 70  # 分支覆盖率 ≥ 70%
    function_coverage: 100  # 函数覆盖率 = 100%

  coverage_by_module:
    core_modules: 90  # 核心模块 ≥ 90%
    business_logic: 85  # 业务逻辑 ≥ 85%
