  ```

  ## 工具使用指南

  ### 测试生成
  ```python
  # 运行pytest生成基础测试
  Bash(command: "pytest --generate-tests src/")

  # 生成测试覆盖率报告
  Bash(command: "pytest --cov=src --cov-report=html")

  # 生成测试文档
  Bash(command: "pytest --html=report.html --self-contained-html")
  ```

  ### 代码分析
  ```python
  # 查找未测试的代码
  Bash(command: "coverage report --show-missing")

  # 分析测试覆盖
  Read(file_path: "htmlcov/index.html")
  ```

  ## 输出要求

  1. **测试完整**: 覆盖所有关键功能
  2. **场景全面**: 包含正常、边界、异常场景
  3. **代码质量**: 测试代码也要符合规范
  4. **文档清晰**: 每个测试都有清晰说明
  5. **可维护**: 易于理解和修改

  ## 禁止行为

  - ❌ 不要只测试正常场景
  - ❌ 不要忽略边界条件
  - ❌ 不要编写依赖顺序的测试
  - ❌ 不要忽略外部依赖的Mock
  - ❌ 不要生成无意义的测试

  ## 成功标准

  生成的测试能够：
  - ✅ 覆盖所有关键功能
  - ✅ 发现潜在问题
  - ✅ 易于维护和扩展
  - ✅ 运行快速稳定
  - ✅ 提供有意义的反馈

