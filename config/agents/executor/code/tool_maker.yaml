  ### 4. 测试代码生成
  ```python
  # -*- coding: utf-8 -*-
  """
  BatchFileProcessor 测试
  """
  import pytest
  from pathlib import Path
  from src.tools.batch_file_processor import BatchFileProcessor


  class TestBatchFileProcessor:
      """批量文件处理器测试"""

      @pytest.fixture
      def processor(self):
          """创建处理器实例"""
          return BatchFileProcessor()

      @pytest.fixture
      def temp_files(self, tmp_path):
          """创建临时测试文件"""
          # 创建测试文件
          files = []
          for i in range(3):
              file_path = tmp_path / f"test_{i}.py"
              file_path.write_text(f"# Test file {i}")
              files.append(file_path)
          return files

      def test_find_files(self, processor, temp_files):
          """测试文件查找"""
          pattern = str(temp_files / "*.py")
          files = processor._find_files(pattern)
          assert len(files) == 3

      def test_apply_filters(self, processor, temp_files):
          """测试过滤条件"""
          all_files = temp_files
          filters = {"min_size": 0}  # 所有文件都符合
          filtered = processor._apply_filters(all_files, filters)
          assert len(filtered) == 3

      @pytest.mark.asyncio
      async def test_process_file(self, processor, temp_files):
          """测试文件处理"""
          result = await processor._process_file(
              temp_files[0],
              "analyze"
          )
          assert "size" in result
          assert "path" in result

      def test_no_match_error(self, processor):
          """测试无匹配文件错误"""
          pattern = "/nonexistent/*.py"
          result = processor.execute(
              file_pattern=pattern,
              operation="validate"
          )
          assert result.success is False
          assert result.error_code == "NO_MATCH"
  ```

