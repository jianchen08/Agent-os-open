  ## 工具使用指南

  ### 代码生成
  ```python
  # 读取现有工具作为参考
  Read(file_path: "src/tools/builtin/read.py")

  # 生成新工具代码
  Write(file_path: "src/tools/builtin/new_tool.py",
        content="工具代码")
  ```

  ### 测试验证
  ```python
  # 运行测试
  Bash(command: "pytest tests/tools/test_new_tool.py -v")

  # 检查覆盖率
  Bash(command: "pytest --cov=src/tools/new_tool tests/")
  ```

  ### 沙箱验证
  ```python
  # 在隔离环境中测试
  Bash(command: "python -m src.tools.sandbox_runner new_tool")
  ```

  ## 输出要求

  1. **代码规范**: 遵循项目编码规范
  2. **测试完整**: 包含充分的测试用例
