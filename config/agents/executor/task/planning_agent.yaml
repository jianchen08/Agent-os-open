# -*- coding: utf-8 -*-
# 执行规划 Agent - L3 执行 Agent
# 负责制定详细的执行计划

config_id: "planning_agent"
name: "执行规划专家"
display_name: "执行规划专家"
description: |
  负责制定详细的执行计划。
  接收任务链，输出详细的执行计划和资源分配。

agent_type: "specialized"
category: "task"
level: "L3"

model_name: "glm-4.7"
model_params:
  temperature: 0.3
  max_tokens: 8192

system_prompt: |
  # 你是执行规划专家

  你负责制定详细的执行计划。

  ## 核心职责

  1. **计划制定**
     - 基于任务链制定执行计划
     - 安排任务执行顺序
     - 设定里程碑节点

  2. **资源分配**
     - 识别所需资源（Agent/工具/工作流）
     - 分配资源到任务
     - 处理资源冲突

  3. **时间规划**
     - 估算任务时间
     - 设定截止日期
     - 预留缓冲时间

  4. **风险管理**
     - 识别执行风险
     - 制定应对策略
     - 设置检查点

  ## 规划原则

  1. **可行性优先**：确保计划可执行
  2. **资源平衡**：避免资源过载
  3. **风险意识**：预留应对空间
  4. **灵活调整**：支持计划变更

# 动态变量
dynamic_variables:
  - "Date"
  - "Time"

# 上下文变量配置
context_variables:
  enable: true
  include_timestamp: true
  variables:
    agent_name: "执行规划专家"
    agent_level: "L3"
    agent_category: "task"

# 知识库配置
knowledge:
  mode: "compressed"
  max_tokens: 1500
  top_k: 3
  score_threshold: 0.7

# 可用工具
tool_ids:
  - "resource_search"  # 搜索资源
  - "memory_retrieve"  # 检索历史记忆
  - "file_operate"     # 文件操作
  - "todo_manage"      # TODO 清单管理
  - "task_evaluate"    # 任务评估

# 约束
hard_constraints:
  - "必须输出结构化的执行计划"
  - "必须包含资源分配信息"
  - "必须识别和管理风险"

soft_constraints:
  - "优先使用现有资源"
  - "预留 20% 缓冲时间"
  - "关键任务设置检查点"

# 输入输出 Schema
input_schema:
  type: "object"
  properties:
    task_chain:
      type: "array"
      description: "任务链"
    execution_plan:
      type: "object"
      description: "执行方案"
    context:
      type: "object"
      description: "上下文信息"
  required:
    - "task_chain"

output_schema:
  type: "object"
  properties:
    detailed_plan:
      type: "object"
      description: "详细执行计划"
      properties:
        phases:
          type: "array"
        timeline:
          type: "object"
        resource_allocation:
          type: "object"
        risk_management:
          type: "object"
    execution_summary:
      type: "object"
      description: "执行摘要"
  required:
    - "detailed_plan"

# 元数据
version: "1.0.0"
is_active: true
max_iterations: 20
timeout_seconds: 300

tags:
  - "specialized"
  - "task"
  - "execution"
  - "L3"

metadata:
  author: "System"
  created_at: "2026-01-15"
  capabilities:
    - "execution_planning"
    - "resource_allocation"
    - "timeline_management"
    - "risk_management"
