# -*- coding: utf-8 -*-
# 任务分解 Agent - L3 执行 Agent
# 负责将长期任务分解为短期任务链

config_id: "decompose_agent"
name: "任务分解专家"
display_name: "任务分解专家"
description: |
  负责将长期任务分解为短期任务链。
  接收执行方案，输出可执行的任务链。

agent_type: "specialized"
category: "task"
level: "L3"

model_name: "glm-4.7"
model_params:
  temperature: 0.3
  max_tokens: 8192

system_prompt: |
  # 你是任务分解专家

  你负责将长期任务分解为短期任务链。

  ## 核心职责

  1. **任务分析**
     - 理解执行方案
     - 识别任务边界
     - 确定任务粒度

  2. **任务分解**
     - 将大任务拆分为小任务
     - 确保任务独立可执行
     - 控制单个任务复杂度

  3. **依赖分析**
     - 识别任务间依赖关系
     - 确定执行顺序
     - 标记并行可能性

  4. **任务链构建**
     - 组织任务为有序链
     - 定义任务输入输出
     - 设置任务优先级

  ## 分解原则

  1. **单一职责**：每个任务只做一件事
  2. **可验证性**：每个任务有明确的完成标准
  3. **适当粒度**：任务不宜过大或过小
  4. **最小依赖**：减少任务间耦合

# 动态变量
dynamic_variables:
  - "Date"
  - "Time"

# 上下文变量配置
context_variables:
  enable: true
  include_timestamp: true
  variables:
    agent_name: "任务分解专家"
    agent_level: "L3"
    agent_category: "task"

# 知识库配置
knowledge:
  mode: "compressed"
  max_tokens: 1500
  top_k: 3
  score_threshold: 0.7

# 可用工具
tool_ids:
  - "memory_retrieve"  # 检索历史记忆
  - "file_operate"     # 文件操作
  - "todo_manage"      # TODO 清单管理
  - "task_evaluate"    # 任务评估

# 约束
hard_constraints:
  - "必须输出结构化的任务链"
  - "每个任务必须有明确的输入输出"
  - "必须标注任务依赖关系"
  - "单个任务预估工时不超过 1 天"

soft_constraints:
  - "优先分解为可并行的任务"
  - "关键路径任务优先级更高"
  - "考虑任务执行的风险"

# 输入输出 Schema
input_schema:
  type: "object"
  properties:
    execution_plan:
      type: "object"
      description: "确认的执行方案"
    initial_ac:
      type: "array"
      description: "初步验收标准"
    context:
      type: "object"
      description: "上下文信息"
  required:
    - "execution_plan"

output_schema:
  type: "object"
  properties:
    task_chain:
      type: "array"
      description: "任务链"
      items:
        type: "object"
        properties:
          task_id:
            type: "string"
          name:
            type: "string"
          description:
            type: "string"
          type:
            type: "string"
          priority:
            type: "string"
          estimated_effort:
            type: "string"
          inputs:
            type: "array"
          outputs:
            type: "array"
          dependencies:
            type: "array"
          acceptance_criteria:
            type: "array"
    execution_order:
      type: "array"
    parallel_groups:
      type: "array"
    critical_path:
      type: "array"
    total_estimated_effort:
      type: "string"
  required:
    - "task_chain"
    - "execution_order"

# 元数据
version: "1.0.0"
is_active: true
max_iterations: 20
timeout_seconds: 300

tags:
  - "specialized"
  - "task"
  - "decomposition"
  - "L3"

metadata:
  author: "System"
  created_at: "2026-01-15"
  capabilities:
    - "task_decomposition"
    - "dependency_analysis"
    - "effort_estimation"
    - "critical_path_analysis"
