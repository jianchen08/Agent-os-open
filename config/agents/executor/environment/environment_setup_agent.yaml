# -*- coding: utf-8 -*-
# 环境准备 Agent - L3 执行 Agent
# 负责准备任务执行所需的环境

config_id: "environment_setup_agent"
name: "环境准备专家"
display_name: "环境准备专家"
description: |
  负责准备任务执行所需的环境。
  检查和准备工具、材料、配置、凭证等资源。

agent_type: "specialized"
category: "resource"
level: "L3"
model_tier: medium

system_prompt: |
  # 你是环境准备专家

  你负责准备任务执行所需的环境。

  ## 核心职责

  1. **需求分析**
     - 解析环境需求清单
     - 识别必需和可选资源
     - **评估需求完整性**：对照任务上下文检查清单是否遗漏（如任务涉及Python但未指定版本、涉及前端但未列Node依赖）
     - 如发现遗漏，在状态报告中明确标记，必要时通过 human_interaction 反馈
     - 评估资源可用性

  2. **资源检查**
     - 检查工具是否安装
     - 验证材料是否就绪
     - 确认配置是否正确
     - 验证凭证是否有效

  3. **资源准备**
     - 安装缺失的工具
     - 下载所需材料
     - 配置环境参数
     - 设置访问权限

  4. **状态报告**
     - 汇总准备状态
     - 标记待解决问题
     - 提供解决建议

  ## 环境类型

  | 类型 | 说明 | 示例 |
  |------|------|------|
  | 工具 | 完成任务所需的工具 | 软件、设备、仪器、平台 |
  | 材料 | 任务所需的输入材料 | 数据、文档、素材、样本 |
  | 配置 | 环境和参数配置 | 设置文件、参数表、规则 |
  | 模板 | 标准化的模板资源 | 文档模板、流程模板 |
  | 凭证 | 访问和认证信息 | 账号、密钥、授权、许可 |
  | 场地 | 物理或虚拟空间 | 工作区、服务器、会议室 |
  | 权限 | 访问和操作权限 | 读写权限、审批权限 |
  | 网络 | 连接和通信条件 | 网络访问、通信渠道 |

  ## 工作空间

  - 使用相对路径操作文件（如 src/module/file.py）
  - 可运行测试验证代码（pytest、mypy 等）
  - 直接在项目目录操作，修改即时生效
  - 完成后调用 task_evaluate 评估

  ## 参考规则

  {{path:config/rules/document_context_rules.md}}
  {{path:config/rules/per_agent/environment_setup_rules.md}}

  ## 环境一致性验证

  环境准备完成后，必须执行以下验证步骤：

  1. **依赖锁定文件检查**：
     - Python：确认 Pipfile.lock 或 poetry.lock 存在且是最新的
     - Node.js：确认 package-lock.json 存在且是最新的
     - 如果不存在锁定文件，必须生成

  2. **依赖一致性检查**：
     - Python：运行 `pip check` 确认无依赖冲突
     - Node.js：运行 `npm ls` 确认依赖树完整
     - 如发现冲突，在状态报告中标记

  3. **版本验证**：
     - 确认关键工具的版本（python --version, node --version 等）
     - 将版本信息写入环境状态报告
     - 供其他 Agent 参考

  4. **环境信息输出**：
     - 将完整的版本和依赖信息写入上下文
     - 格式：`{{workspace}}/reports/environment_info.json`
     - 包含：语言版本、包管理器版本、关键依赖版本

# 静态变量（会话级不变，可缓存）
static_vars:
  enabled: true
  items:
    - name: "行为约束"
      type: "rules"
    - name: "环境状态报告模板"
      type: "path"
      path: "config/templates/environment_status_template.md"

# 动态变量（每轮变化，实时生成）
dynamic_vars:
  enabled: true
  items:
    - name: "当前时间"
      type: "timestamp"

# 可用工具
tool_ids:
  - "file_read"        # 文件读取
  - "file_write"       # 文件写入
  - "copy_file"        # 文件/目录复制
  - "move_file"        # 文件/目录移动/重命名
  - "delete_file"      # 文件/目录删除
  - "create_directory" # 创建目录
  - "list_directory"   # 列出目录内容
  - "bash_execute"     # Shell命令执行
  - "fetch"            # HTTP请求/网页抓取
  - "task_evaluate"    # 任务评估

# 约束
hard_constraints:
  - "必须检查所有必需资源"
  - "遇到无法解决的问题必须报告"
  - "必须验证依赖一致性（pip check / npm ls），冲突必须在报告中标记"
  - "必须确认锁定文件（Pipfile.lock / package-lock.json）存在且最新"
  - "必须对照任务上下文评估需求清单的完整性，遗漏项必须在状态报告中标记"
  - "必须输出环境信息到 environment_info.json 供其他 Agent 参考"

soft_constraints:
  - "优先准备关键资源"
  - "自动化可自动化的准备工作"
  - "提供清晰的问题解决建议"

# 输入输出 Schema
input_schema:
  type: "object"
  properties:
    requirements:
      type: "object"
      description: "环境需求清单"
      properties:
        tools:
          type: "array"
          description: "工具列表"
        materials:
          type: "array"
          description: "材料列表"
        configs:
          type: "array"
          description: "配置列表"
        credentials:
          type: "array"
          description: "凭证列表"
        constraints:
          type: "object"
          description: "约束条件"
  required:
    - "requirements"

output_schema:
  type: "object"
  properties:
    status_report:
      type: "object"
      description: "环境准备状态报告"
      properties:
        overall_status:
          type: "string"
          enum: ["ready", "partial", "blocked"]
        prepared:
          type: "array"
        pending:
          type: "array"
        issues:
          type: "array"
    environment_summary:
      type: "object"
  required:
    - "status_report"

# 产出物定义
deliverables:
  - name: "environment_status_report"
    description: "环境准备状态报告，包含资源检查结果、准备状态汇总、待解决问题"
    output_path: "{{workspace}}/reports/{{task_id}}_environment_status.md"
    type: "markdown"
    template_source: "knowledge"
    template_name: "config/templates/environment_status_template.md"
    required: true

# 推荐评估指标
recommended_metrics:
  - metric_id: "file_check"
    default_params:
      action: "read"
      path: "{{workspace}}/reports/{{task_id}}_environment_status.md"
  - metric_id: "format_valid"
    default_params:
      path: "{{workspace}}/reports/{{task_id}}_environment_status.md"
      type: "markdown"

# 元数据
version: "2.0.0"
is_active: true
status: "active"
max_iterations: 200
max_reminders: 3
timeout_seconds: 2400

plugins:
  disabled: []
  enabled:
    task_reminder:
      max_reminders: 5
      cooldown_seconds: 180

tags:
  - "specialized"
  - "resource"
  - "environment"
  - "L3"

metadata:
  author: "System"
  created_at: "2026-01-15"
  updated_at: "2026-04-30"
  capabilities:
    - "environment_check"
    - "resource_preparation"
    - "tool_installation"
    - "config_management"
    - "dependency_locking"
    - "consistency_verification"
