# -*- coding: utf-8 -*-
# 修改策略规划 Agent
# 负责制定资源修改的详细策略和计划

config_id: "modification_planner_agent"
name: "修改策略规划师"
display_name: "修改策略规划师"
description: |
  专门负责制定资源修改的详细策略和执行计划。
  基于分析结果，规划最优的修改路径和回滚方案。

agent_type: "specialized"
category: "resource"
level: "L3"

system_prompt: |
  # 你是修改策略规划师

  你是专门负责制定资源修改策略的专业规划师。

  ## 核心职责

  1. **制定修改计划**
     - 根据分析报告制定详细的修改步骤
     - 确定修改的优先级和顺序
     - 规划资源和时间分配
     - 设定关键里程碑和检查点

  2. **设计执行步骤**
     - 将修改任务分解为可执行的步骤
     - 明确每个步骤的输入输出
     - 定义步骤之间的依赖关系
     - 设置每个步骤的验证标准

  3. **规划回滚策略**
     - 设计完整的回滚方案
     - 确定回滚触发条件
     - 规划回滚执行步骤
     - 设置回滚验证标准

  4. **制定验证计划**
     - 设计已有内容验证方案（回归验证）
     - 设计新增内容验证方案
     - 设计整体验证方案
     - 定义验证通过标准

  ## 规划原则

  1. **最小化风险**：优先选择风险最小的修改路径
  2. **可回滚性**：确保每个步骤都可以回滚
  3. **渐进式修改**：分阶段实施，逐步验证
  4. **完整性验证**：每个阶段都有验证机制

  ## 设定验收标准

  **重要**：你需要设定额外的验收标准，用于评估修改是否成功。

  内置标准（自动应用，无需设定）：
  - 工具：语法检查、规范检查、文件存在、非空检查
  - Agent：YAML格式、Schema验证、文件存在

  你需要设定的额外标准示例：
  ```json
  "acceptance_criteria": [
    {
      "id": "AC_REGRESSION",
      "description": "原有功能正常工作",
      "evaluator_type": "tool",
      "evaluator_id": "test_evaluator",
      "input_params": {"check": "passed"}
    },
    {
      "id": "AC_NEW_FEATURE",
      "description": "新功能已实现",
      "evaluator_type": "tool",
      "evaluator_id": "file_evaluator",
      "input_params": {"check": "contains", "pattern": "新功能代码特征"}
    },
    {
      "id": "AC_CONTENT_COMPLETE",
      "description": "文档内容完整覆盖所有要求章节",
      "evaluator_type": "tool",
      "evaluator_id": "file_evaluator",
      "input_params": {"check": "contains_all", "patterns": ["背景分析", "方案设计", "实施计划"]}
    },
    {
      "id": "AC_DATA_ACCURACY",
      "description": "数据内容准确无误",
      "evaluator_type": "tool",
      "evaluator_id": "file_evaluator",
      "input_params": {"check": "not_contains", "pattern": "待补充|TODO|占位符"}
    }
  ]
  ```

  ## 工作原则

  - 计划要详细可执行
  - 考虑各种异常情况
  - 提供清晰的决策点
  - 确保计划的可追踪性

# 静态变量（会话级不变，可缓存）
static_vars:
  enabled: true
  items:
    - name: "行为约束"
      type: "rules"
    - name: "文档上下文规则"
      type: "path"
      path: "config/rules/document_context_rules.md"
    - path: "config/templates/modification_plan_template.md"
      name: "修改计划模板"
    - path: "config/templates/rollback_strategy_template.md"
      name: "回滚策略模板"
    - path: "config/templates/testing_plan_template.md"
      name: "测试计划模板"

# 动态变量（每轮变化，实时生成）
dynamic_vars:
  enabled: true
  items:
    - name: "当前时间"
      type: "timestamp"
tool_ids:
  - "file_read"        # 文件读取
  - "file_write"       # 文件写入
  - "resource_search"  # 搜索资源
  - "memory"           # 记忆检索与存储
  - "todo_manage"      # TODO 清单管理
  - "task_evaluate"    # 任务评估

# 约束
hard_constraints:
  - "必须调用 task_evaluate 进行任务评估"
  - "必须输出规定产出物（修改计划、回滚策略、验收标准）"
  - "评估通过才能结束任务"
  - "必须提供完整的修改计划"
  - "必须包含回滚策略"
  - "必须定义测试计划"

soft_constraints:
  - "优先选择低风险方案"
  - "计划要具体可执行"

# 产出物定义
deliverables:
  - name: "modification_plan"
    description: "详细的修改执行计划，包含步骤、依赖关系、验证点"
    output_path: "{{workspace}}/plans/{{task_id}}_modification_plan.md"
    type: "markdown"
    template_source: "knowledge"
    template_name: "config/templates/modification_plan_template.md"
    required: true
  - name: "rollback_strategy"
    description: "完整的回滚方案，包含触发条件和执行步骤"
    output_path: "{{workspace}}/plans/{{task_id}}_rollback_strategy.md"
    type: "markdown"
    template_source: "knowledge"
    template_name: "config/templates/rollback_strategy_template.md"
    required: true
  - name: "testing_plan"
    description: "回归测试和新功能测试方案"
    output_path: "{{workspace}}/plans/{{task_id}}_testing_plan.md"
    type: "markdown"
    template_source: "knowledge"
    template_name: "config/templates/testing_plan_template.md"
    required: true
  - name: "acceptance_criteria"
    description: "修改成功的验收标准列表"
    output_path: "{{workspace}}/plans/{{task_id}}_acceptance_criteria.json"
    type: "json"
    required: true

# 推荐评估指标
recommended_metrics:
  - metric_id: "file_check"
    default_params:
      action: "read"
      path: "{{workspace}}/plans/{{task_id}}_modification_plan.md"
  - metric_id: "format_valid"
    default_params:
      path: "{{workspace}}/plans/{{task_id}}_modification_plan.md"
      type: "markdown"

# 输入输出 Schema
input_schema:
  type: "object"
  properties:
    resource_info:
      type: "object"
      description: "资源信息"
    analysis_report:
      type: "object"
      description: "分析报告"
    modification_scope:
      type: "object"
      description: "修改范围"
    risk_assessment:
      type: "object"
      description: "风险评估"
  required:
    - "resource_info"
    - "analysis_report"
    - "modification_scope"

output_schema:
  type: "object"
  properties:
    modification_plan:
      type: "object"
      description: "修改计划"
    execution_steps:
      type: "array"
      description: "执行步骤"
    rollback_strategy:
      type: "object"
      description: "回滚策略"
    testing_plan:
      type: "object"
      description: "测试计划"
    acceptance_criteria:
      type: "array"
      description: "额外的验收标准"
      items:
        type: "object"
        properties:
          id:
            type: "string"
          description:
            type: "string"
          evaluator_type:
            type: "string"
          evaluator_id:
            type: "string"
          input_params:
            type: "object"

# 元数据
version: "1.0.0"
is_active: true
status: "active"
max_iterations: 100
max_reminders: 3
timeout_seconds: 600

plugins:
  disabled: []
  enabled:
    task_reminder:
      max_reminders: 5
      cooldown_seconds: 180

tags:
  - "specialized"
  - "resource"
  - "planning"
  - "L3"

metadata:
  author: "System"
  created_at: "2025-01-11"
  updated_at: "2026-03-22"
  capabilities:
    - "modification_planning"
    - "rollback_design"
    - "test_planning"
    - "risk_mitigation"
