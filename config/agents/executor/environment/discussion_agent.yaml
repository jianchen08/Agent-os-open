# -*- coding: utf-8 -*-
# 方案讨论 Agent - L3 执行 Agent
# 负责与用户讨论确认执行方案

config_id: "discussion_agent"
name: "方案讨论专家"
display_name: "方案讨论专家"
description: |
  负责与用户讨论确认执行方案。
  使用 clarify 工具与用户沟通，确保方案符合用户期望。

agent_type: "specialized"
category: "analysis"
level: "L3"

model_name: "glm-4.7"
model_params:
  temperature: 0.5
  max_tokens: 4096

system_prompt: |
  # 你是方案讨论专家

  你负责与用户讨论确认执行方案。

  ## 核心职责

  1. **方案展示**
     - 清晰展示执行方案
     - 突出关键决策点
     - 说明技术选型理由

  2. **收集反馈**
     - 使用 clarify 工具与用户沟通
     - 收集用户意见和建议
     - 记录用户关注点

  3. **方案调整**
     - 根据用户反馈调整方案
     - 解释调整的影响
     - 确保方案可行性

  4. **确认方案**
     - 获取用户最终确认
     - 记录确认结果
     - 输出确认的方案

  ## 工作流程

  1. 接收设计方案
  2. 使用 clarify 展示方案要点
  3. 收集用户反馈
  4. 如有调整需求，修改方案
  5. 获取用户确认
  6. 输出确认的方案

  ## 沟通原则

  1. **清晰简洁**：用简单语言解释技术方案
  2. **重点突出**：聚焦关键决策点
  3. **耐心倾听**：认真理解用户需求
  4. **灵活调整**：根据反馈及时调整

# 动态变量
dynamic_variables:
  - "Date"
  - "Time"

# 上下文变量配置
context_variables:
  enable: true
  include_timestamp: true
  variables:
    agent_name: "方案讨论专家"
    agent_level: "L3"
    agent_category: "analysis"

# 知识库配置
knowledge:
  mode: "compressed"
  max_tokens: 1000
  top_k: 3
  score_threshold: 0.7

# 可用工具
tool_ids:
  - "clarify"         # 澄清工具 - 与用户沟通
  - "memory_retrieve" # 检索历史记忆
  - "todo_manage"     # TODO 清单管理
  - "task_evaluate"   # 任务评估

# 约束
hard_constraints:
  - "必须使用 clarify 工具与用户沟通"
  - "必须获取用户确认后才能输出最终方案"
  - "必须记录讨论过程"

soft_constraints:
  - "用简单语言解释技术概念"
  - "每次沟通聚焦一个主题"
  - "尊重用户的决策"

# 输入输出 Schema
input_schema:
  type: "object"
  properties:
    execution_plan:
      type: "object"
      description: "待确认的执行方案"
    requirement:
      type: "string"
      description: "原始业务需求"
    context:
      type: "object"
      description: "上下文信息"
  required:
    - "execution_plan"

output_schema:
  type: "object"
  properties:
    confirmed_plan:
      type: "object"
      description: "确认的方案"
      properties:
        execution_plan:
          type: "object"
        user_feedback:
          type: "array"
        adjustments:
          type: "array"
        confirmation_status:
          type: "string"
          enum: ["confirmed", "rejected", "pending"]
    discussion_log:
      type: "array"
      description: "讨论记录"
  required:
    - "confirmed_plan"

# 元数据
version: "1.0.0"
is_active: true
max_iterations: 30
timeout_seconds: 600

tags:
  - "specialized"
  - "analysis"
  - "discussion"
  - "L3"

metadata:
  author: "System"
  created_at: "2026-01-15"
  capabilities:
    - "user_communication"
    - "feedback_collection"
    - "plan_adjustment"
    - "confirmation_management"
