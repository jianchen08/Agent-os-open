# -*- coding: utf-8 -*-
# AC 细化 Agent - L3 执行 Agent
# 负责细化验收标准

config_id: "ac_refine_agent"
name: "AC细化专家"
display_name: "AC细化专家"
description: |
  负责细化验收标准（Acceptance Criteria）。
  将初步 AC 细化为可测试、可验证的具体标准。

agent_type: "specialized"
category: "evaluation"
level: "L3"

model_name: "glm-4.7"
model_params:
  temperature: 0.3
  max_tokens: 8192

system_prompt: |
  # 你是 AC 细化专家

  你负责细化验收标准（Acceptance Criteria）。

  ## 核心职责

  1. **AC 分析**
     - 理解初步验收标准
     - 识别模糊或不完整的标准
     - 关联任务和 AC

  2. **AC 细化**
     - 将模糊标准具体化
     - 添加可测试的条件
     - 定义验证方法

  3. **AC 分类**
     - 功能性 AC
     - 非功能性 AC（性能、安全等）
     - 边界条件 AC

  4. **AC 验证设计**
     - 设计验证步骤
     - 定义预期结果
     - 指定验证工具

  ## AC 细化原则（SMART）

  1. **Specific（具体）**：明确描述期望行为
  2. **Measurable（可测量）**：有量化指标
  3. **Achievable（可实现）**：技术上可行
  4. **Relevant（相关）**：与需求直接相关
  5. **Testable（可测试）**：可以验证

# 动态变量
dynamic_variables:
  - "Date"
  - "Time"

# 上下文变量配置
context_variables:
  enable: true
  include_timestamp: true
  variables:
    agent_name: "AC细化专家"
    agent_level: "L3"
    agent_category: "evaluation"

# 知识库配置
knowledge:
  mode: "compressed"
  max_tokens: 1500
  top_k: 3
  score_threshold: 0.7

# 可用工具
tool_ids:
  - "memory_retrieve"  # 检索历史记忆
  - "file_operate"     # 文件操作
  - "todo_manage"      # TODO 清单管理
  - "task_evaluate"    # 任务评估

# 约束
hard_constraints:
  - "必须输出结构化的细化 AC"
  - "每个 AC 必须有验证方法"
  - "必须关联 AC 和任务"

soft_constraints:
  - "优先细化 P0 级别的 AC"
  - "考虑边界条件和异常情况"
  - "验证方法优先选择自动化测试"

# 输入输出 Schema
input_schema:
  type: "object"
  properties:
    initial_ac:
      type: "array"
      description: "初步验收标准"
    task_chain:
      type: "array"
      description: "任务链"
    detailed_plan:
      type: "object"
      description: "详细执行计划"
    context:
      type: "object"
      description: "上下文信息"
  required:
    - "initial_ac"
    - "task_chain"

output_schema:
  type: "object"
  properties:
    refined_ac:
      type: "array"
      description: "细化的验收标准"
      items:
        type: "object"
        properties:
          ac_id:
            type: "string"
          original:
            type: "string"
          refined:
            type: "string"
          category:
            type: "string"
          priority:
            type: "string"
          related_tasks:
            type: "array"
          verification:
            type: "object"
          edge_cases:
            type: "array"
    ac_summary:
      type: "object"
    coverage_analysis:
      type: "object"
  required:
    - "refined_ac"

# 元数据
version: "1.0.0"
is_active: true
max_iterations: 20
timeout_seconds: 300

tags:
  - "specialized"
  - "evaluation"
  - "quality"
  - "L3"

metadata:
  author: "System"
  created_at: "2026-01-15"
  capabilities:
    - "ac_refinement"
    - "verification_design"
    - "coverage_analysis"
    - "quality_assurance"
