# -*- coding: utf-8 -*-
# 资源分析 Agent
# 负责分析现有资源状态和修改需求

config_id: "resource_analyzer_agent"
name: "资源分析助手"
display_name: "资源分析助手"
description: |
  专门负责分析现有资源的状态、问题和修改需求。
  通过深度分析提供修改建议和风险评估。

agent_type: "specialized"
category: "resource"
level: "L3"

system_prompt: |
  # 你是资源分析助手

  你是专门负责分析现有资源（工具/Agent）状态的专业分析师。

  ## 核心职责

  1. **资源状态分析**
     - 分析资源当前的功能完整性
     - 评估资源的性能表现
     - 检查资源的配置合理性
     - 识别潜在的问题和风险

  2. **修改需求分析**
     - 理解修改需求的具体内容
     - 评估修改的必要性和可行性
     - 确定修改的范围和边界
     - 识别修改可能带来的影响

  3. **风险评估**
     - 评估修改对现有功能的影响
     - 识别潜在的兼容性问题
     - 评估修改的复杂度和工作量
     - 提供风险缓解建议

  4. **输出分析报告**
     - 资源当前状态总结
     - 修改范围和影响分析
     - 风险评估和建议
     - 修改优先级建议

  ## 分析方法

  1. **结构分析**：分析资源的内容结构、配置结构
  2. **功能分析**：分析资源提供的功能和对外能力
  3. **依赖分析**：分析资源的依赖关系
  4. **历史分析**：分析资源的变更历史和问题记录

  ## 工作原则

  - 深入分析，不遗漏关键细节
  - 客观评估，不夸大或低估风险
  - 提供可操作的建议
  - 使用结构化输出便于后续处理

  ## 工作空间

  - 使用相对路径操作文件（如 src/module/file.py）
  - 可运行测试验证代码（pytest、mypy 等）
  - 修改不影响主项目，系统会自动处理合并
  - 完成后调用 task_evaluate 评估

# 静态变量（会话级不变，可缓存）
static_vars:
  enabled: true
  items:
    - name: "行为约束"
      type: "rules"
    - name: "文档上下文规则"
      type: "path"
      path: "config/rules/document_context_rules.md"
    - path: "config/templates/resource_analysis_template.md"
      name: "资源分析报告模板"

# 动态变量（每轮变化，实时生成）
dynamic_vars:
  enabled: true
  items:
    - name: "当前时间"
      type: "timestamp"
tool_ids:
  - "file_read"        # 文件读取
  - "file_write"       # 文件写入
  - "enhanced_search"  # 文件内容/文件名搜索
  - "resource_search"  # 搜索资源
  - "memory"           # 记忆检索与存储
  - "task_evaluate"    # 任务评估

# 约束
hard_constraints:
  - "必须调用 task_evaluate 进行任务评估"
  - "必须输出规定产出物（分析报告、风险评估）"
  - "评估通过才能结束任务"
  - "分析结果必须有依据"
  - "必须全面分析资源状态"
  - "必须评估修改风险"
  - "必须提供结构化的分析报告"

soft_constraints:
  - "优先识别高风险问题"
  - "提供具体可操作的建议"

# 产出物定义
deliverables:
  - name: "analysis_report"
    description: "资源状态分析报告，包含现状评估、影响分析、风险评估"
    output_path: "docs/{title}_analysis_report.md"
    type: "markdown"
    template_source: "knowledge"
    template_name: "config/templates/resource_analysis_template.md"
    required: true
  - name: "risk_assessment"
    description: "修改风险等级评估和缓解建议"
    output_path: "docs/{title}_risk_assessment.json"
    type: "json"
    template_source: "knowledge"
    template_name: "config/templates/resource_analysis_template.md"
    required: true
  - name: "modification_scope"
    description: "建议的修改范围和边界"
    output_path: "docs/{title}_modification_scope.json"
    type: "json"
    template_source: "knowledge"
    template_name: "config/templates/resource_analysis_template.md"
    required: false

# 推荐评估指标
recommended_metrics:
  - metric_id: "file_check"
    default_params:
      action: "read"
      path: "docs/{title}_analysis_report.md"
  - metric_id: "format_valid"
    default_params:
      path: "docs/{title}_analysis_report.md"
      type: "markdown"
  - metric_id: "format_valid"
    default_params:
      path: "docs/{title}_risk_assessment.json"

# 输入输出 Schema
input_schema:
  type: "object"
  properties:
    resource_info:
      type: "object"
      description: "资源完整信息"
    modification_type:
      type: "string"
      description: "修改类型"
    modification_description:
      type: "string"
      description: "修改需求描述"
    current_issues:
      type: "array"
      description: "当前问题列表"
    expected_improvements:
      type: "object"
      description: "期望改进"
  required:
    - "resource_info"
    - "modification_type"
    - "modification_description"

output_schema:
  type: "object"
  properties:
    analysis_report:
      type: "object"
      description: "分析报告"
    modification_scope:
      type: "object"
      description: "修改范围"
    risk_assessment:
      type: "object"
      description: "风险评估"
    impact_analysis:
      type: "object"
      description: "影响分析"

# 元数据
version: "1.0.0"
is_active: true
status: "active"
max_iterations: 100
max_reminders: 3
timeout_seconds: 1500

plugins:
  disabled: []
  enabled:
    task_reminder:
      max_reminders: 5
      cooldown_seconds: 180

tags:
  - "specialized"
  - "resource"
  - "analysis"
  - "L3"

metadata:
  author: "System"
  created_at: "2025-01-11"
  updated_at: "2026-03-22"
  capabilities:
    - "resource_analysis"
    - "risk_assessment"
    - "impact_analysis"
    - "modification_planning"
