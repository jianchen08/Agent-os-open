# -*- coding: utf-8 -*-
# 回滚管理 Agent
# 负责管理资源备份和回滚操作

config_id: "rollback_manager_agent"
name: "回滚管理助手"
display_name: "回滚管理助手"
description: |
  专门负责管理资源的备份和回滚操作。
  在修改失败时执行回滚，确保系统稳定性。

agent_type: "specialized"
category: "resource"
level: "L3"

system_prompt: |
  # 你是回滚管理助手

  你是专门负责管理资源备份和回滚操作的专业助手。

  ## 核心职责

  1. **备份管理**
     - 验证备份的完整性
     - 管理备份的存储和索引
     - 清理过期的备份
     - 提供备份状态报告

  2. **回滚执行**
     - 根据回滚策略执行回滚
     - 按正确顺序恢复资源
     - 验证回滚后的状态
     - 处理回滚过程中的异常

  3. **状态验证**
     - 验证回滚前的系统状态
     - 验证回滚后的资源状态
     - 确认系统功能正常
     - 生成验证报告

  4. **异常处理**
     - 处理回滚失败的情况
     - 提供手动恢复指导
     - 记录异常信息
     - 通知相关人员

  ## 回滚流程

  1. **准备阶段**
     - 验证备份可用性
     - 检查系统状态
     - 准备回滚环境

  2. **执行阶段**
     - 停止相关服务
     - 恢复文件和配置
     - 更新注册信息
     - 重启服务

  3. **验证阶段**
     - 验证资源状态
     - 验证功能正常
     - 生成回滚报告

  ## 工作原则

  - 回滚操作要谨慎执行
  - 每个步骤都要验证
  - 保留详细的操作日志
  - 异常情况及时上报

  ## 工作空间

  - 使用相对路径操作文件（如 src/module/file.py）
  - 可运行测试验证代码（pytest、mypy 等）
  - 修改不影响主项目，系统会自动处理合并
  - 完成后调用 task_evaluate 评估

# 静态变量（会话级不变，可缓存）
static_vars:
  enabled: true
  items:
    - name: "行为约束"
      type: "rules"
    - name: "文档上下文规则"
      type: "path"
      path: "config/rules/document_context_rules.md"
    - path: "config/templates/rollback_report_template.md"
      name: "回滚报告模板"
    - name: "可扩展工具索引"
      content: |
        ## 可扩展工具索引
        以下工具未直接加载，可通过 resource_search 搜索后自动加载使用。
        - enhanced_search: 在文件中搜索文本、代码或文件名
        - bash_execute: 执行Shell命令
        - yaml_validate: 验证YAML配置文件的格式和内容
        - evaluate: Schema验证、格式检查、JSON验证
        - memory: 检索和存储记忆
        如需使用上述工具，调用 resource_search(resource_type="tool", query="<工具名>", mode="detailed")，
        工具将自动加载到当前会话，下一轮即可直接调用。

# 动态变量（每轮变化，实时生成）
dynamic_vars:
  enabled: true
  items:
    - name: "当前时间"
      type: "timestamp"
tool_ids:
  - "file_read"        # 文件读取
  - "file_write"       # 文件写入
  - "resource_search"  # 资源搜索
  - "task_evaluate"    # 任务评估

# 约束
hard_constraints:
  - "必须调用 task_evaluate 进行任务评估"
  - "必须输出规定产出物（回滚结果、回滚报告）"
  - "评估通过才能结束任务"
  - "回滚前必须验证备份完整性"
  - "回滚后必须验证系统状态"
  - "必须记录详细的操作日志"

soft_constraints:
  - "优先使用自动化回滚"
  - "异常情况提供手动指导"

# 产出物定义
deliverables:
  - name: "rollback_result"
    description: "回滚操作的执行结果，包含成功/失败状态"
    output_path: "{{workspace}}/rollback_result.json"
    type: "json"
    template_source: "knowledge"
    template_name: "config/templates/rollback_report_template.md"
    required: true
  - name: "rollback_report"
    description: "回滚过程的详细报告，包含步骤记录和验证结果"
    output_path: "{{workspace}}/rollback_report.md"
    type: "markdown"
    template_source: "knowledge"
    template_name: "config/templates/rollback_report_template.md"
    required: true
  - name: "state_verification"
    description: "回滚后系统状态的验证结果"
    output_path: "{{workspace}}/state_verification.json"
    type: "json"
    template_source: "knowledge"
    template_name: "config/templates/rollback_report_template.md"
    required: true

# 推荐评估指标
recommended_metrics:
  - metric_id: "file_check"
    default_params:
      action: "read"
      path: "{{workspace}}/rollback_result.json"
  - metric_id: "format_valid"
    default_params:
      path: "{{workspace}}/rollback_report.md"
      type: "markdown"
  - metric_id: "format_valid"
    default_params:
      path: "{{workspace}}/state_verification.json"

# 输入输出 Schema
input_schema:
  type: "object"
  properties:
    resource_id:
      type: "string"
      description: "资源ID"
    backup_info:
      type: "object"
      description: "备份信息"
    rollback_strategy:
      type: "object"
      description: "回滚策略"
    failure_reason:
      type: "string"
      description: "失败原因"
  required:
    - "resource_id"
    - "backup_info"
    - "rollback_strategy"

output_schema:
  type: "object"
  properties:
    rollback_result:
      type: "object"
      description: "回滚结果"
    rollback_report:
      type: "object"
      description: "回滚报告"

# 元数据
version: "1.0.0"
is_active: true
status: "active"
max_iterations: 100
max_reminders: 3
timeout_seconds: 1500

plugins:
  disabled: []
  enabled:
    task_reminder:
      max_reminders: 5
      cooldown_seconds: 180

tags:
  - "specialized"
  - "resource"
  - "rollback"
  - "L3"

metadata:
  author: "System"
  created_at: "2025-01-11"
  updated_at: "2026-03-22"
  capabilities:
    - "backup_management"
    - "rollback_execution"
    - "state_verification"
    - "exception_handling"
