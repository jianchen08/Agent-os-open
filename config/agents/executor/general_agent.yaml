# -*- coding: utf-8 -*-
# 通用任务 Agent - L3 执行 Agent
# 负责执行各类通用任务：文件操作、数据处理、信息收集等

config_id: "general_agent"
name: "通用任务执行者"
display_name: "通用任务执行者"
description: |
  通用任务执行Agent（L3），负责执行各类通用任务。
  包括文件操作、数据处理、信息收集、简单脚本编写等。
  可被灵汐(L1)直接调用处理轻量任务，也可被各L2编排者按需调用。

agent_type: "specialized"
category: "task"
level: "L3"
model_tier: small

system_prompt: |
  {{path:config/rules/information_integrity_rules.md}}
  {{path:config/rules/document_context_rules.md}}
  {{path:docs/project/}}

  # 你是通用任务执行者

  你是 L3 执行 Agent，负责执行各类通用任务。你接收上级 Agent（灵汐或各 L2 编排者）派发的任务，自主执行并产出结果。

  ## 核心职责

  1. **任务理解**：理解任务描述、目标和验收标准
  2. **任务执行**：使用可用工具完成任务
  3. **结果产出**：按任务要求产出文件或结果
  4. **结果评估**：使用 task_evaluate 评估任务完成情况

  ## 执行流程

  1. **理解任务**【自己执行】：分析任务描述，明确目标和验收标准
  2. **制定方案**【自己执行】：确定执行步骤和所需工具
  3. **执行任务**【自己执行】：使用工具逐步执行
  4. **验证产出**【自己执行】：检查产出物是否符合验收标准
  5. **评估完成**【自己执行】：调用 task_evaluate 评估

  ## 工作空间

  - 使用相对路径操作文件（如 src/module/file.py）
  - 可运行测试验证代码（pytest、mypy 等）
  - 修改不影响主项目，系统会自动处理合并
  - 完成后调用 task_evaluate 评估

  ## 参考规则

  上方已通过占位符注入统一上下文读取规则，此处不再重复引用。

# 静态变量（会话级不变，可缓存）
static_vars:
  enabled: true
  items:
    - name: "行为约束"
      type: "rules"
    - name: "可扩展工具索引"
      type: "reference"
      content: |
        ## 可扩展工具索引
        以下工具未直接加载，可通过 resource_search 搜索后自动加载使用。
        - yaml_validate: 验证YAML配置文件
        - schema_evaluator: 验证JSON/YAML格式或正则模式校验

        如需使用上述工具，调用 resource_search(resource_type="tool", query="<工具名>", mode="detailed")，
        工具将自动加载到当前会话，下一轮即可直接调用。

# 动态变量（每轮变化，实时生成）
dynamic_vars:
  enabled: true
  items:
    - name: "当前时间"
      type: "timestamp"

# 可用工具（L3 执行者，无调度权限）
tool_ids:
  - "file_read"          # 文件读取
  - "file_write"         # 文件写入
  - "copy_file"          # 文件/目录复制
  - "move_file"          # 文件/目录移动/重命名
  - "delete_file"        # 文件/目录删除
  - "create_directory"   # 创建目录
  - "list_directory"     # 列出目录内容
  - "bash_execute"       # Shell命令执行
  - "enhanced_search"    # 文件内容/文件名搜索
  - "web_search"         # 互联网搜索
  - "fetch"              # HTTP请求/网页抓取
  - "memory"             # 记忆检索与存储
  - "task_evaluate"      # 任务评估（L3必选）
  - "human_interaction"  # 向用户提问并获取回答
  - "design_generate"    # UI代码生成
  - "playwright_test"    # 浏览器测试
  - "design_review"      # 设计审查

# 约束
hard_constraints:
  - "任务执行完成后必须调用 task_evaluate 工具进行评估"
  - "必须输出规定的产出物"
  - "评估通过才能结束任务"
  - "遇到无法解决的问题必须报告上级"

soft_constraints:
  - "优先使用简单直接的方法"
  - "执行前确认理解任务"
  - "每个工具只需调用一次，不要重复调用相同的工具"

# 产出物定义
deliverables:
  - name: "execution_report"
    description: "执行报告，包含任务概述、执行记录、产出物索引、修改记录、已知问题与建议"
    output_path: "{{workspace}}/reports/{{task_id}}_report.md"
    type: "markdown"
    template_source: "knowledge"
    template_name: "config/templates/execution_report_template.md"
    required: true

# 推荐评估指标
recommended_metrics:
  - metric_id: "file_check"
    default_params:
      action: "read"
      path: "{{workspace}}/reports/{{task_id}}_report.md"
  - metric_id: "format_valid"
    default_params:
      path: "{{workspace}}/reports/{{task_id}}_report.md"
      type: "markdown"

# 元数据
version: "2.0.0"
is_active: true
status: "active"
max_iterations: 100
max_reminders: 3
timeout_seconds: 1800

plugins:
  disabled: []
  enabled:
    task_reminder:
      max_reminders: 3
      cooldown_seconds: 180

tags:
  - "specialized"
  - "task"
  - "general"
  - "L3"

metadata:
  author: "System"
  created_at: "2026-01-15"
  updated_at: "2026-06-01"
  capabilities:
    - "general_execution"
    - "file_operations"
    - "data_processing"
    - "information_gathering"
