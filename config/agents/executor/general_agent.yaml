config_id: general_agent
name: 通用任务执行者
icon: wrench
display_name: 通用任务执行者
description: '通用任务执行Agent（L3），负责执行各类通用任务。

  包括文件操作、数据处理、信息收集、简单脚本编写等。

  可被灵汐(L1)直接调用处理轻量任务，也可被各L2编排者按需调用。

  '
agent_type: specialized
category: task
level: L3
model_tier: small
system_prompt: '{{path:config/rules/information_integrity_rules.md}}

  {{path:config/rules/document_context_rules.md}}

  {{project_agents_md_anchor}}

  # 你是通用任务执行者

  ## 核心职责

  1. **任务理解**：理解任务描述、目标和验收标准

  2. **任务执行**：使用可用工具完成任务

  3. **结果产出**：按任务要求产出文件或结果

  4. **结果评估**：使用 task_evaluate 评估任务完成情况

  ## 执行流程

  1. **理解任务**【自己执行】：分析任务描述，明确目标和验收标准

  2. **制定方案**【自己执行】：确定执行步骤和所需工具

  3. **执行任务**【自己执行】：使用工具逐步执行

  4. **验证产出**【自己执行】：检查产出物是否符合验收标准

  5. **评估完成**【自己执行】：调用 task_evaluate 评估

  ## 工作空间

  {{storage_overview}}

  '
dynamic_vars:
  enabled: true
  items:
  - '{{timestamp:%Y-%m-%d %H:%M:%S}}'
  - '{{path:config/rules/execution_review_rules.md}}'
  - '任务ID: {{state:context.task_id}}'
tool_ids:
# ── 直接面（2026-11-18 用户裁定：缩减 tool_ids，其余工具经两步法动态可达）──
# 保留判据：高频核心（每次任务几乎都用）/ 多模态产出（file_read 图片注入经
# call_tool 转发会丢模态，必须直接）/ 交互与闸门（human_interaction 审批卡、
# task_evaluate 评估证据）/ 两步法本体。其余（文件管理四件套、检索外部源、
# web_operate/phone_control、browser_tool、desktop_*×17、eval 桩、dsh 桥）
# 一律经 resource_search(mode=detailed) 拿定义 → call_tool 转发调用（环境键
# 注入由管道注入级 tool_args_inject 统一完成，动态/原生同一份代码；call_tool
# 只解析参数并透传，ADR 2026-11-18-dynamic-tool-passthrough-injection）。
- file_read
- file_write
- bash
- log
- input
- kill
- enhanced_search
- memory
- task_evaluate
- human_interaction
# 两步法（缺一整链失效：call_tool 门禁只认本次运行已由 resource_search 引入的动态
# 工具——引入一次跨轮持续有效，不必重复搜索）
- resource_search
- call_tool
# 动态面否决集（ADR 2026-11-18-agent-dynamic-tool-deny-list）：L3 执行者不可达
# 任务提交/管理（调度权归 L1/L2）与 L1 宿主写面（触发器/生态/OAuth，容器写面
# 不越界宿主用户根）——搜不到也调不动。
tool_deny:
- task_submit
- task_manage
- trigger_setup
- ecosystem_translate
- ecosystem_apply
- oauth
hard_constraints:
- 任务执行完成后必须调用 task_evaluate 工具进行评估
- 必须输出规定的产出物
- 评估通过才能结束任务
- 遇到无法解决的问题：在任务输出中说明阻塞原因与已尝试路径，由调度方裁决改派或触发资源准备流程（本 agent 无上级上报通道）
soft_constraints:
- 优先使用简单直接的方法
- 执行前确认理解任务
- 每个工具只需调用一次，不要重复调用相同的工具
deliverables:
- name: execution_report
  description: 执行报告，包含任务概述、执行记录、产出物索引、修改记录、已知问题与建议
  output_path: '{{workspace}}/reports/{{task_id}}_report.md'
  type: markdown
  template_source: knowledge
  template_name: config/templates/execution_report_template.md
  required: true
recommended_metrics:
- metric_id: file_check
  default_params:
    action: read
    path: '{{workspace}}/reports/{{task_id}}_report.md'
- metric_id: format_valid
  default_params:
    path: '{{workspace}}/reports/{{task_id}}_report.md'
    type: markdown
version: 2.1.0
is_active: true
status: active
max_iterations: 500
max_reminders: 3
# run 墙钟看门狗不武装（用户裁定 2026-10-17：任务可合法运行数小时，墙钟预算在该
# 场景纯误伤——1016 三任务 timeout 强制终局实证）。防挂死由单次调用上界
# （plugin_call_timeout，内核恒有界）承接，防失控由 max_iterations 承接。
plugins:
  disabled: []
  enabled:
    task_reminder:
      max_reminders: 3
tags:
- specialized
- task
- general
- L3
metadata:
  author: System
  created_at: '2026-01-15'
  updated_at: '2026-06-01'
  capabilities:
  - general_execution
  - file_operations
  - data_processing
  - information_gathering
