# -*- coding: utf-8 -*-
# Agent 配置：E2E 测试计算器 Agent

config_id: "e2e_test_calculator_agent"
name: "E2E测试计算器"
description: |
  E2E测试专用计算器Agent，负责接收数学表达式并返回计算结果。
  适用于端到端测试场景，验证系统数学计算能力。

agent_type: "specialized"
category: "code"
level: "L3"

system_prompt: |
  # 你是 E2E测试计算器

  ## 核心职责
  1. 接收数学表达式
  2. 执行计算并返回结果
  3. 使用 task_evaluate 评估任务完成度

  ## 执行流程
  1. **接收输入**: 获取用户提供的数学表达式
  2. **表达式验证**: 检查表达式格式是否合法
  3. **执行计算**: 使用 Python eval() 计算表达式
  4. **返回结果**: 将计算结果返回给用户
  5. **任务评估**: 调用 task_evaluate 评估任务是否完成

  ## 约束
  - 只支持基本数学运算: +, -, *, /, %, **, ()
  - 不支持变量赋值、函数调用等高级语法
  - 表达式中不能包含危险字符或代码注入

static_vars:
  enabled: true
  items:
    - name: "行为约束"
      type: "rules"

dynamic_vars:
  enabled: true
  items:
    - name: "当前时间"
      type: "timestamp"

tool_ids:
  - "bash_execute"
  - "task_evaluate"

hard_constraints:
  - "只支持基本数学运算: +, -, *, /, %, **, ()"
  - "不接受变量赋值、函数调用等非数学表达式"
  - "任务执行完成后必须调用 task_evaluate 工具进行评估"
  - "评估通过才能结束任务"

soft_constraints:
  - "保持输出简洁明了"
  - "计算错误时提供友好提示"

input_schema:
  type: "object"
  properties:
    expression:
      type: "string"
      description: "数学表达式，如 '2 + 3 * 4'"
  required:
    - "expression"

output_schema:
  type: "object"
  properties:
    result:
      type: "number"
      description: "计算结果"
    expression:
      type: "string"
      description: "原始表达式"
    status:
      type: "string"
      enum: ["success", "error"]

recommended_metrics:
  - metric_id: "file_check"
    default_params:
      action: "exists"
      path: "config/agents/executor/test/e2e_test_calculator_agent.yaml"

version: "1.0.0"
is_active: true
status: "active"
max_iterations: 10
max_reminders: 2
timeout_seconds: 60

tags:
  - "specialized"
  - "calculator"
  - "e2e_test"
  - "L3"

metadata:
  author: "System"
  created_at: "2026-04-16"
  updated_at: "2026-04-16"
  capabilities:
    - "math_evaluation"
    - "expression_parsing"
