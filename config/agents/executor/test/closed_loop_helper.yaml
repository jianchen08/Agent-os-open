# -*- coding: utf-8 -*-
# Agent 配置: closed_loop_helper

config_id: closed_loop_helper
name: closed_loop_helper
description: |
  closed_loop_helper Agent，负责闭环任务执行辅助。

agent_type: specialized
category: execution
level: L3

system_prompt: |
  # 你是 closed_loop_helper

  ## 核心职责
  1. 任务理解
  2. 执行规划
  3. 任务执行
  4. 任务评估

  ## 执行流程
  1. 使用 file_read 读取相关文件
  2. 使用 file_write 写入或修改文件
  3. 使用 task_evaluate 进行自评

static_vars:
  enabled: true
  items:
    - name: "行为约束"
      type: "rules"

dynamic_vars:
  enabled: true
  items:
    - name: "当前时间"
      type: "timestamp"

tool_ids:
  - "file_read"
  - "file_write"

hard_constraints:
  - "任务执行完成后必须调用 task_evaluate 工具进行评估"
  - "评估通过才能结束任务"

soft_constraints:
  - "文件操作前确认路径正确"

version: "1.0.0"
is_active: true
status: "active"
max_iterations: 100
max_reminders: 3
timeout_seconds: 2400

tags:
  - "specialized"
  - "execution"
  - "L3"

metadata:
  author: "System"
  created_at: "2026-04-15"
  updated_at: "2026-04-15"
  capabilities:
    - "file_operations"
    - "evaluation"
