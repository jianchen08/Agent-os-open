# -*- coding: utf-8 -*-
# 测试主 Agent - 仅配备任务提交工具

config_id: "test-mainagent"
name: "测试主Agent"
display_name: "测试主Agent"
description: |
  测试用的主 Agent
agent_type: "main"
category: "system"
level: "L1"

system_prompt: "你是测试主Agent，一个用于测试任务提交流程的简化版AI助手，用于测试各类工具的功能。"
# 静态变量（可缓存，包含约束注入）
static_vars:
  enabled: true
  items:
    # 知识库注入：调研报告模板（全量注入）
    # 约束注入：将硬约束和软约束注入到静态变量
    - name: "行为约束"
      type: "rules"

# 动态变量（每轮变化）
dynamic_vars:
  enabled: true
  items:
    - name: "当前时间"
      type: "timestamp"
# 可用工具 - 配置资源搜索和任务评估工具
tool_ids:
  - "resource_search"
  - "task_submit"
  - "task_manage"
  - "human_interaction"
# 约束
hard_constraints: []

soft_constraints:
  - "优先使用工具而非 LLM 推理"

# 输入输出 Schema
input_schema:
  type: "object"
  properties:
    user_message:
      type: "string"
      description: "用户消息"
    context:
      type: "object"
      description: "上下文信息"
  required:
    - "user_message"

output_schema:
  type: "object"
  properties: {}

# 元数据
version: "1.0.0"
is_active: true
status: "active"
max_iterations: 100
max_reminders: 10
timeout_seconds: -1

tags:
  - "main"
  - "test"
  - "assistant"
  - "L1"

metadata:
  author: "System"
  created_at: "2026-03-01"
  persona: "neutral"
  capabilities:
    - "task_submit"

# ===== 记忆和知识库配置 =====
context_variables:
  enable: true
  include_timestamp: true
  include_session_id: true
  include_user_id: true
  include_model_name: true
  variables:
    agent_name: "测试主Agent"
    agent_level: "L1"

prompt_structure:
  include_system_prompt: true
  include_tools_description: true
  include_system_vars: true
  include_knowledge: true
  include_memory_l1: true
  include_memory_l2: true
  include_memory_l3: true
  include_retrieval: true
  include_user_message: true
  layer_order:
    - "system_prompt"
    - "tools_description"
    - "system_vars"
    - "l3_memory"
    - "l2_memory"
    - "l1_memory"
    - "knowledge"
    - "retrieval"
    - "user_message"

knowledge:
  mode: "compressed"
  max_tokens: 2000
  top_k: 5
  score_threshold: 0.7

memory_injection:
  enable: true
  budget:
    l1_budget: 10000
    l2_budget: 5000
    l3_budget: 2000
    retrieval_budget: 3000
  compression_mode: "auto"
  retrieval_top_k: 5
