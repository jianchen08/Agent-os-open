# UI Schema 示例模块配置
# 包含完整的 identity/actions/rendering/clients 四部分声明
# 包含 8 种聊天交互组件和组合式工作区示例
# 包含 data 声明，自动生成 CRUD 接口

config_id: ui_example
name: UI 示例模块
is_active: true
description: 包含完整 UI Schema 的示例模块配置

# ========== E. 数据声明（自动生成 CRUD 接口） ==========
data:
  # 物品集合 - 完整 CRUD
  inventory:
    fields:
      id: { type: "uuid", primary: true, auto: true }
      name: { type: "string", required: true }
      type: { type: "enum", values: ["weapon", "armor", "potion", "scroll", "misc"] }
      quantity: { type: "integer", default: 1, min: 0 }
      description: { type: "string" }
      rarity: { type: "enum", values: ["common", "uncommon", "rare", "epic", "legendary"] }
    access: "crud"
    filters: ["type", "rarity"]
    sort: ["name", "quantity"]
    pagination: true

  # 任务集合 - 完整 CRUD
  tasks:
    fields:
      id: { type: "uuid", primary: true, auto: true }
      title: { type: "string", required: true }
      status: { type: "enum", values: ["pending", "in_progress", "completed", "cancelled"] }
      priority: { type: "enum", values: ["low", "medium", "high", "urgent"] }
      assignee: { type: "string" }
      tags: { type: "string" }
    access: "crud"
    filters: ["status", "priority", "assignee"]
    sort: ["title", "priority"]
    pagination: true

  # 配置集合 - 只读
  settings:
    fields:
      key: { type: "string", primary: true, required: true }
      value: { type: "string", required: true }
      description: { type: "string" }
    access: "read-only"
    filters: []
    sort: ["key"]
    pagination: false

ui:
  # ========== A. 身份信息 ==========
  identity:
    id: ui_example
    name: UI 示例模块
    version: "1.0.0"
    category: extension
    description: 演示 UI Schema 所有功能的示例模块
    icon: "🧩"
    author: agent-os-team
    tags:
      - demo
      - ui
      - example

  # ========== B. 交互动作 ==========
  actions:
    - id: create_item
      name: 创建项目
      type: command
      label: 创建
      api: /api/modules/ui_example/items
      requiresConfirmation: false
      isDangerous: false

    - id: query_items
      name: 查询项目列表
      type: query
      label: 查询
      api: /api/modules/ui_example/items

    - id: delete_item
      name: 删除项目
      type: command
      label: 删除
      api: /api/modules/ui_example/items
      requiresConfirmation: true
      isDangerous: true

    - id: stream_logs
      name: 实时日志
      type: stream
      label: 日志
      api: /api/modules/ui_example/logs/stream

    - id: notify_event
      name: 事件通知
      type: event
      label: 通知

  # ========== C. 渲染配置 ==========
  rendering:
    # 聊天交互组件 - 8 种类型全部演示
    chat:
      # 1. form - 表单交互
      - type: form
        props:
          fields:
            - name: title
              label: 标题
              type: text
              required: true
            - name: priority
              label: 优先级
              type: select
              options: ["高", "中", "低"]
        dataSource: "module://items/create"

      # 2. chart - 数据图表
      - type: chart
        props:
          chartType: bar
          title: 项目统计
          xField: category
          yField: count
        dataSource: "module://items/stats"
        refreshInterval: 30000

      # 3. gallery - 图片/视频画廊
      - type: gallery
        props:
          columns: 3
          thumbnailSize: medium
          lightbox: true
        dataSource: "module://items/media"

      # 4. table - 数据表格
      - type: table
        props:
          columns:
            - key: id
              label: ID
              width: 80
            - key: title
              label: 标题
            - key: status
              label: 状态
              width: 100
          sortable: true
          filterable: true
          pagination: true
          pageSize: 20
        dataSource: "module://items"

      # 5. progress - 进度条
      - type: progress
        props:
          label: 任务进度
          showPercentage: true
          color: "#1890ff"
        dataSource: "module://items/progress"
        refreshInterval: 5000

      # 6. code_block - 代码块
      - type: code_block
        props:
          language: python
          theme: monokai
          showLineNumbers: true
          runnable: true
        dataSource: "module://items/code"

      # 7. status_card - 状态卡片
      - type: status_card
        props:
          title: 系统状态
          metrics:
            - label: CPU 使用率
              key: cpu
              unit: "%"
              trend: up
            - label: 内存
              key: memory
              unit: "GB"
              trend: stable
        dataSource: "module://items/status"
        refreshInterval: 10000

      # 8. decision - 决策按钮
      - type: decision
        props:
          question: "请选择处理方式"
          options:
            - id: auto
              label: 自动处理
              style: primary
            - id: manual
              label: 手动处理
              style: default
            - id: skip
              label: 跳过
              style: ghost

    # 渲染空间配置 - 组合式工作区示例
    spaces:
      # 工作区面板 - 组合式布局
      - space: workspace
        widget: split
        props:
          direction: horizontal
          ratio: [1, 2]
        layout:
          width: "100%"
          height: "100%"
          resizable: true

      # 悬浮窗 - 状态监控
      - space: floating
        widget: status_card
        props:
          title: 实时监控
          compact: true
        layout:
          width: 300
          height: 200
          position: bottom-right
          draggable: true
          resizable: true
        autoOpen:
          event: on_task_start
          delay: 500

      # 全屏覆盖 - 代码编辑器
      - space: fullscreen
        widget: editor
        props:
          language: python
          theme: dark
        autoOpen:
          event: on_code_edit

    # Dock 栏配置
    dock:
      icon: "🧩"
      label: 示例模块
      indicator: dot
      indicatorColor: "#52c41a"

    # 全屏触发
    fullscreen:
      triggerEvent: on_full_edit
      autoEnter: false

  # ========== D. 客户端适配 ==========
  clients:
    requiredSpaces:
      - chat
      - workspace
    requiredWidgets:
      - form
      - table
      - chart
    minClientVersion: "1.0.0"
    fallback:
      widget: status_card
      space: chat
