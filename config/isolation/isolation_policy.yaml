# 工具隔离策略配置
# 优先级：tools（工具名精确匹配）> categories（分类匹配）> default
#
# 设计原则：
# - 只有「命令执行类」工具需要强制容器隔离（因为它们执行任意命令）
# - 其他工具的隔离级别由分类兜底策略决定
# - 审批由 security_check 插件统一处理，不在策略中配置
#
# 隔离环境按根任务共享，不是每个工具调用创建新环境

# ============================================
# 默认策略（未匹配到的工具走容器隔离，允许降级）
# ============================================
default:
  isolation: container
  execution: command_in_container
  fallback: allow

# ============================================
# 工具级规则（优先级最高，精确匹配工具名）
# ============================================
tools:
  # --- 命令执行类（强制容器隔离，禁止降级）---
  # 这些工具在容器内执行任意命令，必须隔离
  bash_execute:
    isolation: container
    execution: command_in_container
    fallback: deny
    disk_quota: "100m"
    network: restricted

  # --- 内部 API / 数据服务类（宿主机执行，不走容器）---
  # 这些是系统内部工具，直接操作内存/数据库/状态，不需要容器
  task_submit:
    isolation: host
    execution: host_direct
    fallback: allow
  task_manage:
    isolation: host
    execution: host_direct
    fallback: allow
  task_evaluate:
    isolation: host
    execution: host_direct
    fallback: allow
  memory:
    isolation: host
    execution: host_direct
    fallback: allow
  state_update:
    isolation: host
    execution: host_direct
    fallback: allow
  resource_merge:
    isolation: host
    execution: host_direct
    fallback: allow
  trigger_setup:
    isolation: host
    execution: host_direct
    fallback: allow
  human_interaction:
    isolation: host
    execution: host_direct
    fallback: allow

# ============================================
# 分类级规则（匹配不到具体工具名时，按分类兜底）
# ============================================
categories:
  execution:
    isolation: container
    execution: command_in_container
    fallback: deny
  network:
    isolation: container
    execution: command_in_container
    network: nat
    fallback: allow
  file:
    isolation: container
    execution: command_in_container
    fallback: allow
  search:
    isolation: container
    execution: command_in_container
    fallback: allow
  analysis:
    isolation: container
    execution: command_in_container
    fallback: allow
  system:
    isolation: host
    execution: host_direct
    fallback: allow
  evaluation:
    isolation: container
    execution: command_in_container
    fallback: allow
  task:
    isolation: host
    execution: host_direct
    fallback: allow
  memory:
    isolation: host
    execution: host_direct
    fallback: allow
