mode: blacklist

rules:
  - name: "dangerous_commands"
    tools: ["*"]
    params: ["command", "cmd"]
    action: block
    patterns:
      - type: keyword
        value: "rm -rf"
      - type: keyword
        value: "del /s"
      - type: keyword
        value: "format"
      - type: keyword
        value: "mkfs"
      - type: keyword
        value: "dd if="
      - type: keyword
        value: "> /dev/sd"
      - type: keyword
        value: "chmod 777"
      - type: keyword
        value: "chown root"
      - type: keyword
        value: "shutdown"
      - type: keyword
        value: "reboot"
      - type: keyword
        value: "halt"
      - type: keyword
        value: "poweroff"
      - type: keyword
        value: "curl "
      - type: keyword
        value: "wget "
      - type: keyword
        value: "nc -"
      - type: keyword
        value: "netcat "
      - type: keyword
        value: "ncat "
      - type: keyword
        value: "ssh "
      - type: keyword
        value: "scp "
      - type: keyword
        value: "rsync "
      - type: keyword
        value: "iptables"
      - type: keyword
        value: "pip install"
      - type: keyword
        value: "npm install"
      - type: keyword
        value: "yarn add"
      - type: keyword
        value: "apt-get install"
      - type: keyword
        value: "yum install"
      - type: keyword
        value: "brew install"
      - type: keyword
        value: "python -c"
      - type: keyword
        value: "python3 -c"
      - type: keyword
        value: "node -e"
      - type: keyword
        value: "perl -e"
      - type: keyword
        value: "ruby -e"
      - type: keyword
        value: "php -r"
      - type: keyword
        value: "reg add"
      - type: keyword
        value: "reg delete"
      - type: keyword
        value: "regedit"
      - type: keyword
        value: "crontab"
      - type: keyword
        value: "schtasks"
      - type: keyword
        value: "at "
      - type: keyword
        value: "export PATH"
      - type: keyword
        value: "set PATH"
      - type: keyword
        value: "LD_PRELOAD"
      - type: keyword
        value: "no-preserve-root"
      - type: keyword
        value: "2>/dev/null"
      - type: regex
        value: "\\brm\\s+(-\\w*r\\w*f\\w*|-\\w*f\\w*r\\w*)"
      - type: regex
        value: "\\bdel\\s+/[sq]\\b"
      - type: regex
        value: "\\bdd\\s+.*of=/dev/"
      - type: regex
        value: "\\bsudo\\s+(rm|dd|mkfs|format|fdisk|parted)\\b"
      - type: regex
        value: "\\|\\s*(ba)?sh\\b"
      - type: regex
        value: "(bash|sh|nc|ncat)\\s+-[ep]\\s"
      - type: regex
        value: "\\b(eval|exec)\\s*\\("
      - type: regex
        value: "(Remove-Item|Invoke-WebRequest|Start-Process)"
      - type: regex
        value: "\\b(fdisk|parted|mkfs|mount\\s+/dev/)\\b"

  - name: "protected_paths"
    tools: ["*"]
    params: ["path", "file_path", "directory", "dest", "target", "output_path"]
    action: block
    patterns:
      - type: keyword
        value: "/etc/passwd"
      - type: keyword
        value: "/etc/shadow"
      - type: keyword
        value: "/etc/sudoers"
      - type: keyword
        value: "/etc/ssh"
      - type: keyword
        value: "/root/.ssh"
      - type: keyword
        value: "/home/.ssh"
      - type: keyword
        value: "C:\\Windows\\System32"
      - type: keyword
        value: "C:\\Windows\\SysWOW64"
      - type: keyword
        value: "/System/Library"
      - type: keyword
        value: "/usr/lib/systemd"
      - type: keyword
        value: "/boot/"
      - type: keyword
        value: "/efi/"

  - name: "ssrf_protection"
    tools: ["fetch", "web"]
    params: ["url"]
    action: block
    patterns:
      - type: keyword
        value: "localhost"
      - type: keyword
        value: "127.0.0."
      - type: keyword
        value: "0.0.0.0"
      - type: keyword
        value: "169.254."
      - type: keyword
        value: "[::1]"
      - type: keyword
        value: "file://"
      - type: keyword
        value: "gopher://"
      - type: keyword
        value: "dict://"
      - type: regex
        value: "10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}"
      - type: regex
        value: "192\\.168\\.\\d{1,3}\\.\\d{1,3}"
      - type: regex
        value: "172\\.(1[6-9]|2\\d|3[01])\\.\\d{1,3}\\.\\d{1,3}"

  - name: "high_risk_operations"
    tools: ["*"]
    params: ["command", "cmd"]
    action: needs_approval
    patterns:
      - type: keyword
        value: "sudo "
      - type: keyword
        value: "runas "
      - type: keyword
        value: "su -"
      - type: keyword
        value: "docker run"
      - type: keyword
        value: "docker exec"
      - type: keyword
        value: "kubectl apply"
      - type: keyword
        value: "kubectl delete"

  - name: "subprocess_git_only"
    tools: ["resource_merge"]
    params: ["command"]
    action: block
    patterns:
      - type: regex
        value: "^(?!git\\s).+"
