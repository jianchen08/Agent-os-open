# -*- coding: utf-8 -*-
# 内置评估指标配置
# 应用启动时自动同步到数据库

metrics:
  # ========== 文件检查 ==========
  - name: file_check
    description: 文件/目录检查（存在性、非空、内容匹配）
    category: file
    evaluator_type: tool
    evaluator_id: file_evaluator
    level: 1  # 基础层级
    includes: []  # 独立指标，不包含其他
    requires: []  # 无前置依赖
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: 文件或目录路径
        check:
          type: string
          enum: [exists, not_empty, contains, is_directory]
          description: 检查类型
          default: exists
        pattern:
          type: string
          description: 内容匹配模式（check=contains 时使用）
        min_size:
          type: integer
          description: 最小字节数（check=not_empty 时使用）
          default: 1
      required: [path]
    tags: [file, existence, content]

  # ========== 格式验证 ==========
  - name: format_valid
    description: 数据格式验证（JSON/YAML/Schema）
    category: schema
    evaluator_type: tool
    evaluator_id: schema_evaluator
    level: 2  # 格式层级
    includes: [file_check]  # 包含文件存在检查
    requires: []  # 无前置依赖
    input_schema:
      type: object
      properties:
        data:
          description: 要验证的数据（字符串或对象）
        path:
          type: string
          description: 或指定文件路径
        format:
          type: string
          enum: [json, yaml, schema]
          description: 验证格式类型
          default: json
        schema:
          type: object
          description: JSON Schema（format=schema 时使用）
    tags: [schema, json, yaml, validation]

  # ========== 语义检查 ==========
  - name: semantic_check
    description: 语义检查（意图覆盖、匹配、幻觉）
    category: semantic
    evaluator_type: agent
    evaluator_id: evaluator_agent
    level: 3  # 语义层级
    includes: []  # 独立指标（语义检查不依赖文件）
    requires: []  # 无前置依赖
    input_schema:
      type: object
      properties:
        output:
          type: string
          description: 要检查的输出
        check:
          type: string
          enum: [intent, match, hallucination]
          description: 检查类型
          default: match
        intents:
          type: array
          items:
            type: string
          description: 用户意图列表（check=intent 时使用）
        expected:
          type: string
          description: 期望的语义描述（check=match 时使用）
        references:
          type: array
          items:
            type: string
          description: 参考资料（check=hallucination 时使用）
      required: [output]
    tags: [semantic, intent, match, hallucination]


