# -*- coding: utf-8 -*-
# 内置评估指标配置
# 应用启动时自动同步到数据库

metrics:
  # ========== 文件检查 ==========
  - name: file_check
    description: 文件/目录检查（存在性、非空、内容匹配）
    category: file
    evaluator_type: tool
    evaluator_id: file_evaluator
    level: 1  # 基础层级
    includes: []  # 独立指标，不包含其他
    requires: []  # 无前置依赖
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: 文件或目录路径
        check:
          type: string
          enum: [exists, not_empty, contains, is_directory]
          description: 检查类型
          default: exists
        pattern:
          type: string
          description: 内容匹配模式（check=contains 时使用）
        min_size:
          type: integer
          description: 最小字节数（check=not_empty 时使用）
          default: 1
      required: [path]
    tags: [file, existence, content]

  # ========== 格式验证 ==========
  - name: format_valid
    description: 数据格式验证（JSON/YAML/Schema）
    category: schema
    evaluator_type: tool
    evaluator_id: schema_evaluator
    level: 2  # 格式层级
    includes: [file_check]  # 包含文件存在检查
    requires: []  # 无前置依赖
    input_schema:
      type: object
      properties:
        data:
          description: 要验证的数据（字符串或对象）
        path:
          type: string
          description: 或指定文件路径
        format:
          type: string
          enum: [json, yaml, schema]
          description: 验证格式类型
          default: json
        schema:
          type: object
          description: JSON Schema（format=schema 时使用）
    tags: [schema, json, yaml, validation]

  # ========== 测试检查 ==========
  - name: test_check
    description: 测试执行检查（通过率、覆盖率）
    category: test
    evaluator_type: tool
    evaluator_id: test_evaluator
    level: 2  # 内容层级
    includes: [file_check]  # 包含文件存在检查
    requires: []  # 无前置依赖
    input_schema:
      type: object
      properties:
        check:
          type: string
          enum: [passed, coverage]
          description: 检查类型
          default: passed
        path:
          type: string
          description: 测试文件或目录路径
        command:
          type: string
          description: 测试命令
          default: pytest
        min_coverage:
          type: number
          description: 最低覆盖率百分比（check=coverage 时使用）
          default: 80
    tags: [test, pytest, coverage]

  # ========== 代码检查 ==========
  - name: code_check
    description: 代码静态检查（Lint/语法/类型）
    category: code
    evaluator_type: tool
    evaluator_id: code_evaluator
    level: 2  # 内容层级
    includes: [file_check]  # 包含文件存在检查
    requires: []  # 无前置依赖
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: 代码文件或目录路径
        check:
          type: string
          enum: [lint, syntax, type]
          description: 检查类型
          default: lint
        tool:
          type: string
          description: 检查工具（lint=ruff, type=mypy）
        language:
          type: string
          description: 编程语言
          default: python
      required: [path]
    tags: [code, lint, syntax, type]

  # ========== API 检查 ==========
  - name: api_check
    description: API 响应检查（状态码、Schema）
    category: api
    evaluator_type: tool
    evaluator_id: api_evaluator
    level: 2  # 内容层级
    includes: []  # 独立指标（API不依赖文件）
    requires: []  # 无前置依赖
    input_schema:
      type: object
      properties:
        url:
          type: string
          description: API URL
        method:
          type: string
          enum: [GET, POST, PUT, DELETE, PATCH]
          default: GET
        check:
          type: string
          enum: [status, schema]
          description: 检查类型
          default: status
        expected_status:
          type: array
          items:
            type: integer
          description: 期望的状态码
          default: [200]
        schema:
          type: object
          description: 期望的响应 Schema（check=schema 时使用）
        headers:
          type: object
          description: 请求头
        body:
          description: 请求体
      required: [url]
    tags: [api, http, response]

  # ========== 命令执行检查 ==========
  - name: command_check
    description: 命令执行检查（成功/超时）
    category: execution
    evaluator_type: tool
    evaluator_id: bash_evaluator
    level: 1  # 基础层级
    includes: []  # 独立指标
    requires: []  # 无前置依赖
    input_schema:
      type: object
      properties:
        command:
          type: string
          description: 要执行的命令
        check:
          type: string
          enum: [success, time]
          description: 检查类型
          default: success
        max_seconds:
          type: number
          description: 最大执行时间（check=time 时使用）
        working_dir:
          type: string
          description: 工作目录
      required: [command]
    tags: [execution, bash, command]

  # ========== 质量评估（语义） ==========
  - name: quality_check
    description: 代码/文档质量评估
    category: semantic
    evaluator_type: agent
    evaluator_id: evaluator_agent
    level: 3  # 语义层级
    includes: [file_check, code_check]  # 包含文件和代码检查
    requires: []  # 无前置依赖
    default_config:
      criteria:
        - 结构清晰
        - 命名规范
        - 注释充分
        - 遵循最佳实践
    input_schema:
      type: object
      properties:
        content:
          type: string
          description: 要评估的内容
        path:
          type: string
          description: 或指定文件路径
        type:
          type: string
          enum: [code, doc, config]
          description: 内容类型
          default: code
        criteria:
          type: array
          items:
            type: string
          description: 评估标准（覆盖默认）
    tags: [semantic, quality, code, doc]

  # ========== 语义检查 ==========
  - name: semantic_check
    description: 语义检查（意图覆盖、匹配、幻觉）
    category: semantic
    evaluator_type: agent
    evaluator_id: evaluator_agent
    level: 3  # 语义层级
    includes: []  # 独立指标（语义检查不依赖文件）
    requires: []  # 无前置依赖
    input_schema:
      type: object
      properties:
        output:
          type: string
          description: 要检查的输出
        check:
          type: string
          enum: [intent, match, hallucination]
          description: 检查类型
          default: match
        intents:
          type: array
          items:
            type: string
          description: 用户意图列表（check=intent 时使用）
        expected:
          type: string
          description: 期望的语义描述（check=match 时使用）
        references:
          type: array
          items:
            type: string
          description: 参考资料（check=hallucination 时使用）
      required: [output]
    tags: [semantic, intent, match, hallucination]


