# 新建任务表单声明（task_form 服务插件消费，config_files.task_form.path 唯一真相源）。
#
# 前端 "新建任务" 模态框经 fieldsUri=/ext/task_form/form 拉此声明渲染（FormWidget），
# 字段的 datasourceUri 指示内核数据源（前端按填写的值自行去内核取对应选项）；
# dependsOn 声明值变化时重新取数。提交语义仍在前端（createRootTask 派发矩阵）。
form:
  id: task_create
  title: 新建任务
  fields:
    - name: title
      type: input
      label: 标题
      required: true
      placeholder: 输入任务标题...
    - name: description
      type: textarea
      label: 描述（可选）
      placeholder: 任务详细描述...
    - name: parent_task_id
      type: select
      label: 父容器（可选，选则挂为子任务，工作空间继承）
      datasourceUri: /ext/task_form/options/containers
      description: 工作空间继承父容器；session 由 /ext/task_form/form 内嵌
    - name: task_scope
      type: select
      label: 任务类型
      default: non_container
      options:
        - { label: 非容器（直接执行）, value: non_container }
        - { label: 容器（工作空间集合）, value: container }
      description: 选了父容器则为非容器子任务
    - name: target_id
      type: select
      label: 执行 Agent（非容器必填）
      datasourceUri: /ext/task_form/options/agents
      dependsOn: [task_scope]
      description: 容器任务不直接执行，无需选择
    - name: workspace
      type: input
      label: 工作空间（可选）
      placeholder: 留空使用默认工作空间...
    - name: workspace_mode
      type: select
      label: 工作空间拓扑
      options:
        - { label: 默认（worktree）, value: "" }
        - { label: worktree（隔离副本，不影响原项目）, value: worktree }
        - { label: plain（直接操作目标目录）, value: plain }
      description: 容器任务恒为隔离复制，此选项不生效
    - name: isolation_level
      type: select
      label: 隔离模式
      options:
        - { label: 默认（隔离）, value: "" }
        - { label: 隔离, value: isolated }
        - { label: 非隔离, value: non_isolated }
