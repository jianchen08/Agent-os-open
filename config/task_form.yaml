# 新建任务表单声明（task_form 服务插件消费，config_files.task_form.path 唯一真相源）。
#
# 前端 "新建任务" 模态框经 fieldsUri=/ext/task_form/form 拉此声明渲染（FormWidget），
# 字段的 datasourceUri 指示内核数据源（前端按填写的值自行去内核取对应选项）。
# 提交语义在前端（createRootTask 派发）。
form:
  id: task_create
  title: 新建任务
  fields:
    - name: title
      type: input
      label: 标题
      required: true
      placeholder: 输入任务标题...
    - name: description
      type: textarea
      label: 描述（可选）
      placeholder: 任务详细描述...
    - name: project_id
      type: select
      label: 挂靠项目（可选，任务在项目文件夹下执行，默认 worktree 分叉）
      datasourceUri: /ext/task_form/options/projects
      description: 缺省为独立任务；与「新建项目」二选一
    - name: project_title
      type: input
      label: 新建项目标题（可选）
      placeholder: 填了则创建项目并挂靠（目录缺省自动生成）
      description: 与「挂靠项目」二选一；已存在目录非 git 仓库会自动 git init
    - name: project_path
      type: input
      label: 新建项目目录（可选）
      placeholder: 留空自动生成 {工作空间}/projects/<标题>
      description: 配合「新建项目标题」；已存在目录直接复用
    - name: target_id
      type: select
      label: 执行 Agent（必填）
      datasourceUri: /ext/task_form/options/agents
      description: 任务由该 Agent 配置执行
    - name: workspace
      type: input
      label: 工作空间（可选）
      placeholder: 留空使用默认工作空间；挂靠项目时恒为项目文件夹
    - name: workspace_mode
      type: select
      label: 工作空间拓扑
      options:
        - { label: 默认（worktree）, value: "" }
        - { label: worktree（隔离副本，不影响原项目）, value: worktree }
        - { label: plain（直接操作目标目录）, value: plain }
    - name: isolation_level
      type: select
      label: 隔离模式
      options:
        - { label: 默认（隔离）, value: "" }
        - { label: 隔离, value: isolated }
        - { label: 非隔离, value: non_isolated }
