    reasoning_model: true
    default_params:
      temperature: 0.7
      max_tokens: 100000
      thinking:
        type: enabled
      reasoning_effort: max
  minimax-m2.7:
    provider: minimax
    model_name: MiniMax-M2.7
    display_name: MiniMax-M2.7
    api_base: https://api.minimaxi.com/v1
    api_key: [REDACTED]
    context_window: 204800
    reasoning_model: true
    default_params:
      temperature: 0.7
      max_tokens: 8192
defaults:
  chat: minimax-m2.7
  reasoning: minimax-m2.7
  embedding: embedding-3
  call_timeout: 120
  tiers:
    large: glm-5.1
    medium: minimax-m2.7
    small: minimax-m2.7
  fallback_chain:
