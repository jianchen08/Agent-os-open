concurrency:
  default_max_concurrent: 2
  max_concurrent_pipelines: 5
defaults:
  call_timeout: 600
  chat: deepseek-v4-flash
  compression: minimax-m3
  embedding: embedding-3
  first_token_timeout: 120
  stream_idle_timeout: 180
  tiers:
    large: minimax-m3
    medium: minimax-m3
    small: minimax-m3
embeddings: {}
models:
  deepseek-v4-flash:
    api_base: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
    context_window: 1000000
    default_params:
      max_tokens: 100000
      reasoning_effort: max
      reasoning_retention:
        sample_interval: 3
      temperature: 0.7
      thinking:
        type: enabled
    display_name: DeepSeek V4 Flash
    model_name: deepseek-v4-flash
    provider: deepseek
    reasoning_model: true
    # 思考强度 → 思考参数路由规则（模型级，不同模型可不同；未配置档位回退
    # llm_core 内置默认表）。只覆盖思考相关参数（reasoning_effort / thinking）；
    # temperature/max_tokens 等采样参数不随强度变化（始终用 default_params）。
    # DeepSeek 经 openai 中转时 reasoning_effort 自动进 extra_body 透传。
    thinking_strength_params:
      low:
        reasoning_effort: low
      medium:
        reasoning_effort: medium
      high:
        reasoning_effort: max
  deepseek-v4-pro:
    api_base: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
    context_window: 1000000
    default_params:
      max_tokens: 100000
      reasoning_effort: max
      reasoning_retention:
        sample_interval: 3
      temperature: 0.7
      thinking:
        type: enabled
    display_name: DeepSeek V4 Pro
    model_name: deepseek-v4-pro
    provider: deepseek
    reasoning_model: true
  embedding-2:
    api_base: https://open.bigmodel.cn/api/coding/paas/v4/
    context_window: 1000000
    dimension: 1024
    display_name: Embedding-2
    model_name: embedding-2
    provider: zhipu_coding
  embedding-3:
    api_base: https://open.bigmodel.cn/api/coding/paas/v4/
    context_window: 1000000
    dimension: 2048
    display_name: Embedding-3
    model_name: embedding-3
    provider: zhipu_coding
  bge-m3:
    # BAAI/bge-m3 @ 硅基流动（免费，国内直连，1024 维，8K 上下文）
    # 用于 Hindsight 记忆库向量检索。OpenAI 兼容端点。
    api_base: https://api.siliconflow.cn/v1/
    context_window: 8192
    dimension: 1024
    display_name: BGE-M3 (SiliconFlow)
    model_name: BAAI/bge-m3
    provider: siliconflow
  glm-5.2:
    api_base: https://open.bigmodel.cn/api/coding/paas/v4/
    context_window: 1000000
    default_params:
      extra_body:
        tool_stream: true
      max_tokens: 100000
      reasoning_effort: max
      temperature: 0.7
      thinking:
        type: enabled
    display_name: GLM-5.2
    model_name: glm-5.2
    multimodal:
      max_image_size: 20971520
      supported_image_types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      supports_image: true
    provider: zhipu_coding
    reasoning_model: true
  minimax-m3:
    api_base: https://api.minimaxi.com/v1
    context_window: 1000000
    default_params:
      max_tokens: 100000
      temperature: 0.7
      thinking:
        type: adaptive
    display_name: MiniMax-M3
    model_name: MiniMax-M3
    multimodal:
      max_image_size: 20971520
      max_video_size: 104857600
      supported_image_types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      supports_image: true
      supports_video: true
    provider: minimax
    reasoning_model: true
  mock-llm:
    api_base: http://127.0.0.1:18080/v1
    api_key: '****'
    context_window: 1000000
    default_params:
      max_tokens: 4096
      temperature: 0.7
    display_name: Mock LLM (本地验证)
    model_name: mock-llm
    provider: mock_llm
providers:
  anthropic:
    # Anthropic 官方（litellm 原生 anthropic 前缀）。获取 key: https://console.anthropic.com
    api_base: https://api.anthropic.com
    keys:
    - api_key: ${ANTHROPIC_API_KEY}
      id: anthropic_main
      max_concurrent: 6
      rpm: 10
      token_quota: 0
    type: anthropic
  cerebras:
