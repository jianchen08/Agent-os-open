concurrency:
  default_max_concurrent: 2
  max_concurrent_pipelines: 5
defaults:
  call_timeout: 600
  chat: deepseek-v4-flash
  compression: minimax-m3
  embedding: embedding-3
  first_token_timeout: 120
  stream_idle_timeout: 180
  tiers:
    large: minimax-m3
    medium: minimax-m3
    small: minimax-m3
embeddings: {}
models:
  deepseek-v4-flash:
    api_base: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
    context_window: 1000000
    default_params:
      max_tokens: 100000
      reasoning_effort: max
      reasoning_retention:
        sample_interval: 3
      temperature: 0.7
      thinking:
        type: enabled
    display_name: DeepSeek V4 Flash
    model_name: deepseek-v4-flash
    provider: deepseek
    reasoning_model: true
  deepseek-v4-pro:
    api_base: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
    context_window: 1000000
    default_params:
      max_tokens: 100000
      reasoning_effort: max
      reasoning_retention:
        sample_interval: 3
      temperature: 0.7
      thinking:
        type: enabled
    display_name: DeepSeek V4 Pro
    model_name: deepseek-v4-pro
    provider: deepseek
    reasoning_model: true
  embedding-2:
    api_base: https://open.bigmodel.cn/api/coding/paas/v4/
    context_window: 1000000
    dimension: 1024
    display_name: Embedding-2
    model_name: embedding-2
    provider: zhipu_coding
  embedding-3:
    api_base: https://open.bigmodel.cn/api/coding/paas/v4/
    context_window: 1000000
    dimension: 2048
    display_name: Embedding-3
    model_name: embedding-3
    provider: zhipu_coding
  glm-5.2:
    api_base: https://open.bigmodel.cn/api/coding/paas/v4/
    context_window: 1000000
    default_params:
      extra_body:
        tool_stream: true
      max_tokens: 100000
      reasoning_effort: max
      temperature: 0.7
      thinking:
        type: enabled
    display_name: GLM-5.2
    model_name: glm-5.2
    multimodal:
      max_image_size: 20971520
      supported_image_types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      supports_image: true
    provider: zhipu_coding
    reasoning_model: true
  glm-5.2-yi:
    api_base: https://ai.1cc.ai/v1
    context_window: 1000000
    default_params:
      extra_body:
        tool_stream: true
      max_tokens: 100000
      reasoning_effort: max
      temperature: 0.7
      thinking:
        type: enabled
    display_name: GLM-5.2-YC
    model_name: glm-5.2
    multimodal:
      max_image_size: 20971520
      supported_image_types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      supports_image: true
    provider: yichengc
    reasoning_model: true
  minimax-m3:
    api_base: https://api.minimaxi.com/v1
    context_window: 1000000
    default_params:
      max_tokens: 100000
      temperature: 0.7
      thinking:
        type: adaptive
    display_name: MiniMax-M3
    model_name: MiniMax-M3
    multimodal:
      max_image_size: 20971520
      max_video_size: 104857600
      supported_image_types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      supports_image: true
      supports_video: true
    provider: minimax
    reasoning_model: true
  mock-llm:
    api_base: http://127.0.0.1:18080/v1
    api_key: '****'
    context_window: 1000000
    default_params:
      max_tokens: 4096
      temperature: 0.7
    display_name: Mock LLM (本地验证)
    model_name: mock-llm
    provider: mock_llm
providers:
  deepseek:
    api_base: https://api.deepseek.com/v1
    keys:
    - api_key: ${DEEPSEEK_API_KEY}
      id: deepseek_main
      max_concurrent: 6
      rpm: 10
      token_quota: 0
    type: deepseek
  minimax:
    api_base: https://api.minimaxi.com/v1
    keys:
    - api_key: ${MINIMAX_API_KEY}
      id: minimax_main
      max_concurrent: 6
      rpm: 10
      token_quota: 0
    type: minimax
  mock_llm:
    api_base: http://127.0.0.1:18080/v1
    keys:
    - api_key: '****'
      id: mock_main
      max_concurrent: 6
      rpm: 100
      token_quota: 0
    type: openai
  yichengc:
    api_base: https://ai.1cc.ai/v1
    keys:
    - api_key: ${YICHENGC_API_KEY}
      id: yichengc_main
      max_concurrent: 6
      rpm: 12
      token_quota: 0
    type: openai
  zhipu:
    api_base: https://open.bigmodel.cn/api/paas/v4/
    keys:
    - api_key: ${ZHIPU_API_KEY}
      id: zhipu_main
      max_concurrent: 6
      rpm: 10
      token_quota: 0
    type: zai
  zhipu_coding:
    api_base: https://open.bigmodel.cn/api/coding/paas/v4/
    keys:
    - api_key: ${ZHIPU_API_KEY}
      id: zhipu_coding_main
      max_concurrent: 6
      rpm: 10
      token_quota: 0
    type: zai
