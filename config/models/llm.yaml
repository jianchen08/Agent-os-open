models:
  glm-5.2:
    provider: zhipu_coding
    model_name: glm-5.2
    display_name: GLM-5.2
    api_base: https://open.bigmodel.cn/api/coding/paas/v4/
    context_window: 1000000
    reasoning_model: true
    default_params:
      temperature: 0.7
      max_tokens: 16384
    multimodal:
      supports_image: true
      supported_image_types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      max_image_size: 20971520
  embedding-3:
    provider: zhipu_coding
    model_name: embedding-3
    display_name: Embedding-3
    api_base: https://open.bigmodel.cn/api/coding/paas/v4/
    context_window: 128000
    dimension: 2048
  embedding-2:
    provider: zhipu_coding
    model_name: embedding-2
    display_name: Embedding-2
    api_base: https://open.bigmodel.cn/api/coding/paas/v4/
    context_window: 128000
    dimension: 1024
  deepseek-v4-flash:
    provider: deepseek
    model_name: deepseek-v4-flash
    display_name: DeepSeek V4 Flash
    api_base: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
    context_window: 1000000
    reasoning_model: true
    default_params:
      temperature: 0.7
      max_tokens: 100000
      thinking:
        type: enabled
      reasoning_effort: max
  deepseek-v4-pro:
    provider: deepseek
    model_name: deepseek-v4-pro
    display_name: DeepSeek V4 Pro
    api_base: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
    context_window: 1000000
    reasoning_model: true
    default_params:
      temperature: 0.7
      max_tokens: 100000
      thinking:
        type: enabled
      reasoning_effort: max
  minimax-m3:
    provider: minimax
    model_name: MiniMax-M3
    display_name: MiniMax-M3
    api_base: https://api.minimaxi.com/v1
    context_window: 1048576
    reasoning_model: true
    default_params:
      temperature: 0.7
      max_tokens: 8192
      thinking:
        type: enabled
    multimodal:
      supports_image: true
      supports_video: true
      supported_image_types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      max_image_size: 20971520
      max_video_size: 104857600
defaults:
  chat: deepseek-v4-flash
  embedding: embedding-3
  call_timeout: 300
  compression: minimax-m3
  tiers:
    large: deepseek-v4-pro
    medium: minimax-m3
    small: minimax-m3
    fallback_chain:
      chat:
      - minimax-m3
      - minimax-m3
providers:
  zhipu_coding:
    api_base: https://open.bigmodel.cn/api/coding/paas/v4/
    keys:
    - id: zhipu_coding_main
      api_key: ${ZHIPU_API_KEY}
      max_concurrent: 7
      rpm: 120
      token_quota: 0
    - id: zhipu_coding_2
      api_key: ${ZHIPU_API_KEY_2}
      max_concurrent: 3
      rpm: 150
      token_quota: 0
  zhipu:
    api_base: https://open.bigmodel.cn/api/paas/v4/
    keys:
    - id: zhipu_main
      api_key: ${ZHIPU_API_KEY}
      rpm: 120
      token_quota: 0
    - id: zhipu_2
      api_key: ${ZHIPU_API_KEY_2}
      rpm: 20
      token_quota: 0
  deepseek:
    api_base: https://api.deepseek.com/v1
    keys:
    - id: deepseek_main
      api_key: ${DEEPSEEK_API_KEY}
      rpm: 30
      token_quota: 0
  minimax:
    api_base: https://api.minimaxi.com/v1
    keys:
    - id: minimax_main
      api_key: ${MINIMAX_API_KEY}
      max_concurrent: 5
      rpm: 0
      token_quota: 0
embeddings: {}
concurrency:
  max_concurrent_pipelines: 5
  default_max_concurrent: 2
