# 嵌入模型配置
# 用于文本向量化和语义搜索

# 嵌入模型配置
embeddings:
  # 智谱嵌入模型 (推荐)
  zhipu:
    provider: zhipu
    model_name: embedding-3
    display_name: 智谱 Embedding-3
    dimension: 1024
    api_base: https://open.bigmodel.cn/api/paas/v4/
    max_batch_size: 100
    
  # 智谱高维度嵌入模型
  zhipu-hd:
    provider: zhipu_coding
    model_name: embedding-3
    display_name: 智谱 Embedding-3 (高维度)
    dimension: 2048
    api_base: https://open.bigmodel.cn/api/coding/paas/v4/
    max_batch_size: 50

  # 智谱标准嵌入模型
  zhipu-standard:
    provider: zhipu_coding
    model_name: embedding-2
    display_name: 智谱 Embedding-2
    dimension: 1024
    api_base: https://open.bigmodel.cn/api/coding/paas/v4/
    max_batch_size: 100

  # 本地嵌入模型 (备用)
  local:
    provider: sentence_transformers
    model_name: sentence-transformers/all-MiniLM-L6-v2
    display_name: 本地 MiniLM
    dimension: 384
    max_batch_size: 32
    device: cpu  # 或 cuda

  # OpenAI 嵌入模型 (备用)
  openai:
    provider: openai
    model_name: text-embedding-3-small
    display_name: OpenAI Embedding Small
    dimension: 1536
    api_base: https://api.openai.com/v1
    max_batch_size: 100

# 默认嵌入模型
default_embedding: zhipu

# 嵌入模型提供商配置
providers:
  # 智谱 AI
  zhipu:
    api_key: "${APP_ZHIPU_API_KEY}"
    api_base: https://open.bigmodel.cn/api/paas/v4/

  # 智谱 AI Coding Plan
  zhipu_coding:
    api_key: "${APP_ZHIPU_API_KEY}"
    api_base: https://open.bigmodel.cn/api/coding/paas/v4/

  # OpenAI
  openai:
    api_key: ""  # 需要设置 OPENAI_API_KEY 环境变量
    api_base: https://api.openai.com/v1

  # 本地模型
  sentence_transformers:
    cache_dir: "./models/embeddings"
    device: "cpu"  # 或 "cuda"

# 嵌入缓存配置
cache:
  enabled: true
  ttl: 3600  # 缓存1小时
  max_size: 10000  # 最大缓存条目数