# 推理规则配置

# 高风险工具列表
high_risk_tools:
  # 文件操作
  - delete_file
  - move_file
  - write_file  # 覆盖写入
  
  # 数据库操作
  - drop_table
  - truncate_table
  - alter_table
  - delete_records
  
  # 系统操作
  - execute_bash
  - kill_process
  - shutdown_system

# 推理规则
reasoning_rules:
  max_retries: 2  # 最多重试2次
  auto_pass_after_retries: true  # 超过重试次数后自动通过（降级处理）
  
  # 推理要求
  required_sections:
    - intent      # 意图分析
    - impact      # 影响分析
    - strategy    # 执行策略

# 存储策略
storage:
  mode: "summary"  # full | summary | minimal
  save_to_db: true
  compress_in_messages: true

# 消息压缩
message_compression:
  enabled: true
  max_reasoning_length: 100
  placeholder: "[已完成推理和影响分析]"
