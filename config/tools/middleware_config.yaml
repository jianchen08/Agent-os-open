# 中间件配置
# 控制工具执行前的各种检查功能

# 中间件功能开关
enabled:
  reasoning: false    # 推理检查（高风险工具执行前要求 AI 推理）
  permission: true    # 权限检查（控制参数访问范围）

# 推理检查配置
reasoning:
  high_risk_tools:
    - execute_shell
    - delete_file
    - write_file
  max_retries: 2
  auto_pass_after_retries: true

# 权限检查配置
permission:
  # 路径权限规则
  path_rules:
    # 写入类工具：路径必须在 workspace 内
    file_write:
      path:
        condition: within_workspace
        mode: write
    
    # 读取类工具：根据隔离模式决定
    file_read:
      path:
        condition: within_workspace_if_container
        mode: read
    
    # 搜索类工具：不限制
    enhanced_search:
      path:
        condition: none
        mode: read
    
    # Bash 工具：工作目录限制
    bash_execute:
      working_dir:
        condition: within_workspace
        mode: execute

    # LSP 工具：文件路径读取，容器模式下限制在 workspace 内
    lsp_definition:
      file_path:
        condition: within_workspace_if_container
        mode: read

    lsp_references:
      file_path:
        condition: within_workspace_if_container
        mode: read

    lsp_diagnostics:
      file_path:
        condition: within_workspace_if_container
        mode: read

    # 文件跳转工具：文件路径读取，容器模式下限制在 workspace 内
    file_jump:
      file_path:
        condition: within_workspace_if_container
        mode: read
