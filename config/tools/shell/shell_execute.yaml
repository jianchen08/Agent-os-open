# -*- coding: utf-8 -*-
# Shell 执行工具

name: bash_execute
display_name: "命令执行"
description: "Shell 命令执行工具：执行 Shell 命令并返回结果"

category: "shell"
level: "user"

# 权限配置
requires_approval: true  # 默认需要审批
dangerous_operations:
  - "rm -rf"
  - "format"
  - "del /q"
  - "shutdown"
  - "reboot"
  - "mkfs"
  - "dd if="
  - "> /dev/sd"
  - "curl"
  - "wget"

# 缓存配置
cache:
  enabled: false  # 有副作用，不缓存

# 标签
tags: ["shell", "command", "dangerous"]
