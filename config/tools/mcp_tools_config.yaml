# -*- coding: utf-8 -*-
# MCP 系统级配置
# 服务器连接配置放在各服务器目录的 mcp.json 中
# 此文件只保留系统级配置（权限、缓存等）

# MCP 工具映射（可选，用于覆盖 MCP 工具的元数据）
tool_mappings: {}

# 缓存配置
mcp_cache:
  enabled: true
  default_ttl: 300

# 权限配置
permission_policies:
  admin:
    can_use_mcp: true
    auto_approve_mcp_tools:
      - '*'
  developer:
    can_use_mcp: true
    auto_approve_mcp_tools: []
    require_approval_mcp_tools:
      - '*'
  readonly:
    can_use_mcp: false
