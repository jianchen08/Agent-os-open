# ================================================================
# 能力适配器后端配置
# ================================================================
#
# 快速启用步骤：
#   1. 把目标后端的 available 改为 true
#   2. 确认 server.command/args 指向正确的 MCP 服务
#   3. 如需环境变量，在 server.env 中配置（支持 ${VAR} 插值）
#   4. 无需重启，下次调用自动加载最新配置
#
# tool_mapping 说明：
#   左侧是适配器的操作名（固定），右侧是 MCP Server 暴露的工具名。
#   安装 MCP Server 后，可用 tools/list 查看实际工具名并更新映射。
#
# 回退机制：
#   同一适配器下多个后端按 priority 排序，第一个 available=true 的后端优先。
#   主后端调用失败时自动回退到下一个。
#
# Windows 注意：
#   command 使用 npx.cmd 而非 npx（Python subprocess 兼容性）
# ================================================================

adapters:
  # ============================================================
  # UI 代码生成：从文字描述/截图 → 前端代码
  # ============================================================
  design_generate:
    default_backend: magic
    backends:
      # --- 21st.dev Magic（已安装，组件生成）---
      # 需要 API Key：https://21st.dev/magic 获取，设置环境变量 MAGIC_API_KEY
      # 工具映射说明：
      #   generate: 用 inspiration 搜索组件（纯API，无需浏览器）
      #   build: 用 component_builder 创建组件（需打开浏览器）
      #   refine: 用 component_refiner 改进组件（纯API）
      - name: magic
        priority: 1
        server:
          command: "npx.cmd"
          args: ["-y", "@21st-dev/magic@latest"]
          env:
            API_KEY: "${MAGIC_API_KEY}"
        tool_mapping:
          generate: "21st_magic_component_inspiration"
          build: "21st_magic_component_builder"
          refine: "21st_magic_component_refiner"
        timeout: 60.0
        overall_timeout: 120.0
        available: true

      # --- screenshot-to-code（截图→代码，原项目无 MCP 包，待替代）---
      - name: screenshot_to_code
        priority: 2
        server:
          command: "npx.cmd"
          args: ["-y", "screenshot-to-code@latest"]
        tool_mapping:
          generate: "generate_code"
        timeout: 120.0
        overall_timeout: 180.0
        available: false

      # --- Google Stitch（需 Google Cloud 认证）---
      - name: stitch
        priority: 3
        server:
          command: "npx.cmd"
          args: ["-y", "stitch-mcp@latest"]
          env:
            GOOGLE_CLOUD_PROJECT: "${GOOGLE_CLOUD_PROJECT}"
        tool_mapping:
          generate: "stitch_generate"
        timeout: 120.0
        overall_timeout: 180.0
        available: false

  # ============================================================
  # 浏览器测试：渲染页面 → 执行操作 → 收集验证数据
  # ============================================================
  browser_test:
    default_backend: playwright_devtools
    backends:
      # --- playwright-devtools-mcp（推荐：混合 DevTools + Playwright）---
      - name: playwright_devtools
        priority: 1
        server:
          command: "npx.cmd"
          args: ["playwright-devtools-mcp"]
        tool_mapping:
          navigate: "browser_launch"
          interact: "browser_click"
          screenshot: "browser_screenshot"
          console: "console_get_logs"
          performance: "performance_get_core_vitals"
        timeout: 60.0
        overall_timeout: 120.0
        available: false

      # --- Microsoft Playwright MCP（已验证可用，20+ 工具）---
      - name: playwright
        priority: 2
        server:
          command: "npx.cmd"
          args: ["-y", "@playwright/mcp@latest"]
        tool_mapping:
          navigate: "browser_navigate"
          interact: "browser_click"
          screenshot: "browser_take_screenshot"
          console: "browser_console_messages"
          performance: "browser_network_requests"
        timeout: 60.0
        overall_timeout: 120.0
        available: true

      # --- Google Chrome DevTools MCP（已全局安装 v0.13.0）---
      - name: chrome_devtools
        priority: 3
        server:
          command: "npx.cmd"
          args: ["-y", "chrome-devtools-mcp@latest", "--slim"]
        tool_mapping:
          navigate: "chrome_navigate"
          interact: "chrome_interact"
          screenshot: "chrome_screenshot"
          console: "chrome_console"
          performance: "chrome_performance"
        timeout: 60.0
        overall_timeout: 120.0
        available: true

  # ============================================================
  # 设计审查：对比设计参考 vs 实现，识别视觉问题
  # ============================================================
  design_review:
    default_backend: playwright_screenshot
    backends:
      # --- Playwright（全维度审查：快照 + JS注入 + 控制台）---
      - name: playwright_screenshot
        priority: 1
        server:
          command: "npx.cmd"
          args: ["-y", "@playwright/mcp@latest", "--caps=vision", "--isolated"]
        tool_mapping:
          navigate: "browser_navigate"
          snapshot: "browser_snapshot"
          evaluate: "browser_evaluate"
          console: "browser_console_messages"
          screenshot: "browser_take_screenshot"
        timeout: 60.0
        overall_timeout: 120.0
        available: true

      # --- Figma MCP（需 Figma Access Token）---
      - name: figma_compare
        priority: 2
        server:
          command: "npx.cmd"
          args: ["-y", "figma-developer-mcp@latest"]
          env:
            FIGMA_ACCESS_TOKEN: "${FIGMA_ACCESS_TOKEN}"
        tool_mapping:
          screenshot: "get_figma_data"
          compare: "visual_compare"
        timeout: 60.0
        overall_timeout: 120.0
        available: false
