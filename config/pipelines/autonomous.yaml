loop_bodies:
- id: init
  steps:
  - id: init
    steps:
    - pipeline_workspace_lifecycle
    - pipeline_environment_lifecycle
- id: main
  steps:
  - context:
      model_tier: '{{state.model_tier}}'
    id: prepare
    steps:
    - pipeline_pause_guard
    - pipeline_context_build
    - pipeline_injected_param_validator
    - pipeline_tool_schema
    - pipeline_param_inject
    - pipeline_multimodal_preprocessor
    - pipeline_model_prompt_adapter
    - pipeline_godot_context
    - pipeline_prompt_build
    - pipeline_context_window_guard
    - pipeline_tool_schema_validator
    - pipeline_isolation_guard
    - pipeline_level_guard
    - pipeline_security_check
  - context:
      temperature: 0.7
    id: core
    steps:
    - name: pipeline_tool_cache
      when: raw_tool_calls != [] and raw_tool_calls != None
    - '{{state.core_plugin}}'
    - pipeline_spill_guard
  - id: post
    next:
    - then: end
      when: task.status == 'completed' or task.status == 'failed' or task.status == 'cancelled'
    - set:
        suspended: true
      then: loop
      when: conversation_mode == True and raw_tool_calls == []
    - set:
        conversation_mode: false
        core_plugin: pipeline_tool_core
        core_type: tool_execute
      then: loop
      when: conversation_mode == True and raw_tool_calls != []
    - set:
        core_plugin: pipeline_tool_core
        core_type: tool_execute
      then: loop
      when: raw_tool_calls != [] and raw_tool_calls != None
    - set:
        core_plugin: pipeline_llm_core
        core_type: llm_call
      then: loop
      when: core_type == 'tool_execute'
    - set:
        core_plugin: pipeline_llm_core
        core_type: llm_call
      then: loop
      when: _has_new_llm_input == true
    - set:
        core_plugin: pipeline_llm_core
        core_type: llm_call
        router.duplicate_back_llm: false
      then: loop
      when: router.duplicate_back_llm == True
    - then: end
    steps:
    - pipeline_track
    - pipeline_task_reminder
    - pipeline_stop_check
    - pipeline_duplicate_check
    - pipeline_tool_cache_writer
    - pipeline_conversation_mode
    - pipeline_sensitive_checker
    - pipeline_result_format
  while: 'True'
- id: exit
  run_on_error: true
  steps:
  - id: exit
    steps:
    - pipeline_workspace_lifecycle
    - pipeline_environment_lifecycle
name: autonomous
