loop_bodies:
- id: init
  steps:
  - id: init
    steps:
    - pipeline_workspace_lifecycle
    - pipeline_environment_lifecycle
- id: main
  steps:
  - context:
      model_tier: '{{state.model_tier}}'
    id: prepare
    steps:
    - pipeline_pause_guard
    - pipeline_agent_config_load
    # 模式物料通用步骤（2026-09-24 架构重构：自 agent 配置装载步抽出）——
    # 须先于 tool_schema（tool_ids 收窄）与 prompt_build（模式段追加）。
    - pipeline_mode_material_inject
    - pipeline_tool_schema
    - pipeline_tool_args_inject
    - pipeline_multimodal_preprocessor
    - pipeline_model_prompt_adapter
    - pipeline_host_context
    - pipeline_prompt_build
    # W2a 上下文压缩粗门（引擎只算术，零领域知识）：占用比 =（上次真实
    # input_tokens + 自锚以来字符增量 × 2.0）÷ 模型窗口。口径：token ≈ 紧凑
    # JSON 字节/2（中文保守偏高）；窗口经 track.model_context_window 由
    # llm_core 随 usage 写入。阈值 0.6 与 context_window_guard 的
    # compress_trigger_ratio 缺省（manifest fields.default）同源语义，系数/
    # 阈值均为本 YAML 配置域可调。窗口 0（未解析到）→ 除零 fail-soft 判假，
    # 仅剩冷启动兜底支。冷启动兜底：无 token 锚（从未调用 LLM）且消息多
    # （>40）也放行 guard 做精确判定。
    - name: pipeline_context_window_guard
      when: '(track.llm_usage.last_input_tokens + (track.messages_chars - track.messages_chars_at_llm) * 2.0) / track.model_context_window > 0.6 or (track.llm_usage.last_input_tokens == none and len(messages) > 40)'
    - pipeline_tool_schema_validator
    - pipeline_isolation_guard
    - pipeline_level_guard
    - pipeline_security_check
  # 工具轮缓存查询（命中即直出结果 + 清调用，跳过执行）。
  - id: core
    steps:
    - name: pipeline_tool_cache
      when: raw_tool_calls != [] and raw_tool_calls != None
  # 工具执行核 = 并行 for-each（ADR 2026-10-02-loopconfig-parallel-foreach）：
  # 对上一轮 LLM 产出的 raw_tool_calls 逐元素执行 pipeline_tool_core（单调用
  # 契约，当前调用由引擎注入迭代局部键 current_call）。collect 键循环开始清
  # []、各迭代产出按迭代序拼接（本轮新鲜产出）；submitted_task_ids 是会话
  # 累计键，走 collect_append（父键现值 + 各迭代增量追加，不随循环清空）；
  # consume/consume_keys 循环收尾清源（对齐旧批执行插件的消费即清）。
  # max_concurrency 4 = 有界并行，迭代从同一父快照隔离执行。
  - id: tool_exec
    loop_config:
      as: current_call
      collect:
      - tool_results
      - _full_tool_results
      - _executed_tool_calls
      collect_append:
      - submitted_task_ids
      consume: true
      consume_keys:
      - pre_decided_results
      enabled: true
      max_concurrency: 4
      over: state.raw_tool_calls
    steps:
    - pipeline_tool_core
  # LLM 轮：消费工具结果产出下一轮响应；spill_guard 保留在核器官尾
  # （旧 core 组序 cache → 执行核 → spill_guard 的等价平铺）。
  - context:
      temperature: 0.7
    id: llm
    steps:
    - pipeline_llm_core
    - pipeline_spill_guard
  - id: post
    next:
    - then: end
      when: task.status == 'completed' or task.status == 'failed' or task.status == 'cancelled'
    - set:
        suspended: true
      then: loop
      when: conversation_mode == True and raw_tool_calls == []
    - set:
        conversation_mode: false
      then: loop
      when: conversation_mode == True and raw_tool_calls != []
    - then: loop
      when: _has_new_llm_input == true
    - set:
        router.duplicate_back_llm: false
      then: loop
      when: router.duplicate_back_llm == True
    # 任务管道纯文本轮不终局（D2 一次性终局修复）：叶子执行者用嘴回答而未调
    # 工具时，回 llm_core 继续——由 task_reminder 三信号注入提醒并按
    # max_reminders 预算耗尽裁决（终态改写），兜底 end 只留给真终态。此前
    # 兜底 end 使第 1 轮纯文本即整管终局（假绿 completed/task 恒 running，
    # 2026-09-13 批次实锤多例）。task.id != none 限定任务管道；会话聊天管道
    # （无 task.id）保持"文本即停"会话语义不变。
    - then: loop
      when: task.id != none and conversation_mode != True and task.status != 'completed' and task.status != 'failed' and task.status != 'cancelled'
    - then: end
    steps:
    # token / 耗时统计已并入 pipeline_llm_core 核心步骤（累加与
    # cost_update / metrics 出口同点位完成，ADR 2026-09-15-track-merged-into-llm-core），
    # post 链不再需要独立统计步骤。
    - pipeline_task_reminder
    - pipeline_stop_check
    - pipeline_duplicate_check
    - pipeline_tool_cache_writer
    - pipeline_conversation_mode
    - pipeline_sensitive_checker
    - pipeline_result_format
  while: 'True'
- id: exit
  run_on_error: true
  steps:
  - id: exit
    steps:
    - pipeline_workspace_lifecycle
    - pipeline_environment_lifecycle
name: autonomous
