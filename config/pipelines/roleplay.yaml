# 角色扮演专用管道（纯对话精简链）——经管道配置 ID `roleplay` 显式选用
# （WS user_input 帧 / HTTP chat params / task_submit orchestration_key）。
# 与 autonomous 的差异（一切为了沉浸感，扮演是对话不是任务）：
# - 无工具面：tool_schema / tool_args_inject / isolation_guard / level_guard /
#   security_check 等工具域 prepare 步骤与 tool_exec 执行核整体不在链上——
#   模型无 tools 可调，扮演卡 tool_ids 配置不生效（2026-10-03 用户裁定：
#   防御工具轮撤销，纯对话单轮即终局）；
# - 无任务域步骤：task_reminder（评估提醒）/duplicate_check（签名去重）/
#   sensitive_checker（任务终检）/tool_cache 系列全部不在链上；
# - 无多模态/godot 上下文等任务向装配；
# - 收尾无评估：无 task_reminder 即无提醒/裁决，文本落定即本轮完成；角色
#   状态经 state_marker_parse 落账（<state> 标记 → 账本/前端状态小卡）。
# 单轮执行：main 体不声明 while（DSL 缺省 = 单次），无工具轮故循环退役。
loop_bodies:
- id: init
  steps:
  - id: init
    steps:
    - pipeline_workspace_lifecycle
    - pipeline_environment_lifecycle
- id: main
  steps:
  - context:
      model_tier: '{{state.model_tier}}'
    id: prepare
    steps:
    - pipeline_pause_guard
    - pipeline_agent_config_load
    - pipeline_mode_material_inject
    - pipeline_model_prompt_adapter
    - pipeline_prompt_build
  - context:
      temperature: 0.8
    id: llm
    steps:
    - pipeline_llm_core
    - pipeline_spill_guard
  - id: post
    steps:
    # 状态统一标记解析步（2026-09-28 设计）：提取 <state> 标记 → 账本落账
    # （character_state/memory）→ render 回写下轮动态变量注入源 →
    # context.state_updates 载荷（前端状态小卡 + span 隐藏）。零标记零动作。
    - pipeline_state_marker_parse
- id: exit
  run_on_error: true
  steps:
  - id: exit
    steps:
    - pipeline_workspace_lifecycle
    - pipeline_environment_lifecycle
name: roleplay
