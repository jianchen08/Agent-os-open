# memory_tool 记忆后端配置（经 manifest config_files 注入 sidecar get_config）。
#
# backend: hindsight（默认）| kernel
# - hindsight：向量检索后端（hindsight-all-slim，高质量）。2026-08-19 e2e 实测
#   本机包生态断裂——hindsight-api-slim 顶层依赖 fastmcp server 面，fastmcp 3.4
#   按 mcp 1.x API 写（request_ctx/mcp.shared.session 等），与插件 SDK 锁定的
#   mcp>=2.0,<3 同 site-packages 下互斥，hindsight-api 子进程起不来。上游发布
#   mcp 2.0 兼容版（或 hindsight 独立 venv 方案落地）后切回 hindsight。
# - kernel：内核记忆表（M1 存储，service-registry memory.* 方法）。关键词
#   匹配（无向量），质量低但永远可用——断裂期间的保底后端。
backend: kernel
