# -*- coding: utf-8 -*-
# 记忆模块存储配置
# 定义情景记忆和语义记忆的存储后端

# 情景记忆存储后端
episode_backend: database  # database | redis | file

# 语义记忆存储后端
semantic_backend: database  # database | redis | file

# ========== 数据库配置 ==========
database:
  # 连接池大小
  pool_size: 10

  # 连接池最大溢出
  max_overflow: 20

  # 连接超时（秒）
  pool_timeout: 30

  # 连接回收时间（秒）
  pool_recycle: 3600

# ========== Redis 配置 ==========
redis:
  # Redis 主机地址
  host: localhost

  # Redis 端口
  port: 6379

  # 数据库索引（0-15）
  db: 0

  # 密码（可选）
  password: null

  # 连接池大小
  pool_size: 10

  # 数据过期时间（秒），默认 24 小时
  ttl: 86400

  # 连接超时（秒）
  socket_timeout: 5

  # SSL/TLS 配置
  ssl: false

# ========== 文件系统配置 ==========
file:
  # 基础存储路径（相对于项目根目录）
  base_path: ./data/memory

  # 是否启用压缩（gzip）
  compression: true

  # 压缩级别（1-9，越高压缩率越高但越慢）
  compression_level: 6

  # 是否启用索引（加速查询）
  enable_index: true

  # 索引文件路径
  index_path: ./data/memory/index

  # 文件权限（Unix）
  file_mode: 0o644

  # 目录权限（Unix）
  dir_mode: 0o755

# ========== 混合存储配置 ==========
# 不同类型的数据使用不同的存储后端
hybrid:
  # 热数据（最近访问）使用 Redis
  hot_data_backend: redis

  # 冷数据使用数据库
  cold_data_backend: database

  # 归档数据使用文件系统
  archive_backend: file

  # 热数据阈值（访问次数或时间）
  hot_threshold:
    min_access_count: 5
    max_age_hours: 24

  # 冷数据阈值
  cold_threshold:
    max_age_hours: 720  # 30 天

  # 归档阈值
  archive_threshold:
    max_age_hours: 8760  # 1 年

# ========== 性能优化配置 ==========
performance:
  # 批量操作大小
  batch_size: 100

  # 并发操作数量
  max_concurrent: 10

  # 缓存大小（条目数）
  cache_size: 1000

  # 预加载配置
  preload:
    enabled: false
    max_items: 100

# ========== 监控配置 ==========
monitoring:
  # 是否启用性能监控
  enabled: true

  # 慢查询阈值（毫秒）
  slow_query_threshold: 1000

  # 是否记录操作日志
  log_operations: true

  # 日志级别
  log_level: INFO  # DEBUG | INFO | WARNING | ERROR
