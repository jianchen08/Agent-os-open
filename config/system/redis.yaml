# Redis 配置文件
# 用于支持多实例部署的 WebSocket 消息广播

# Redis 连接配置
redis:
  # Redis 服务器地址
  host: localhost
  # Redis 端口
  port: 6379
  # 数据库索引
  db: 0
  # 连接 URL（优先级高于 host/port/db）
  url: "redis://localhost:6379/0"

  # 连接池配置
  pool:
    # 连接池大小
    size: 10
    # 最大空闲连接数
    max_idle: 5
    # 最小空闲连接数
    min_idle: 2
    # 连接超时时间（秒）
    timeout: 5
    # 是否自动解码响应
    decode_responses: true

  # Pub/Sub 配置
  pubsub:
    # 是否启用 Redis Pub/Sub
    enabled: true
    # 全局广播频道
    broadcast_channel: "websocket:broadcast"
    # 线程频道前缀
    thread_channel_prefix: "websocket:thread:"
    # 消息重试次数
    retry_count: 3
    # 消息重试间隔（毫秒）
    retry_interval: 1000

# 环境特定配置
development:
  redis:
    url: "redis://localhost:6379/0"
    pool:
      size: 5

testing:
  redis:
    url: "redis://localhost:6379/1"  # 使用不同的数据库
    pool:
      size: 3

production:
  redis:
    # 生产环境使用环境变量配置
    url: "${REDIS_URL}"
    pool:
      size: 20
      timeout: 10
