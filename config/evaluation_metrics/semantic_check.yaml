# 内容质量评估指标
# 使用独立 LLM Agent 对任意内容进行质量评估
# 不局限于特定内容类型（代码/文档/方案/报告），通过评估标准灵活适配

id: semantic_check
name: 质量评估
description: 对任意内容进行质量评估，包括结构完整性、内容准确性、逻辑连贯性、表达清晰度等，并给出改进建议

# ===== 评估器配置 =====
evaluator_id: general_agent
evaluator_type: agent

default_config:
  check: semantic

# ===== 预期输入定义 =====
expected_input:
  description: "对任务产出物进行质量评估，评估Agent会通过任务执行摘要和工具自行获取内容"
  params:
    content:
      type: string
      description: "要评估的内容文本（可选）。不传时评估Agent会通过任务执行摘要和文件读取工具自行获取"
      required: false
      example: "要评估的完整内容文本"
    criteria:
      type: string
      description: "评估要求描述，用自然语言说明期望的质量标准。如：结构完整、内容深度、逻辑清晰"
      required: false
      example: "报告应包含摘要、背景、方法、结论四个章节，内容需要有足够的深度和细节"

# ===== 预期输出定义 =====
# Agent 评估器统一返回结构（所有 Agent 评估器输出相同）
expected_output:
  description: "返回质量评估结果"
  params:
    passed:
      type: boolean
      description: "评估是否通过"
    score:
      type: number
      description: "综合评分（0-100）"
    feedback:
      type: string
      description: "评估结果总结"
    suggestions:
      type: array
      items:
        type: object
        description: "改进建议列表"
        properties:
          section:
            type: string
            description: "建议修改的位置/章节"
          issue:
            type: string
            description: "问题描述"
          suggestion:
            type: string
            description: "具体改进建议"
          priority:
            type: string
            enum: [high, medium, low]
            description: "优先级"
    evaluation_details:
      type: object
      description: "详细评估结果"
      properties:
        dimension_scores:
          type: object
          description: "各维度评分"
          properties:
            structure:
              type: number
              description: "结构完整性评分"
            content:
              type: number
              description: "内容质量评分"
            logic:
              type: number
              description: "逻辑连贯性评分"
            clarity:
              type: number
              description: "表达清晰度评分"
            accuracy:
              type: number
              description: "准确性评分"
        overall_assessment:
          type: string
          description: "整体评价"

# ===== 评估判断标准 =====
expect:
  conditions:
    - field: "passed"
      operator: "is_true"
  logic: "and"
  pass_message: "质量评估通过"
  fail_message: "质量评估未通过"

# ===== 输入参数定义 =====
input_schema:
  type: object
  properties:
    content:
      type: string
      description: "要评估的内容（可选，不传时由评估Agent自行获取）"
    criteria:
      type: string
      description: "评估要求描述（可选，用自然语言描述即可）"

# ===== 使用边界 =====
when_to_use:
  - 评估文档/报告的结构完整性和内容质量
  - 评估方案的逻辑性和可行性
  - 评估代码的可读性和设计合理性
  - 评估翻译质量、摘要质量
  - 需要获取具体的改进建议
  - 任何需要"理解内容 + 判断质量"的场景
when_not_use:
  - 只需要格式验证（使用 format_valid）
  - 只需要验证功能是否实现（由 function_verifier_agent 在流程中执行）
  - 只需要简单的是/否判断（使用 Tool 类型指标）
examples:
  - params:
      criteria: "报告应包含摘要、背景、方法、结论四个章节，内容需要有足够的深度"
    description: "评估调研报告质量（不传content，由评估Agent自行获取）"
  - params:
      content: "def calculate_total(items): ..."
      criteria: "代码可读性、设计合理性、命名规范"
    description: "评估代码可读性"
  - params: {}
    description: "最简用法，不传任何参数，评估Agent根据任务目标自动评估"
caveats:
  - 评估质量取决于任务目标描述是否清晰
  - LLM 判断有不确定性，评分仅供参考
  - 评估的是内容质量，不验证功能正确性（功能验证由 function_verifier_agent 在流程中执行）
  - 长文本可能需要分段评估

# ===== 依赖关系 =====
is_red_line: false
default_weight: 1.0
level: 3
includes:
  - file_check
requires: []

# ===== 元数据 =====
source: builtin
status: active
tags:
  - semantic
  - quality
  - content
  - readability
  - review
  - suggestions
