# 测试执行检查评估指标
# 使用通用工具 bash_execute 执行测试

id: test_check
name: 测试检查
description: 运行测试并检查通过率

# ===== 评估器配置 =====
evaluator_id: bash_execute
evaluator_type: tool

default_config:
  action: execute
  timeout: 120
  use_isolation: true

# ===== 预期输入定义 =====
expected_input:
  description: "运行测试并检查通过率"
  params:
    command:
      type: string
      description: "测试命令（如 pytest tests/unit）"
      required: true
      example: "pytest tests/unit"
    working_dir:
      type: string
      description: "工作目录"
      required: false
      example: "."

# ===== 预期输出定义 =====
expected_output:
  description: "返回测试执行结果"
  params:
    success:
      type: boolean
      description: "工具调用是否成功"
    data:
      type: object
      description: "返回数据（成功时返回）"
      properties:
        status:
          type: string
          description: "命令状态"
          enum: ["completed", "running", "terminated"]
        exit_code:
          type: integer
          description: "命令退出码（0 表示全部通过）"
        output:
          type: string
          description: "测试输出（含通过/失败详情）"
        summary:
          type: array
          description: "输出摘要"
        elapsed_seconds:
          type: number
          description: "执行耗时（秒）"
    error:
      type: string
      description: "错误信息（失败时返回）"

# ===== 评估判断标准 =====
expect:
  conditions:
    - field: "success"
      operator: "is_true"
    - field: "data.status"
      operator: "equals"
      value: "completed"
    - field: "data.exit_code"
      operator: "equals"
      value: 0
  logic: "and"
  pass_message: "测试全部通过"
  fail_message: "测试存在失败用例"

# ===== 输入参数定义 =====
input_schema:
  type: object
  properties:
    action:
      type: string
      enum: ["execute", "continue", "terminate", "input", "read_log"]
      description: "操作类型"
      default: "execute"
    command:
      type: string
      description: "要执行的测试命令"
    pid:
      type: integer
      description: "进程ID（continue/terminate/input/read_log 时使用）"
    timeout:
      type: integer
      description: "超时时间（秒）"
      default: 120
    working_dir:
      type: string
      description: "工作目录"
    input_text:
      type: string
      description: "发送到进程的输入"
    force:
      type: boolean
      description: "是否强制终止"
      default: false
    use_isolation:
      type: boolean
      description: "是否使用隔离环境"
      default: true
  required: ["action"]

# ===== 使用边界 =====
when_to_use:
  - 需要运行单元测试并检查通过率
  - 需要运行测试套件
  - 需要验证测试是否全部通过
when_not_use:
  - 需要运行性能测试
  - 需要验证功能是否正确实现（应使用 function_verify）
  - 需要执行自定义命令（应使用 bash_check）
examples:
  - params:
      command: pytest tests/unit
    description: "运行单元测试"
  - params:
      command: pytest --cov=src
    description: "运行测试并生成覆盖率报告"
caveats:
  - 需要安装测试框架
  - 确保测试环境正确
  - 退出码 0 表示全部通过
  - action/timeout/use_isolation 由 default_config 固定，Agent 无需关心

# ===== 依赖关系 =====
is_red_line: false
default_weight: 1.5
level: 2
includes:
  - file_check
requires: []

# ===== 元数据 =====
source: builtin
status: active
tags:
  - test
  - pytest
  - coverage
