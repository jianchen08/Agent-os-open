# 测试执行检查评估指标
# 使用通用工具 bash_execute 执行测试

id: test_check
name: 测试检查
description: 运行测试并检查通过率

# ===== 评估器配置 =====
evaluator_id: bash_execute
evaluator_type: tool

default_config:
  action: execute
  command: pytest
  timeout: 300

# ===== 预期输入定义 =====
# Agent 在提交任务时需要提供的参数
# 对应 bash_execute 工具的 input_schema
expected_input:
  description: "运行测试并检查通过率"
  params:
    command:
      type: string
      description: "测试命令"
      required: false
      default: "pytest"
      example: "pytest tests/unit"
    working_dir:
      type: string
      description: "工作目录"
      required: false
    timeout:
      type: integer
      description: "超时时间（秒）"
      required: false
      default: 300

# ===== 预期输出定义 =====
# 对应 bash_execute 工具的返回结构
expected_output:
  description: "返回测试执行结果"
  # bash_execute 工具返回结构：
  # 成功时: ToolResult.success=true, data={status, exit_code, output, summary, ...}
  params:
    success:
      type: boolean
      description: "工具调用是否成功（ToolResult.success）"
    data:
      type: object
      description: "返回数据（ToolResult.data）"
      properties:
        status:
          type: string
          description: "命令状态"
          enum: ["completed", "running", "terminated"]
        exit_code:
          type: integer
          description: "命令退出码（0 表示全部通过）"
        output:
          type: string
          description: "测试输出"
        summary:
          type: array
          description: "输出摘要"
        elapsed_seconds:
          type: number
          description: "执行耗时（秒）"
    error:
      type: string
      description: "错误信息（失败时）"

# ===== 评估判断标准 =====
# 基于工具返回结果进行判断
expect:
  conditions:
    # 判断工具调用成功
    - field: "success"
      operator: "is_true"
    # 判断命令执行完成
    - field: "data.status"
      operator: "equals"
      value: "completed"
    # 判断退出码为 0（全部测试通过）
    - field: "data.exit_code"
      operator: "equals"
      value: 0
  logic: "and"
  pass_message: "测试全部通过"
  fail_message: "测试存在失败用例"

# ===== 输入参数定义（与工具 input_schema 一致）=====
input_schema:
  type: object
  properties:
    action:
      type: string
      enum: ["execute", "continue", "terminate", "input", "read_log"]
      description: "操作类型"
      default: "execute"
    command:
      type: string
      description: "要执行的测试命令"
      default: "pytest"
    timeout:
      type: integer
      description: "超时时间（秒）"
      default: 300
    working_dir:
      type: string
      description: "工作目录"
  required: ["action"]

# ===== 使用边界 =====
when_to_use:
  - 需要验证测试通过
  - 需要运行单元测试
when_not_use:
  - 需要运行集成测试（使用专门的集成测试指标）
  - 需要进行性能测试
examples:
  - params:
      action: execute
      command: pytest tests/unit
  - params:
      action: execute
      command: pytest --cov=src
caveats:
  - 需要安装测试框架
  - 确保测试环境正确
  - 退出码 0 表示全部通过

# ===== 依赖关系 =====
is_red_line: false
default_weight: 1.5
level: 2
includes:
  - file_check
requires: []

# ===== 元数据 =====
source: builtin
status: active
tags:
  - test
  - pytest
  - coverage
