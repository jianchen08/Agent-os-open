# 命令执行检查评估指标
# 使用 bash_execute 工具检查命令执行结果

id: command_check
name: 命令检查
description: 检查命令执行结果（成功/超时）

# ===== 评估器配置 =====
evaluator_id: bash_execute
evaluator_type: tool

default_config:
  action: execute
  timeout: 30

# ===== 预期输入定义 =====
# Agent 在提交任务时需要提供的参数
# 对应 bash_execute 工具的 input_schema
expected_input:
  description: "检查命令执行结果（成功/超时）"
  params:
    command:
      type: string
      description: "要执行的命令"
      required: true
      example: "python --version"
    working_dir:
      type: string
      description: "工作目录"
      required: false
    timeout:
      type: integer
      description: "超时时间（秒）"
      required: false
      default: 30

# ===== 预期输出定义 =====
# 对应 bash_execute 工具的返回结构
expected_output:
  description: "返回命令执行结果"
  # bash_execute 工具返回结构：
  # 成功时: ToolResult.success=true, data={status, exit_code, output, summary, ...}
  params:
    success:
      type: boolean
      description: "工具调用是否成功（ToolResult.success）"
    data:
      type: object
      description: "返回数据（ToolResult.data）"
      properties:
        status:
          type: string
          description: "命令状态"
          enum: ["completed", "running", "terminated"]
        exit_code:
          type: integer
          description: "退出码（0 表示成功）"
        output:
          type: string
          description: "命令输出"
        summary:
          type: array
          description: "输出摘要"
        elapsed_seconds:
          type: number
          description: "执行耗时（秒）"
    error:
      type: string
      description: "错误信息（失败时）"

# ===== 评估判断标准 =====
# 基于工具返回结果进行判断
expect:
  conditions:
    # 判断工具调用成功
    - field: "success"
      operator: "is_true"
    # 判断命令执行完成
    - field: "data.status"
      operator: "equals"
      value: "completed"
    # 判断退出码为 0
    - field: "data.exit_code"
      operator: "equals"
      value: 0
  logic: "and"
  pass_message: "命令执行成功"
  fail_message: "命令执行失败"

# ===== 输入参数定义（与工具 input_schema 一致）=====
input_schema:
  type: object
  properties:
    action:
      type: string
      enum: ["execute", "continue", "terminate", "input", "read_log"]
      description: "操作类型"
      default: "execute"
    command:
      type: string
      description: "要执行的Shell命令"
    timeout:
      type: integer
      description: "超时时间（秒）"
      default: 30
    working_dir:
      type: string
      description: "工作目录"
  required: ["action"]

# ===== 使用边界 =====
when_to_use:
  - 需要验证命令执行成功
  - 需要检查命令执行时间
  - 需要执行系统命令
when_not_use:
  - 需要执行复杂脚本
  - 需要交互式命令
examples:
  - params:
      action: execute
      command: "python --version"
  - params:
      action: execute
      command: "pytest tests/"
caveats:
  - 命令需要在安全沙箱中执行
  - 超时检查需要设置合理的时间

# ===== 依赖关系 =====
is_red_line: false
default_weight: 1.0
level: 1
includes: []
requires: []

# ===== 元数据 =====
source: builtin
status: active
tags:
  - execution
  - bash
  - command
