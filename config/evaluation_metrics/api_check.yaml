# API 响应检查评估指标
# 使用通用工具 web_operate 检查 API 响应

id: api_check
name: API检查
description: 检查API接口响应状态

# ===== 评估器配置 =====
evaluator_id: web_operate
evaluator_type: tool

default_config:
  action: get

# ===== 预期输入定义 =====
# Agent 在提交任务时需要提供的参数
# 对应 web_operate 工具的 input_schema
expected_input:
  description: "检查API接口是否正常响应"
  params:
    url:
      type: string
      description: "API URL"
      required: true
      example: "http://localhost:8000/health"
    action:
      type: string
      description: "HTTP方法"
      required: false
      default: "get"
      enum: ["get", "post", "fetch"]
    headers:
      type: object
      description: "请求头"
      required: false
    timeout:
      type: integer
      description: "超时时间（秒）"
      required: false
      default: 30

# ===== 预期输出定义 =====
# 对应 web_operate 工具的返回结构
expected_output:
  description: "返回API响应状态"
  # web_operate 工具返回结构：
  # 成功时: ToolResult.success=true, data={url, status_code, headers, data}
  # 失败时: ToolResult.success=false, error="错误信息"
  params:
    success:
      type: boolean
      description: "工具调用是否成功（ToolResult.success）"
    data:
      type: object
      description: "返回数据（ToolResult.data）"
      properties:
        url:
          type: string
          description: "请求的 URL"
        status_code:
          type: integer
          description: "HTTP 状态码"
        headers:
          type: object
          description: "响应头"
        data:
          type: object
          description: "响应数据"
    error:
      type: string
      description: "错误信息（失败时）"

# ===== 评估判断标准 =====
# 基于工具返回结果进行判断
expect:
  conditions:
    # 判断工具调用成功
    - field: "success"
      operator: "is_true"
    # 判断 HTTP 状态码在成功范围内
    - field: "data.status_code"
      operator: "in"
      value: [200, 201, 204]
  logic: "and"
  pass_message: "API响应正常"
  fail_message: "API响应异常"

# ===== 输入参数定义（与工具 input_schema 一致）=====
input_schema:
  type: object
  properties:
    action:
      type: string
      enum: ["get", "post", "fetch"]
      description: "操作类型：get(GET请求)、post(POST请求)、fetch(抓取网页)"
    url:
      type: string
      description: "目标 URL"
    headers:
      type: object
      description: "请求头"
    data:
      type: object
      description: "POST 请求体数据"
    params:
      type: object
      description: "URL 查询参数"
    timeout:
      type: integer
      description: "超时时间（秒）"
      default: 30
  required: ["action", "url"]

# ===== 使用边界 =====
when_to_use:
  - 需要验证API可访问性
  - 需要检查响应状态
when_not_use:
  - 需要完整的功能测试
  - 需要进行性能测试
examples:
  - params:
      action: get
      url: http://localhost:8000/health
  - params:
      action: get
      url: http://localhost:8000/api/users
caveats:
  - 确保服务已启动
  - 需要正确的网络访问权限

# ===== 依赖关系 =====
is_red_line: false
default_weight: 1.0
level: 2
includes: []
requires: []

# ===== 元数据 =====
source: builtin
status: active
tags:
  - api
  - http
  - response
