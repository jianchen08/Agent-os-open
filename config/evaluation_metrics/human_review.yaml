# 人工审核评估指标
# 使用 human_interaction 工具请求人工审核/审批

id: human_review
name: 人工审核
description: 人工审核（审批/复核）

# ===== 评估器配置 =====
evaluator_id: human_interaction
evaluator_type: human

default_config:
  mode: choice
  timeout_seconds: 300

# ===== 预期输入定义 =====
# 对应 human_interaction 工具的 input_schema
expected_input:
  description: "人工审核（审批/复核）"
  params:
    mode:
      type: string
      description: "交互模式"
      required: true
      default: "choice"
    title:
      type: string
      description: "审核标题"
      required: true
    description:
      type: string
      description: "审核说明"
      required: false
    options:
      type: array
      description: "选项列表"
      required: false
    timeout_seconds:
      type: number
      description: "超时时间（秒）"
      required: false
      default: 300

# ===== 预期输出定义 =====
# human_interaction 工具返回结构
expected_output:
  description: "返回人工审核结果"
  params:
    passed:
      type: boolean
      description: "是否通过审核"
    score:
      type: number
      description: "评分（0-100）"
    feedback:
      type: string
      description: "审核反馈"
    details:
      type: object
      description: "详细信息"
      properties:
        status:
          type: string
          description: "状态（completed, denied, cancelled）"
        response:
          type: object
          description: "用户响应"

# ===== 评估判断标准 =====
# 基于工具返回结果进行判断
# 工具返回结构: {success: bool, data: {status, selected_option, feedback}}
expect:
  conditions:
    - field: "success"
      operator: "is_true"
      logic: "and"
      pass_message: "审核通过"
      fail_message: "审核未通过"
    - field: "data.selected_option"
      operator: "in"
      value: ["approve", "通过"]
      logic: "and"
      pass_message: "用户选择通过"
      fail_message: "用户选择不通过"

# ===== 输入参数定义（与 human_interaction 工具 input_schema 一致）=====
input_schema:
  type: object
  properties:
    mode:
      type: string
      enum: ["choice", "conversation"]
      description: "交互模式：choice=选择模式（弹出选择框），conversation=对话模式"
      default: "choice"
    title:
      type: string
      description: "审核标题"
    description:
      type: string
      description: "审核说明"
    options:
      type: array
      items:
        type: object
        properties:
          id: {"type": "string"}
          label: {"type": "string"}
      description: "选项列表（选择模式）"
    questions:
      type: array
      items: {"type": "string"}
      description: "问题列表（澄清场景）"
    timeout_seconds:
      type: number
      description: "超时时间（秒）"
      default: 300
    priority:
      type: string
      enum: ["low", "normal", "high", "critical"]
      description: "优先级"
      default: "normal"
  required: ["mode", "title"]

# ===== 输入映射模板 =====
# 将评估上下文映射到工具输入
input_mapping:
  mode: "choice"
  title: "{{ metric.name }}"
  description: "{{ metric.description }}"
  options:
    - id: "approve"
      label: "通过"
    - id: "reject"
      label: "不通过"
  timeout_seconds: "{{ metric.default_config.timeout_seconds | default(300) }}"
  priority: "high"

# ===== 输出映射模板 =====
# 将工具输出映射到评估结果
output_mapping:
  passed: "{% if data.selected_option == 'approve' %}true{% else %}false{% endif %}"
  score: "{% if data.selected_option == 'approve' %}100{% else %}0{% endif %}"
  feedback: "{{ data.feedback | default('审核完成') }}"
  details:
    status: "{{ status }}"
    selected_option: "{{ data.selected_option }}"

# ===== 使用边界 =====
when_to_use:
  - 需要人工审批
  - 需要人工复核
  - 需要专家评审
when_not_use:
  - 可以自动验证
  - 有明确的自动化检查标准
examples:
  - params:
      mode: choice
      title: "任务完成确认"
      description: "请确认任务是否完成"
      options:
        - id: "approve"
          label: "确认完成"
        - id: "reject"
          label: "需要修改"
  - params:
      mode: choice
      title: "代码变更审批"
      description: "请审批本次代码变更"
caveats:
  - 人工审核需要时间
  - 需要设置合理的超时时间

# ===== 依赖关系 =====
is_red_line: false
default_weight: 1.0
level: 4
includes: []
requires: []

# ===== 元数据 =====
source: builtin
status: active
tags:
  - human
  - approval
  - review
