    - 环境缺依赖时先自行安装（如 pip install -e . 以及运行测试所需的依赖）；\n- 完成后确认以下测试可通过：test_get_choices_default_ordering (model_fields.tests.GetChoicesOrderingTests), test_get_choices_reverse_related_field_default_ordering (model_fields.tests.GetChoicesOrderingTests), RelatedFieldListFilter ordering respects Model.ordering., test_relatedfieldlistfilter_reverse_relationships_default_ordering (admin_filters.tests.ListFiltersTests), RelatedOnlyFieldListFilter ordering respects Meta.ordering., RelatedOnlyFieldListFilter ordering respects ModelAdmin.ordering.。"
