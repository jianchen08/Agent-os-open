    \nax.add_artist(box)\n```\n\n\n### Actual outcome\n\n![download](https://user-images.githubusercontent.com/23433306/200162888-702626bf-ad47-40e2-8751-7dffe91df85c.png)\r\n\n\n### Expected outcome\n\n![download](https://user-images.githubusercontent.com/23433306/200162908-e0e9dfd5-6f8b-4aac-975e-bb363d809c41.png)\r\n\n\n### Additional information\n\n_No response_\n\n### Operating system\n\n_No response_\n\n### Matplotlib Version\n\n3.6.2\n\n### Matplotlib Backend\n\n_No response_\n\n### Python version\n\n_No response_\n\n### Jupyter version\n\n_No response_\n\n### Installation\n\n_No response_\n\n--- >8 --- issue 结束 --- >8 ---\n\n约束与提示：\n- 只修改必要的源码；不得修改或绕过测试本身；\n- 环境缺依赖时先自行安装（如 pip install -e . 以及运行测试所需的依赖）；\n- 完成后确认以下测试可通过：lib/matplotlib/tests/test_offsetbox.py::test_packers[bottom], lib/matplotlib/tests/test_offsetbox.py::test_packers[top]。"
