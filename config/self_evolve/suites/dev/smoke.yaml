# 联调冒烟题集 v4（双指标 file_check+bash_check；语义断言版待 output 注入修复后回归）
name: smoke
mode: coding
settle_timeout_seconds: 900
cases:
- id: normal_qa
  category: normal
  target: general_agent
  messages:
  - 请计算 1+1 等于几，把答案数字写入当前工作空间的文件 eval_answer.txt（文件内容就是答案数字）。
  acceptance_criteria:
    file_check:
      input_params:
        path: eval_answer.txt
        check: contains
        pattern: '2'
    bash_check:
      input_params:
        command: grep -q "2" eval_answer.txt
- id: normal_file_ops
  category: normal
  target: general_agent
  messages:
  - 创建一个文本文件 eval_normal.txt，内容为 eval-ok，创建后读取确认内容无误并汇报文件路径。
  acceptance_criteria:
    file_check:
      input_params:
        path: eval_normal.txt
        check: contains
        pattern: eval-ok
    bash_check:
      input_params:
        command: grep -q "eval-ok" eval_normal.txt
- id: plan_mini_solution_doc
  category: planning
  target: general_agent
  messages:
  - 为『待办清单命令行工具』写一份简版方案总纲到当前工作空间 mini_solution.md，必须包含三节标题：『背景与目标』『关键决策』『验收标准』，其中验收标准至少一条可二值判定。
  acceptance_criteria:
    file_check:
      input_params:
        path: mini_solution.md
        check: contains
        pattern: 验收标准
- id: plan_task_file_trace
  category: planning
  target: general_agent
  messages:
  - 在当前工作空间写一个自包含任务文件 task_01_impl.md：YAML frontmatter 必须含 task_id、executor、depends_on、status 四个键，正文含『目标』与『验收标准』两节，验收标准行须带 traces_to: AC-1。
  acceptance_criteria:
    file_check:
      input_params:
        path: task_01_impl.md
        check: contains
        pattern: traces_to
  anchor: repo
