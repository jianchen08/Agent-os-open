# 浏览器工具配置（browser_tool 插件经 config_files 注入）
#
# bridge 段：MCP Bridge 网关连接参数。bridge_base 是宿主侧直发地址；
# 容器路径的地址候选由 bridge_client 自行推导（env → host.docker.internal → 网关）。

bridge:
  bridge_base: http://127.0.0.1:8765
  upstream: browser
  timeout_secs: 120
  # 网关凭据（可选，config 优先于 env）：dev 走 .env/环境变量不在此落值；
  # 装机侧 sidecar 无 env 供给通道，由用户空间配置副本携带（部署时写入）。
  # token:
