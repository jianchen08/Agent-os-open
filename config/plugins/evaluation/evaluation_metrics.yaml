# -*- coding: utf-8 -*-
# 内置评估指标配置
# 应用启动时自动同步到数据库

metrics:
  # ========== 文件检查 ==========
  - name: file_check
    description: 文件/目录检查（存在性、非空、内容匹配）
    category: file
    evaluator_type: tool
    evaluator_id: file_evaluator
    level: 1  # 基础层级
    includes: []  # 独立指标，不包含其他
    requires: []  # 无前置依赖
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: 文件或目录路径
        check:
          type: string
          enum: [exists, not_empty, contains, is_directory]
          description: 检查类型
          default: exists
        pattern:
          type: string
          description: 内容匹配模式（check=contains 时使用）
        min_size:
          type: integer
          description: 最小字节数（check=not_empty 时使用）
          default: 1
      required: [path]
    tags: [file, existence, content]

  # ========== 语义检查 ==========
  - name: semantic_check
    description: 语义检查（意图覆盖、匹配、幻觉）
    category: semantic
    evaluator_type: agent
    evaluator_id: evaluator_agent
    level: 3  # 语义层级
    includes: []  # 独立指标（语义检查不依赖文件）
    requires: []  # 无前置依赖
    input_schema:
      type: object
      properties:
        output:
          type: string
          description: 要检查的输出
        check:
          type: string
          enum: [intent, match, hallucination]
          description: 检查类型
          default: match
        intents:
          type: array
          items:
            type: string
          description: 用户意图列表（check=intent 时使用）
        expected:
          type: string
          description: 期望的语义描述（验收期望，评估 agent 对照工作区产出判定）
        references:
          type: array
          items:
            type: string
          description: 参考资料（check=hallucination 时使用）
      required: [expected]
    tags: [semantic, intent, match, hallucination]

  # ========== 命令检查 ==========
  - name: bash_check
    description: 自定义命令执行检查（通过退出码判定结果）
    category: command
    evaluator_type: tool
    evaluator_id: bash_execute
    level: 2
    includes: [file_check]
    requires: []
    input_schema:
      type: object
      properties:
        command:
          type: string
          description: 要执行的命令
        timeout:
          type: integer
          description: 超时时间（秒）
          default: 30
        working_dir:
          type: string
          description: 工作目录
        use_isolation:
          type: boolean
          description: 是否使用隔离环境
          default: true
      required: [command]
    tags: [bash, command, execute, universal]

  # ========== 人工审核 ==========
  - name: human_review
    description: 人工审核（审批/复核）
    category: human
    evaluator_type: human
    evaluator_id: human_interaction
    level: 4
    includes: []
    requires: []
    input_schema:
      type: object
      properties:
        mode:
          type: string
          enum: [choice]
          description: 交互模式
          default: choice
        title:
          type: string
          description: 审核标题
        description:
          type: string
          description: 审核说明
        options:
          type: array
          items:
            type: object
          description: 选项列表（mode=choice 时使用）
        timeout_seconds:
          type: number
          description: 超时时间（秒）
          default: 300
      required: [mode, title]
    tags: [human, approval, review]

  # ========== 格式检查 ==========
  - name: format_valid
    description: 产物格式检查（tool 型：给 command 时在任务工作区真执行格式化器检查命令，退出码 0=通过；无 command 时按 path 存在性检查）
    category: file
    evaluator_type: tool
    evaluator_id: bash_execute
    level: 2
    includes: [file_check]
    requires: []
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: 目标文件或目录路径（command 缺席时的检查对象）
        type:
          type: string
          enum: [python, markdown, json, yaml]
          description: 产物语言类型（command 缺省时随任务语境记录，不参与判定）
        command:
          type: string
          description: 格式检查命令（真执行：在任务工作区运行，退出码 0=通过，如 ruff format --check <path>）
        timeout_seconds:
          type: integer
          description: command 超时时间（秒）
          default: 600
      required: [path]
    tags: [format, style, check]

  # ========== L0 通用层检查规则（ADR 2026-10-27 步骤 2，观察模式）==========

  - name: artifact_schema_check
    description: L0 产物结构检查（执行报告存在且结构合法、AC 清单非空——YAML/JSON 产物按 schema 校验必填字段/类型/数组长度）
    category: artifact
    evaluator_type: tool
    evaluator_id: file_evaluator
    level: 1  # L0 通用层
    includes: []
    requires: []
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: 产物文件路径（YAML/JSON，相对任务工作区）
        workspace:
          type: string
          description: 任务工作区根（path 相对解析基准）
        check:
          type: string
          enum: [matches_schema, exists, not_empty, contains]
          description: 检查类型（matches_schema=结构契约校验；兼容 file_check 族枚举）
        schema:
          type: object
          description: 结构契约（required=必填字段存在且非空；properties.{f}.type=array/object/string/number/integer/boolean；properties.{f}.min_items=数组最小长度）
          properties:
            required:
              type: array
              items:
                type: string
            properties:
              type: object
        pattern:
          type: string
          description: 内容匹配模式（check=contains 时使用）
      required: [path, check]
    tags: [l0, artifact, schema]

  - name: antipattern_scan
    description: L0 反模式扫描（空 except、调试残留 print/console.log、疑似硬编码密钥——bash 命令组合，命中即失败）
    category: antipattern
    evaluator_type: tool
    evaluator_id: bash_execute
    level: 1
    includes: []
    requires: []
    input_schema:
      type: object
      properties:
        command:
          type: string
          description: 扫描命令（在任务工作区执行；退出码 0=无反模式命中=通过；default_config 载观察期参考命令，试点任务可按语境定制）
        workspace:
          type: string
          description: 任务工作区根
        timeout_seconds:
          type: integer
          description: 超时时间（秒）
          default: 600
      required: [command]
    default_config:
      # 观察期参考命令：对 git 改动的 py/ts/tsx 文件扫描空 except、调试残留、
      # 疑似密钥赋值；命中 → exit 1（fail + message 留痕），无命中 → exit 0（pass）
      command: >-
        git status --porcelain -uall | awk '{print $2}'
        | grep -E '[.](py|ts|tsx)$'
        | xargs -r grep -n -E 'except[^:]*:[[:space:]]*(pass|\.\.\.)|console[.]log\(|(api_key|secret|password)[[:space:]]*=[[:space:]]*[^[:space:]]+'
        && exit 1 || exit 0
    tags: [l0, antipattern, scan]

  - name: scope_consistency
    description: L0 改动面一致性（git status 改动文件清单 ⊆ 任务书改动面绑定表 allowed_paths；越界清单进 message）
    category: scope
    evaluator_type: tool
    evaluator_id: file_evaluator
    level: 1
    includes: []
    requires: []
    input_schema:
      type: object
      properties:
        workspace:
          type: string
          description: 任务工作区根（git 仓库/worktree 根）
        allowed_paths:
          type: array
          items:
            type: string
          description: 改动面绑定表（文件或目录，相对工作区，/ 分隔；目录前缀匹配）
      required: [workspace, allowed_paths]
    tags: [l0, scope, consistency]
