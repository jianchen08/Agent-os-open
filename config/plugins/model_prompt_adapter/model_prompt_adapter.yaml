# model_prompt_adapter 插件配置（内核按 manifest config_files 注入 sidecar get_config）。
#
# default_model：state 无 model_id/model_tier 时的模型匹配回退值。
# 必须与 config/plugins/llm/llm.yaml 的 defaults.chat 保持同步：
#   实际选模 = state.model_id（agent_config_load 管道输入步写入，见
#   plugins/shared/agent_config_load/plugin.py）→ state.model_tier →
#   defaults.chat（llm_core 内部解析，prepare 链插件看不到最终模型，
#   故用本值做接线）。把 defaults.chat 切回 deepseek-v4-pro 时，同步把
#   本值改为 deepseek-v4-pro，rules.yaml 的 pro 规则才会命中（当前
#   chat=minimax 下 deepseek 规则零注入属配置驱动的预期行为）。
default_model: minimax-m3.1-flash-preview
