# 灵汐助手内置 LLM 网关进程配置（CLIProxyAPI v8 布局；llm_provider_gateway 插件
# config_files[id=gateway_server] 出厂种子）。
#
# 真值语义：用户空间为真值——内核启动期 copy-if-missing 播种本文件（用户层存在
# 即整体接管，升级不丢用户配置）；llm_provider_gateway 插件首启做一次性令牌
# 修补（__AGENTOS_AUTH_DIR__ → 实际用户空间绝对路径；management.secret-key 为空
# 时生成随机管理密钥——上游语义：空密钥 = 管理 API 整体禁用），修补后插件不再
# 改写本文件，管理页/手编的改动永不被覆盖。
#
# 默认 = 空车道 + 管理口：OAuth 车道在管理页登录即得（Codex/Claude Code/Gemini/
# Grok/Kimi 零 dll 原生支持）；OpenAI 兼容上游经 api-keys 段或管理页接入（自带
# key 即活）。个人账号资产（OAuth 凭据/钱包/礼包）不可分发、永不出现在本种子。
config-version: 8
server:
  host: "127.0.0.1"
  port: 8317
oauth:
  # 插件首启替换为实际用户空间绝对路径（占位符见文件头说明）
  auth-dir: "__AGENTOS_AUTH_DIR__"
management:
  # 仅本机回环可达管理面
  allow-remote: false
  # 空 = 管理面禁用；插件首启生成随机密钥写入（用户可改）；管理页登录用它
  secret-key: ""
  # 管理控制台面板源（上游 MIT；网关按需自取，离线机面板缺席不影响 API 面）
  panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"
# 空车道示例（填即活；或直接在管理页操作）：
# api-keys:
#   openai:
#     - name: my-openai
#       base-url: https://api.example.com/v1
#       api-key: "sk-..."
#       models:
#         - name: some-model
