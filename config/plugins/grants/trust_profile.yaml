# grants trust profile 三档（P3 运营面，ADR 2026-11-19 D2 + 执行方案 §5）
#
# 生效点唯一：grants PolicyEngine.classify 内部（表查得 verdict 后按档升降映射）。
# 执法面（security_check）零改动——它只消费 classify 的 verdict，档位切换对它透明。
#
# 三档升降档矩阵（policy.py 代码固定，本文件不可改写——矩阵语义由测试锁定）：
#   balanced（默认）: 恒等映射，= P1 行为等价（零行为变化红线）
#   strict:          task_grant → per_call_approval（任务级授予收紧为逐次人审）
#                    domain_grant → task_grant（域级授予收紧为任务级）
#   open:            task_grant → domain_grant（任务级授予放宽为域级 = domain_grant
#                    覆盖面放宽；一条域级 grant 可覆盖更多同类调用）
#
# 红线（任何档不可豁免，ADR D3 + D2）：
#   - deny 恒 deny（block 语义数据面，任何档不改写）；
#   - per_call_approval 恒逐次人审（任何档不放宽）；
#   - auto 恒 auto（读面 v1 不动档）；
#   - 未分类恒 deny（fail-closed，tool_policy.yaml defaults.uncategorized 口径不变）；
#   - 规则面 block / final_approval 恒先于 grant（执法面 P1 语义，本文件不触碰）。
#
# 本文件只承载「生效档选择」：default_profile ∈ {strict, balanced, open} 闭集；
# 解析失败/档名未知 → fail-closed 回落 strict（收紧方向）；文件缺失 → balanced
# （未配置 = 出厂默认 = P1 等价）。

version: 1

default_profile: balanced
