# 工具隔离策略配置
# 优先级：tools（工具名精确匹配）> categories（分类匹配）> default
#
# 设计原则：
# - 只有「命令执行类」工具需要强制容器隔离（因为它们执行任意命令）
# - 其他工具的隔离级别由分类兜底策略决定
# - 审批由 security_check 插件统一处理，不在策略中配置
# - 隔离级别不可用即拒绝执行（返回 blocked），不降级到其它级别
#
# 隔离环境按根任务共享，不是每个工具调用创建新环境

# ============================================
# 默认策略（未匹配到的工具走宿主机执行）
# 只有 bash_execute 需要/能在容器里执行（它是 shell 命令），
# 其他工具是 Python 函数，容器里没有工具代码，必须走 non_isolated。
# ============================================
default:
  isolation: non_isolated
  execution: host_direct

# ============================================
# 工具级规则（优先级最高，精确匹配工具名）
# ============================================
tools:
  # --- 命令执行类（强制容器隔离）---
  # 这些工具在容器内执行任意命令，必须隔离；容器不可用即拒绝，不降级到 non_isolated
  bash_execute:
    isolation: isolated
    execution: command_in_container
    disk_quota: "100m"
    network: restricted

  # --- 内部 API / 数据服务类（宿主机执行，不走容器）---
  # 这些是系统内部工具，直接操作内存/数据库/状态，不需要容器
  task_submit:
    isolation: non_isolated
    execution: host_direct
  task_manage:
    isolation: non_isolated
    execution: host_direct
  task_evaluate:
    isolation: non_isolated
    execution: host_direct
  memory:
    isolation: non_isolated
    execution: host_direct
  resource_merge:
    isolation: non_isolated
    execution: host_direct
  trigger_setup:
    isolation: non_isolated
    execution: host_direct
  human_interaction:
    isolation: non_isolated
    execution: host_direct

  # --- 浏览器操作类（经 MCP Bridge 网关，沙箱内发起）---
  # 隔离任务：isolation_guard 注入 _container_id → 工具 sidecar 经 docker exec
  # 在容器内发起 MCP 调用（沙箱内 MCP Client → 宿主 Bridge → Playwright）。
  # 审批由 Bridge 侧治理层（token/白名单/域名）承担，非隔离降级路径才弹审批
  # （execution 用 browser_mcp 标记，不进 security_check 的 command_in_container
  # 全量审批轨道——浏览器调用不执行任意命令）。
  browser_navigate:
    isolation: isolated
    execution: browser_mcp
  browser_snapshot:
    isolation: isolated
    execution: browser_mcp
  browser_click:
    isolation: isolated
    execution: browser_mcp
  browser_type:
    isolation: isolated
    execution: browser_mcp
  browser_take_screenshot:
    isolation: isolated
    execution: browser_mcp
  browser_console_messages:
    isolation: isolated
    execution: browser_mcp

# ============================================
# 模式/进化治理路径 profile（2026-09-15 模式服务化同刀）
# ============================================
# 进化 agent（self_evolve）容器对用户空间治理路径的访问边界声明：
# - 用户插件根 modes（<USER_ROOT>/plugins/modes，模式插件用户副本）：缺席——
#   容器不挂载用户空间，进化 agent 对模式 profile 的消费只走 mode.get_profile
#   服务调用（内核服务面），物理不可达；
# - 配置层 self_evolve 镜像（config/self_evolve）：只读——规则/题集等 B 部类
#   物料对进化 agent 仅可读（提示词注入 / file_read），任何写面走
#   proposal_submit 的仓库外 staging，直接写主仓 = 提案校验冻结面拒绝。
#
# 声明面语义：IsolationPolicyLoader 现消费 default/tools/categories 三节；
# 本节为治理路径访问边界的机器可读登记，供隔离侧路径治理接线消费
# （当前容器仅挂载 /workspace，上述缺席/只读语义由容器挂载面 + 提案冻结面
# 双重成立）。路径出现于此处即代表对进化 agent 非可写，新增治理路径须同刀
# 同步 material_registry.md 的 B 部类清单。
profiles:
  self_evolve:
    description: 进化 agent（self_evolve）对用户空间治理路径只读或缺席
    governance_paths:
      user_plugins_modes:
        path: <USER_ROOT>/plugins/modes
        access: absent
        reason: 模式插件用户副本归用户所有；进化 agent 经 mode.get_profile 服务消费，容器不挂载用户空间
      self_evolve_config_mirror:
        path: config/self_evolve
        access: read_only
        reason: B 部类进化流程物料；写面仅仓库外 staging（proposal_submit），冻结面由提案校验执行

# ============================================
# 分类级规则（匹配不到具体工具名时，按分类兜底）
# ============================================
categories:
  execution:
    isolation: non_isolated
    execution: host_direct
  network:
    isolation: non_isolated
    execution: host_direct
  file:
    isolation: non_isolated
    execution: host_direct
  search:
    isolation: non_isolated
    execution: host_direct
  analysis:
    isolation: non_isolated
    execution: host_direct
  system:
    isolation: non_isolated
    execution: host_direct
  evaluation:
    isolation: non_isolated
    execution: host_direct
  task:
    isolation: non_isolated
    execution: host_direct
  memory:
    isolation: non_isolated
    execution: host_direct

  # --- 自进化评测面（内部数据服务，宿主直执行）---
  eval_run_suite:
    isolation: non_isolated
    execution: host_direct
  eval_judge_heldout:
    isolation: non_isolated
    execution: host_direct
  proposal_submit:
    isolation: non_isolated
    execution: host_direct
  proposal_promote:
    isolation: non_isolated
    execution: host_direct
  proposal_reject:
    isolation: non_isolated
    execution: host_direct
  eval_view_signatures:
    isolation: non_isolated
    execution: host_direct
  eval_health_report:
    isolation: non_isolated
    execution: host_direct
