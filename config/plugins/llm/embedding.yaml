# 嵌入模型（Embedding）配置
#
# embedding 与 LLM 同源配置驱动：实际模型定义（api_base/api_key/dimension 等）
# 在 llm.yaml 的 models.embedding-3 中，provider 凭证在 llm.yaml 的 providers.zhipu 中。
# 本文件仅声明 embedding 服务的可用性与默认选择，避免与 llm.yaml 重复维护。
#
# 说明：
# - api_key 支持 ${ENV_VAR} 占位符，运行时从环境变量读取
# - 嵌入模型用于语义检索、记忆系统向量检索、复盘经验相似度匹配
# - 未配置 api_key（环境变量未设置）时 enabled=false，语义检索降级为关键词检索而非崩溃
#   （降级机制：消费方读取 enabled=false 时回退 keyword 检索）
# - default_model 指向 llm.yaml models 命名空间下的 embedding 模型条目

embedding:
  enabled: false  # 默认禁用，待配置 ZHIPU_API_KEY 后改为 true
  default_provider: zhipu
  default_model: embedding-3  # 对应 llm.yaml models.embedding-3（GLM, zhipu_coding provider）
