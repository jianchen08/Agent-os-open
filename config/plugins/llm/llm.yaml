      max_tokens: 16000
  glm-5.3:
    provider: cpa_gateway
    model_name: glm-5.3
    display_name: GLM-5.3 (礼包优先统一车道)
    api_base: http://127.0.0.1:8317/v1
    context_window: 200000
    reasoning_model: true
    default_params:
      temperature: 0.7
      max_tokens: 16000
  glm-5.3-gift:
