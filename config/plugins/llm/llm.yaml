concurrency:
  default_max_concurrent: 2
  max_concurrent_pipelines: 5
defaults:
  call_timeout: 1800
  chat: glm-5.2
  embedding: bge-m3
  first_token_timeout: 60
  stream_idle_timeout: 90
  tiers:
    large: minimax-m3.1-flash-preview
    medium: minimax-m3.1-flash-preview
    small: minimax-m3.1-flash-preview
    # 自路由兜底链（2026-11-04 网关化第一步）：键=defaults 直键（build_fallbacks
    # 按 defaults.get(键) 取主模型），Router fallback 按主模型 id 匹配——tiers
    # 三档与 chat 同为 minimax，挂 chat 一条即全覆盖；兜底走异构 provider
    # （cpa_gateway 本地车道 glm-5.3-flash），降级经 keypool_fallback_notice 可见。
    fallback_chain:
      chat: [glm-5.3-flash]
embeddings: {}
models:
  bge-m3:
    api_base: https://api.siliconflow.cn/v1/
    context_window: 8192
    dimension: 1024
    display_name: BGE-M3 (SiliconFlow)
    model_name: BAAI/bge-m3
    provider: siliconflow
  deepseek-v4-flash:
    api_base: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
    context_window: 1000000
    default_params:
      max_tokens: 100000
      reasoning_effort: max
      reasoning_retention:
        sample_interval: 3
      temperature: 0.7
      thinking:
        type: enabled
    display_name: DeepSeek V4 Flash
    model_name: deepseek-v4-flash
    provider: deepseek
    reasoning_model: true
    thinking_strength_params:
      low:
        reasoning_effort: low
      high:
        reasoning_effort: high
      max:
        reasoning_effort: max
  deepseek-v4-pro:
    api_base: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
    context_window: 1000000
    default_params:
      max_tokens: 100000
      reasoning_effort: max
      reasoning_retention:
        sample_interval: 3
      temperature: 0.7
      thinking:
        type: enabled
    display_name: DeepSeek V4 Pro
    model_name: deepseek-v4-pro
    provider: deepseek
    reasoning_model: true
    thinking_strength_params:
      low:
        reasoning_effort: low
      high:
        reasoning_effort: high
      max:
        reasoning_effort: max
  embedding-3:
    api_base: https://open.bigmodel.cn/api/coding/paas/v4/
    context_window: 1000000
    dimension: 2048
    display_name: Embedding-3
    model_name: embedding-3
    provider: zhipu_coding
  glm-5.2:
    api_base: https://open.bigmodel.cn/api/coding/paas/v4/
    context_window: 1000000
    default_params:
      extra_body:
        tool_stream: true
      max_tokens: 100000
      reasoning_effort: max
      temperature: 0.7
      thinking:
        type: enabled
    display_name: GLM-5.2
    model_name: glm-5.2
    multimodal:
      max_image_size: 20971520
      supported_image_types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      supports_image: true
      # 视觉输入不缩放总像素上限（R21 总像素口径）：GLM 官方文档只披露上传
      # 上限（单图 ≤5MB、像素 ≤6000*6000，docs.bigmodel.cn 对话补全 API），
      # 编码器内部缩放阈值未披露——取保守缺省 1024²=1048576（业内编码器
      # 常见 patch 处理预算，低于阈值直喂不被 API 端缩放）。
      max_pixels: 1048576
    provider: zhipu_coding
    reasoning_model: true
    thinking_strength_params:
      "off":
        thinking:
          type: disabled
      high:
        thinking:
          type: enabled
        reasoning_effort: high
      max:
        thinking:
          type: enabled
        reasoning_effort: max
  minimax-m3:
    api_base: https://api.minimaxi.com/v1
    context_window: 1000000
    default_params:
      max_tokens: 100000
      temperature: 0.7
      thinking:
        type: adaptive
    display_name: MiniMax-M3
    model_name: MiniMax-M3
    multimodal:
      max_image_size: 20971520
      max_video_size: 104857600
      supported_image_types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      supports_image: true
      supports_video: true
    provider: minimax
    reasoning_model: true
    thinking_strength_params:
      high:
        thinking:
          type: adaptive
      low:
        thinking:
          type: disabled
      medium:
        thinking:
          type: adaptive
      'off':
        thinking:
          type: disabled
  minimax-m3.1-flash-preview:
    api_base: https://api.minimaxi.com/v1
    context_window: 1000000
    default_params:
      max_tokens: 100000
      reasoning_effort: max
      temperature: 0.7
    display_name: MiniMax-M3.1-Flash-Preview
    model_name: MiniMax-M3.1-Flash-Preview
    multimodal:
      max_image_size: 20971520
      max_video_size: 104857600
      supported_image_types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      supports_image: true
      supports_video: true
    provider: minimax
    reasoning_model: true
    thinking_strength_params:
      low:
        reasoning_effort: low
      high:
        reasoning_effort: high
      max:
        reasoning_effort: max
      'off':
        reasoning_effort: low
  mock-llm:
    api_base: http://127.0.0.1:18080/v1
