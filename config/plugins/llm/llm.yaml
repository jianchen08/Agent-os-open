    provider: mock_llm
  deepseek-ai/DeepSeek-V4-Pro:
    provider: siliconflow
    model_name: deepseek-ai/DeepSeek-V4-Pro
    display_name: deepseek-ai/DeepSeek-V4-Pro
  deepseek-v4-flash-vision-exp:
    provider: deepseek
    model_name: deepseek-v4-flash-vision-exp
    display_name: deepseek-v4-flash-vision-exp
    context_window: 1000000
    reasoning_model: true
    default_params:
      temperature: 0.7
      max_tokens: 100000
      top_p: 1
    thinking_strength_params:
      high:
        reasoning_effort: max
      medium:
        reasoning_effort: high
      low:
        reasoning_effort: low
    multimodal:
      supports_image: true
      supported_image_types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      max_image_size: 20971520
      # 视觉输入不缩放总像素上限（R21 总像素口径）：DeepSeek 官方图像理解
      # 文档——总像素小于约 544×544 等比放大、更大则缩到总像素约 1300×1300
      # （api-docs.deepseek.com/zh-cn/guides/vision）；不缩放安全区 =
      # 总像素 ≤ 544²。R20 误取目标值 1300 做单边阈值，861K 像素海报漏判
      # （TB 真题 R21 实证），本键即缩放触发阈值下限。
      max_pixels: 295936
  deepseek-v4.1-flash:
    provider: ollama-oline
    model_name: deepseek-v4.1-flash
    display_name: deepseek-v4.1-flash
    context_window: 1000000
    reasoning_model: true
    default_params:
      temperature: 0.7
      max_tokens: 100000
      top_p: 1
      reasoning_effort: max
    multimodal:
      supports_image: true
      supported_image_types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      max_image_size: 20971520
      # 视觉输入不缩放总像素上限（R21 总像素口径）：DeepSeek 官方图像理解
      # 文档——总像素小于约 544×544 等比放大、更大则缩到总像素约 1300×1300
      # （api-docs.deepseek.com/zh-cn/guides/vision）；不缩放安全区 =
      # 总像素 ≤ 544²。R20 误取目标值 1300 做单边阈值，861K 像素海报漏判
      # （TB 真题 R21 实证），本键即缩放触发阈值下限。
      max_pixels: 295936
    thinking_strength_params:
      low:
        reasoning_effort: low
      high:
        reasoning_effort: high
      max:
        reasoning_effort: max
  glm-5.3-flash-gift:
    provider: cpa_gateway
    model_name: glm-5.3-flash-gift
    display_name: GLM-5.3-Flash (ZCode 礼包)
    api_base: http://127.0.0.1:8317/v1
    context_window: 200000
    reasoning_model: true
    default_params:
      temperature: 0.7
      max_tokens: 16000
  glm-5.3-flash:
    provider: cpa_gateway
    model_name: glm-5.3-flash
    display_name: GLM-5.3-Flash (礼包优先统一车道)
    api_base: http://127.0.0.1:8317/v1
    context_window: 200000
    reasoning_model: true
    default_params:
      temperature: 0.7
      max_tokens: 16000
  glm-5.3:
    provider: cpa_gateway
    model_name: glm-5.3
    display_name: GLM-5.3 (礼包优先统一车道)
    api_base: http://127.0.0.1:8317/v1
    context_window: 200000
    reasoning_model: true
    default_params:
      temperature: 0.7
      max_tokens: 16000
  glm-5.3-gift:
    provider: cpa_gateway
    model_name: glm-5.3-gift
