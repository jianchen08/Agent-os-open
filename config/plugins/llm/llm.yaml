      max:
        reasoning_effort: max
  glm-5.3-flash-gift:
    provider: cpa_gateway
    model_name: glm-5.3-flash-gift
    display_name: GLM-5.3-Flash (ZCode 礼包)
    api_base: http://127.0.0.1:8317/v1
    context_window: 200000
    reasoning_model: true
    default_params:
      temperature: 0.7
      max_tokens: 16000
  glm-5.3-flash:
    provider: cpa_gateway
    model_name: glm-5.3-flash
    display_name: GLM-5.3-Flash (礼包优先统一车道)
    api_base: http://127.0.0.1:8317/v1
    context_window: 200000
    reasoning_model: true
