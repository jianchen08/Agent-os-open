      reasoning_effort: max
    multimodal:
      supports_image: true
      supported_image_types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      max_image_size: 20971520
    thinking_strength_params:
      low:
        reasoning_effort: low
      high:
