      - image/png
      - image/gif
      - image/webp
      supports_image: true
      supports_video: true
    provider: minimax
    reasoning_model: true
    thinking_strength_params:
      high:
        thinking:
          type: adaptive
      low:
        thinking:
          type: disabled
      medium:
        thinking:
          type: adaptive
      'off':
        thinking:
          type: disabled
