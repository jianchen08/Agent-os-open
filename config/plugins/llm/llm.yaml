    type: openai
  zhipu:
    api_base: https://open.bigmodel.cn/api/paas/v4/
    keys:
    - api_key: ${ZHIPU_API_KEY}
      id: zhipu_main
      max_concurrent: 6
      rpm: 10
      token_quota: 0
    # GLM-5 系思考档位 = reasoning_effort low/high/max（与 zhipu_coding 同源，
    # thinking.type 旧词汇已废弃，见 zhipu_coding 注释）
    thinking_strength_params:
      high:
        reasoning_effort: max
      medium:
        reasoning_effort: high
      low:
        reasoning_effort: low
    type: zai
  zhipu_coding:
    api_base: https://open.bigmodel.cn/api/coding/paas/v4/
    keys:
    - api_key: ${ZHIPU_CODING_API_KEY}
      id: zhipu_coding_main
      max_concurrent: 6
      rpm: 10
      token_quota: 0
    # GLM-5 系思考档位 = reasoning_effort low/high/max（BigModel coding-plan
    # 实际参数面；thinking.type enabled/disabled 是旧 4 档词汇，2026-10-03 用户
    # 裁定废弃）。键 = 设置页档位词汇（levels 清单），值 = 真实 effort 值。
    thinking_strength_params:
      high:
        reasoning_effort: max
      medium:
        reasoning_effort: high
      low:
        reasoning_effort: low
    type: zai
  ollama-oline:
    type: openai
    api_base: https://ollama.com/v1
    keys:
    - id: ollama-oline_main
      api_key: ${OLLAMA-OLINE_API_KEY}
    thinking_strength_params:
      high:
        reasoning_effort: high
      low:
        reasoning_effort: low
      medium:
        reasoning_effort: medium
      'off':
        reasoning_effort: none
  cpa_gateway:
    # CPA 网关（127.0.0.1:8317）——via=plugin 契约首个正式实例（ADR 2026-11-04，
    # 用户裁定 2026-11-21）：传输在 provider 插件 llm_provider_gateway（provides
    # namespace llm_provider.gateway），路由/池化/兜底/用量编排留网关侧。网关
    # 进程由该插件自包含拉起（端口三态：外部探活命中→复用；端口空闲→拉起捆绑
    # exe；被第三方占用→fail-visible 不误杀），本机个人网关与捆绑网关收敛到
    # 同一 8317 出口。
    # keys 保留 = 托管形态（slot 注入 api_key/api_base 逐 slot 冷却重试，复用
    # 既有语义）；client key 经 CPA_CLIENT_API_KEY 注入（真值在网关侧 KEYS.txt，
    # 禁入仓）。glm-5.3 车道需网关在位且用户已接入车道（OAuth 登录或自带 key）。
    via: plugin
    provider_type: gateway
    type: openai
    api_base: http://127.0.0.1:8317/v1
    keys:
    - api_key: ${CPA_CLIENT_API_KEY}
      id: cpa_gateway_main
      max_concurrent: 6
      rpm: 60
      token_quota: 0
    # GLM-5 系思考档位与 zhipu_coding 同源（同一 GLM 家族经 OpenAI 兼容 /v1
    # 代理；参数面 = reasoning_effort low/high/max，2026-10-03 用户裁定）。
    # 缺此块时 reasoning_model: true 的 glm-5.3* 在 thinking-levels 端点返回空面，
    # 聊天页选择器空转（推理模型端到端闸红）。
    thinking_strength_params:
      high:
        reasoning_effort: max
      medium:
        reasoning_effort: high
      low:
        reasoning_effort: low
  dsh_runtime:
    # DSH 生态模型源（dsh 方言；LLM 两类收敛批 4，主方案 §6.4-b）——新接 provider
    # 条目，非改既有：本条目只声明 DSH llm 服务端点与 provider 路由形态。
    # 接入两步：①设 DSH_LLM_BASE_URL / DSH_LLM_API_KEY；②models 段按
    # provider: dsh_runtime 写条目（模型 id 取自 listProviders/listModels 咨询
    # 发现，契约实现见 plugins/shared/llm_core/llm_dsh.py）。未配置 env 时本条目
    # 无模型引用、不进模型选择器；直接引用则 api_base 占位符 fail-closed 不发请求。
    type: dsh
    api_base: ${DSH_LLM_BASE_URL}
    provider_route: dsh
    keys:
    - id: dsh_runtime_main
      api_key: ${DSH_LLM_API_KEY}
