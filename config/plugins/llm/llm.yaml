    provider: mock_llm
  deepseek-ai/DeepSeek-V4-Pro:
    provider: siliconflow
    model_name: deepseek-ai/DeepSeek-V4-Pro
    display_name: deepseek-ai/DeepSeek-V4-Pro
  deepseek-v4-flash-vision-exp:
    provider: deepseek
    model_name: deepseek-v4-flash-vision-exp
