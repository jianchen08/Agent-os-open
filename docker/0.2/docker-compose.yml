# =============================================================================
# AgentOS 0.2 — Docker Compose（内核二进制 + PostgreSQL/pgvector + Redis）
#
# 三服务编排：
#   kernel  — Rust 内核二进制（multi-stage build，runtime 镜像 ≤ 200MB）
#   postgres — pgvector/pgvector:pg16（长期记忆/向量检索/多租户行级隔离）
#   redis   — redis:7-alpine（缓存/pub-sub）
#
# 容器命名不设 container_name，使用 compose 标准命名（project-service）。
# 宿主端口用环境变量参数化，单实例零配置开箱即用。
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 内核二进制（Rust multi-stage build）
  # ---------------------------------------------------------------------------
  kernel:
    build:
      # context 为 docker/0.2/，使 Dockerfile 内 COPY kernel/ 可访问
      context: docker/0.2
      dockerfile: Dockerfile
    image: agentos-0.2-kernel:latest
    restart: on-failure
    ports:
      - "${KERNEL_HOST_PORT:-8090}:8080"
    environment:
      - POSTGRES_URL=postgres://agentos:${POSTGRES_PASSWORD:-agentos_dev}@postgres:5432/agentos
      - REDIS_URL=redis://redis:6379/0
      - RUST_LOG=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agentos-net
    healthcheck:
      test: ["CMD", "kernel-api"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + pgvector（长期记忆/向量检索/多租户行级隔离）
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    restart: on-failure
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      - POSTGRES_USER=agentos
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-agentos_dev}
      - POSTGRES_DB=agentos
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - agentos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos -d agentos"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis 7（缓存/pub-sub）
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: on-failure
    ports:
      - "${REDIS_HOST_PORT:-6481}:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly no
      --save ""
    volumes:
      - redis-data:/data
    networks:
      - agentos-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  postgres-data:
  redis-data:

networks:
  agentos-net:
    driver: bridge
