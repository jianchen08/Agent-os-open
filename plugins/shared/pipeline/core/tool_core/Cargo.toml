[package]
name = "pipeline-tool-core-native"
version = "1.0.0"
edition = "2021"
description = "Native (cdylib) tool_core pipeline plugin — replaces Python sidecar pipeline_tool_core"

[lib]
# cdylib：产出供 NativePluginLoader 加载的动态库（.dll/.so/.dylib）。
crate-type = ["cdylib"]

[dependencies]
# 原生插件 interface crate：PipelinePlugin/HostServices trait 契约 + 构造函数封装。
agentos-native-sdk = { path = "../../../../../kernel/crates/native-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# messages 序列化（对齐 Python get_format_manager 默认 YAML）。
serde_yaml = "0.9"
# tc_id 兜底生成（对齐 Python uuid4().hex[:8]）。
uuid = { version = "1", features = ["v4"] }

# cdylib 跨边界标准做法：panic=abort（避免 unwind 跨 FFI UB）。
[profile.release]
panic = "abort"
