[project]
name = "agentos-plugin-pipeline-dsh-hook"
version = "1.0.0"
description = "Lingxi AgentOS 0.2 plugin — pipeline_dsh_hook（DSH 钩子翻译的管道执行端）"
requires-python = ">=3.11"
dependencies = [
    "agentos-plugin-sdk>=0.2.0",
]

# 本地 SDK 源映射（uv lock 解析必需——agentos-plugin-sdk 不在任何 registry）：
# editable 链接 plugins/sdk/src 源码目录（判据 2 案 A）。
[tool.uv.sources]
agentos-plugin-sdk = { path = "../../../../sdk", editable = true }
