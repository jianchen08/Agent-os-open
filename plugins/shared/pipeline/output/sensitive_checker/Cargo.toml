[package]
name = "pipeline-sensitive-checker-native"
version = "1.0.0"
edition = "2021"
description = "Native (cdylib) sensitive_checker pipeline plugin — replaces Python sidecar pipeline_sensitive_checker"

[lib]
# cdylib：产出供 NativePluginLoader 加载的动态库（.dll/.so/.dylib）。
crate-type = ["cdylib"]

[dependencies]
# 原生插件 interface crate：PipelinePlugin/HostServices trait 契约 + 构造函数封装。
agentos-native-sdk = { path = "../../../../../kernel/crates/native-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 正则脱敏（对齐 Python re.compile + IGNORECASE）。
once_cell = "1"
regex = "1"

[dev-dependencies]
# 验证 cdylib 经 dlopen + box_from_raw 加载（对齐 NativePluginLoader 路径）。
libloading = "0.8"

# cdylib 跨边界标准做法：panic=abort（避免 unwind 跨 FFI UB）。
[profile.release]
panic = "abort"
