[project]
name = "agentos-cohost-host"
version = "1.0.0"
description = "Lingxi AgentOS co-hosting host base — shared venv for cohost members (方案 §4.7)"
requires-python = ">=3.11"
# 本 venv 是合宿成员（任一 host_group）的运行环境：成员自身 .venv 零消费。
# 故此处必须装齐成员依赖并集——漏一项 = 该成员在宿主进程内 import 即失败，
# 且宿主 fail-fast 连坐全组成员（monitoring 缺 psutil 实证）。
dependencies = [
    "agentos-plugin-sdk>=0.2.0",
    # 成员依赖并集（成员清单与逐项归属见 bootstrap_plugin_envs.py 审计输出；
    # 闭包不变量由 tests/test_bootstrap_plugin_envs.py 两条真语料测试执法：
    # import 闭包 + pyproject 声明 ⊆ 本 venv 实装）：
    "psutil",              # monitoring — 系统指标采集
    "pyyaml",              # eval_harness
    "websockets>=12.0",    # eval_harness — ws 评估通道
    "pillow",              # review — 图片审查
    "av",                  # review — 音视频审查
    "sqlalchemy>=2",       # rollback — 快照元数据
    "aiohttp",             # rollback — 快照拉取
    "httpx",               # web_ext — HTTP 客户端（注意：与 mcp 生态
                           # 的改名包 httpx2 并存，import 名不同互不冲突）
    "trafilatura>=1.8",    # web_ext — 网页正文抽取
    "litellm",             # task_evaluate — LLM 评估
    "tzdata>=2024.1",      # prompt_build — Windows 时区数据
    "markdown-it-py>=3.0", # doc_tools — Markdown 解析（纯 Python）
    "python-docx>=1.1",    # doc_tools — Word 读写（lxml 已在闭包；C 扩展经
                           # lxml 间接在位，成员侧函数级懒加载 + to_thread 隔离）
    "pypdf>=4.0",          # doc_tools — PDF 读取（纯 Python）
    "reportlab>=4.0",      # doc_tools — PDF 写出（含可选 C 加速扩展，成员侧
                           # 函数级懒加载 + to_thread 隔离，崩溃面见收编台账）
    "docker>=7.0",         # isolation_service / pipeline_isolation_guard —
                           # 容器隔离底座（此前带外实装不在 lock，uv sync
                           # 修剪后实装门禁红；按门禁指令补声明归一）
    "simurg>=1.0.4,<2",    # 共享根 _llm_streaming.py（流式退化检测，经
                           # llm_provider.* 成员 import）— ADR
                           # 2026-11-12-degen-detector-simurg-adoption
    "sherpa-onnx>=2.0.1",  # multimodal_service — 本地 ASR（SenseVoiceSmall
                           # int8 ONNX，纯 CPU；成员内函数级懒 import）
    "paramiko>=3.4",       # sync_agent — 远端文件面 SFTP 传输
                           # （/ext/sync_agent/fs/**）；此前带外实装不在 lock，
                           # uv sync 修剪后实装门禁红，按门禁指令补声明归一
]

# 本地 SDK 源映射（editable，与成员插件 pyproject 同轨）：
# 合宿宿主加载成员依赖并集——light 准入已排除重依赖，并集 = SDK + 标准库级别。
[tool.uv.sources]
agentos-plugin-sdk = { path = "../../sdk", editable = true }
