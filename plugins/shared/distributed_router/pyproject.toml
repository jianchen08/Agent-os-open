[project]
name = "agentos-plugin-distributed-router"
version = "1.2.0"
description = "Lingxi AgentOS 0.2 plugin — distributed_router（2c 统一路径树内部路由面，uv 单轨）"
requires-python = ">=3.11"
dependencies = [
    "agentos-plugin-sdk>=0.2.0",
]

# 本地 SDK 源映射（uv lock 解析必需——agentos-plugin-sdk 不在任何 registry）：
# editable 链接 plugins/sdk/src 源码目录（判据 2 案 A）。
[tool.uv.sources]
agentos-plugin-sdk = { path = "../../sdk", editable = true }
