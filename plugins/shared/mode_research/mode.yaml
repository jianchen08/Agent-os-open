# 研究模式 profile（原「调研模式」，2026-09-25 更名；B 部类物料：由用户维护；
# 出厂种子随 mode_research 插件内打包，经 mode.get_profile 服务透出；suite 路径相对项目根）
# 对标 Perplexity/Elicit 范式：问题→带引用报告；验证器族含引用可溯断言与幻觉检测
mode: research
name: 研究模式
# description = 主 agent 唯一域路由知识（批 F3 接管口径：什么任务归我/直派谁/编排链要点；措辞定版 = 渲染缓存前缀稳定）
description: 调研/研究任务（问题→带引用报告）。简单调研直派 executor/generation/research_agent；复杂研究派编排链 orchestrator/research_orchestrator_agent（执行型：建模/分析/整合/报告自执行，信息收集与终稿独立核查外包 research_agent）
icon: 🔍                # 选择器选项图标（批 G⑤；emoji 随声明面透出 modes API/mode.list）
# 方案规划段领域规格（批 B2 注册化）：值 = 技能名（包内 skills/ 随包，经工作空间
# 并集快照按名可读）；方案段骨架第零步按本键查注册表（ADR 2026-10-09 决策 4）
plan_spec: skill-solution-research
panel_page_id: research_desk
chain:
  entry: main
  # 实际编排（照实声明）：main 派单表调研域 research_agent /
  # research_orchestrator_agent 两键皆可直派；复杂研究走编排者（五阶段状态机），
  # 其信息收集/终稿独立核查外包 research_agent，链终点即编排者；执行者池声明已全模式退役
  # （P1，ADR 2026-10-09 决策 2）
  expected_path: [main, orchestrator/research_orchestrator_agent]
  entry_override: null
suite:
  smoke: config/self_evolve/suites/dev/research.yaml
  full: null          # 二期补全
material_scope:
  dispatch_stage:
    - config/agents/main/task_dispatch_guide.md
  execution_stage:
    - config/agents/orchestrator/research_orchestrator_agent.yaml
    - config/agents/executor/generation/research_agent.yaml
levers:
  agent_misdispatch: {dispatch_stage: [task_dispatch_guide, orchestrator_config]}
  citation_missing: {execution_stage: [persona, tool_ids]}
  hallucination: {execution_stage: [persona, prompt_skeleton]}
  orchestration_runaway: {orchestration_stage: [pipeline_steps, breaker_params]}
  eval_no_settle: {evaluation_stage: [evaluation_params]}
verifier_families: [file_assert, citation_trace, hallucination_check]
weights: {success: 1.0, cost: 0.2, rounds: 0.1}
budget:
  case_timeout: 1500
  round_tokens: 3000000
  proposals_per_session: 3
