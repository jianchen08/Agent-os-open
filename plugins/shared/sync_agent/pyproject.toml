[project]
name = "agentos-plugin-sync-agent"
version = "1.0.0"
description = "Lingxi AgentOS 0.2 plugin — sync_agent（多端同步端侧引擎，uv 单轨）"
requires-python = ">=3.11"
dependencies = [
    "agentos-plugin-sdk>=0.2.0",
    "aiohttp",
    # 远端文件面（/ext/sync_agent/fs/**）SFTP 传输
    "paramiko>=3.4",
]

# 本地 SDK 源映射（uv lock 解析必需——agentos-plugin-sdk 不在任何 registry）：
# editable 链接 plugins/sdk/src 源码目录（判据 2 案 A）。
[tool.uv.sources]
agentos-plugin-sdk = { path = "../../sdk", editable = true }
