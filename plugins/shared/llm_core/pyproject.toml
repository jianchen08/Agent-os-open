[project]
name = "agentos-plugin-pipeline-llm-core"
version = "1.0.0"
description = "Lingxi AgentOS 0.2 plugin — pipeline_llm_core（uv 单轨迁移样板）"
requires-python = ">=3.11"
dependencies = [
    "agentos-plugin-sdk>=0.2.0",
    # 适配服务面 wire 机器（llm_wire，批 3 复制改造）：httpx 连接池/SSE 解析。
    "httpx",
]

# 本地 SDK 源映射（uv lock 解析必需——agentos-plugin-sdk 不在任何 registry）：
# editable 链接 plugins/sdk/src 源码目录（判据 2 案 A）。
[tool.uv.sources]
agentos-plugin-sdk = { path = "../../sdk", editable = true }
