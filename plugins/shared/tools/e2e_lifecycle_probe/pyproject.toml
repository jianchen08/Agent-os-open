[project]
name = "agentos-plugin-e2e-lifecycle-probe"
version = "1.0.0"
description = "Lingxi AgentOS 0.2 plugin — e2e_lifecycle_probe（插件装卸载 e2e 探针）"
requires-python = ">=3.11"
dependencies = [
    "agentos-plugin-sdk>=0.2.0",
]

# 本地 SDK 源映射（uv lock 解析必需——agentos-plugin-sdk 不在任何 registry）：
# editable 链接 plugins/sdk 源码目录（与 simple 等插件同款判据 2 案 A）。
[tool.uv.sources]
agentos-plugin-sdk = { path = "../../../sdk", editable = true }
