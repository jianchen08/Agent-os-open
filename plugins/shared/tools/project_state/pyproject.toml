[project]
name = "agentos-plugin-project-state-tool"
version = "1.0.0"
description = "Lingxi AgentOS 0.2 plugin — project_state_tool（项目方案工作流状态查询与门控迁移）"
requires-python = ">=3.11"
dependencies = [
    "agentos-plugin-sdk>=0.2.0",
    "pyyaml",
    # 显式钉 MCP SDK 线，与 plugins/sdk 统一约定（mcp>=2.0,<3，v2 lowlevel API）
    # 对齐；精确解析版本由 uv.lock 锁定（BUG-38 取证：全仓 sidecar venv 均在
    # 2.x 线，v1 fastmcp 路径无任何代码引用）
    "mcp>=2.0,<3",
]

# 本地 SDK 源映射（uv lock 解析必需——agentos-plugin-sdk 不在任何 registry）：
# editable 链接 plugins/sdk/src 源码目录（判据 2 案 A）。
[tool.uv.sources]
agentos-plugin-sdk = { path = "../../../sdk", editable = true }
