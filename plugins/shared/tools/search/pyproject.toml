[project]
name = "agentos-plugin-resource-search-tool"
version = "1.0.0"
description = "Lingxi AgentOS 0.2 plugin — resource_search_tool（uv 单轨迁移样板）"
requires-python = ">=3.11"
dependencies = [
    "agentos-plugin-sdk>=0.2.0",
    "pyyaml",
]

# 本地 SDK 源映射（uv lock 解析必需——agentos-plugin-sdk 不在任何 registry）：
# editable 链接 plugins/sdk/src 源码目录（判据 2 案 A）。
[tool.uv.sources]
agentos-plugin-sdk = { path = "../../../sdk", editable = true }
