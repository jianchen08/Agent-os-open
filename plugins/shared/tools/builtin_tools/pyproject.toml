[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lingxi-builtin-tools"
version = "0.2.0"
description = "Lingxi AgentOS 0.2 builtin tool plugins — MCP wrapped"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Lingxi AgentOS Contributors"}
]
dependencies = [
    "lingxi-plugin-sdk>=0.2.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
