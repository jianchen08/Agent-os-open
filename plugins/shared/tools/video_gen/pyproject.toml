[project]
name = "agentos-plugin-video-gen"
version = "0.1.0"
description = "Lingxi AgentOS 0.2 plugin — video_gen（ComfyUI 视频段生成适配层）"
requires-python = ">=3.11"
dependencies = [
    "agentos-plugin-sdk>=0.2.0",
    "httpx",
]

# 本地 SDK 源映射（uv lock 解析必需——agentos-plugin-sdk 不在任何 registry）：
# editable 链接 plugins/sdk/src 源码目录。
[tool.uv.sources]
agentos-plugin-sdk = { path = "../../../sdk", editable = true }
