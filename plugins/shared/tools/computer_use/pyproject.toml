[project]
name = "agentos-plugin-computer-use"
version = "2.0.0"
description = "Lingxi AgentOS 0.2 plugin — computer_use（宿主机桌面操作，Windows-MCP Bridge 上游客户端）"
requires-python = ">=3.11"
dependencies = [
    "agentos-plugin-sdk>=0.2.0",
]

# 本地 SDK 源映射（uv lock 解析必需——agentos-plugin-sdk 不在任何 registry）：
# editable 链接 plugins/sdk/src 源码目录（web_ext 单轨迁移样板同款）。
[tool.uv.sources]
agentos-plugin-sdk = { path = "../../../sdk", editable = true }
