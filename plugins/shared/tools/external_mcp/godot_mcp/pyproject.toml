[project]
name = "agentos-plugin-godot-mcp-tool"
version = "1.0.0"
description = "Lingxi AgentOS 0.2 plugin — godot_mcp_tool（godot_run 编辑器执行面，按 workspace 路由）"
requires-python = ">=3.11"
dependencies = [
    "agentos-plugin-sdk>=0.2.0",
]

# 本地 SDK 源映射（uv lock 解析必需——agentos-plugin-sdk 不在任何 registry）：
# editable 链接 plugins/sdk/src 源码目录（判据 2 案 A）。
[tool.uv.sources]
agentos-plugin-sdk = { path = "../../../../sdk", editable = true }
