[project]
name = "agentos-plugin-community-ops-tool"
version = "1.0.0"
description = "Lingxi AgentOS 0.2 plugin — community_ops_tool（GitHub 社区运营 + 反馈台账）"
requires-python = ">=3.11"
dependencies = [
    "agentos-plugin-sdk>=0.2.0",
    "httpx",
]

# 本地 SDK 源映射（uv lock 解析必需——agentos-plugin-sdk 不在任何 registry）：
# editable 链接 plugins/sdk/src 源码目录。
[tool.uv.sources]
agentos-plugin-sdk = { path = "../../../sdk", editable = true }
