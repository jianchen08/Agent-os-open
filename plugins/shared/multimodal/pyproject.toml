[project]
name = "agentos-plugin-multimodal-service"
version = "1.0.0"
description = "Lingxi AgentOS 0.2 plugin — multimodal_service（uv 单轨迁移样板）"
requires-python = ">=3.11"
dependencies = [
    "agentos-plugin-sdk>=0.2.0",
    "aiohttp",
    # ASR 本地模型下载 CA bundle（系统代理 MITM/证书链不全场景，1.1.1 修）
    "certifi",
    "pyyaml",
    "pydantic",
    # 本地 ASR 引擎（SenseVoiceSmall int8 ONNX，纯 CPU）：合宿模式下实装于
    # _host venv；此处声明同轨，保证独立部署形态依赖闭环。
    "sherpa-onnx>=2.0.1",
]

# 本地 SDK 源映射（uv lock 解析必需——agentos-plugin-sdk 不在任何 registry）：
# editable 链接 plugins/sdk/src 源码目录（判据 2 案 A）。
[tool.uv.sources]
agentos-plugin-sdk = { path = "../../sdk", editable = true }
