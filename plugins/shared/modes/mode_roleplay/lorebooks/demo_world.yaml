  secondary_keys: []
  content: 郊区的县立高中，天台水塔旁堆着天文社的器材。那台老式折射望远镜是社团创始人
    留下的，主镜有一道裂纹，修好它是星野未来的执念。
  enabled: true
  insertion_order: 100
  constant: false
  position: before_char
