  content: 巨构层叠的高密度城寨，天空永远被上层地板遮住。地下诊所「铁手」开在旧水道
    改建的铺位里，招牌是一块焊死的义肢手掌。 义体零件黑市每午夜开市。
  enabled: true
  insertion_order: 100
  constant: false
  position: before_char
  case_sensitive: false
  comment: 主舞台·赛博线
