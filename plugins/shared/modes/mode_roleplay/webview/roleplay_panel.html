<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>角色扮演工作坊</title>
  <style>
    /* 面板主题跟宿主：宿主经 theme.sync 下行 --ag-* token（documentElement 内联），
       此处变量以 var(--ag-*, fallback) 桥接——token 未到时回落本文件基座
       （@media(prefers-color-scheme) 提供亮暗 fallback 基座）。 */
    :root {
      --bg: var(--ag-bg, #f6f7fb); --fg: var(--ag-fg, #1a1a2e);
      --muted: var(--ag-muted, #64748b); --border: var(--ag-border, #d7dce6);
      --card: var(--ag-card, #ffffff); --accent: var(--ag-accent, #7c5cff);
      --accent-soft: var(--ag-accent-soft, #efeaff); --chip: var(--ag-chip, #f1f5f9);
      --ok: var(--ag-ok, #16a34a); --warn: var(--ag-warn, #d97706);
      --err: var(--ag-err, #dc2626); --radius: var(--ag-radius, 8px);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: var(--ag-bg, #12121c); --fg: var(--ag-fg, #e2e8f0);
        --muted: var(--ag-muted, #94a3b8); --border: var(--ag-border, #2c2f45);
        --card: var(--ag-card, #1b1d2e); --accent: var(--ag-accent, #a78bfa);
        --accent-soft: var(--ag-accent-soft, #2a2547); --chip: var(--ag-chip, #262a3d);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--fg); background: var(--bg);
      font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      height: 100vh; display: flex; flex-direction: column;
    }
    /* 顶栏：低饱和细边框，视觉重量对齐宿主工作区 tab 条 */
    header {
      display: flex; align-items: center; gap: 8px; flex: none;
      padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--chip);
    }
    header h1 { margin: 0; font-size: 13px; font-weight: 600; }
    header .spacer { flex: 1; }
    #modeName { color: var(--muted); font-size: 11px; }
    #status { color: var(--muted); font-size: 11px; min-width: 60px; text-align: right; }
    /* 按钮主次分级：主 = accent 实底 / 次 = chip 底 + 描边 */
    button {
      padding: 4px 12px; background: var(--accent); color: #fff;
      border: 1px solid transparent; border-radius: var(--radius);
      cursor: pointer; font-size: 12px; line-height: 1.6; font-family: inherit;
    }
    button.secondary { background: var(--chip); color: var(--fg); border-color: var(--border); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    input, textarea, select {
      padding: 4px 8px; background: var(--card); color: var(--fg);
      border: 1px solid var(--border); border-radius: var(--radius);
      font-size: 12px; line-height: 1.6; font-family: inherit;
    }
    textarea { resize: vertical; }
    .layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 8px; flex: 1; min-height: 0; padding: 8px; }
    .drawer, .main {
      display: flex; flex-direction: column; min-height: 0;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--card); overflow: hidden;
    }
    .tabs { display: flex; border-bottom: 1px solid var(--border); flex: none; }
    .tabs button {
      flex: 1; background: none; color: var(--muted); border: none; border-radius: 0;
      padding: 8px 0; border-bottom: 2px solid transparent;
    }
    .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
    .list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
    .item {
      border: 1px solid var(--border); border-radius: var(--radius); padding: 8px;
      cursor: pointer; background: var(--card);
    }
    .item:hover { border-color: var(--accent); }
    .item.active { border-color: var(--accent); background: var(--accent-soft); }
    .item .row1 { display: flex; align-items: center; gap: 8px; }
    .avatar {
      width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft);
      color: var(--accent); display: flex; align-items: center; justify-content: center;
      font-weight: 600; flex: none;
    }
    .item .name { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .sub { color: var(--muted); font-size: 11px; margin-top: 4px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; }
    /* 卡库画廊（页签工具行 + 封面卡网格） */
    .toolrow { display: flex; gap: 6px; flex: none; padding-bottom: 8px; border-bottom: 1px dashed var(--border); }
    .toolrow button { flex: 1; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .gcard {
      border: 1px solid var(--border); border-radius: var(--radius); padding: 8px;
      cursor: pointer; background: var(--card);
      display: flex; flex-direction: column; gap: 6px;
    }
    .gcard:hover { border-color: var(--accent); }
    .gcard.active { border-color: var(--accent); background: var(--accent-soft); }
    .gavatar {
      width: 56px; height: 56px; border-radius: var(--radius); background: var(--accent-soft);
      color: var(--accent); display: flex; align-items: center; justify-content: center;
      font-size: 28px; flex: none;
    }
    .grow { display: flex; align-items: center; gap: 4px; min-width: 0; }
    .gname { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .origin-badge {
      font-size: 10px; padding: 0 6px; border-radius: var(--radius);
      background: var(--chip); color: var(--muted); flex: none;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .chip {
      font-size: 10px; background: var(--chip); color: var(--muted);
      padding: 1px 7px; border-radius: var(--radius);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
    .dot.running { background: var(--ok); animation: dotpulse 1.2s ease-in-out infinite; }
    .dot.done { background: var(--muted); }
    .dot.other { background: var(--warn); }
    @keyframes dotpulse { 50% { opacity: .35; } }
    .entry { border-bottom: 1px solid var(--border); padding: 8px 2px; }
    .entry:last-child { border-bottom: none; }
    .entry .keys { color: var(--accent); font-size: 11px; }
    .entry .content { margin-top: 4px; color: var(--fg); white-space: pre-wrap; }
    .entry .meta { margin-top: 4px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .badge { font-size: 10px; padding: 1px 7px; border-radius: var(--radius); background: var(--chip); color: var(--muted); }
    .badge.on { color: var(--ok); } .badge.off { color: var(--err); }
    .main-head {
      flex: none; padding: 8px 12px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
    }
    .main-head .title { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #mainActions { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .main-body { flex: 1; overflow-y: auto; padding: 12px 16px; }
    .section { margin-bottom: 16px; }
    .section h3 { margin: 0 0 8px; font-size: 11px; font-weight: 600; color: var(--muted); }
    details.section summary { cursor: pointer; font-size: 11px; font-weight: 600; color: var(--muted); }
    .prose { white-space: pre-wrap; font-size: 13px; }
    .quote {
      border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--accent-soft);
      border-radius: 0 var(--radius) var(--radius) 0; white-space: pre-wrap;
    }
    .formrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .flabel { width: 84px; flex: none; color: var(--muted); font-size: 11px; text-align: right; }
    .linkish { color: var(--accent); cursor: pointer; text-decoration: underline; font-size: 11px; }
    .mutednote { color: var(--muted); font-size: 11px; }
    /* persona 管理小面板行 */
    .prow {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      flex-wrap: wrap; padding: 4px 0; border-bottom: 1px solid var(--border);
    }
    .prow:last-of-type { border-bottom: none; }
    /* 开演记录摘要卡（对话在对话框，面板不内置对话流） */
    .sumcard {
      border: 1px solid var(--border); border-radius: var(--radius); background: var(--card);
      padding: 12px 16px; display: flex; flex-direction: column; gap: 8px;
    }
    .sumrow { display: flex; gap: 12px; align-items: baseline; }
    .sumlabel { color: var(--muted); font-size: 11px; flex: none; width: 32px; }
    .sumval { word-break: break-word; }
    .notice {
      border: 1px dashed var(--border); border-radius: var(--radius);
      padding: 8px 12px; color: var(--muted);
    }
    .empty {
      height: 100%; min-height: 120px; display: flex; flex-direction: column; gap: 8px;
      align-items: center; justify-content: center; color: var(--muted);
      border: 1px dashed var(--border); border-radius: var(--radius); padding: 16px; text-align: center;
    }
    .empty .empty-icon { font-size: 28px; }
    .empty .empty-label { font-size: 13px; color: var(--fg); }
    .empty .empty-note { font-size: 11px; opacity: .75; }
    .toast {
      position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px;
      background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: var(--radius);
      font-size: 12px; display: none; max-width: 80%; white-space: pre-wrap;
    }
    .toast.error { background: var(--err); color: #fff; }
    .toast.warn { background: var(--warn); color: #fff; }
    .greet-opt {
      border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px;
      margin-top: 8px; cursor: pointer; white-space: pre-wrap; font-size: 13px;
    }
    .greet-opt.active { border-color: var(--accent); background: var(--accent-soft); }
      /* 面板桥失败 ≠ 真空数据：显式错误横幅（--ag-err 语义色）与「暂无 XX」空态区分 */
    .bridge-err {
      border: 1px solid var(--err, #dc2626); border-radius: var(--radius, 8px); padding: 16px;
      display: flex; flex-direction: column; gap: 8px; align-items: center;
      justify-content: center; text-align: center; margin: 8px;
    }
    .bridge-err-title { color: var(--err, #dc2626); font-weight: 600; }
    .bridge-err-msg { font-size: 11px; color: var(--muted, #64748b); word-break: break-all; }
  </style>
</head>
<body>
  <header>
    <h1>🎭 角色扮演工作坊</h1>
    <span id="modeName"></span>
    <span class="spacer"></span>
    <span id="status"></span>
    <button class="secondary" onclick="refreshAll()">刷新</button>
  </header>
  <div class="layout">
    <aside class="drawer">
      <div class="tabs">
        <button id="tab-cards" class="active" onclick="switchTab('cards')">角色卡</button>
        <button id="tab-lorebooks" onclick="switchTab('lorebooks')">世界书</button>
        <button id="tab-sessions" onclick="switchTab('sessions')">开演记录</button>
      </div>
      <div class="list" id="list"></div>
    </aside>
    <main class="main">
      <div class="main-head">
        <span class="title" id="mainTitle">欢迎使用角色扮演工作坊</span>
        <span id="mainActions"></span>
      </div>
      <div class="main-body" id="mainBody"></div>
    </main>
  </div>
  <div class="toast" id="toast"></div>

  <script>
  // ── 宿主下行桥通用接收器（theme.sync）──
  // theme.sync：宿主推 --ag-* 主题 token，逐键设到根元素（面板主题跟宿主）。
  // 宿主下行的会话上下文同步消息在此被有意忽略（BUG-73 断点a）：开演会话锚由
  // 服务端按卡派生专属扮演会话，宿主活跃会话 id 不再参与任何上行——防「开演
  // 任务落活跃既有 thread」回归。
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || !d.__agentos_webview) return;
    if (d.method === 'theme.sync' && d.params && d.params.tokens) {
      var rootStyle = document.documentElement.style;
      Object.keys(d.params.tokens).forEach(function (k) {
        rootStyle.setProperty(k, d.params.tokens[k]);
      });
    }
  });

  // agentosFetch：经 window.agentos.postMessage（宿主代发 REST 带 token）+ Promise 化。
  // webview iframe 是 opaque-origin 沙箱（CSP connect-src 'none'），直接 fetch 不可行。
  // path 两形态：/ext/** REST 路由（宿主代发）与 'xxx.yyy' 宿主桥动作（theme.apply /
  // roleplay.possess 同机制，error 下行走同一 .error 后缀配对）。
  function agentosFetch(path, params) {
    return new Promise(function (resolve, reject) {
      if (!window.agentos) { reject(new Error('window.agentos 桥不可用')); return; }
      var id = window.agentos.postMessage(path, params);
      function handler(e) {
        var d = e.data;
        if (!d || !d.__agentos_webview || d.id !== id) return;
        window.removeEventListener('message', handler);
        if (d.method && d.method.indexOf('.error') > -1) reject(new Error(JSON.stringify(d.params || d.error)));
        else resolve(d.params);
      }
      window.addEventListener('message', handler);
    });
  }
  // 宿主返回 axios res.data，内层 body 是 base64 JSON
  function unwrap(res) {
    var data = (res && res.data) ? res.data : res;
    if (data && data.body) {
      try { return JSON.parse(atob(data.body)); } catch (e) { return data; }
    }
    return data;
  }

  var state = {
    modeName: '', cards: [], lorebooks: [], sessions: [], personas: [],
    activeTab: 'cards', activeCard: null, activeSession: null, activeBook: null,
    greetingIndex: 0,
    // 你的设定三态：none 不注入 / persona 已存档案（按 id）/ custom 临时文本（personaText）
    personaSel: { kind: 'none', id: '' },
    personaText: '', personaMgrOpen: false, armedPersona: '',
    formCardId: null,   // 卡表单正在编辑的卡 id（null=新建）
    deleteArmed: false, // 用户卡删除两步确认（沙箱 iframe 无模态 confirm）
    // 世界书管理态（对齐卡管理）：activeBook 详情选中 / formBookId 表单编辑 id
    // （null=新建）/ bookDeleteArmed 两步确认 / bookFormHead+bookFormEntries 表单工作副本
    formBookId: null, bookDeleteArmed: false, bookFormHead: null, bookFormEntries: [],
    errors: {},  // 各数据面桥失败信息（键=activeTab，另 personas）；失败≠空数据，见 bridgeErrorBox
  };
  var themedCardId = null;  // 已随卡上行 theme.apply 的卡 id（同卡重渲染不重复上行）

  function $(id) { return document.getElementById(id); }
  function setStatus(s) { $('status').textContent = s || ''; }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toast(msg, kind) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast' + (kind ? ' ' + kind : '');
    t.style.display = 'block';
    setTimeout(function () { t.style.display = 'none'; }, 3200);
  }
  // agentosFetch 的 error 下行 message 是 JSON.stringify(params)（如
  // {"message":"theme.apply 已丢弃：…"}），取人话字段；非 JSON 形态原样返回。
  function unwrapErrorMessage(e) {
    var raw = (e && e.message) || String(e);
    var m = raw.match(/"message"\s*:\s*"((?:[^"\\]|\\.)*)"/);
    return m ? m[1] : raw;
  }
  // 面板桥失败 ≠ 真空数据：桥不可用/请求失败渲染显式错误横幅（--ag-err 语义色），
  // 与 emptyBox 的诚实空态视觉区分；重试按钮走全量刷新。
  function bridgeErrorBox(msg) {
    return '<div class="bridge-err"><div class="bridge-err-title">面板桥不可用/加载失败</div>' +
      '<div class="bridge-err-msg">' + escapeHtml(msg) + '</div>' +
      '<button class="secondary" onclick="refreshAll()">重试</button></div>';
  }
  function emptyBox(icon, label, note, actionOnclick, actionLabel) {
    return '<div class="empty"><div class="empty-icon">' + icon + '</div>' +
      '<div class="empty-label">' + escapeHtml(label) + '</div>' +
      (note ? '<div class="empty-note">' + escapeHtml(note) + '</div>' : '') +
      (actionLabel ? '<button class="secondary" onclick="' + actionOnclick + '">' + escapeHtml(actionLabel) + '</button>' : '') +
      '</div>';
  }
  function findCard(cardId) {
    var c = null;
    state.cards.forEach(function (x) { if (x.id === cardId) c = x; });
    return c;
  }
  // 卡人设文本：description+personality+scenario 段落拼接（缺段跳过，全缺=空串）。
  // possess 上行载荷 personaText 的唯一生产者；宿主发送链经消息级
  // execution_context.roleplay_persona 注入（主 agent 身份不变）。
  function cardPersonaText(c) {
    return [c.description, c.personality, c.scenario]
      .map(function (s) { return String(s == null ? '' : s).trim(); })
      .filter(Boolean).join('\n\n');
  }
  function findPersona(personaId) {
    var p = null;
    state.personas.forEach(function (x) { if (x.id === personaId) p = x; });
    return p;
  }
  function dotClass(s) {
    return s.run_status === 'running' ? 'running' : (s.task_status === 'completed' ? 'done' : 'other');
  }

  // ── 数据装载 ──
  function loadBootstrap() {
    return agentosFetch('/ext/mode_roleplay/data/bootstrap').then(function (res) {
      var d = unwrap(res) || {};
      state.modeName = d.name || '';
      $('modeName').textContent = state.modeName;
    }).catch(function () {});
  }
  function loadCards() {
    return agentosFetch('/ext/mode_roleplay/data/cards').then(function (res) {
      state.cards = (unwrap(res) || {}).cards || [];
      delete state.errors.cards;
      if (state.activeTab === 'cards') renderList();
    }).catch(function (e) {
      state.errors.cards = (e && e.message) || String(e);
      if (state.activeTab === 'cards') renderList();
    });
  }
  function loadLorebooks() {
    return agentosFetch('/ext/mode_roleplay/data/lorebooks').then(function (res) {
      state.lorebooks = (unwrap(res) || {}).lorebooks || [];
      delete state.errors.lorebooks;
      if (state.activeTab === 'lorebooks') renderList();
    }).catch(function (e) {
      state.errors.lorebooks = (e && e.message) || String(e);
      if (state.activeTab === 'lorebooks') renderList();
    });
  }
  function loadSessions() {
    return agentosFetch('/ext/mode_roleplay/data/sessions').then(function (res) {
      state.sessions = (unwrap(res) || {}).sessions || [];
      delete state.errors.sessions;
      if (state.activeTab === 'sessions') renderList();
    }).catch(function (e) {
      state.errors.sessions = (e && e.message) || String(e);
      if (state.activeTab === 'sessions') renderList();
    });
  }
  // persona 档案面：GET /data/personas → {personas:[{id,name,description,avatar}]}。
  // 无独立页签，失败不在左列横幅（errors.personas 只在详情「你的设定」区如实上屏）。
  function loadPersonas() {
    return agentosFetch('/ext/mode_roleplay/data/personas').then(function (res) {
      state.personas = (unwrap(res) || {}).personas || [];
      delete state.errors.personas;
    }).catch(function (e) {
      state.personas = [];
      state.errors.personas = (e && e.message) || String(e);
    });
  }

  function refreshAll() {
    setStatus('刷新中...');
    Promise.all([loadBootstrap(), loadCards(), loadLorebooks(), loadSessions(), loadPersonas()])
      .then(function () { setStatus(''); renderList(); })
      .catch(function (e) { setStatus('加载失败'); toast(String(e), 'error'); });
  }

  // ── 左抽屉 ──
  function switchTab(tab) {
    state.activeTab = tab;
    ['cards', 'lorebooks', 'sessions'].forEach(function (t) {
      $('tab-' + t).className = (t === tab) ? 'active' : '';
    });
    renderList();
  }
  // 画廊头像块（56px）：avatar 为 emoji 串或 {fg,bg} 色对（色对回退名字首字着色）
  function gavatarHtml(c) {
    var a = c.avatar;
    if (a && typeof a === 'object') {
      var style = 'background:' + escapeHtml(a.bg || 'var(--accent-soft)') +
        ';color:' + escapeHtml(a.fg || 'var(--accent)');
      return '<div class="gavatar" style="' + style + '">' + escapeHtml((c.name || '?').slice(0, 1)) + '</div>';
    }
    return '<div class="gavatar">' + escapeHtml(a ? String(a) : (c.name || '?').slice(0, 1)) + '</div>';
  }
  function renderList() {
    var el = $('list');
    if (state.errors[state.activeTab]) {
      el.innerHTML = bridgeErrorBox(state.errors[state.activeTab]);
      return;
    }
    if (state.activeTab === 'cards') {
      // 工具行常驻（空卡库也能新建/导入）；画廊网格 = 封面卡（头像块+名字+来源徽标+标签）
      var gallery = state.cards.length
        ? '<div class="gallery">' + state.cards.map(function (c) {
            var tags = (c.tags || []).map(function (t) { return '<span class="chip">' + escapeHtml(t) + '</span>'; }).join('');
            return '<div class="gcard' + (state.activeCard === c.id ? ' active' : '') + '" data-id="' + escapeHtml(c.id) + '">' +
              gavatarHtml(c) +
              '<div class="grow"><span class="gname">' + escapeHtml(c.name) + '</span>' +
              '<span class="origin-badge">' + (c.origin === 'builtin' ? '出厂' : '自建') + '</span></div>' +
              (tags ? '<div class="chips" style="margin-top:0">' + tags + '</div>' : '') +
              '</div>';
          }).join('') + '</div>'
        : emptyBox('🎭', '暂无角色卡', '点「➕ 新建」创建，或「📥 导入」角色卡文件');
      el.innerHTML = '<div class="toolrow">' +
        '<button class="secondary" onclick="openCardForm()">➕ 新建</button>' +
        '<button class="secondary" onclick="importCard()">📥 导入</button></div>' + gallery;
      el.querySelectorAll('.gcard').forEach(function (node) {
        node.addEventListener('click', function () { openCard(node.getAttribute('data-id')); });
      });
    } else if (state.activeTab === 'lorebooks') {
      // 工具行常驻（空书库也能新建/导入）；书列表 = 名字 + 来源徽标 + 条目数
      var bookList = state.lorebooks.length
        ? state.lorebooks.map(function (b) {
            return '<div class="item' + (state.activeBook === b.id ? ' active' : '') +
              '" data-id="' + escapeHtml(b.id) + '">' +
              '<div class="row1"><div class="name">📖 ' + escapeHtml(b.name) + '</div>' +
              '<span class="origin-badge">' + (b.origin === 'builtin' ? '出厂' : '自建') + '</span></div>' +
              '<div class="sub">' + escapeHtml(b.description || '') + ' · 条目 ' + (b.entries || []).length + '</div></div>';
          }).join('')
        : '';
      el.innerHTML = '<div class="toolrow">' +
        '<button class="secondary" onclick="openBookForm()">➕ 新建</button>' +
        '<button class="secondary" onclick="importBook()">📥 导入</button></div>' +
        (bookList || emptyBox('📖', '暂无世界书', '点「➕ 新建」创建，或「📥 导入」SillyTavern 世界书 JSON'));
      el.querySelectorAll('.item').forEach(function (node) {
        node.addEventListener('click', function () { openBook(node.getAttribute('data-id')); });
      });
    } else {
      if (!state.sessions.length) {
        el.innerHTML = emptyBox('🎬', '暂无开演记录', '开演或聊天区选「角色扮演」发起的会话会落在这里');
        return;
      }
      el.innerHTML = state.sessions.map(function (s) {
        return '<div class="item' + (state.activeSession === s.pipeline_id ? ' active' : '') + '" data-id="' + escapeHtml(s.pipeline_id) + '">' +
          '<div class="row1"><span class="dot ' + dotClass(s) + '"></span><div class="name">' +
          escapeHtml(s.goal || s.pipeline_id) + '</div></div>' +
          '<div class="sub">' + escapeHtml(s.task_status || s.run_status || '—') + ' · ' +
          escapeHtml(s.pipeline_id.slice(0, 10)) + '</div></div>';
      }).join('');
      el.querySelectorAll('.item').forEach(function (node) {
        node.addEventListener('click', function () {
          openSessionRecord(node.getAttribute('data-id'));
        });
      });
    }
  }

  // ── 中央主区 ──
  function renderMainHead(title, actionsHtml) {
    $('mainTitle').textContent = title;
    $('mainActions').innerHTML = actionsHtml || '';
  }
  function showWelcome() {
    renderMainHead('欢迎使用角色扮演工作坊', '');
    $('mainBody').innerHTML = emptyBox('🎭', '从左侧选择一张角色卡开始',
      '选卡后对话框主题将随卡切换；对话在聊天区进行', "switchTab('cards')", '浏览角色卡');
  }
  // 选卡即向宿主上行卡的 ThemeConfig 档（theme.apply 白名单桥，载荷作用于当前
  // 会话=对话框主题/聊天背景随卡切换）。面板自身主题跟宿主（theme.sync），不走此桥。
  // 宿主侧 fail-closed：无活跃会话或档不合法时整包丢弃并回执 error 下行——
  // result/error 各 toast 反馈，静默丢弃会让「选卡切主题」看起来零生效。
  function applyCardTheme(c) {
    if (!c.theme || !window.agentos) return;
    agentosFetch('theme.apply', c.theme).then(function () {
      toast('对话框主题已随「' + c.name + '」切换');
    }).catch(function (e) {
      toast('随卡主题切换失败：' + unwrapErrorMessage(e), 'error');
    });
  }

  // ── 角色卡详情 ──
  function renderCardActions(c) {
    var html =
      '<button onclick="playCard(\'possess\')">🧑‍🎤 附身当前助手</button>' +
      '<button onclick="playCard(\'fresh\')">🎬 新开扮演会话</button>' +
      '<button onclick="continueCard()" title="以该卡开一个纯净扮演会话（持续对话），不带所选开场白与用户设定">💬 转续演</button>' +
      '<button class="secondary" onclick="editCard()">✏️ 编辑</button>' +
      '<button class="secondary" onclick="exportCard()">📤 导出</button>';
    if (c.origin === 'builtin') {
      // 出厂卡无删除面（只读保护）；编辑=复制派生用户副本
      html += '<span class="badge">出厂卡·可复制修改</span>';
    } else if (state.deleteArmed) {
      html += '<button onclick="deleteCard()">⚠️ 确认删除</button>' +
        '<button class="secondary" onclick="disarmDelete()">取消</button>';
    } else {
      html += '<button class="secondary" onclick="armDelete()">🗑 删除</button>';
    }
    renderMainHead('角色卡 · ' + c.name, html);
  }
  // persona 区三态选择器：不注入 / 已存档案 / 临时填写
  function personaSectionHtml() {
    var opts = '<option value="none"' + (state.personaSel.kind === 'none' ? ' selected' : '') + '>不注入</option>';
    state.personas.forEach(function (p) {
      opts += '<option value="p:' + escapeHtml(p.id) + '"' +
        (state.personaSel.kind === 'persona' && state.personaSel.id === p.id ? ' selected' : '') + '>' +
        escapeHtml((p.avatar ? p.avatar + ' ' : '') + p.name) + '</option>';
    });
    opts += '<option value="custom"' + (state.personaSel.kind === 'custom' ? ' selected' : '') + '>临时填写…</option>';
    var errNote = state.errors.personas
      ? '<div class="mutednote">persona 列表读取失败：' + escapeHtml(state.errors.personas) + '</div>' : '';
    return '<div class="section"><h3>你的设定（可选，随开演注入） ' +
      '<span class="linkish" onclick="togglePersonaMgr()">管理</span></h3>' + errNote +
      '<div class="formrow"><select id="personaSel" onchange="onPersonaSelChange()" style="min-width:180px">' +
      opts + '</select><span id="personaMeta" class="mutednote"></span></div>' +
      '<div id="personaCustom" hidden><textarea id="personaText" rows="2" style="width:100%;margin-top:6px" ' +
      'placeholder="例如：我是北地来的佣兵，沉默寡言……">' + escapeHtml(state.personaText) + '</textarea></div>' +
      '<div id="personaMgr" hidden></div></div>';
  }
  function cardDetailHtml(c) {
    var greets = (c.alternate_greetings || []);
    var greetHtml = '';
    if (c.first_mes) {
      greetHtml += '<div class="greet-opt' + (state.greetingIndex === 0 ? ' active' : '') + '" data-gi="0">' + escapeHtml(c.first_mes) + '</div>';
    }
    greets.forEach(function (g, i) {
      greetHtml += '<div class="greet-opt' + (state.greetingIndex === i + 1 ? ' active' : '') + '" data-gi="' + (i + 1) + '">' + escapeHtml(g) + '</div>';
    });
    // 关联世界书：lorebook_ids 对照 /data/lorebooks 取名（查无此书如实回显 id）
    var bookChips = (c.lorebook_ids || []).map(function (id) {
      var b = null;
      state.lorebooks.forEach(function (x) { if (x.id === id) b = x; });
      return '<span class="chip">📖 ' + escapeHtml(b ? b.name : id) + '</span>';
    }).join('');
    return '<div class="section"><h3>设定</h3><div class="prose">' + escapeHtml(c.description) + '</div></div>' +
      (c.personality ? '<div class="section"><h3>性格</h3><div class="prose">' + escapeHtml(c.personality) + '</div></div>' : '') +
      (c.scenario ? '<div class="section"><h3>场景</h3><div class="prose">' + escapeHtml(c.scenario) + '</div></div>' : '') +
      ((c.lorebook_ids || []).length ? '<div class="section"><h3>关联世界书</h3><div class="chips" style="margin-top:0">' + bookChips + '</div></div>' : '') +
      '<div class="section"><h3>开场白' + (greets.length ? '（点击选择备选开场）' : '') + '</h3>' +
      (greetHtml || emptyBox('💬', '该卡没有开场白', '')) + '</div>' +
      (c.mes_example ? '<details class="section"><summary>对话示例（点击展开）</summary>' +
        '<div class="prose" style="margin-top:8px">' + escapeHtml(c.mes_example) + '</div></details>' : '') +
      personaSectionHtml() +
      (c.creator_notes ? '<div class="section"><h3>备注</h3><div class="prose" style="color:var(--muted);font-size:11px">' + escapeHtml(c.creator_notes) + '</div></div>' : '');
  }
  function bindCardDetail() {
    $('mainBody').querySelectorAll('.greet-opt').forEach(function (node) {
      node.addEventListener('click', function () {
        state.greetingIndex = parseInt(node.getAttribute('data-gi'), 10) || 0;
        $('mainBody').querySelectorAll('.greet-opt').forEach(function (n) { n.className = 'greet-opt'; });
        node.className = 'greet-opt active';
      });
    });
    syncPersonaSection();
    if (state.personaMgrOpen) renderPersonaMgr();
  }
  function openCard(cardId) {
    if (state.activeCard !== cardId) {
      state.greetingIndex = 0;
      state.personaMgrOpen = false;
      state.armedPersona = '';
    }
    state.activeCard = cardId;
    state.deleteArmed = false;
    state.formCardId = null;
    renderList();
    var c = findCard(cardId);
    if (!c) return;
    if (themedCardId !== cardId) {  // 同卡重渲染（persona 增删等）不重复上行主题
      themedCardId = cardId;
      applyCardTheme(c);
    }
    renderCardActions(c);
    $('mainBody').innerHTML = cardDetailHtml(c);
    bindCardDetail();
  }

  // ── persona 三态与管理 ──
  function readPersonaText() {
    var box = $('personaText');
    if (box) state.personaText = box.value;
  }
  function syncPersonaSection() {
    var customBox = $('personaCustom');
    var meta = $('personaMeta');
    if (!customBox || !meta) return;
    customBox.hidden = state.personaSel.kind !== 'custom';
    var p = state.personaSel.kind === 'persona' ? findPersona(state.personaSel.id) : null;
    meta.textContent = p ? (p.description || '') : '';
  }
  function onPersonaSelChange() {
    readPersonaText();
    var v = $('personaSel').value;
    if (v === 'custom') state.personaSel = { kind: 'custom', id: '' };
    else if (v.slice(0, 2) === 'p:') state.personaSel = { kind: 'persona', id: v.slice(2) };
    else state.personaSel = { kind: 'none', id: '' };
    syncPersonaSection();
  }
  function togglePersonaMgr() {
    state.personaMgrOpen = !state.personaMgrOpen;
    var box = $('personaMgr');
    if (!box) return;
    box.hidden = !state.personaMgrOpen;
    if (state.personaMgrOpen) renderPersonaMgr();
  }
  function renderPersonaMgr() {
    var box = $('personaMgr');
    if (!box) return;
    var rows = state.personas.map(function (p) {
      var ops = state.armedPersona === p.id
        ? '<button onclick="personaDelete(\'' + escapeHtml(p.id) + '\')">⚠️ 确认删除</button>' +
          '<button class="secondary" onclick="personaDisarm()">取消</button>'
        : '<button class="secondary" onclick="personaArm(\'' + escapeHtml(p.id) + '\')">删除</button>';
      return '<div class="prow"><span>' + escapeHtml(p.avatar || '') + ' <b>' + escapeHtml(p.name) + '</b>' +
        (p.description ? ' <span class="mutednote">' + escapeHtml(p.description) + '</span>' : '') + '</span>' +
        '<span style="display:inline-flex;gap:6px">' + ops + '</span></div>';
    }).join('');
    box.innerHTML = '<div class="notice" style="margin-top:8px">' +
      (rows || '<div class="mutednote">暂无已存 persona，可用下方表单新增。</div>') +
      '<div class="formrow" style="margin-top:8px">' +
      '<input id="pName" placeholder="名称*" style="width:120px">' +
      '<input id="pAvatar" placeholder="emoji" style="width:70px">' +
      '<input id="pDesc" placeholder="一句话设定" style="flex:1;min-width:140px">' +
      '<button onclick="personaSave()">新增</button></div></div>';
  }
  function personaArm(id) { state.armedPersona = id; renderPersonaMgr(); }
  function personaDisarm() { state.armedPersona = ''; renderPersonaMgr(); }
  // persona 写面契约：save body={name,description,avatar}；delete body={persona_id}
  function personaSave() {
    var name = ($('pName').value || '').trim();
    if (!name) { toast('persona 名称必填', 'error'); return; }
    agentosFetch('/ext/mode_roleplay/data/personas/save', {
      name: name,
      description: $('pDesc').value,
      avatar: ($('pAvatar').value || '').trim()
    }).then(function (res) {
      var d = unwrap(res) || {};
      if (d.error) { toast('persona 保存失败：' + d.error, 'error'); return; }
      toast('persona 已保存：' + name);
      loadPersonas().then(function () { if (state.activeCard) openCard(state.activeCard); });
    }).catch(function (e) { toast('persona 保存失败：' + e, 'error'); });
  }
  function personaDelete(id) {
    agentosFetch('/ext/mode_roleplay/data/personas/delete', { persona_id: id }).then(function (res) {
      var d = unwrap(res) || {};
      if (d.error) { toast('persona 删除失败：' + d.error, 'error'); return; }
      toast('persona 已删除');
      state.armedPersona = '';
      if (state.personaSel.kind === 'persona' && state.personaSel.id === id) {
        state.personaSel = { kind: 'none', id: '' };
      }
      loadPersonas().then(function () { if (state.activeCard) openCard(state.activeCard); });
    }).catch(function (e) { toast('persona 删除失败：' + e, 'error'); });
  }

  // 所选开场白文本（面板侧解析，对齐派发期所选档口径）：0=first_mes，
  // ≥1=alternate_greetings[i-1]；越界/缺省回落 first_mes。
  function selectedGreetingText(c) {
    var alts = c.alternate_greetings || [];
    if (state.greetingIndex >= 1 && alts[state.greetingIndex - 1] != null) {
      return String(alts[state.greetingIndex - 1]);
    }
    return String(c.first_mes || '');
  }
  // 你的设定三态解析为文本：已存档案 → 档案 description；临时文本 → 原文；
  // 不注入 → 空串（载荷键缺省，会话不携带用户设定）。
  function resolvedUserPersonaText() {
    if (state.personaSel.kind === 'persona') {
      var p = findPersona(state.personaSel.id);
      return p ? String(p.description || '').trim() : '';
    }
    if (state.personaSel.kind === 'custom') return String(state.personaText || '').trim();
    return '';
  }

  // ── 开演（双按钮：possess 附身 / fresh 新开会话，用户裁定并列无默认）──
  // fresh = 会话化开演（开演即对话）：roleplay.continue 宿主桥建「扮演·<卡名>」
  // 会话并绑定卡身份、切到聊天区，载荷携带所选开场白与用户设定文本；首条开场
  // 触发消息由宿主自动发送——不再走任务派发（无开演记录、无评估语义）。
  function playCard(mode) {
    var c = findCard(state.activeCard);
    if (!c) return;
    readPersonaText();
    if (mode === 'possess') {
      var body = { card_id: c.id, play_mode: mode, greeting_index: state.greetingIndex };
      // persona 三态上行：选中档案 → persona_name；临时文本 → user_persona；不注入 → 两键都缺省
      if (state.personaSel.kind === 'persona') {
        var p = findPersona(state.personaSel.id);
        if (p) body.persona_name = p.name;
      } else if (state.personaSel.kind === 'custom' && state.personaText.trim()) {
        body.user_persona = state.personaText.trim();
      }
      setStatus('派发中...');
      agentosFetch('/ext/mode_roleplay/data/actions/play', body).then(function (res) {
        var d = unwrap(res) || {};
        setStatus('');
        if (d.error) { toast('派发失败：' + d.error, 'error'); return; }
        toast('已附身：' + c.name + '——在聊天区发送的消息将以该角色身份回应');
        // 宿主桥动作：通知宿主聊天区进入该角色附身态，personaText 携带卡人设
        //（cardPersonaText 拼接）。失败只提示不阻断（附身派发本身已成功）。
        agentosFetch('roleplay.possess', {
          card_id: c.id, name: c.name, avatar: c.avatar, personaText: cardPersonaText(c)
        })
          .catch(function (e) { toast('附身宿主通知失败：' + unwrapErrorMessage(e), 'error'); });
      }).catch(function (e) { setStatus(''); toast('派发失败：' + e, 'error'); });
      return;
    }
    var payload = { card_id: c.id, name: c.name, avatar: c.avatar };
    // 开场白/用户设定为空则键缺省（桥 fail-closed：在场键须非空字符串）
    var greeting = selectedGreetingText(c);
    if (greeting.trim()) payload.greeting = greeting;
    var personaText = resolvedUserPersonaText();
    if (personaText) payload.personaText = personaText;
    setStatus('创建会话中...');
    agentosFetch('roleplay.continue', payload).then(function () {
      setStatus('');
      toast('扮演会话已创建，已切换');
    }).catch(function (e) { setStatus(''); toast('扮演会话创建失败：' + unwrapErrorMessage(e), 'error'); });
  }

  // ── 卡新建/编辑表单 ──
  function editCard() { openCardForm(state.activeCard); }
  function openCardForm(cardId) {
    state.formCardId = cardId || null;
    state.deleteArmed = false;
    var c = cardId ? findCard(cardId) : null;
    renderMainHead(c ? '编辑角色卡 · ' + c.name : '新建角色卡',
      '<button onclick="saveCardForm()">💾 保存</button>' +
      '<button class="secondary" onclick="cancelCardForm()">取消</button>');
    // 出厂卡编辑 = 复制派生：服务端不动出厂件，另落一份可改的用户副本（新 id 回执）
    var copyNote = (c && c.origin === 'builtin')
      ? '<div class="notice" style="margin-bottom:12px">将创建用户副本（出厂卡不动）。</div>' : '';
    $('mainBody').innerHTML = copyNote + cardFormHtml(c);
    var nameInput = $('fName');
    if (nameInput) nameInput.focus();
  }
  function cardFormHtml(c) {
    function val(k) { return c && c[k] != null ? String(c[k]) : ''; }
    var avatarVal = c ? (c.avatar && typeof c.avatar === 'object' ? '' : String(c.avatar || '')) : '';
    var tagsVal = c ? (c.tags || []).join(',') : '';
    var bookIds = c && Array.isArray(c.lorebook_ids) ? c.lorebook_ids : [];
    var bookOpts = state.lorebooks.map(function (b) {
      return '<option value="' + escapeHtml(b.id) + '"' +
        (bookIds.indexOf(b.id) > -1 ? ' selected' : '') + '>' + escapeHtml(b.name) + '</option>';
    }).join('');
    function area(id, label, rows, content) {
      return '<div class="formrow" style="align-items:flex-start"><span class="flabel">' + label + '</span>' +
        '<textarea id="' + id + '" rows="' + rows + '" style="flex:1;min-width:220px">' + escapeHtml(content) + '</textarea></div>';
    }
    return '<div class="section">' +
      '<div class="formrow"><span class="flabel">名称 *</span>' +
      '<input id="fName" value="' + escapeHtml(val('name')) + '" style="flex:1;min-width:200px"></div>' +
      '<div class="formrow"><span class="flabel">头像 emoji</span>' +
      '<input id="fAvatar" value="' + escapeHtml(avatarVal) + '" maxlength="4" placeholder="如 🧝" style="width:120px"></div>' +
      '<div class="formrow"><span class="flabel">标签</span>' +
      '<input id="fTags" value="' + escapeHtml(tagsVal) + '" placeholder="逗号分隔，如 奇幻,治愈" style="flex:1;min-width:200px"></div>' +
      '<div class="formrow" style="align-items:flex-start"><span class="flabel">关联世界书</span>' +
      '<select id="fBooks" multiple size="4" style="flex:1;min-width:220px">' + bookOpts + '</select></div>' +
      area('fDesc', '设定', 3, val('description')) +
      area('fPersonality', '性格', 2, val('personality')) +
      area('fScenario', '场景', 2, val('scenario')) +
      area('fFirstMes', '开场白', 3, val('first_mes')) +
      area('fMesExample', '对话示例', 4, val('mes_example')) +
      area('fSystemPrompt', '系统提示词', 4, val('system_prompt')) +
      '</div>';
  }
  // save 契约：body=卡字段（card_id 有值=编辑，缺省=新建；出厂卡副本 id 由服务端派生）
  // → 响应 {card_id}，保存后刷新列表并打开该卡
  function saveCardForm() {
    var name = ($('fName').value || '').trim();
    if (!name) { toast('名称必填', 'error'); return; }
    var books = [];
    var opts = $('fBooks').options;
    for (var i = 0; i < opts.length; i++) { if (opts[i].selected) books.push(opts[i].value); }
    var body = {
      name: name,
      description: $('fDesc').value,
      personality: $('fPersonality').value,
      scenario: $('fScenario').value,
      first_mes: $('fFirstMes').value,
      mes_example: $('fMesExample').value,
      system_prompt: $('fSystemPrompt').value,
      tags: $('fTags').value.split(/[,，]/).map(function (t) { return t.trim(); }).filter(Boolean),
      lorebook_ids: books,
      avatar: ($('fAvatar').value || '').trim()
    };
    if (state.formCardId) body.card_id = state.formCardId;
    setStatus('保存中...');
    agentosFetch('/ext/mode_roleplay/data/cards/save', body).then(function (res) {

  // ── 卡导入/导出/删除 ──
  // import 契约：body={filename, data_base64}（文件字节 base64，支持 .png/.json）
  // → 响应 {card_id, warnings?[]}；warnings 非空 = 服务端检出可疑指令模式
  function importCard() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.png,.json';
    input.addEventListener('change', function () {
      var f = input.files && input.files[0];
      if (!f) return;  // 用户取消选择：无动作
      var reader = new FileReader();
      reader.onload = function () {
        // ArrayBuffer → base64（readAsDataURL 路径不可用，按字节自行编码）
        var bytes = new Uint8Array(reader.result || []);
        var bin = '';
        for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        var b64 = btoa(bin);
        setStatus('导入中...');
        agentosFetch('/ext/mode_roleplay/data/cards/import', { filename: f.name, data_base64: b64 })
          .then(function (res) {
            var d = unwrap(res) || {};
            setStatus('');
            if (d.error) { toast('导入失败：' + d.error, 'error'); return; }
            var warned = (d.warnings || []).length > 0;
            toast('导入成功：' + (d.card_id || f.name) +
              (warned ? '\n⚠️ 检测到可疑指令模式，建议检查' : ''), warned ? 'warn' : '');
            loadCards().then(function () {
              switchTab('cards');
              if (d.card_id) openCard(d.card_id);
            });
          })
          .catch(function (e) { setStatus(''); toast('导入失败：' + e, 'error'); });
      };
      reader.onerror = function () { toast('文件读取失败', 'error'); };
      reader.readAsArrayBuffer(f);
    });
    input.click();
  }
  // export 契约：body={card_id} → 响应 {filename, content_base64}，
  // data URI + a[download] 落地 json（沙箱内无模态/无直连网络，走浏览器下载面）
  function exportCard() {
    var c = findCard(state.activeCard);
    if (!c) return;
    agentosFetch('/ext/mode_roleplay/data/cards/export', { card_id: c.id }).then(function (res) {
      var d = unwrap(res) || {};
      if (d.error) { toast('导出失败：' + d.error, 'error'); return; }
      var name = d.filename || (c.id + '.json');
      var a = document.createElement('a');
      a.setAttribute('download', name);
      a.setAttribute('href', 'data:application/json;base64,' + String(d.content_base64 || ''));
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      toast('已导出：' + name);
    }).catch(function (e) { toast('导出失败：' + e, 'error'); });
  }

  // 书表单工作副本：bookFormHead（书级字段）+ bookFormEntries（条目数组），

  function editBook() { openBookForm(state.activeBook); }
  function openBookForm(bookId) {
    state.formBookId = bookId || null;

    state.bookFormHead = b
      ? { name: b.name || '', description: b.description || '',

  function bookFormHtml() {

        '<div class="formrow">' +

      (entryRows || '<div class="mutednote">空书：点「加条目」创建条目。</div>') +
      '</div></div>';

  function intOr(v, dflt) { var n = parseInt(v, 10); return isNaN(n) ? dflt : n; }
  function syncBookFormState() {
    if ($('bName')) {
      state.bookFormHead = {
        name: $('bName').value,
        description: $('bDesc').value,
        scan_depth: intOr($('bDepth').value, 4),
        token_budget: intOr($('bBudget').value, 512),
      };
    }
    // 按 index 对位收集条目 DOM 现值；表单外字段从工作副本原样保留
    state.bookFormEntries = (state.bookFormEntries || []).map(function (e, i) {
      var keysEl = document.getElementById('eKeys_' + i);
      if (!keysEl) return e;
      var out = {};
      Object.keys(e).forEach(function (k) { out[k] = e[k]; });
      out.keys = keysEl.value.split(/[,，]/).map(function (t) { return t.trim(); }).filter(Boolean);
      out.content = document.getElementById('eContent_' + i).value;
      out.enabled = document.getElementById('eEnabled_' + i).checked;
      out.constant = document.getElementById('eConstant_' + i).checked;
      out.insertion_order = intOr(document.getElementById('eOrder_' + i).value, 100);
      out.position = document.getElementById('ePos_' + i).value;
      return out;
    });
  }
  function addBookEntry() {

      insertion_order: 100, constant: false, position: 'before_char', comment: '' });

  // save 契约：body=书字段（book_id 有值=编辑，缺省=新建由服务端派生 id；出厂书

  // ── 开演记录详情（BUG-73 断点b 可见面）：摘要卡 + 扮演轮次回显 + 进度态联动 ──
  // 演出消息落在任务管道里（聊天区不渲染），面板经 /data/messages 只读回显
  // assistant 轮次——「开演是否有真实扮演产出」在此可核。
  function performanceHtml(messages, s) {
    var turns = (messages || []).filter(function (m) { return m.role === 'assistant' && m.content; });
    if (turns.length) {
      return turns.map(function (m) {
        return '<div class="quote">' + escapeHtml(m.content) + '</div>';
      }).join('');
    }
    if (s && s.run_status === 'running') {
      return '<div class="notice"><span class="dot running"></span> 🎭 演出进行中…（任务执行中，稍后点「刷新」看产出）</div>';
    }
    if (s && s.task_status === 'completed') {
      return '<div class="notice">演出已完成但未捕获产出（可在聊天区续演后用消息操作重试）。</div>';
    }
    return '<div class="notice">演出尚未落定（任务执行中或暂无产出），稍后点「刷新」再看。</div>';
  }
  function loadPerformance(pipelineId) {
    agentosFetch('/ext/mode_roleplay/data/messages?pipeline_id=' + encodeURIComponent(pipelineId))
      .then(function (res) {
        if (state.activeSession !== pipelineId) return;  // 已切走：丢弃过期回包
        var d = unwrap(res) || {};

        if (box) {

          state.sessions.forEach(function (x) { if (x.pipeline_id === pipelineId) s = x; });

        toast('已创建扮演会话，已为你切换到聊天区');
      })
      .catch(function (e) { toast('转续演失败：' + unwrapErrorMessage(e), 'error'); });
  }
  function continueCard() {
    var c = findCard(state.activeCard);
    if (!c) return;
    continuePlay(c.id, c.name);
  }
  function continueFromRecord() {
    var s = null;
    state.sessions.forEach(function (x) { if (x.pipeline_id === state.activeSession) s = x; });
    if (!s) return;
    var prefix = 'mode_roleplay/';
    var cardId = String(s.agent_id || '').indexOf(prefix) === 0 ? s.agent_id.slice(prefix.length) : '';
    if (!cardId) { toast('该记录未绑定角色身份，无法转续演', 'error'); return; }
    continuePlay(cardId, (findCard(cardId) || {}).name || cardId);
  }

  // ── 入口 ──
  renderList();
  showWelcome();
  refreshAll();
  </script>
</body>
</html>
