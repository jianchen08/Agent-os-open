<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>SnippetBox 片段速查库</title>
  <!-- 自包含契约：单 script、无外链资源引用、无出网调用（CSP connect-src 'none'
       挡全部动态通道）。数据由供页端点替换 __SNIPPET_DATA_JSON__ 锚点内联，
       刷新=重新供页取最新快照。 -->
  <style>
    body { font-family: system-ui, "Microsoft YaHei", sans-serif; margin: 24px; color: #1d2539; background: #f5f7fb; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .meta { color: #667; font-size: 12px; margin-bottom: 16px; }
    #q { width: 100%; box-sizing: border-box; padding: 8px 12px; border: 1px solid #ccd3e0; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
    .card { background: #fff; border: 1px solid #e2e7f0; border-radius: 10px; padding: 12px 16px; margin-bottom: 12px; }
    .card h2 { font-size: 15px; margin: 0 0 6px; }
    .tag { display: inline-block; background: #e8eefc; color: #2a4d8f; border-radius: 999px; padding: 1px 10px; font-size: 12px; margin-right: 6px; }
    pre { background: #f2f4f8; border-radius: 6px; padding: 10px; font-size: 13px; white-space: pre-wrap; word-break: break-all; margin: 8px 0 0; font-family: Consolas, monospace; }
    .empty { color: #667; border: 1px dashed #99a; padding: 16px; border-radius: 8px; text-align: center; }
    .hid { display: none; }
  </style>
</head>
<body>
  <h1>SnippetBox 片段速查库</h1>
  <div class="meta" id="meta"></div>
  <input id="q" type="text" placeholder="本地过滤：标题 / 标签 / 内容子串（不触网）">
  <div id="list"></div>
  <script>
    // 单 script：数据由供页端点内联（锚点替换），全部交互本地完成。
    const DATA = __SNIPPET_DATA_JSON__;
    const listEl = document.getElementById("list");
    const metaEl = document.getElementById("meta");
    const qEl = document.getElementById("q");
    const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    function card(s) {
      const div = document.createElement("div");
      div.className = "card";
      const tags = (s.tags || []).map((t) => '<span class="tag">' + esc(t) + "</span>").join("");
      div.innerHTML = '<h2>' + esc(s.title || "(无标题)") + '</h2><div>' + tags + '</div><pre>' + esc(s.content) + '</pre>';
      div.dataset.needle = ((s.title || "") + " " + (s.tags || []).join(" ") + " " + (s.content || "")).toLowerCase();
      return div;
    }
    function render(snips) {
      listEl.innerHTML = "";
      if (!snips.length) {
        listEl.innerHTML = '<div class="empty">库为空：用 LLM 工具 snippet_box 的 add 动作添加片段，刷新页面取最新快照</div>';
      } else {
        snips.forEach((s) => listEl.appendChild(card(s)));
      }
      metaEl.textContent = "共 " + snips.length + " 条片段（供页时内联快照）";
    }
    qEl.addEventListener("input", () => {
      const q = qEl.value.trim().toLowerCase();
      const cards = listEl.querySelectorAll(".card");
      cards.forEach((c) => c.classList.toggle("hid", q !== "" && c.dataset.needle.indexOf(q) === -1));
    });
    render(DATA.snippets || []);
  </script>
</body>
</html>
