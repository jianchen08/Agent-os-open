# 文风标准档·具象白描（C1 整合刀 2026-10-13）——档位结构契约（C2 开演向导消费面）：
#   id:          档位标识（snake_case，向导引用键，styles/ 目录内唯一，与文件名一致）
#   name:        档位名（中文展示名）
#   traits:      特征清单（字符串列表，写作纪律条目，可逐条拼入提示词）
#   authors:     参考作家（字符串列表，检索锚点；仅作家名事实，不含任何原文引用）
#   sample_note: 示例风格说明（80-150 字原创整合文案，向导预览用）
# 字段缺一不可（schema 校验见 modes/tests/test_roleplay_style_profiles.py）。
# 考据来源（整合对照，措辞原创）：wbu-craft-control-sliders（MIT，可改编）、
# sudachi-zh-style-core（MIT，可改编）、spiderweb-zh-bagu-style-crafts（对照）、
# bartender-zh-style-library（对照，作家锚）、nemo-atelier-style-library（对照）。
# 播种自包含：本目录数据不 import 共享根模块，C2 按 yaml 逐文件读取。
id: concrete_plain
name: 具象白描档
traits:
  - 情绪一律不点名，只写动作、姿态与注意力的去向
  - 名词具体：品牌、街名、时辰、物件的新旧程度
  - 句子短而平，口语底色，少用成语与比喻
  - 感官贴人物视角：他此刻能看见听见的才写
  - 让重复出现的小物件承担情绪（一只杯子、一把伞）
  - 对话像日常说话，允许说不完整、被打断
  - 结尾停在动作或画面上，不做总结升华
authors:
  - 汪曾祺
  - 杨本芬
  - 海明威
sample_note: >-
  写物不写情，写动作不写心理。情绪藏在动作里：不说"他很紧张"，写他把烟盒里的
  烟倒出来又一根根装回去。名词要具体到牌子、街名、时辰，句子短而平，少用成语与
  比喻。感官贴着人物走：他闻到什么、碰到什么，读者就看到什么。留白交给读者，
  不替他总结。
