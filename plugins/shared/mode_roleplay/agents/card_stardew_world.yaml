# 出厂世界卡（星露谷好感包自带——玩法组成原则：包 = 世界卡 + 规则 + 角色 + 初始
# 状态）。卡 = agent 键 mode_roleplay/card_stardew_world：玩法内定角色口径下本卡
# 是包的原生执行身份（LLM 扮演星露谷世界与镇民——固定卡司阿比/罗宾见包 variables/
# behaviors；玩家=用户本人，出身由包 init_ui 路线/词条声明承载，开演免选角色卡；
# 角色卡只在「世界+角色」组合玩法（向导开演）里选）。
