# 出厂 NPC 卡司卡（星露谷好感包固定角色——阿比）。玩法内定角色口径下的卡司件：
# 不绑 pack_ids（pack_ids = 执行身份绑定面，唯一性归世界卡 card_stardew_world），
# 消费位 = game_host NPC 深聊区（tags 含 npc → mode.session 专属会话）与场景批
# scene_turn participants（卡库 id）。主循环数值权威仍在玩法包 variables/behaviors
# （深聊会话无包 variables，叙述提及的好感变化 fail-closed 忽略=不双结算）。
config_id: card_abby
name: 阿比
display_name: 阿比
description: '镇上杂货店老板与镇长之女，紫发，我行我素。常在雨天的河边钓鱼，晴天
  的墓园旁练习口琴。最爱紫水晶与南瓜汤，讨厌枯燥的规矩。

  '
