    var pack = setupPack();
    var init = (pack && pack.init_ui) || {};
    var routes = init.routes || [];
    var pools = init.trait_pools || [];
    // 玩法内定角色（2026-10-17 用户裁定）：包有绑定卡（卡顶层 pack_ids 引用包）
    // 时卡为内定执行身份——不渲染选卡件，开演免选（固定玩法零跨包选卡；角色卡
    // 选择只存在于世界+角色组合玩法）。无绑定卡回落全库下拉（兼容态零变化）。
    var boundCards = pack
      ? setup.cards.filter(function (c) { return (c.pack_ids || []).indexOf(pack.id) > -1; })
      : [];
    var fixedCast = boundCards.length > 0;
    if (fixedCast && !boundCards.some(function (c) { return c.id === setup.cardId; })) {
      setup.cardId = boundCards[0].id;  // 内定身份锁定（残留选择自动归位）
    }
    var cardPool = boundCards.length ? boundCards : setup.cards;
    var html = '<div class="formrow">' +
      '<span class="flabel">玩法包</span>' +
      '<select id="gh-setup-pack" data-testid="gh-setup-pack"' + (setup.packs.length ? '' : ' disabled') + '>' +
      (setup.packs.map(function (p) {
        return '<option value="' + escapeHtml(p.id) + '"' + (setup.packId === p.id ? ' selected' : '') + '>' +
          escapeHtml(p.name || p.id) + '</option>';
      }).join('') || '<option value="">（无玩法包）</option>') + '</select>' +
      (fixedCast
        ? '<span class="flabel">角色</span><span class="setup-note">内定（' +
          escapeHtml((boundCards[0].name || boundCards[0].id)) + '）——本玩法固定卡司，无需选卡</span>'
        : '<span class="flabel">角色卡</span>' +
      '<select id="gh-setup-card" data-testid="gh-setup-card"' + (cardPool.length ? '' : ' disabled') + '>' +
      (cardPool.map(function (c) {
        return '<option value="' + escapeHtml(c.id) + '"' + (setup.cardId === c.id ? ' selected' : '') + '>' +
          escapeHtml(c.name || c.id) + '</option>';
      }).join('') || '<option value="">（无角色卡）</option>') + '</select>') + '</div>';
    if (!setup.packs.length) {
      html += '<div class="setup-note">玩法包清点读取失败或为空（不选包也可按卡直接开演）。</div>';
    }
    if (pack && (init.title || init.intro)) {
      html += '<h3>' + escapeHtml(init.title || '开演设置') + '</h3>' +
        (init.intro ? '<div class="setup-note">' + escapeHtml(init.intro) + '</div>' : '');
    }
    if (pack && init.show_variables) {
      html += '<div class="setup-note">本包声明 ' + (pack.variables_count || 0) +
        ' 个状态变量，开局按缺省档起算。</div>';
    }
    if (routes.length) {
      html += '<h3>开局路线（单选）</h3><div class="setup-opts">' + routes.map(function (r) {
        return '<label class="setup-opt"><input type="radio" name="gh-setup-route" value="' +
          escapeHtml(r.id) + '"' + (setup.routeId === r.id ? ' checked' : '') +
          ' data-testid="gh-setup-route-opt"><b>' + escapeHtml(r.label || r.id) + '</b>' +
          (r.profile ? '<span class="setup-note">' + escapeHtml(r.profile) + '</span>' : '') + '</label>';
      }).join('') + '</div>';
    }
    pools.forEach(function (pool) {
      var opts = (pool.options || []).map(function (opt) {
        var effects = opt.effects
          ? '<span class="setup-note">' + escapeHtml(Object.keys(opt.effects).map(function (k) {
              return k + ' ' + opt.effects[k];
            }).join('、')) + '</span>'
          : '';
        return '<label class="setup-opt"><input type="checkbox" data-trait="' + escapeHtml(opt.id) + '"' +
          (setup.traitIds.indexOf(opt.id) > -1 ? ' checked' : '') +
          ' data-testid="gh-setup-trait-opt"><b>' + escapeHtml(opt.label || opt.id) + '</b>' +
          (opt.profile ? '<span class="setup-note">' + escapeHtml(opt.profile) + '</span>' : '') +
          effects + '</label>';
      }).join('');
      html += '<h3>' + escapeHtml(pool.label || pool.id) + '（多选）</h3><div class="setup-opts">' + opts + '</div>';
    });
    if (pack && !routes.length && !pools.length && init.title === undefined && init.intro === undefined
      && init.show_variables === undefined) {
      // 包无 init_ui 声明 = 跳过声明段（兼容态：无声明包开演行为现状零变化）
      html += '<div class="setup-note">该玩法包未声明开演配置（init_ui）——直接开演即可。</div>';
    }
    html += '<div class="formrow" style="margin-top:10px">' +
      '<button id="gh-setup-start" data-testid="gh-setup-start">🎬 开 演</button>' +
      '<span class="setup-note">开演后：对话进系统对话页，游玩在本页（包自包含玩法页的包由包页整区接管）。</span></div>';
    html += '<div id="gh-setup-err" data-testid="gh-setup-err" class="setup-note" ' +
      'style="color:#c0392b;font-weight:600;display:none"></div>';
    box.innerHTML = html;
    // 可见默认即状态：浏览器对首选项的隐式选中必须回写状态层，否则「显示已选卡、
    // 开演报未选」（2026-10-15 用户实测复现：下拉显示凯尔·铁手、点开演报未选卡）
    var packSelEl = $('gh-setup-pack');
    if (packSelEl && packSelEl.value && !setupPack()) setup.packId = packSelEl.value;
    var cardSelEl = $('gh-setup-card');
    if (cardSelEl && cardSelEl.value) {
      var inPool = cardPool.some(function (c) { return c.id === setup.cardId; });
      if (!inPool) setup.cardId = cardSelEl.value;
    }
  }
  function setupError(msg) {
    var el = $('gh-setup-err');
    if (el) { el.textContent = msg || ''; el.style.display = msg ? 'block' : 'none'; }
    setStatus(msg || '');
  }
  function setupStart() {
    setupError('');
    var pack = setupPack();
    var card = setupCard();
    if (!card) { setupError('请先选择角色卡（下拉有值即已选中；若仍提示请点「刷新」重载卡库）'); return; }
    var payload = {
      mode: 'roleplay',
      agent_id: 'mode_roleplay/' + card.id,
      name: card.name,
      title: '扮演·' + card.name,
      first_message: '（开始）'
    };
    var extra = {};
    if (card.first_mes) extra.roleplay_greeting = String(card.first_mes);
    // 玩法归属：卡声明在前，本场包增量并入（与面板既有开演载荷同键同语义；
    // Validator 键域按卡+包装载）
    var packIds = (card.pack_ids || []).slice();
    if (pack && packIds.indexOf(pack.id) < 0) packIds.push(pack.id);
    if (packIds.length) extra.wizard_pack_ids = packIds.join(',');
    // 玩法级管道绑定（批次一，调研 §6.4）：本场包声明管道透传（清点键
    // pipeline，服务端已过登记校验）；无声明 = 键缺省（现役回落态零变化）
    if (pack && pack.pipeline) payload.pipeline_config_id = pack.pipeline;
    var init = (pack && pack.init_ui) || {};
    var route = findRoute(init, setup.routeId);
    var traits = findTraitOptions(init, setup.traitIds);
    var profile = rpProfileFromSelection(route, traits, '');
    if (profile) extra.wizard_profile = profile;
    var initSnap = rpInitSnapshot(rpInitPairs(route, traits));
    if (initSnap) extra.rp_init = initSnap;
    if (Object.keys(extra).length) payload.extra_context = extra;
    // 卡主题随扮演会话出生（批次四，与面板开演同键同语义）：所选卡 theme 载荷
    // （卡库 /data/cards 条目字段，完整 ThemeConfig 档）随出生桥上行；无主题卡
    // = 键缺席（现役行为一致），非法档宿主 fail-closed 丢该位
    if (card.theme) payload.card_theme = card.theme;
    setStatus('创建会话中...');
    rpHost.request('mode.session', payload).then(function (res) {
      setStatus('');
      setupHide();
      setStatus('已开演（无租约时先「接入」再发言）');
      // 页内开演回执广播：面板「工作区」签同窗监听同步锚（无监听者=无副作用）
      try {
        window.dispatchEvent(new CustomEvent('rp:session-bound', { detail: { sid: (unwrap(res) || {}).session_id || '' } }));
      } catch (e) { /* 老宿主无 CustomEvent=表现层降级 */ }
      pollSessions();
      pollOnce();
    }).catch(function (err) { setupError('开演失败: ' + err.message); });
  }
  $('gh-setup-open').addEventListener('click', function () {
    setup.dismissed = false;
    setupShow();
  });
  $('gh-setup-close').addEventListener('click', setupHide);
  $('gh-setup').addEventListener('change', function (e) {
    var t = e.target;
    if (!t || typeof t.getAttribute !== 'function') return;
    if (t.id === 'gh-setup-pack') {
      setup.packId = t.value;
      setup.routeId = null;
      setup.traitIds = [];
      renderSetup();
    } else if (t.id === 'gh-setup-card') {
      setup.cardId = t.value;
    } else if (t.name === 'gh-setup-route') {
      setup.routeId = t.value;
      renderSetup();
    } else if (t.type === 'checkbox' && t.getAttribute('data-trait') !== null) {
      var v = t.getAttribute('data-trait');
      var i = setup.traitIds.indexOf(v);
      if (i > -1) setup.traitIds.splice(i, 1); else setup.traitIds.push(v);
    }
  });
  $('gh-setup').addEventListener('click', function (e) {
    var t = e.target;
    if (t && t.id === 'gh-setup-start') setupStart();
  });

  // 拆卸契约（面板挂载器 playPageDispose 消费，SDK 面见 GAME_HOST_SDK.md）：同
  // 窗 document 注入挂载下容器清空杀不掉活脚本——页面自报清理，装载器换页前
  // 调用，保证任意时刻至多一个活实例（多实例并存的定时器/监听器交叉写入=重影
  // 根因）。在飞回包经 disposed 判废不写 DOM。
  window.__RP_PAGE_DISPOSE__ = function () {
    disposed = true;
    if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
    window.removeEventListener('message', onHostMessage);
    document.removeEventListener('pointerdown', onFirstPointer);
  };

  pollSessions();
  pollOnce();
  restartPolling();
  })();
  </script>
</body>
</html>
