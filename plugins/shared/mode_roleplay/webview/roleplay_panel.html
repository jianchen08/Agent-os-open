<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>酒馆工作坊</title>
  <style>
    /* 面板主题跟宿主：宿主经 theme.sync 下行 --ag-* token（documentElement 内联），
       此处变量以 var(--ag-*, fallback) 桥接——token 未到时回落本文件基座
       （@media(prefers-color-scheme) 提供亮暗 fallback 基座）。 */
    :root {
      --bg: var(--ag-bg, #f6f7fb); --fg: var(--ag-fg, #1a1a2e);
      --muted: var(--ag-muted, #64748b); --border: var(--ag-border, #d7dce6);
      --card: var(--ag-card, #ffffff); --accent: var(--ag-accent, #7c5cff);
      --accent-soft: var(--ag-accent-soft, #efeaff); --chip: var(--ag-chip, #f1f5f9);
      --on-accent: var(--ag-accent-contrast, #fff);
      --ok: var(--ag-ok, #16a34a); --warn: var(--ag-warn, #d97706);
      --err: var(--ag-err, #dc2626); --radius: var(--ag-radius, 8px);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: var(--ag-bg, #12121c); --fg: var(--ag-fg, #e2e8f0);
        --muted: var(--ag-muted, #94a3b8); --border: var(--ag-border, #2c2f45);
        --card: var(--ag-card, #1b1d2e); --accent: var(--ag-accent, #a78bfa);
        --accent-soft: var(--ag-accent-soft, #2a2547); --chip: var(--ag-chip, #262a3d);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--fg); background: var(--bg);
      font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      height: 100vh; display: flex; flex-direction: column;
    }
    /* 顶栏：表面色底 + 细边框分隔（对照设计稿 .rp-top 轻量形态；不做大面积
       重色/主题色底，配色全部跟 --ag-* 主题 token 走） */
    header {
      display: flex; align-items: center; gap: 8px; flex: none; position: relative;
      padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--card);
    }
    header h1 { margin: 0; font-size: 13px; font-weight: 600; }
    header .spacer { flex: 1; }
    #modeName { color: var(--muted); font-size: 11px; }
    #status { color: var(--muted); font-size: 11px; min-width: 60px; text-align: right; }
    /* 按钮主次分级：主 = accent 实底 / 次 = chip 底 + 描边 */
    button {
      padding: 4px 12px; background: var(--accent); color: var(--on-accent);
      border: 1px solid transparent; border-radius: var(--radius);
      cursor: pointer; font-size: 12px; line-height: 1.6; font-family: inherit;
    }
    button.secondary { background: var(--chip); color: var(--fg); border-color: var(--border); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    input, textarea, select {
      padding: 4px 8px; background: var(--card); color: var(--fg);
      border: 1px solid var(--border); border-radius: var(--radius);
      font-size: 12px; line-height: 1.6; font-family: inherit;
    }
    textarea { resize: vertical; }
    .layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 8px; flex: 1; min-height: 0; padding: 8px; }
    .layout.solo { grid-template-columns: minmax(0, 1fr); }
    .drawer, .main {
      display: flex; flex-direction: column; min-height: 0;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--card); overflow: hidden;
    }
    /* 作者 display 会压过 [hidden] 的 UA 样式——抽屉关闭态必须显式回 none */
    .drawer[hidden] { display: none; }
    .tabs { display: flex; border-bottom: 1px solid var(--border); flex: none; }
    .tabs button {
      flex: 1; background: none; color: var(--muted); border: none; border-radius: 0;
      padding: 8px 0; border-bottom: 2px solid transparent;
    }
    .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
    .list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
    .item {
      border: 1px solid var(--border); border-radius: var(--radius); padding: 8px;
      cursor: pointer; background: var(--card);
    }
    .item:hover { border-color: var(--accent); }
    .item.active { border-color: var(--accent); background: var(--accent-soft); }
    .item .row1 { display: flex; align-items: center; gap: 8px; }
    .avatar {
      width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft);
      color: var(--accent); display: flex; align-items: center; justify-content: center;
      font-weight: 600; flex: none;
    }
    .item .name { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .sub { color: var(--muted); font-size: 11px; margin-top: 4px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; }
    /* 卡库画廊（页签工具行 + 封面卡网格） */
    .toolrow { display: flex; gap: 6px; flex: none; padding-bottom: 8px; border-bottom: 1px dashed var(--border); }
    .toolrow button { flex: 1; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .gcard {
      border: 1px solid var(--border); border-radius: var(--radius); padding: 8px;
      cursor: pointer; background: var(--card);
      display: flex; flex-direction: column; gap: 6px;
    }
    .gcard:hover { border-color: var(--accent); }
    .gcard.active { border-color: var(--accent); background: var(--accent-soft); }
    .gavatar {
      width: 100%; height: 92px; border-radius: var(--radius); background: var(--accent-soft);
      color: var(--accent); display: flex; align-items: center; justify-content: center;
      font-size: 26px; flex: none;
    }
    .grow { display: flex; align-items: center; gap: 4px; min-width: 0; }
    .gname { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .origin-badge {
      font-size: 10px; padding: 0 6px; border-radius: var(--radius);
      background: var(--chip); color: var(--muted); flex: none;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .chip {
      font-size: 10px; background: var(--chip); color: var(--muted);
      padding: 1px 7px; border-radius: var(--radius);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
    .dot.running { background: var(--ok); animation: dotpulse 1.2s ease-in-out infinite; }
    .dot.done { background: var(--muted); }
    .dot.other { background: var(--warn); }
    @keyframes dotpulse { 50% { opacity: .35; } }
    .entry { border-bottom: 1px solid var(--border); padding: 8px 2px; }
    .entry:last-child { border-bottom: none; }
    .entry .keys { color: var(--accent); font-size: 11px; }
    .entry .content { margin-top: 4px; color: var(--fg); white-space: pre-wrap; }
    .entry .meta { margin-top: 4px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .badge { font-size: 10px; padding: 1px 7px; border-radius: var(--radius); background: var(--chip); color: var(--muted); }
    .badge.on { color: var(--ok); } .badge.off { color: var(--err); }
    .main-head {
      flex: none; padding: 8px 12px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
    }
    .main-head .title { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #mainActions { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .main-body { flex: 1; overflow-y: auto; padding: 12px 16px; }
    .section { margin-bottom: 16px; }
    .section h3 { margin: 0 0 8px; font-size: 11px; font-weight: 600; color: var(--muted); }
    details.section summary { cursor: pointer; font-size: 11px; font-weight: 600; color: var(--muted); }
    .prose { white-space: pre-wrap; font-size: 13px; }
    .quote {
      border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--accent-soft);
      border-radius: 0 var(--radius) var(--radius) 0; white-space: pre-wrap;
    }
    .formrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .flabel { width: 84px; flex: none; color: var(--muted); font-size: 11px; text-align: right; }
    .linkish { color: var(--accent); cursor: pointer; text-decoration: underline; font-size: 11px; }
    .mutednote { color: var(--muted); font-size: 11px; }
    /* persona 管理小面板行 */
    .prow {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      flex-wrap: wrap; padding: 4px 0; border-bottom: 1px solid var(--border);
    }
    .prow:last-of-type { border-bottom: none; }
    /* 开演记录摘要卡（对话在对话框，面板不内置对话流） */
    .sumcard {
      border: 1px solid var(--border); border-radius: var(--radius); background: var(--card);
      padding: 12px 16px; display: flex; flex-direction: column; gap: 8px;
    }
    .sumrow { display: flex; gap: 12px; align-items: baseline; }
    .sumlabel { color: var(--muted); font-size: 11px; flex: none; width: 32px; }
    .sumval { word-break: break-word; }
    .notice {
      border: 1px dashed var(--border); border-radius: var(--radius);
      padding: 8px 12px; color: var(--muted);
    }
    .empty {
      height: 100%; min-height: 120px; display: flex; flex-direction: column; gap: 8px;
      align-items: center; justify-content: center; color: var(--muted);
      border: 1px dashed var(--border); border-radius: var(--radius); padding: 16px; text-align: center;
    }
    .empty .empty-icon { font-size: 28px; }
    .empty .empty-label { font-size: 13px; color: var(--fg); }
    .empty .empty-note { font-size: 11px; opacity: .75; }
    .toast {
      position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px;
      background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: var(--radius);
      font-size: 12px; display: none; max-width: 80%; white-space: pre-wrap;
    }
    .toast.error { background: var(--err); color: var(--on-accent); }
    .toast.warn { background: var(--warn); color: var(--on-accent); }
    .greet-opt {
      border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px;
      margin-top: 8px; cursor: pointer; white-space: pre-wrap; font-size: 13px;
    }
    .greet-opt.active { border-color: var(--accent); background: var(--accent-soft); }
    /* 开演选择件（向导/builder 同族：卡片流选项，复用面板既有变量基座） */
    .wiz-opts { display: flex; flex-direction: column; gap: 6px; }
    .wiz-opt {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 8px 10px; cursor: pointer; background: var(--card);
    }
    .wiz-opt:hover { border-color: var(--accent); }
    .wiz-opt.active { border-color: var(--accent); background: var(--accent-soft); }
    .wiz-opt-name { font-weight: 600; }
    .wiz-nav {
      display: flex; gap: 8px; align-items: center;
      border-top: 1px dashed var(--border); padding-top: 10px;
    }
    /* 面板桥失败 ≠ 真空数据：显式错误横幅（--ag-err 语义色）与「暂无 XX」空态区分 */
    .bridge-err {
      border: 1px solid var(--err, #dc2626); border-radius: var(--radius, 8px); padding: 16px;
      display: flex; flex-direction: column; gap: 8px; align-items: center;
      justify-content: center; text-align: center; margin: 8px;
    }
    .bridge-err-title { color: var(--err, #dc2626); font-weight: 600; }
    .bridge-err-msg { font-size: 11px; color: var(--muted, #64748b); word-break: break-all; }
    /* ── v3.1 四视图 IA：主导航 / 我的菜单 / 大厅卡 / 玩法子页 ──────────────── */
    .rp-logo { font-size: 13px; font-weight: 600; cursor: pointer; }
    .rp-logo i { color: var(--accent); font-style: normal; }
    /* 主导航：与顶栏同表面色底（无重色块），active 项 = accent 前景 + 底部 2px
       下划线（设计稿 .rp-nav 形态） */
    .rp-nav { display: flex; gap: 4px; padding: 6px 12px 0; border-bottom: 1px solid var(--border); background: var(--card); flex: none; }
    .rp-nav button { background: none; color: var(--muted); border: none; border-radius: 8px 8px 0 0; padding: 7px 16px; border-bottom: 2px solid transparent; }
    .rp-nav button.active { color: var(--accent); border-bottom-color: var(--accent); }
    #meMenu {
      position: absolute; top: 36px; right: 10px; z-index: 30;
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: 0 4px 16px rgba(0,0,0,.18); min-width: 170px; padding: 4px;
    }
    #meMenu button { display: block; width: 100%; text-align: left; background: none; color: var(--fg); border: none; padding: 7px 10px; }
    #meMenu button:hover { background: var(--accent-soft); }
    .rp-hall { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 14px; }
    .rp-hcard { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; background: var(--card); }
    .rp-hcard:hover { border-color: var(--accent); }
    .rp-hcv { height: 96px; display: flex; align-items: center; justify-content: center; font-size: 26px; background: var(--accent-soft); }
    .rp-hb { padding: 8px 10px; }
    .rp-hb b { font-size: 13px; font-weight: 600; }
    .rp-hb .sub { display: block; font-size: 10px; color: var(--muted); margin: 3px 0 5px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rp-tier { font-size: 10px; border-radius: 4px; padding: 1px 6px; margin-left: 6px; background: var(--chip); color: var(--muted); }
    .rp-tier.factory { color: var(--accent); background: var(--accent-soft); }
    .rp-tier.custom { color: var(--ok); }
    .rp-ladder { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
    /* 谱系阶梯 pill（对齐设计稿观感：胶囊形带边框，末档 accent 高亮） */
    .rp-ladder .rp-step { font-size: 11px; border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; color: var(--muted); background: var(--card); }
    .rp-ladder .rp-step.accent { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
    .rp-crumb { font-size: 11px; color: var(--muted); margin-bottom: 10px; }
    .rp-subtabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .rp-subtabs button { background: var(--card); color: var(--muted); border-color: var(--border); border-radius: 999px; padding: 3px 14px; }
    .rp-subtabs button.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
    .rp-row { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--border); font-size: 12px; flex-wrap: wrap; cursor: pointer; }
    .rp-row:last-child { border-bottom: none; }
    .rp-bar { display: flex; align-items: center; gap: 12px; border-top: 1px dashed var(--border); padding-top: 10px; margin-top: 12px; flex-wrap: wrap; }
    .play-game { min-height: 320px; border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; overflow: hidden; }
  </style>
</head>
<body>
  <header>
    <span class="rp-logo" onclick="rpGo('hall')"><i>灵汐</i> · 酒馆</span>
    <span id="modeName"></span>
    <span class="spacer"></span>
    <span id="status"></span>
    <button class="secondary" onclick="toggleMeMenu()">我的 ▾</button>
    <button class="secondary" onclick="refreshAll()">刷新</button>
    <div id="meMenu" hidden>
      <button onclick="openSessionsView()">🎬 开演记录</button>
      <button onclick="openPersonaView()">🧑 你的设定</button>
      <button onclick="openGuideView()">🗺 游戏界面指引</button>
    </div>
  </header>
  <nav class="rp-nav">
    <button id="nav-hall" class="active" onclick="rpGo('hall')">玩法大厅</button>
    <button id="nav-lib" onclick="rpGo('lib')">库与创作</button>
  </nav>
  <div class="layout solo" id="layout">
    <aside class="drawer" id="drawer" hidden>
      <div class="tabs" id="libTabs">
        <button id="tab-cards" class="active" onclick="switchTab('cards')">🎭 角色卡库</button>
        <button id="tab-lorebooks" onclick="switchTab('lorebooks')">📜 世界书</button>
        <button id="tab-drafts" onclick="switchTab('drafts')">✨ 创作台</button>
      </div>
      <div class="tabs" id="sessTabs" hidden>
        <button id="tab-sessions" class="active" onclick="switchTab('sessions')">开演记录</button>
      </div>
      <div class="list" id="list"></div>
    </aside>
    <main class="main">
      <div class="main-head">
        <span class="title" id="mainTitle"></span>
        <span id="mainActions"></span>
      </div>
      <div class="main-body" id="mainBody"></div>
    </main>
  </div>
  <div class="toast" id="toast"></div>

  <script>
  // ── 宿主下行桥通用接收器（theme.sync）──
  // theme.sync：宿主推 --ag-* 主题 token，逐键设到根元素（面板主题跟宿主）。
  // 宿主下行的会话上下文同步消息在此被有意忽略（BUG-73 断点a）：开演会话锚由
  // 服务端按卡派生专属扮演会话，宿主活跃会话 id 不再参与任何上行——防「开演
  // 任务落活跃既有 thread」回归。
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || !d.__agentos_webview) return;
    if (d.method === 'theme.sync' && d.params && d.params.tokens) {
      var rootStyle = document.documentElement.style;
      Object.keys(d.params.tokens).forEach(function (k) {
        rootStyle.setProperty(k, d.params.tokens[k]);
      });
    }
  });

  /* rp-bridge:single-source-begin */
  // 宿主桥函数单源（评审修复刀）：agentosFetch/unwrap 面板为单源持方，游戏页
  // serve-time include 装配（rp-bridge 装配标记原位替换，页面磁盘不持手抄
  // 副本——装配测试执法）。纯函数无面板态依赖，两页同语义。
  // agentosFetch：经 window.agentos.postMessage（宿主代发 REST 带 token）+ Promise 化。
  // webview iframe 是 opaque-origin 沙箱（CSP connect-src 'none'），直接 fetch 不可行。
  // path 两形态：/ext/** REST 路由（宿主代发）与 'xxx.yyy' 宿主桥动作（theme.apply /
  // mode.possess 同机制，error 下行走同一 .error 后缀配对）。
  function agentosFetch(path, params) {
    return new Promise(function (resolve, reject) {
      if (!window.agentos) { reject(new Error('window.agentos 桥不可用')); return; }
      var id = window.agentos.postMessage(path, params);
      function handler(e) {
        var d = e.data;
        if (!d || !d.__agentos_webview || d.id !== id) return;
        window.removeEventListener('message', handler);
        if (d.method && d.method.indexOf('.error') > -1) reject(new Error(JSON.stringify(d.params || d.error)));
        else resolve(d.params);
      }
      window.addEventListener('message', handler);
    });
  }
  // 宿主返回 axios res.data，内层 body 是 base64 JSON
  function unwrap(res) {
    var data = (res && res.data) ? res.data : res;
    if (data && data.body) {
      try { return JSON.parse(atob(data.body)); } catch (e) { return data; }
    }
    return data;
  }
  /* rp-bridge:single-source-end */

  var state = {
    modeName: '', cards: [], lorebooks: [], sessions: [], personas: [], packs: [], combos: [],
    view: 'hall',   // 四视图 IA：hall/play/combo/lib/sessions/persona/guide
    activeTab: 'cards', activeCard: null, activeSession: null, activeBook: null,
    greetingIndex: 0,
    cardFilter: 'all', cardSearch: '', bookSearch: '',  // 卡库/书库过滤（库与创作页工具行）
    // 开演选择态（组合 builder；玩法子页 setup 在 webview 页内——刀4）：
    // cardId / bookIds·packIds 勾选 / extras 组合③自由文本段 /
    // comboId 编辑中的自定义玩法 id
    wizard: null,
    // 玩法子页态：packId 当前玩法 / sessionId 绑定会话 / newPlay 显式新开态 /
    // shellPack 壳构建标记（历史区+玩法区壳随包重建；页实例生命周期归 playMount
    // 单点管，见挂载控制器）
    play: null,
    // 创作工作台态（扩展波 B-Ⅰ）：drafts 草稿列表 / activeDraft 详情选中 /
    // wbForm 内联表单视图（smoke/reject）/ wbApproveArmed 批准两步确认 /
    // wbDraftDetail 详情数据（表单切换重渲染用）
    drafts: [], activeDraft: null, wbForm: null, wbApproveArmed: false, wbDraftDetail: null,
    // 你的设定三态：none 不注入 / persona 已存档案（按 id）/ custom 临时文本（personaText）
    personaSel: { kind: 'none', id: '' },
    personaText: '', personaMgrOpen: false, armedPersona: '',
    formCardId: null,   // 卡表单正在编辑的卡 id（null=新建）
    deleteArmed: false, // 用户卡删除两步确认（沙箱 iframe 无模态 confirm）
    comboDeleteArmed: false, // 自定义玩法删除两步确认
    // 世界书管理态（对齐卡管理）：activeBook 详情选中 / formBookId 表单编辑 id

     - findRoute(init, routeId) / findTraitOptions(init, traitIds)：init_ui

    var out = [];

      var el = $('tab-' + t);
      if (el) el.className = (t === tab) ? 'active' : '';
    });
    renderList();
    if (tab === 'cards') {
      if (state.activeCard && findCard(state.activeCard)) openCard(state.activeCard);
      else showLibHome();
    } else if (tab === 'lorebooks') {
      if (state.activeBook && findBook(state.activeBook)) openBook(state.activeBook);
      else showLibHome();
    } else if (tab === 'drafts') {
      if (state.activeDraft) openDraft(state.activeDraft);
      else showLibHome();
    } else {
      if (state.activeSession) openSessionRecord(state.activeSession);
      else {
        renderMainHead('开演记录', '');

  function rpNewCombo() { openWizard(''); }
  // 选卡即向宿主上行卡的 ThemeConfig 档（theme.apply 白名单桥，载荷作用于当前
  // 会话=对话框主题/聊天背景随卡切换）。面板自身主题跟宿主（theme.sync），不走此桥。
  // 宿主侧 fail-closed：无活跃会话或档不合法时整包丢弃并回执 error 下行——
  // result/error 各 toast 反馈，静默丢弃会让「选卡切主题」看起来零生效。
  function applyCardTheme(c) {

  function renderCardActions(c) {
    var html =
      // 向导入口 id 走 data-id 属性（下方事件委托读取）——不拼进 onclick JS
      // 字符串上下文：HTML 实体转义在属性解码后还原引号可破 JS 字面量（转义
      // 汇点），dataset 读值无字符串拼接进 JS 上下文。
      '<button data-id="' + escapeHtml(c.id) + '" data-testid="wiz-entry" ' +
      'title="开演组合：选卡+世界书+初始状态，可存为自定义玩法">🪄 向导开演</button>' +
      '<button onclick="playCard(\'possess\')">🧑‍🎤 附身当前助手</button>' +
      '<button onclick="playCard(\'fresh\')">🎬 新开扮演会话</button>' +

      '<button class="secondary" onclick="editCard()">✏️ 编辑</button>' +

  function bindCardDetail() {

  function openCard(cardId) {
    if (state.activeCard !== cardId) {
      state.greetingIndex = 0;

      state.armedPersona = '';
    }
    state.activeCard = cardId;
    state.deleteArmed = false;
    state.formCardId = null;
    renderList();
    var c = findCard(cardId);
    if (!c) return;
    if (themedCardId !== cardId) {  // 同卡重渲染（persona 增删等）不重复上行主题
      themedCardId = cardId;
      applyCardTheme(c);
    }
    renderCardActions(c);
    $('mainBody').innerHTML = cardDetailHtml(c);
    bindCardDetail();
  }

  function readPersonaText() {
    var box = $('personaText');
    if (box) state.personaText = box.value;
  }
  function syncPersonaSection() {
    var customBox = $('personaCustom');
    var meta = $('personaMeta');
    if (!customBox || !meta) return;
    customBox.hidden = state.personaSel.kind !== 'custom';
    var p = state.personaSel.kind === 'persona' ? findPersona(state.personaSel.id) : null;
    meta.textContent = p ? (p.description || '') : '';
  }
  function onPersonaSelChange() {
    readPersonaText();
    var v = $('personaSel').value;
    if (v === 'custom') state.personaSel = { kind: 'custom', id: '' };
    else if (v.slice(0, 2) === 'p:') state.personaSel = { kind: 'persona', id: v.slice(2) };
    else state.personaSel = { kind: 'none', id: '' };
    syncPersonaSection();
  }
  function togglePersonaMgr() {
    state.personaMgrOpen = !state.personaMgrOpen;
    var box = $('personaMgr');
    if (!box) return;
    box.hidden = !state.personaMgrOpen;
    if (state.personaMgrOpen) renderPersonaMgr();
  }
  function renderPersonaMgr() {
    var box = $('personaMgr');
    if (!box) return;
    var rows = state.personas.map(function (p) {
      var ops = state.armedPersona === p.id
        ? '<button onclick="personaDelete(\'' + escapeHtml(p.id) + '\')">⚠️ 确认删除</button>' +
          '<button class="secondary" onclick="personaDisarm()">取消</button>'
        : '<button class="secondary" onclick="personaArm(\'' + escapeHtml(p.id) + '\')">删除</button>';
      return '<div class="prow"><span>' + escapeHtml(p.avatar || '') + ' <b>' + escapeHtml(p.name) + '</b>' +
        (p.description ? ' <span class="mutednote">' + escapeHtml(p.description) + '</span>' : '') + '</span>' +
        '<span style="display:inline-flex;gap:6px">' + ops + '</span></div>';
    }).join('');
    box.innerHTML = '<div class="notice" style="margin-top:8px">' +
      (rows || '<div class="mutednote">暂无已存 persona，可用下方表单新增。</div>') +
      '<div class="formrow" style="margin-top:8px">' +
      '<input id="pName" placeholder="名称*" style="width:120px">' +
      '<input id="pAvatar" placeholder="emoji" style="width:70px">' +
      '<input id="pDesc" placeholder="一句话设定" style="flex:1;min-width:140px">' +
      '<button onclick="personaSave()">新增</button></div></div>';
  }
  function personaArm(id) { state.armedPersona = id; renderPersonaMgr(); }
  function personaDisarm() { state.armedPersona = ''; renderPersonaMgr(); }
  // persona 写面契约：save body={name,description,avatar}；delete body={persona_id}
  function personaSave() {
    var name = ($('pName').value || '').trim();
    if (!name) { toast('persona 名称必填', 'error'); return; }
    agentosFetch('/ext/mode_roleplay/data/personas/save', {
      name: name,
      description: $('pDesc').value,
      avatar: ($('pAvatar').value || '').trim()
    }).then(function (res) {
      var d = unwrap(res) || {};
      if (d.error) { toast('persona 保存失败：' + d.error, 'error'); return; }
      toast('persona 已保存：' + name);
      loadPersonas().then(function () {
        if (state.view === 'persona') renderPersonaMgr();
        else if (state.activeCard) openCard(state.activeCard);
      });
    }).catch(function (e) { toast('persona 保存失败：' + e, 'error'); });
  }
  function personaDelete(id) {
    agentosFetch('/ext/mode_roleplay/data/personas/delete', { persona_id: id }).then(function (res) {
      var d = unwrap(res) || {};
      if (d.error) { toast('persona 删除失败：' + d.error, 'error'); return; }
      toast('persona 已删除');
      state.armedPersona = '';
      if (state.personaSel.kind === 'persona' && state.personaSel.id === id) {
        state.personaSel = { kind: 'none', id: '' };
      }
      loadPersonas().then(function () {
        if (state.view === 'persona') renderPersonaMgr();
        else if (state.activeCard) openCard(state.activeCard);
      });
    }).catch(function (e) { toast('persona 删除失败：' + e, 'error'); });
  }

  // 开场白文本解析（面板侧，对齐派发期所选档口径）：index 0=first_mes，
  // ≥1=alternate_greetings[index-1]；越界/缺省回落 first_mes。
  // 卡详情页档在 state.greetingIndex，开演选择档在 state.wizard.greetingIndex。
  function greetingTextAt(c, index) {
    var alts = c.alternate_greetings || [];
    if (index >= 1 && alts[index - 1] != null) {
      return String(alts[index - 1]);
    }
    return String(c.first_mes || '');
  }
  function selectedGreetingText(c) {
    return greetingTextAt(c, state.greetingIndex);
  }
  // 你的设定三态解析为文本：已存档案 → 档案 description；临时文本 → 原文；
  // 不注入 → 空串（载荷键缺省，会话不携带用户设定）。
  function resolvedUserPersonaText() {
    if (state.personaSel.kind === 'persona') {
      var p = findPersona(state.personaSel.id);
      return p ? String(p.description || '').trim() : '';
    }
    if (state.personaSel.kind === 'custom') return String(state.personaText || '').trim();
    return '';
  }

  // ── 快捷开演（双按钮：possess 附身 / fresh 新开会话，用户裁定并列无默认）──
  // fresh = 会话化开演（开演即对话）：mode.session 宿主桥建「扮演·<卡名>」
  // 会话并绑定卡身份、切到聊天区，载荷携带所选开场白与用户设定文本；首条开场
  // 触发消息由宿主自动发送——不再走任务派发（无开演记录、无评估语义）。
  function playCard(mode) {
    var c = findCard(state.activeCard);
    if (!c) return;
    readPersonaText();
    if (mode === 'possess') {
      var body = { card_id: c.id, play_mode: mode, greeting_index: state.greetingIndex };
      // persona 三态上行：选中档案 → persona_name；临时文本 → user_persona；不注入 → 两键都缺省
      if (state.personaSel.kind === 'persona') {
        var p = findPersona(state.personaSel.id);
        if (p) body.persona_name = p.name;
      } else if (state.personaSel.kind === 'custom' && state.personaText.trim()) {
        body.user_persona = state.personaText.trim();
      }
      setStatus('派发中...');
      agentosFetch('/ext/mode_roleplay/data/actions/play', body).then(function (res) {
        var d = unwrap(res) || {};
        setStatus('');
        if (d.error) { toast('派发失败：' + d.error, 'error'); return; }
        toast('已附身：' + c.name + '——在聊天区发送的消息将以该角色身份回应');
        // 宿主桥动作：通知宿主聊天区进入该角色附身态，personaText 携带卡人设
        //（cardPersonaText 拼接）。失败只提示不阻断（附身派发本身已成功）。
        agentosFetch('mode.possess', {
          mode: 'roleplay', card_id: c.id, name: c.name, avatar: c.avatar,
          personaText: cardPersonaText(c)
        })
          .catch(function (e) { toast('附身宿主通知失败：' + unwrapErrorMessage(e), 'error'); });
      }).catch(function (e) { setStatus(''); toast('派发失败：' + e, 'error'); });
      return;
    }
    var payload = {
      mode: 'roleplay',
      agent_id: 'mode_roleplay/' + c.id,
      name: c.name,
      title: '扮演·' + c.name,
      first_message: '（开始）'
    };
    // 开演档：开场白/用户设定为空则键缺省（桥 fail-closed：在场键须非空字符串）
    var extra = {};
    var greeting = selectedGreetingText(c);
    if (greeting.trim()) extra.roleplay_greeting = greeting;
    var personaText = resolvedUserPersonaText();
    if (personaText) extra.roleplay_user_persona = personaText;
    if (Object.keys(extra).length) payload.extra_context = extra;
    // 卡主题随扮演会话出生（批次四）：所选卡 theme 载荷（完整 ThemeConfig 档，
    // 卡库 /data/cards 条目字段）随出生桥上行——面板浏览期的 applyCardTheme
    // 钉的是**当时活跃**会话，新会话不继承，故须在出生时随载荷钉入。无主题卡
    // = 键缺席（宿主出生行为与现役一致）；非法档宿主 fail-closed 丢该位。
    if (c.theme) payload.card_theme = c.theme;
    // 通用会话出生桥（mode.session）：mode 键 + 模式包特有扩展位——agent_id
    // （卡=本包 agents 命名空间执行者）、title、extra_context（开演档键）、
    // first_message（首条触发，宿主据此开演）。宿主零模式知识。
    setStatus('创建会话中...');
    agentosFetch('mode.session', payload).then(function () {
      setStatus('');
      toast('扮演会话已创建，已切换');
    }).catch(function (e) { setStatus(''); toast('扮演会话创建失败：' + unwrapErrorMessage(e), 'error'); });
  }

  // ── 开演选择态（v3.1：builder 与玩法子页共用 state.wizard，mode 分流）──────
  // 既有五步向导能力映射（IA 重构）：选卡→builder①（角色卡画廊）；世界观→
  // builder②；玩法勾选→builder 玩法包直挂；快捷开演/转续演等既有入口保全
  // （角色卡详情不动）。刀4：纯玩法 setup 段（init_ui 表单/角色配置三输入/
  // 开场白档/四轴）收敛出面板——init_ui 渲染与 rp_init 组装在 webview 页内
  // （stardew 页/game_host，rp-core 单源），rp_axes 快照生产随面板 setup 段
  // 一并退役（消费原为后置，无生产方=契约面退役，复活触发见台账刀4 节）。
  // 透传契约（mode.session extra_context，桥 fail-closed 只收非空字符串——
  // 列表以逗号分隔 id 串承载；空选 = 键缺省回落现状）：
  // - wizard_lorebook_ids：覆盖卡默认 lorebook_ids（消费在 material 组装器）
  // - wizard_pack_ids：增量并入卡 pack_ids（消费在 agent_config_load 装载）
  // - wizard_profile：会话级角色配置文本（组装后缀段，不改卡资产；组合③
  //   自由文本段与 webview 页内 setup 的路线/词条 profile 同通道）
  // - roleplay_greeting：所选开场白原文（与快捷开演同键同语义；webview 页内
  //   setup 取卡首开场白同键）
  // - rp_init：路线/词条 effects 快照串（引擎开局结算，转义契约见 rp-panel-core
  //   单源块——刀4 起由 webview 页经 rp-core 装配消费组装）
  // 组合③初始状态预设（纯 UI 建议段，自由文本为准；wizard_profile 纯叙事承载，
  // 无包不涉引擎 effects）
  var EXTRA_PRESETS = ['开场重伤', '身负血仇', '灵力封印', '一文不名'];
  function wizDefaultState(mode, packId, comboId) {
    return {
      mode: mode, packId: packId || null, comboId: comboId || null,
      step: 1, cardId: null,
      bookIds: [], packIds: [],
      extras: []
    };
  }
  // 组合 builder 入口（角色卡详情「向导开演」同入口：卡 id 预选）
  function openWizard(cardId) {
    state.wizard = wizDefaultState('combo', null, null);
    state.comboDeleteArmed = false;
    if (cardId && findCard(cardId)) { wizSelectCard(cardId); return; }
    renderWizard();
  }
  // 大厅自定义卡点击 → 预填 builder（编辑态：保存保 id，可删）
  function openComboFor(comboId) {
    var combo = findCombo(comboId);
    if (!combo) return;
    state.wizard = wizDefaultState('combo', null, comboId);
    state.comboDeleteArmed = false;
    if (findCard(combo.card_id)) state.wizard.cardId = combo.card_id;
    state.wizard.bookIds = (combo.lorebook_ids || []).slice();
    state.wizard.packIds = (combo.pack_ids || []).slice();
    state.wizard.extras = combo.profile_extra
      ? String(combo.profile_extra).split('；').map(function (s) { return s.trim(); }).filter(Boolean)
      : [];
    renderWizard();
  }
  // 选卡即重置依赖档（换卡=换场）：世界书/玩法按该卡可选项预选，开场白回首项；
  // 角色配置三输入会话级保留（不随卡重置）。
  function wizSelectCard(cardId) {
    var w = state.wizard;
    w.cardId = cardId;
    var c = findCard(cardId) || {};
    var bookAvail = {};
    state.lorebooks.forEach(function (b) { bookAvail[b.id] = true; });
    w.bookIds = (c.lorebook_ids || []).filter(function (id) { return bookAvail[id]; });
    var packAvail = {};
    state.packs.forEach(function (p) { packAvail[p.id] = true; });
    w.packIds = (c.pack_ids || []).filter(function (id) { return packAvail[id]; });
    renderWizard();
  }
  function wizToggle(listKey, id) {
    var list = state.wizard[listKey];
    var i = list.indexOf(id);
    if (i > -1) list.splice(i, 1); else list.push(id);
    renderWizard();
  }
  function renderWizard() {
    var w = state.wizard;
    if (!w) return;
    if (w.mode === 'play') { renderPlay(); return; }
    renderCombo();
  }
  function wizStepCardHtml() {
    var w = state.wizard;
    if (!state.cards.length) {
      return emptyBox('🎭', '暂无角色卡', '先在角色卡页新建或导入，再回来开演');
    }
    return '<div class="gallery">' + state.cards.map(function (c) {
      return '<div class="gcard' + (w.cardId === c.id ? ' active' : '') +
        '" data-id="' + escapeHtml(c.id) + '" data-testid="wiz-card-opt">' +
        gavatarHtml(c) +
        '<div class="grow"><span class="gname">' + escapeHtml(c.name) + '</span>' +
        '<span class="origin-badge">' + (c.origin === 'builtin' ? '出厂' : '自建') + '</span></div>' +
        '</div>';
    }).join('') + '</div>';
  }
  function wizStepBooksHtml() {
    var w = state.wizard;
    if (!state.lorebooks.length) {
      return emptyBox('📖', '暂无世界书', '可跳过，或先到世界书页导入');
    }
    // 世界书可选 chips（默认勾选该卡关联书；全不选 = 按卡默认绑定注入）
    var chips = state.lorebooks.map(function (b) {
      var on = w.bookIds.indexOf(b.id) > -1;
      return '<span class="chip linkish" data-testid="wiz-book-opt" style="text-decoration:none;' +
        (on ? 'color:var(--accent);border:1px solid var(--accent)' : '') + '" ' +
        'onclick="wizToggle(\'bookIds\',\'' + escapeHtml(b.id) + '\')">' +
        (on ? '✓ ' : '') + '📖 ' + escapeHtml(b.name) +
        ' <span class="mutednote">' + (b.origin === 'builtin' ? '出厂' : '自建') + ' · 条目 ' + (b.entries || []).length + '</span></span>';
    }).join('');
    return '<div class="notice" style="margin-bottom:8px">默认勾选该卡关联的世界书；全部取消 = 不覆盖，按卡默认绑定注入。</div>' +
      '<div class="chips">' + chips + '</div>';
  }
  function wizStepPacksHtml() {
    var w = state.wizard;
    if (state.errors.packs) {
      return '<div class="notice">玩法包清点读取失败：' + escapeHtml(state.errors.packs) +
        '（可点「刷新」重试；玩法包为空也可开演，卡自带规则照常生效）</div>';
    }
    if (!state.packs.length) {
      return emptyBox('🎮', '暂无玩法包', '玩法包为空也可开演（卡自带规则照常生效）');
    }
    var rows = state.packs.map(function (p) {
      var on = w.packIds.indexOf(p.id) > -1;
      return '<label class="wiz-opt' + (on ? ' active' : '') + '" data-testid="wiz-pack-opt">' +
        '<input type="checkbox"' + (on ? ' checked' : '') +
        ' onchange="wizToggle(\'packIds\',\'' + escapeHtml(p.id) + '\')">' +
        '<span class="wiz-opt-name">🎮 ' + escapeHtml(p.name || p.id) + '</span>' +
        '<span class="origin-badge">' + (p.origin === 'builtin' ? '出厂' : '自建') + '</span>' +
        (p.description ? '<span class="mutednote">' + escapeHtml(p.description) + '</span>' : '') +
        '<span class="chip">状态键 ' + (p.variables_count || 0) + ' · 行为 ' + (p.behaviors_count || 0) + '</span></label>';
    }).join('');
    return '<div class="notice" style="margin-bottom:12px">默认勾选该卡引用的玩法包；此处追加为增量并入（卡声明仍最优先）。</div>' +
      '<div class="wiz-opts">' + rows + '</div>';
  }

  // ── 组合 builder（v3.1「新的组合」）：①角色卡必选（画廊单选）②世界书可选
  // chips ③初始状态可选（自由文本 chips → wizard_profile 纯叙事段；存组合时落
  // profile_extra 承载）＋玩法包直挂勾选；谱系折叠=按所选包 lineage 档收起不
  // 适步骤（pure=仅①；world=①②；full=全部）。底栏=存为自定义玩法 + 开演。
  function comboFoldNote(rank) {
    if (rank === 0) return '<div class="notice" style="margin:8px 0">已按所选玩法包谱系档（pure）收起：本组合仅角色卡直出。</div>';
    if (rank === 1) return '<div class="notice" style="margin:8px 0">已按所选玩法包谱系档（world）收起：初始状态段不参与本场。</div>';
    return '';
  }
  function comboExtrasHtml() {
    var w = state.wizard;
    var presetChips = EXTRA_PRESETS.map(function (t) {
      var on = w.extras.indexOf(t) > -1;
      return '<span class="chip linkish" style="text-decoration:none;' +
        (on ? 'color:var(--accent);border:1px solid var(--accent)' : '') + '" ' +
        'onclick="comboExtraToggle(\'' + escapeHtml(t) + '\')">' + (on ? '✓ ' : '') + escapeHtml(t) + '</span>';
    }).join('');
    var customChips = w.extras.filter(function (t) { return EXTRA_PRESETS.indexOf(t) < 0; })
      .map(function (t) {
        return '<span class="chip" style="color:var(--accent)">' + escapeHtml(t) +
          ' <span class="linkish" onclick="comboExtraRemove(\'' + escapeHtml(t) + '\')">✖</span></span>';
      }).join('');
    return '<div class="chips">' + presetChips + customChips + '</div>' +
      '<div class="formrow" style="margin-top:8px">' +
      '<input id="comboExtraInput" placeholder="自定义初始状态，如：开场重伤" style="flex:1;min-width:200px">' +
      '<button class="secondary" onclick="comboExtraAdd()">＋ 添加</button></div>' +
      '<div class="mutednote" style="margin-top:6px">已选 ' + w.extras.length +
      ' · 纯叙事段写入开局记忆与状态基线（wizard_profile；存组合时落 profile_extra）。</div>';
  }
  function comboExtraToggle(t) {
    var w = state.wizard;
    var i = w.extras.indexOf(t);
    if (i > -1) w.extras.splice(i, 1); else w.extras.push(t);
    renderWizard();
  }
  function comboExtraAdd() {
    var w = state.wizard;
    var el = $('comboExtraInput');
    var v = el ? String(el.value || '').trim() : '';
    if (!v) { toast('请填写初始状态文本', 'error'); return; }
    if (w.extras.indexOf(v) < 0) w.extras.push(v);
    renderWizard();
  }
  function comboExtraRemove(t) {
    var w = state.wizard;
    var i = w.extras.indexOf(t);
    if (i > -1) w.extras.splice(i, 1);
    renderWizard();
  }
  function renderCombo() {
    var w = state.wizard;
    if (!w) return;
    setView('combo');
    var combo = w.comboId ? findCombo(w.comboId) : null;
    renderMainHead(combo ? '编辑组合 · ' + (combo.name || comboIdSafe(w.comboId)) : '开演组合 · 新的组合',
      '<button class="secondary" onclick="rpGo(\'hall\')">‹ 玩法大厅</button>');
    var fold = rpComboFold(state.packs, w.packIds);
    var html = '<div class="rp-crumb">自定义玩法 = 卡 + 世界书 + 初始状态，可存进大厅（默认 = 选一张卡直接玩，下面想加才加）</div>' +
      '<div class="section"><h3>① 角色卡（必选，决定你演谁）</h3>' + wizStepCardHtml() + '</div>';
    if (fold >= 1) {
      html += '<div class="section"><h3>② 世界书（可选 · 默认不挂）</h3>' + wizStepBooksHtml() + '</div>';
    } else {
      html += comboFoldNote(fold);
    }
    html += '<div class="section"><h3>玩法包（可选 · 直挂本场）</h3>' + wizStepPacksHtml() + '</div>';
    if (fold >= 2) {
      html += '<div class="section"><h3>③ 初始状态（可选 · 默认没有）</h3>' + comboExtrasHtml() + '</div>';
    } else if (fold === 1) {
      html += comboFoldNote(fold);
    }
    if (combo) {
      html += '<div class="section">' + (state.comboDeleteArmed
        ? '<button onclick="comboDelete()">⚠️ 确认删除该组合</button>' +

  function comboIdSafe(id) { return String(id == null ? '' : id); }
  // 存为自定义玩法：POST data/combos/save（name/card_id 必填，card 须在卡库；

  // ── 玩法子页（壳持久化 + 单一挂载所有者）：子页壳（历史区+玩法区）只随换包
  // 重建，点记录/新开一局只刷历史行与挂载目标——innerHTML 重建销得了 DOM 销不
  // 了活脚本实例，每次交互整页重建的重挂载 churn 是竞态窗制造源（重影根因），
  // 壳持久化让它不再被制造。挂载生命周期单点归 playMount：键（会话 id 或
  // pack:<id>）不变=幂等免挂；换键=先拆后挂（dispose 契约，见 playPageDispose）；
  // 在飞请求以代际号单点判废。点记录行=bindPlaySession 进该局；「新开一局」=
  // startNewPlay（按包取页，页内分流 setup）；setup 与游玩渲染全在 webview 页
  // 内，面板只做入口。
  var playMount = { key: null, epoch: 0 };
  function playPageDispose() {
    playMount.epoch++;
    playMount.key = null;
    var fn = window.__RP_PAGE_DISPOSE__;
    window.__RP_PAGE_DISPOSE__ = null;
    if (typeof fn === 'function') {
      try { fn(); } catch (e) { console.error('玩法页实例清理失败', e); }
    }
  }
  function openPlay(packId) {
    var pack = packById(packId);
    if (!pack) { rpGo('hall'); return; }
    playPageDispose();  // 换包=换壳：旧壳上的活页实例先拆（壳与实例同生命周期）
    state.play = {
      packId: packId,
      sessionId: null, newPlay: false,
      shellPack: null  // 壳构建标记（renderPlay 换包重建壳）
    };

  // 「新开一局」：会话锚置空、按包取页（页内分流 setup 视图）。活实例若为某局
  // 页（键=会话 id）废键强制重挂；已在 setup 页（键=pack）则幂等不动。
  // 进局即工作区全屏（2026-10-17 用户裁定：开一局=玩法页独占工作区，不嵌小面板）。
  function requestWorkspaceFullscreen() {
    if (!window.agentos) return;
    try { window.agentos.postMessage('workspace.fullscreen', { on: true }); } catch (e) { /* 老宿主无此桥=降级不全屏 */ }

  function startNewPlay() {

  // 点历史行=进该局：会话锚落位换挂载目标（同键重复点=幂等免挂，不重挂不重建）。
  function bindPlaySession(sid) {
    var p = state.play;
    if (!p || !sid) return;

    p.newPlay = false;

    renderPlayHistory();

  // 历史区独立渲染（壳持久化：数据刷新/选行只重绘此区，不重建壳）。无记录=整区
  // 不渲染（零空态占位）；行点击经 data-sid 属性委托（不拼 onclick JS 汇点）。
  function renderPlayHistory() {
    var p = state.play;
    var box = $('play-history');
    if (!p || !box) return;

    var rows = pack ? rpSessionsForPack(state.sessions, pack.id) : [];

    rows.forEach(function (s) {

        ? '<span class="mutednote">' + escapeHtml(String(s.state_summary.character_state_text).slice(0, 42)) + '</span>'

  // 自包含玩法页 document 注入（纯注入器，仅由挂载控制器 mountPlayPage 裁决后
  // 调用）：面板本身是 rpSanitizeHtml /rp-bridge 单源宿主，window.agentos 原生
  // 可用；包内 <script> innerHTML 不执行，逐个重建触发；会话与包上下文经
  // window.__RP_PAGE_SESSION__ / window.__RP_PAGE_PACK__ 注入（挂载前写入——包
  // 页 setup 阶段据此分流与取 init_ui 声明）。注入前清空容器=容器恒单份页面；
  // 页面 <body> 根类（包主题作用域类随 body 标签走）在 template 解析时被连标
  // 签剥除，这里自原文提取补挂到容器，包主题 css 作用域才真正成立。
  function mountPlayPageHtml(html, sid, packId) {
    var host = $('play-game');
    if (!host) return;
    // 注入前清空容器（挂载原子性：容器内恒为单份页面——「装载中」占位不驻留，
    // 并发同键双请求先后到达时后到整替先到，不留双份页面=重影根修）；页面
    // <body> 根类（包主题作用域类随 body 标签走）在 template 解析时被连标签
    // 剥除，这里自原文提取补挂到容器，包主题 css 作用域才真正成立。
    host.innerHTML = '';
    var bodyTag = html.match(/<body\b[^>]*>/i);
    if (bodyTag) {
      var classMatch = bodyTag[0].match(/\bclass\s*=\s*(?:"([^"]*)"|'([^']*)')/i);
      var pageClass = classMatch ? (classMatch[1] || classMatch[2] || '') : '';
      pageClass.split(/\s+/).forEach(function (c) {
        if (c) host.classList.add(c);
      });
    }
    window.__RP_PAGE_SESSION__ = sid || '';
    window.__RP_PAGE_PACK__ = packId || '';
    var tpl = document.createElement('template');
    tpl.innerHTML = html;
    Array.prototype.slice.call(tpl.content.childNodes).forEach(function (node) {
      if (node.tagName === 'SCRIPT') {
        var s = document.createElement('script');
        Array.prototype.slice.call(node.attributes).forEach(function (a) {
          s.setAttribute(a.name, a.value);
        });
        s.textContent = node.textContent;
        host.appendChild(s);
      } else {
        host.appendChild(node);
      }
    });
  }
  // 通用回落渲染（page_html null / 无页包工作区）：状态卡 + 叙事流只读 +
  // 对话在系统对话页进行注记。choices 契约清单无面板数据通道（packs 清点与
  // 声明聚合均不透出），不渲染不硬编码。
  function playStateCardHtml(s) {
    var summary = s && s.state_summary && s.state_summary.character_state_text;
    if (!summary) return '<div class="notice">暂无状态快照（行内持久 state 键缺席，如实显示）。</div>';
    return '<div class="sumcard"><div class="prose">' + rpSanitizeHtml(String(summary)) + '</div></div>';
  }
  function playMessagesHtml(messages) {
    if (!messages || !messages.length) return '<div class="notice">会话暂无消息。</div>';
    return messages.map(function (m) {
      return '<div class="entry"><span class="badge">' + escapeHtml(m.role || '') + '</span>' +
        '<div class="content">' + escapeHtml(m.content || '') + '</div></div>';

  function loadPlayMessages(sid) {
    agentosFetch('/ext/mode_roleplay/data/messages?pipeline_id=' + encodeURIComponent(sid))
      .then(function (res) {
        if (!state.play || state.play.sessionId !== sid) return;  // 已切走：丢弃过期回包
        var box = $('play-msgs');
        if (box) box.innerHTML = playMessagesHtml((unwrap(res) || {}).messages || []);
      })
      .catch(function (e) {
        if (!state.play || state.play.sessionId !== sid) return;
        var box = $('play-msgs');
        if (box) box.innerHTML = '<div class="notice">消息读取失败：' +
          escapeHtml(unwrapErrorMessage(e)) + '（可点「刷新」重试）</div>';

  function playWorkspaceHtml() {
    var p = state.play;
    if (!p.sessionId) {
      return '<div class="notice">尚无绑定会话：点顶部「🆕 新开一局」开演。</div>';
    }
    var s = null;
    state.sessions.forEach(function (x) { if (x.pipeline_id === p.sessionId) s = x; });
    var stateCard = '<div class="section"><h3>状态卡</h3><div>' + playStateCardHtml(s) + '</div></div>';
    var msgs = '<div class="section"><h3>叙事流（只读）</h3><div id="play-msgs">' +
      '<div class="notice">消息加载中...</div></div></div>';
    return '<div class="notice">对话在系统对话页进行（本页为只读回显）。</div>' + stateCard + msgs;
  }
  // 唯一挂载口（控制器）：键=会话 id 或 pack:<id>（无会话 setup 阶段按包取页，
  // has_page 与无页包同模型——无页包=game_host 页内嵌挂载，页内承担 setup 开演
  // 设置与游玩渲染，IIFE 化嵌入安全）。同键幂等免挂；换键先拆后挂
  // （playPageDispose：页自报 dispose 先死+代际号+1 使在飞请求全部判废）；请求
  // 捕获代际，resolve/catch 时与键双双比对——单点判废，无散装让位守卫。
  function mountPlayPage() {
    var p = state.play;
    var host = $('play-game');
    if (!p || !host) return;
    var pack = packById(p.packId);
    if (!pack) return;
    var sid = p.sessionId || '';
    var key = sid || 'pack:' + p.packId;
    if (playMount.key === key) return;  // 同键已挂：幂等（重复点当前局/新开不重挂）
    playPageDispose();                  // 换键先拆：旧实例脚本即刻死亡
    playMount.key = key;                // 挂载意图落位：并发同键后到请求在此让位
    host.innerHTML = '<div class="notice">玩法页装载中...</div>';
    var gen = playMount.epoch;
    setStatus('装载玩法页...');
    var url = pack.has_page
      ? (sid ? '/ext/mode_roleplay/game/page?session_id=' + encodeURIComponent(sid)
             : '/ext/mode_roleplay/game/page?pack=' + encodeURIComponent(p.packId))
      : '/ext/mode_roleplay/page/game-host';
    agentosFetch(url).then(function (res) {
      if (playMount.epoch !== gen || playMount.key !== key) return;  // 已换代/换键：过期回包丢弃
      setStatus('');
      var out = unwrap(res) || {};
      var html = '';
      if (pack.has_page) {
        html = out.page_html ? String(out.page_html) : '';
      } else if (typeof out === 'string') {
        html = out;
      } else if (out && out.body) {
        html = atob(out.body);  // HTML 文档响应（base64，非 JSON）
      }
      if (html) mountPlayPageHtml(html, sid, p.packId);
      else renderPlayFallback(host, sid);
    }).catch(function (e) {
      if (playMount.epoch !== gen || playMount.key !== key) return;
      setStatus('');
      host.innerHTML = '<div class="notice">玩法页装载失败：' +
        escapeHtml(unwrapErrorMessage(e)) + '（<span class="linkish" onclick="retryPlayMount()">刷新重试</span>）</div>';
    });
  }
  // 装载失败重试：废键重挂（错误占位不算已挂实例）。
  function retryPlayMount() {
    playMount.key = null;

  }
  function renderPlayFallback(host, sid) {
    host.innerHTML = playWorkspaceHtml();
    loadPlayMessages(sid);
  }
  // 壳渲染：换包（或壳已随他视图销毁）时整体重建——历史区+玩法区两容器，玩法
  // 页常驻其下（历史在上、玩法在下，无页签无落地页分流）；同包重入只刷历史行
  // 与挂载目标。
  function renderPlay() {
    var p = state.play;
    if (!p) return;
    var pack = packById(p.packId);
    if (!pack) { state.play = null; rpGo('hall'); return; }
    setView('play');

      '<button onclick="startNewPlay()">🆕 新开一局</button>' +
      '<button class="secondary" onclick="rpGo(\'hall\')">‹ 玩法大厅</button>');
    if (!$('play-game') || p.shellPack !== p.packId) {
      $('mainBody').innerHTML = '<div id="play-history"></div>' +
        '<div id="play-game" class="play-game"><div class="notice">玩法页装载中...</div></div>';
      p.shellPack = p.packId;
    }
    renderPlayHistory();
    mountPlayPage();
  }
  // 页内开演回执（stardew 页/game_host 的 rp:session-bound 广播）：面板只同步
  // 会话锚与历史行，不抢视图不重挂（页内已自切游玩视图，重挂=页重载打断游玩）；
  // 下次显式导航按新会话键取页。
  window.addEventListener('rp:session-bound', function (e) {
    var p = state.play;
    var sid = e && e.detail ? e.detail.sid : '';
    if (p && sid) {
      p.sessionId = sid;
      p.newPlay = false;
    }
    // 页内开演成功=已进局：与「新开一局/点历史行」同口径请求工作区全屏
    if (p && sid) requestWorkspaceFullscreen();
    loadSessions().then(renderPlayHistory);
  });

  // ── 卡新建/编辑表单 ──
  function editCard() { openCardForm(state.activeCard); }

    var copyNote = (c && c.origin === 'builtin')

  function cardFormHtml(c) {

    var tagsVal = c ? (c.tags || []).join(',') : '';
    var bookIds = c && Array.isArray(c.lorebook_ids) ? c.lorebook_ids : [];
    var bookOpts = state.lorebooks.map(function (b) {

    function area(id, label, rows, content) {
      return '<div class="formrow" style="align-items:flex-start"><span class="flabel">' + label + '</span>' +
        '<textarea id="' + id + '" rows="' + rows + '" style="flex:1;min-width:220px">' + escapeHtml(content) + '</textarea></div>';
    }

      '<div class="formrow"><span class="flabel">名称 *</span>' +

      '<div class="formrow"><span class="flabel">头像 emoji</span>' +

  // ── 卡导入/导出/删除 ──
  // import 契约：body={filename, data_base64}（文件字节 base64，支持 .png/.json）
  // → 响应 {card_id, warnings?[]}；warnings 非空 = 服务端检出可疑指令模式
  function importCard() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.png,.json';
    input.addEventListener('change', function () {
      var f = input.files && input.files[0];
      if (!f) return;  // 用户取消选择：无动作
      var reader = new FileReader();
      reader.onload = function () {
        // ArrayBuffer → base64（readAsDataURL 路径不可用，按字节自行编码）
        var bytes = new Uint8Array(reader.result || []);
        var bin = '';
        for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        var b64 = btoa(bin);
        setStatus('导入中...');
        agentosFetch('/ext/mode_roleplay/data/cards/import', { filename: f.name, data_base64: b64 })
          .then(function (res) {
            var d = unwrap(res) || {};
            setStatus('');
            if (d.error) { toast('导入失败：' + d.error, 'error'); return; }
            var warned = (d.warnings || []).length > 0;
            toast('导入成功：' + (d.card_id || f.name) +
              (warned ? '\n⚠️ 检测到可疑指令模式，建议检查' : ''), warned ? 'warn' : '');
            loadCards().then(function () {
              switchTab('cards');
              if (d.card_id) openCard(d.card_id);
            });
          })
          .catch(function (e) { setStatus(''); toast('导入失败：' + e, 'error'); });
      };
      reader.onerror = function () { toast('文件读取失败', 'error'); };
      reader.readAsArrayBuffer(f);
    });
    input.click();
  }
  // export 契约：body={card_id} → 响应 {filename, content_base64}，
  // data URI + a[download] 落地 json（沙箱内无模态/无直连网络，走浏览器下载面）
  function exportCard() {
    var c = findCard(state.activeCard);
    if (!c) return;
    agentosFetch('/ext/mode_roleplay/data/cards/export', { card_id: c.id }).then(function (res) {
      var d = unwrap(res) || {};
      if (d.error) { toast('导出失败：' + d.error, 'error'); return; }
      var name = d.filename || (c.id + '.json');
      var a = document.createElement('a');
      a.setAttribute('download', name);
      a.setAttribute('href', 'data:application/json;base64,' + String(d.content_base64 || ''));
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      toast('已导出：' + name);
    }).catch(function (e) { toast('导出失败：' + e, 'error'); });
  }

  function performanceHtml(messages, s) {
    var turns = (messages || []).filter(function (m) { return m.role === 'assistant' && m.content; });

      return turns.map(function (m) {
        return '<div class="quote">' + escapeHtml(m.content) + '</div>';
      }).join('');
    }
    if (s && s.run_status === 'running') {
      return '<div class="notice"><span class="dot running"></span> 🎭 演出进行中…（任务执行中，稍后点「刷新」看产出）</div>';

      return '<div class="notice">演出已完成但未捕获产出（可在聊天区续演后用消息操作重试）。</div>';

    var timeLabel = s.created_at || ('记录 ' + s.pipeline_id.slice(0, 10));
    $('mainBody').innerHTML =
      '<div class="section"><h3>本场摘要</h3><div class="sumcard">' +
      '<div class="sumrow"><span class="sumlabel">目标</span><span class="sumval">' + escapeHtml(s.goal || '—') + '</span></div>' +
      '<div class="sumrow"><span class="sumlabel">状态</span><span class="sumval"><span class="dot ' + dotClass(s) + '"></span> ' +
      escapeHtml(s.task_status || s.run_status || '—') + '</span></div>' +
      '<div class="sumrow"><span class="sumlabel">时间</span><span class="sumval">' + escapeHtml(timeLabel) + '</span></div>' +
      '</div></div>' +
      '<div class="section"><h3>开场表演</h3><div id="performance">' +
      '<div class="notice">演出加载中...</div></div></div>' +
      '<div class="notice">' + (rpCardId
        ? '💬 续演：点「转续演」以「' + escapeHtml(rpCardName) + '」开一个扮演会话（聊天区持续对话）。'
        : '💬 续演：该记录未绑定角色身份，可在角色卡页开演或聊天区对话。') + '</div>';
    loadPerformance(pipelineId);
  }

  // ── 转续演（mode.session 宿主桥，与 playCard 会话化开演同桥）──
  // 契约：载荷 {mode, agent_id, name, title}（开演档缺省——转续演=纯净会话），
  // 宿主建「扮演·<卡名>」会话并绑定卡身份后切换聊天区（持续对话入口）；「新
  // 开扮演会话」同桥另携所选开场白与用户设定（extra_context/first_message）。
  function continuePlay(cardId, name) {
    agentosFetch('mode.session', {
      mode: 'roleplay', agent_id: 'mode_roleplay/' + cardId, name: name, title: '扮演·' + name
    })
      .then(function () {
        toast('已创建扮演会话，已为你切换到聊天区');
      })
      .catch(function (e) { toast('转续演失败：' + unwrapErrorMessage(e), 'error'); });
  }
  function continueCard() {
    var c = findCard(state.activeCard);
    if (!c) return;
    continuePlay(c.id, c.name);
  }
  function continueFromRecord() {
    var s = null;
    state.sessions.forEach(function (x) { if (x.pipeline_id === state.activeSession) s = x; });
    if (!s) return;
    var prefix = 'mode_roleplay/';
    var cardId = String(s.agent_id || '').indexOf(prefix) === 0 ? s.agent_id.slice(prefix.length) : '';
    if (!cardId) { toast('该记录未绑定角色身份，无法转续演', 'error'); return; }
    continuePlay(cardId, (findCard(cardId) || {}).name || cardId);
  }

  // ── 创作工作台（扩展波 B-Ⅰ：AI 生成入口 + 登记草稿 + 五态详情三件套）────────
  // 数据面 = /data/wizards/drafts（列表/详情）+ /data/wizards/draft/*（状态机
  // 动作，契约见 server.py 创作草稿节）。草稿五态 draft/lint_pass/rejected/
  // smoke_pass/awaiting_review/approved；三闸必经（approve 服务端强制 lint/smoke
  // 证据），AI 署名强制（creator=AI 服务端写定）。草稿卡文本渲染过 rpSanitizeHtml
  // （面板刀-Ⅱ 单源，本页直呼同源函数，无第四份手抄副本）。
  var WB_STATE_LABEL = {
    draft: '草稿', lint_pass: 'Lint 通过', rejected: '已打回',
    smoke_pass: '试玩通过', awaiting_review: '待人工审核', approved: '已入库'
  };
  var WB_STATE_COLOR = {
    draft: 'var(--muted)', lint_pass: 'var(--accent)', rejected: 'var(--err)',
    smoke_pass: 'var(--ok)', awaiting_review: 'var(--warn)', approved: 'var(--ok)'
  };
  function wbBadge(stateName) {
    var color = WB_STATE_COLOR[stateName] || 'var(--muted)';
    return '<span class="badge" style="color:' + color + ';border:1px solid ' + color + '">' +
      escapeHtml(WB_STATE_LABEL[stateName] || stateName) + '</span>';
  }
  // null-safe 文本化（草稿卡字段值渲染前统一入口，产物过 rpSanitizeHtml 消毒）
  function draftText(v) { return String(v == null ? '' : v); }
  function wbBackToList() {
    state.activeDraft = null;
    state.wbForm = null;
    state.wbApproveArmed = false;
    state.wbDraftDetail = null;
    renderList();
    renderMainHead('创作工作台', '');
    $('mainBody').innerHTML = emptyBox('✍️', '从左侧选择一张草稿',
      '或「AI 帮我生成」开创作会话起草', "switchTab('cards')", '浏览角色卡');
  }

  // 「AI 帮我生成」：mode.session 开创作会话（创作助手卡附身，创作需求 =
  // first_message 透传——向导 wizard_profile 同族先例）；起草产出 = 会话工作
  // 空间 drafts/<slug>.yaml，回本页「登记草稿」进三闸。
  function wbOpenGenerate() {
    renderMainHead('AI 帮我生成 · 角色卡',
      '<button class="secondary" onclick="wbBackToList()">返回列表</button>');
    $('mainBody').innerHTML =
      '<div class="notice" style="margin-bottom:12px">创作会话由「创作助手」附身（creator AI 署名强制）。' +
      '起草完成后 AI 会给出 drafts/ 下的草稿路径——回本页「登记草稿」走三闸' +
      '（Lint → 试玩 → 人审）入库；三闸未过不入卡库，这是安全底线。</div>' +
      '<div class="section" data-testid="wb-generate-panel">' +
      '<div class="formrow" style="align-items:flex-start"><span class="flabel">创作需求</span>' +
      '<textarea id="wbRequirement" rows="6" style="flex:1;min-width:260px" ' +
      'placeholder="例：赛博朋克世界的黑客侦探，毒舌但心软；想要一个「信任度」状态，审问时高信任解锁隐藏台词……"></textarea></div>' +
      '<div class="formrow" style="margin-top:8px"><button onclick="wbGenerate()">✨ 开创作会话</button></div></div>';
    $('wbRequirement').focus();
  }
  function wbGenerate() {
    var req = ($('wbRequirement').value || '').trim();
    if (!req) { toast('请先填写创作需求', 'error'); return; }
    setStatus('创建创作会话中...');
    agentosFetch('mode.session', {
      mode: 'roleplay',
      agent_id: 'mode_roleplay/card_author',
      name: '创作助手',
      title: 'AI 创作·角色卡',
      first_message: req
    }).then(function () {
      setStatus('');
      toast('创作会话已创建并切换——让 AI 起草，完成后拿 drafts/ 路径回来登记');
    }).catch(function (e) { setStatus(''); toast('创作会话创建失败：' + unwrapErrorMessage(e), 'error'); });
  }

  // 登记草稿：创作会话（agent_id=mode_roleplay/card_author 的会话）+ 会话工作
  // 空间内草稿相对路径 → POST register（形态校验 + 署名强制，落草稿库 draft 态）。
  function wbOpenRegister() {
    renderMainHead('登记草稿 · 三闸入口',
      '<button class="secondary" onclick="wbBackToList()">返回列表</button>');
    var opts = state.sessions.filter(function (s) {
      return String(s.agent_id || '') === 'mode_roleplay/card_author';
    }).map(function (s) {
      return '<option value="' + escapeHtml(s.pipeline_id) + '">' +
        escapeHtml((s.goal || s.pipeline_id).slice(0, 24)) +
        '（' + escapeHtml(s.pipeline_id.slice(0, 12)) + '）</option>';
    }).join('');
    var sessionField = opts
      ? '<select id="wbRegSession" style="min-width:240px">' + opts + '</select>' +
        '<input id="wbRegSessionCustom" placeholder="或手填会话 id" style="flex:1;min-width:150px">'
      : '<input id="wbRegSessionCustom" placeholder="创作会话 id（先「AI 帮我生成」开会话）" style="flex:1;min-width:300px">';
    $('mainBody').innerHTML =
      '<div class="notice" style="margin-bottom:12px">把创作会话中 AI 起草的 yaml 登记进三闸流转：' +
      '登记 = 形态校验 + creator AI 署名强制，落草稿库后按 Lint → 试玩 → 人审推进。</div>' +
      '<div class="section" data-testid="wb-register-panel">' +
      '<div class="formrow"><span class="flabel">创作会话</span>' + sessionField + '</div>' +
      '<div class="formrow" style="margin-top:8px"><span class="flabel">草稿路径</span>' +
      '<input id="wbRegPath" placeholder="drafts/xxx.yaml（会话工作空间内相对路径）" style="flex:1;min-width:300px"></div>' +
      '<div class="formrow" style="margin-top:8px"><button onclick="wbRegister()">📥 登记</button></div></div>';
  }
  function wbRegister() {
    var sid = (($('wbRegSessionCustom') && $('wbRegSessionCustom').value) || '').trim() ||
      (($('wbRegSession') && $('wbRegSession').value) || '');
    var path = ($('wbRegPath').value || '').trim();
    if (!sid) { toast('缺少创作会话 id', 'error'); return; }
    if (!path) { toast('缺少草稿路径', 'error'); return; }
    setStatus('登记中...');
    agentosFetch('/ext/mode_roleplay/data/wizards/draft/register', { author_session: sid, path: path })
      .then(function (res) {
        var d = unwrap(res) || {};
        setStatus('');
        if (d.error) { toast('登记失败：' + d.error, 'error'); return; }
        toast('草稿已登记：' + d.draft_id);
        loadDrafts().then(function () { openDraft(d.draft_id); });
      })
      .catch(function (e) { setStatus(''); toast('登记失败：' + e, 'error'); });
  }

  // 草稿详情（人审三件套：diff 视图 + lint 报告 + 试玩记录 + 审核留痕）
  function openDraft(draftId) {
    state.activeDraft = draftId;
    state.wbForm = null;
    state.wbApproveArmed = false;
    renderList();
    setStatus('加载草稿...');
    agentosFetch('/ext/mode_roleplay/data/wizards/drafts?draft_id=' + encodeURIComponent(draftId))
      .then(function (res) {
        setStatus('');
        var d = unwrap(res);
        if (!d || d.error) { toast((d && d.error) || '草稿详情加载失败', 'error'); return; }
        if (state.activeDraft !== draftId) return;  // 已切走：丢弃过期回包
        state.wbDraftDetail = d;
        renderDraftDetail(d);
      })
      .catch(function (e) { setStatus(''); toast('草稿详情加载失败：' + unwrapErrorMessage(e), 'error'); });
  }
  // 字段级 diff（轻量）：与卡库同 id 现卡逐字段对照（多数=空白基线），值差异行渲染；
  // 新旧值都是卡文本 → 过 rpSanitizeHtml 消毒注入（draftText 仅 null 安全归一）。
  function wbDiffRows(card) {
    var base = findCard(state.activeDraft) || null;
    var rows = '';
    ['name', 'description', 'personality', 'scenario', 'first_mes', 'mes_example',
      'system_prompt', 'post_history_instructions', 'creator_notes'].forEach(function (f) {
      var newVal = draftText(card[f]);
      var oldVal = base ? draftText(base[f]) : '';
      if (!newVal || newVal === oldVal) return;
      rows += '<div class="entry"><div class="keys">' + escapeHtml(f) + '</div>' +
        '<div class="mutednote">现卡：' + (oldVal ? rpSanitizeHtml(oldVal) : '（空白）') + '</div>' +
        '<div class="content">' + rpSanitizeHtml(draftText(newVal)) + '</div></div>';
    });
    var baseExt = base && base.extensions ? JSON.stringify(base.extensions) : '';
    var newExt = card.extensions ? JSON.stringify(card.extensions) : '';
    if (newExt && newExt !== baseExt) {
      rows += '<div class="entry"><div class="keys">extensions（声明面）</div>' +
        '<div class="content">' + rpSanitizeHtml(draftText(newExt)) + '</div></div>';
    }
    return rows || '<div class="mutednote">无字段差异。</div>';
  }
  function wbLintSection(report) {
    if (!report) return '<div class="mutednote">未校验（draft 态先走 Lint 校验）。</div>';
    var badge = '<span class="badge ' + (report.lint_pass ? 'on' : 'off') + '">' +
      (report.lint_pass ? '通过' : '未通过') + '</span>';
    function list(title, items) {
      if (!items || !items.length) return '';
      return '<div class="mutednote" style="margin-top:4px">' + escapeHtml(title) + '：</div>' +
        items.map(function (w) { return '<div class="content">• ' + escapeHtml(w) + '</div>'; }).join('');
    }
    return '<div class="sumrow"><span class="sumlabel">结论</span><span class="sumval">' + badge +
      ' <span class="mutednote">' + escapeHtml(report.linted_at || '') + '</span></span></div>' +
      list('结构问题（card_lint 单源）', report.structure) +
      list('可疑指令（注入形状）', report.suspicious) +
      list('高危 HTML（渲染面消毒兜底，只标注）', report.html);
  }
  function wbSmokeSection(record) {
    if (!record) return '<div class="mutednote">未登记试玩（lint_pass 后人工开演试玩登记；自动探针经 B-Ⅱ 考据维持降级——eval 域任务链管道与草稿卡探针错配，升级触发=卡级探针库化服务面就绪）。</div>';
    return '<div class="sumrow"><span class="sumlabel">试玩会话</span><span class="sumval">' + escapeHtml(record.smoke_session) + '</span></div>' +
      '<div class="sumrow"><span class="sumlabel">结论</span><span class="sumval">' + escapeHtml(record.conclusion || '（未填）') + '</span></div>' +
      '<div class="sumrow"><span class="sumlabel">时间</span><span class="sumval">' + escapeHtml(record.smoked_at || '') + '</span></div>';
  }
  function wbReviewSection(meta) {
    var extra = '';
    if (meta.reject_reason) extra += '<div class="sumrow"><span class="sumlabel">打回意见</span><span class="sumval">' + escapeHtml(meta.reject_reason) + '</span></div>';
    if (meta.approved_card_id) extra += '<div class="sumrow"><span class="sumlabel">入库卡</span><span class="sumval">' + escapeHtml(meta.approved_card_id) + '</span></div>';
    var rows = (meta.review_trail || []).map(function (t) {
      return '<div class="sumrow"><span class="sumlabel">' + (t.action === 'approve' ? '批准' : '打回') + '</span>' +
        '<span class="sumval">' + escapeHtml(t.who || '') + ' · ' + escapeHtml(t.when || '') +
        (t.reason ? ' · ' + escapeHtml(t.reason) : '') + '</span></div>';
    }).join('');
    return (extra + rows) || '<div class="mutednote">尚无审核动作。</div>';
  }
  function wbActionButtons(d) {
    var st = d.meta.state;
    var html = '';
    if (st === 'draft') html += '<button onclick="draftLint()">🔍 Lint 校验</button>';
    if (st === 'lint_pass') html += '<button onclick="wbToggleForm(\'smoke\')">🎮 登记试玩</button>';
    if (st === 'smoke_pass') html += '<button onclick="draftSubmit()">⬆️ 提交人审</button>';
    if (st === 'awaiting_review') {
      html += state.wbApproveArmed
        ? '<button onclick="draftApprove()" data-testid="wb-approve">⚠️ 确认批准入库</button>' +
          '<button class="secondary" onclick="wbDisarmApprove()">取消</button>'
        : '<button onclick="wbArmApprove()" data-testid="wb-approve">✅ 批准入库</button>' +
          '<button onclick="wbToggleForm(\'reject\')" data-testid="wb-reject">❌ 打回</button>';
    }
    return html + '<button class="secondary" onclick="wbBackToList()">返回列表</button>';
  }
  function renderDraftDetail(d) {
    var meta = d.meta || {};
    var card = d.card || {};
    renderMainHead('创作草稿 · ' + (card.name || d.draft_id), wbActionButtons(d));
    var formHtml = '';
    if (state.wbForm === 'smoke') {
      formHtml = '<div class="notice" style="margin-top:8px" data-testid="wb-smoke-form">' +
        '<div class="formrow"><span class="flabel">试玩会话</span>' +
        '<input id="wbSmokeSid" placeholder="开演试玩的会话 id" style="flex:1;min-width:220px"></div>' +
        '<div class="formrow" style="margin-top:6px"><span class="flabel">结论</span>' +
        '<input id="wbSmokeConclusion" placeholder="如：状态到位，人设一致" style="flex:1;min-width:220px"></div>' +
        '<div class="formrow" style="margin-top:6px"><button onclick="draftSmoke()">登记试玩</button>' +
        '<span class="mutednote">自动探针接 eval 域 = B-Ⅱ（一期人工试玩登记）。</span></div></div>';
    } else if (state.wbForm === 'reject') {
      formHtml = '<div class="notice" style="margin-top:8px" data-testid="wb-reject-form">' +
        '<div class="formrow" style="align-items:flex-start"><span class="flabel">打回意见</span>' +
        '<textarea id="wbRejectReason" rows="2" style="flex:1;min-width:220px" placeholder="意见回创作会话迭代"></textarea></div>' +
        '<div class="formrow" style="margin-top:6px"><button onclick="draftReject()">打回</button></div></div>';
    }
    $('mainBody').innerHTML =
      '<div class="section"><h3>状态</h3><div class="sumcard">' +
      '<div class="sumrow"><span class="sumlabel">状态</span><span class="sumval">' + wbBadge(meta.state) +
      ' <span class="badge">creator: ' + escapeHtml(meta.creator || '') + '</span></span></div>' +
      '<div class="sumrow"><span class="sumlabel">草稿</span><span class="sumval">' + escapeHtml(d.draft_id) + '</span></div>' +
      '<div class="sumrow"><span class="sumlabel">来源会话</span><span class="sumval">' + escapeHtml(meta.author_session || '') + '</span></div>' +
      '<div class="sumrow"><span class="sumlabel">更新</span><span class="sumval">' + escapeHtml(meta.updated_at || '') + '</span></div>' +
      '</div>' + formHtml + '</div>' +
      '<div class="section"><h3>字段差异（对照卡库同 id：' + (findCard(d.draft_id) ? '有现卡' : '空白基线') + '）</h3>' +
      '<div data-testid="wb-diff">' + wbDiffRows(card) + '</div></div>' +
      '<div class="section"><h3>Lint 报告</h3><div data-testid="wb-lint-report">' + wbLintSection(meta.lint_report) + '</div></div>' +
      '<div class="section"><h3>试玩记录</h3><div data-testid="wb-smoke-record">' + wbSmokeSection(meta.smoke_record) + '</div></div>' +
      '<div class="section"><h3>审核留痕</h3><div data-testid="wb-review-trail">' + wbReviewSection(meta) + '</div></div>';
  }
  function wbToggleForm(kind) {
    state.wbForm = state.wbForm === kind ? null : kind;
    renderDraftDetail(state.wbDraftDetail);
  }
  function wbArmApprove() { state.wbApproveArmed = true; renderDraftDetail(state.wbDraftDetail); }
  function wbDisarmApprove() { state.wbApproveArmed = false; renderDraftDetail(state.wbDraftDetail); }
  // 状态机动作统一通道：POST → error toast / 成功 toast + 重载详情（入库另刷卡库）
  function _draftAction(endpoint, body, doneMsg) {
    setStatus('提交中...');
    return agentosFetch('/ext/mode_roleplay/data/wizards/draft/' + endpoint, body)
      .then(function (res) {
        var d = unwrap(res) || {};
        setStatus('');
        if (d.error) { toast(endpoint + ' 失败：' + d.error, 'error'); return null; }
        if (doneMsg) toast(doneMsg);
        return d;
      })
      .catch(function (e) { setStatus(''); toast(endpoint + ' 失败：' + unwrapErrorMessage(e), 'error'); return null; });
  }
  function _reloadDraft(d, alsoCards) {
    var wait = alsoCards ? Promise.all([loadCards(), loadDrafts()]) : loadDrafts();
    wait.then(function () { openDraft(d.draft_id); });
  }
  function draftLint() {
    _draftAction('lint', { draft_id: state.activeDraft }, '').then(function (d) {
      if (!d) return;
      toast(d.state === 'lint_pass' ? 'Lint 通过'
        : 'Lint 未通过：见报告（回创作会话修订后重新登记）', d.state === 'lint_pass' ? '' : 'warn');
      _reloadDraft(d);
    });
  }
  function draftSmoke() {
    var sid = ($('wbSmokeSid').value || '').trim();
    if (!sid) { toast('缺少试玩会话 id', 'error'); return; }
    _draftAction('smoke', {
      draft_id: state.activeDraft,
      smoke_session: sid,
      conclusion: ($('wbSmokeConclusion').value || '').trim()
    }, '试玩已登记').then(function (d) { if (d) _reloadDraft(d); });
  }
  function draftSubmit() {
    _draftAction('submit', { draft_id: state.activeDraft }, '已提交人审')
      .then(function (d) { if (d) _reloadDraft(d); });
  }
  function draftApprove() {
    _draftAction('approve', { draft_id: state.activeDraft }, '已批准入库（卡库可见，creator AI 署名）')
      .then(function (d) { if (d) _reloadDraft(d, true); });
  }
  function draftReject() {
    var reason = ($('wbRejectReason').value || '').trim();
    if (!reason) { toast('请填写打回意见', 'error'); return; }
    _draftAction('reject', { draft_id: state.activeDraft, reason: reason }, '已打回（意见已回写，草稿保留）')
      .then(function (d) { if (d) _reloadDraft(d); });
  }

  // ── 入口（v3.1：默认视图 = 玩法大厅）──
  setView('hall');
  showWelcome();
  refreshAll();
  </script>
</body>
</html>
