[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos-plugin-sdk"
version = "0.2.0"
description = "Lingxi AgentOS 0.2 Plugin SDK — Python plugin development toolkit"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Lingxi AgentOS Contributors"}
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # MCP Python SDK（modelcontextprotocol/python-sdk），与 Rust 端 rmcp 同源不同实现
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
# 与根 pyproject.toml 统一（120），避免同一代码库两套行宽标准
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4"]

[tool.ruff.lint.per-file-ignores]
# 测试代码：assert 是标准用法；临时文件/except-pass 是测试桩的合理写法
"tests/**/*.py" = ["S101", "S108", "S110"]
# 公开 API 异常基类名保持 BaseAppException（改名破坏下游兼容）
"src/agentos_plugin_sdk/exceptions/**" = ["N818"]

[tool.mypy]
python_version = "3.11"
strict = true
